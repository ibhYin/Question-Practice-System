# 八股文库：操作系统知识体系（陈述式背诵卡）
category: OS
doc:
  title: "操作系统知识体系全景"
  content: |
    操作系统知识体系可以沿四条主线展开：进程怎么调度、内存怎么管理、IO 怎么高效、出问题怎么排查。

    **进程与调度线。** 进程是资源分配的最小单位，线程是 CPU 调度的最小单位，协程把调度搬进用户态——切换从微秒级降到纳秒级，代价是协作式调度下一次阻塞调用会卡住整个宿主线程。进程间通信手段按数据形态选择：小消息走消息队列，大数据走共享内存（最快的 IPC，但必须配信号量互斥），事件通知靠信号，跨主机靠 Socket。调度算法的演进是公平与效率的平衡史：FCFS 有护航效应，SJF 让长任务饥饿，RR 用时间片换公平，多级反馈队列融合三者、无需预知时长，Linux 的 CFS 用 vruntime 红黑树给出现实答案。并发协调的两大原语各有分工：互斥锁保护临界区，信号量表达资源计数，生产者消费者是两者的合体模板。

    **内存管理线。** 虚拟内存给每个进程独立的地址空间，MMU 与页表完成翻译，多级页表为稀疏空间省内存，TLB 缓存近期翻译保住性能。缺页中断实现按需加载，置换算法 FIFO、OPT、LRU、Clock 全部建立在局部性原理之上。fork 的写时复制把复制成本推迟到首次写入，Redis 的 bgsave 靠它拿到一致性快照，但写密集时内存可能翻倍——这是内存管理知识直接落到生产排障的例子。

    **IO 线。** 用户态与内核态的每次切换都有上下文保存与缓存失效成本，减少切换是高性能 IO 的母题。IO 多路复用的演进最能体现它：select 有 1024 上限且每次全量拷贝、O(n) 扫描；epoll 用红黑树管注册、中断回调喂就绪链表，epoll_wait 只收就绪项，复杂度从 O(连接数) 变成 O(就绪数)，Redis 与 Netty 的十万并发都站在它肩上。零拷贝是同一思想的另一面：传统读写四次拷贝，sendfile 压到两次且不出内核，mmap 让用户态直写页缓存，Kafka 与 Nginx 的高吞吐各取所需。

    **存储与排障线。** 文件系统以 inode 为中心：元数据在 inode，文件名在目录项，硬链接是同一 inode 的多个名字，软链接是存路径的独立文件；磁盘满要分清是数据块满还是 inode 满。排障的最后一课是内存耗尽：available 持续下降、swap 启用、OOM killer 按 oom_score 杀进程——Java 进程无声消失多半是 OS 干的而不是 JVM。记住总纲：调度决定谁用 CPU，内存决定谁住物理页，IO 决定数据搬运的成本，排障沿这三条线找根因。
cards:
  - title: "进程、线程、协程的三层定位"
    content: "进程是资源分配的最小单位，拥有独立地址空间与文件描述符表，进程间内存隔离，切换要换页表并刷新 TLB，开销最大；线程是 CPU 调度的最小单位，同进程内共享堆与全局变量，私有栈和寄存器，切换只换栈与寄存器，比进程轻得多，但共享内存引入并发同步问题；协程是用户态调度的轻量执行单元，切换是函数调用级别、纳秒级且不进内核，靠主动让出协作调度。切换成本协程小于线程小于进程，隔离性恰好相反。"
    points:
      - "进程管资源分配，线程管调度，协程用户态调度"
      - "进程隔离最强，切换要换页表刷 TLB"
      - "线程共享堆与全局变量，私有栈寄存器"
      - "切换成本：协程 < 线程 < 进程，隔离性相反"

  - title: "协程的调度机制与适用边界"
    content: "协程的切换由程序自身控制，本质是函数调用级别的上下文保存，不陷入内核，因此可以在单线程内并发运行数十万甚至百万个协程。它靠主动让出（yield）协作式调度，一旦协程执行了真正的阻塞调用，整个宿主线程都会被卡住——这是与抢占式线程调度的本质差异。Go 的 goroutine 用 GMP 模型把协程映射到线程并实现阻塞卸载，Python asyncio 靠事件循环，Java 虚拟线程由 JVM 托管解决卸载问题。协程的价值在 IO 密集场景：用同步写法获得异步吞吐；CPU 密集场景它无能为力。"
    points:
      - "切换为函数调用级别，纳秒级不进内核"
      - "协作式调度：阻塞调用会卡住整个线程"
      - "goroutine 的 GMP 与虚拟线程解决阻塞卸载"
      - "适合 IO 密集：同步写法获得异步吞吐"

  - title: "进程间通信方式的全景与选型"
    content: "IPC 手段按数据形态分几类：管道半双工，匿名管道限于亲缘进程，命名管道 FIFO 支持任意进程；消息队列是内核中的类型化消息链表，适合小消息异步传递；共享内存让多个进程映射同一块物理内存，是速度最快的 IPC，但必须配信号量或互斥锁同步；信号量本身不传数据，专职同步互斥；信号用于异步事件通知，不承载数据；Socket 跨主机通用，本机走 Unix domain socket 比 TCP loopback 更快。选型口诀：小消息队列、大数据共享内存、事件信号、跨机 socket。"
    points:
      - "管道半双工，FIFO 解除亲缘限制"
      - "共享内存最快，必须配信号量/互斥锁"
      - "信号承载事件通知，不承载数据"
      - "Socket 跨主机，本机 Unix domain socket 更快"
      - "口诀：小消息队列、大数据共享内存、跨机 socket"

  - title: "共享内存是最快 IPC 的原因"
    content: "其他 IPC 方式（管道、消息队列、socket）的数据都要经历用户态与内核态之间的两次拷贝：写入时从用户缓冲拷进内核缓冲，读取时再从内核拷出到用户缓冲。共享内存让通信双方把同一块物理内存映射进各自地址空间，读写直接发生在用户态，数据完全不进内核，省掉这两次拷贝与相关系统调用，因此成为最快的 IPC。代价是内核不再提供任何顺序与互斥保护，进程间必须自己用信号量、互斥锁等机制协调读写时序，否则会出现数据竞争。"
    points:
      - "常规 IPC 的数据要经内核两次拷贝"
      - "共享内存映射同一物理页，读写不进内核"
      - "零拷贝是它最快的根本原因"
      - "内核不提供保护，需自配同步机制"

  - title: "虚拟内存的四大价值"
    content: "虚拟内存给每个进程一套独立的虚拟地址空间，CPU 通过 MMU 与页表把虚拟地址翻译成物理地址。它带来四个核心价值：隔离与保护——进程间互不可见，野指针打不穿其他进程；内存超卖——虚拟空间可以远大于物理内存，配合 swap 兜底；按需加载——页可以暂不调入物理内存，缺页时再载入，程序不必整体驻留；共享与写时复制——动态库映射、fork 的 COW 都建立在虚拟地址层。malloc 返回的只是虚拟地址，真正分配物理页发生在首次触碰时的缺页中断。"
    points:
      - "MMU + 页表完成虚拟到物理的翻译"
      - "隔离保护：进程间地址空间互不可见"
      - "虚拟空间可大于物理内存，配合 swap"
      - "按需加载缺页调入，COW 与共享映射的基础"
      - "malloc 先得虚拟地址，触碰才分配物理页"

  - title: "页表、多级页表与 TLB 的协作"
    content: "内存按固定页大小（通常 4KB）划分，虚拟页到物理页帧的映射记录在页表中。直接的单级页表要为整个虚拟空间建表，内存开销不可接受，因此 x86-64 采用四/五级多级页表，只为实际使用的区域分配下级页表，稀疏空间下大幅省内存。多级带来的代价是一次翻译要多次访存，于是 TLB 充当近期翻译结果的硬件缓存：命中则零成本直取物理地址，未命中才走页表遍历。TLB 命中率高度依赖程序的局部性，进程切换刷 TLB 的成本也是进程切换开销的来源之一。"
    points:
      - "内存按 4KB 分页，映射存于页表"
      - "多级页表只为使用中的区域建表，省内存"
      - "TLB 缓存近期翻译，命中免多次访存"
      - "进程切换刷 TLB 是切换开销来源之一"

  - title: "缺页中断的处理流程"
    content: "当 CPU 访问的虚拟页不在物理内存或权限不符时，MMU 触发 page fault 异常陷入内核。内核先判断访问合法性，非法直接终止进程（段错误）；合法则分配一个物理页框：内存有空闲直接调入目标页，若内存已满则由置换算法选出一页换出，脏页需先写回 swap 或文件，然后把目标页读入、更新页表项并处理 TLB，最后重新执行触发缺页的那条指令。缺页是虚拟内存按需加载的实现基石，但高频缺页意味着系统在颠簸。"
    points:
      - "访问未映射页触发 page fault 陷入内核"
      - "非法访问终止进程，合法访问调入页面"
      - "内存满时置换算法选页换出，脏页先写回"
      - "更新页表后重新执行触发指令"
      - "高频缺页即内存颠簸的信号"

  - title: "常见页面置换算法的对比"
    content: "页面置换算法决定内存满时淘汰谁。FIFO 先进先出，实现简单但存在 Belady 异常——页框变多缺页反而变多；OPT 淘汰未来最久不用的页，是理论最优但不可实现，只作评测基准；LRU 淘汰最久未访问的页，效果好但严格实现需要硬件级支持，成本高；Clock 时钟算法用环形链表加访问位给出第二次机会，是近似 LRU 的主流工程实现；LFU 淘汰访问频率最低的页，对新热点不敏感。Redis 的淘汰策略与数据库 buffer pool 的置换用的都是同一套思想。"
    points:
      - "FIFO 简单但存在 Belady 异常"
      - "OPT 理论最优不可实现，作评测基准"
      - "LRU 效果好但实现贵"
      - "Clock 近似 LRU，是主流工程实现"
      - "LFU 按访问频率淘汰"

  - title: "局部性原理支撑置换算法与缓存"
    content: "局部性原理是内存层次设计的公理：时间局部性指刚被访问的数据短期内大概率再次被访问，空间局部性指相邻地址的数据大概率被连续访问。页面置换算法之所以能用最近的访问历史近似预测未来、LRU 之所以成立，都依赖时间局部性；预读机制、按页加载、磁盘块与 CPU 缓存行的设计则依赖空间局部性。Redis 的 LRU/LFU 淘汰、MySQL buffer pool 的置换、CPU 多级缓存，全部是局部性原理在不同层次的应用。一旦访问模式失去局部性，置换与缓存全部失效，系统性能断崖下跌。"
    points:
      - "时间局部性：刚访问的会再访问"
      - "空间局部性：相邻的会被访问"
      - "LRU 与预读的成立前提是局部性"
      - "Redis 淘汰、buffer pool、CPU 缓存同源"
      - "失去局部性时缓存与置换全部失效"

  - title: "select 与 poll 的共同局限"
    content: "select 把 fd 集合从用户态拷贝进内核，然后线性扫描所有 fd 检查就绪状态，返回后用户还要再遍历一遍找就绪项；它受 FD_SETSIZE 限制最多监听 1024 个 fd，且每次调用都要重新拷贝并重置集合。poll 用 pollfd 数组去掉了 1024 上限，但每次全量拷贝与 O(n) 扫描的本质没变。两者的问题同源：监听集合每次重建、内核与用户态来回拷贝、就绪检测是全量轮询——连接数越大浪费越大，这正是 epoll 要解决的三个痛点。"
    points:
      - "select 有 1024 个 fd 的硬上限"
      - "poll 用数组解除上限，机制未变"
      - "每次调用全量拷贝集合进内核"
      - "就绪检测是 O(n) 线性扫描"
      - "连接越多轮询浪费越大"

  - title: "epoll 的高效原理与三件套 API"
    content: "epoll 把监听与等待拆开，三件套各司其职：epoll_create 创建实例，内核用红黑树管理 fd；epoll_ctl 注册 fd，一次注册永久生效，不再每次调用重复拷贝；epoll_wait 只等待并返回就绪的 fd 列表。高效的根源在就绪链表加回调机制：网卡数据到达触发硬件中断，内核回调把对应 fd 挂入就绪链表，epoll_wait 直接收集就绪项，复杂度是 O(就绪数) 而非 O(总连接数)。万级连接下每次只处理活跃的几十个，这是 Redis、Netty 高并发的底座。"
    points:
      - "epoll_create/ctl/wait 三件套分工"
      - "红黑树管理 fd，注册一次不重复拷贝"
      - "中断回调把就绪 fd 挂入就绪链表"
      - "epoll_wait 只返回就绪项，O(就绪数)"
      - "Redis 与 Netty 高并发的共同底座"

  - title: "ET 与 LT 两种触发模式"
    content: "epoll 有两种事件通知模式。水平触发 LT：只要 fd 处于就绪状态且数据没处理完，每次 epoll_wait 都会持续通知，编程简单不容易丢事件，是默认模式；边缘触发 ET：状态变化时只通知一次，必须配合非阻塞 fd 把数据一次性循环读到 EAGAIN，否则残留数据再也不会有通知，编程难度高但减少了重复唤醒，性能更好。选型上业务简单用 LT，追求极限性能且有非阻塞 IO 处理能力时用 ET。Redis 与 Netty 的 NIO 底层都基于 epoll。"
    points:
      - "LT 持续通知直到数据处理完，默认模式"
      - "ET 只通知一次，必须一次读完"
      - "ET 必须搭配非阻塞 fd 与 EAGAIN 循环"
      - "ET 减少重复唤醒，性能更好"
      - "Redis 与 Netty 底层都是 epoll"

  - title: "传统 IO 的四次拷贝与零拷贝演进"
    content: "传统读文件发网络要经历四次拷贝与四次上下文切换：read 从磁盘经内核缓冲拷到用户缓冲，write 再从用户缓冲拷到 socket 缓冲最后到网卡。sendfile 把这条路压到内核态内完成：数据从页缓存直达 socket 缓冲，两次拷贝两次切换，配合 DMA gather 可做到 CPU 零拷贝。mmap + write 则把文件映射进用户地址空间直接读写页缓存，省掉内核到用户的一次拷贝。Kafka 消费与 Nginx 静态文件用 sendfile，Kafka 索引用 mmap。"
    points:
      - "传统路径 4 次拷贝 4 次切换"
      - "sendfile 内核态内直达，2 次拷贝"
      - "DMA gather 实现 CPU 零拷贝"
      - "mmap 映射文件进用户空间，省一次拷贝"
      - "Kafka/Nginx 用 sendfile，Kafka 索引用 mmap"

  - title: "sendfile 与 mmap 的适用边界"
    content: "两者都是零拷贝手段但定位不同。sendfile 是一条完整的数据管道：文件内容不经用户态直接从页缓存流向 socket 缓冲，适合读文件发网络且不需要修改数据的场景，Kafka 消费、Nginx 静态文件、Netty FileRegion 都走这条路；mmap 是把文件映射进用户地址空间，应用可直接读写页缓存，适合需要修改数据或与应用逻辑交互的场景，Kafka 用它建稀疏索引。需要应用层加工数据时零拷贝不适用，数据必须进用户态——这是所有零拷贝方案的共同边界。"
    points:
      - "sendfile 是文件到 socket 的完整管道"
      - "mmap 让用户态直接读写页缓存"
      - "不需要改数据用 sendfile，要改数据用 mmap"
      - "Kafka 消费走 sendfile，索引建 mmap"
      - "需应用层处理数据时零拷贝不适用"

  - title: "用户态与内核态的切换成本"
    content: "CPU 分特权级运行：应用代码在用户态受限执行，系统调用、中断、异常时陷入内核态执行特权操作。一次切换要保存与恢复寄存器上下文、校验参数、执行内核逻辑，还会破坏缓存局部性导致 TLB 失效，单次微秒级，高频调用累积可观。常见触发点是 read/write 等系统调用、缺页、futex 阻塞锁与定时器信号。削减手段：批量（writev、epoll 批收就绪项）、应用层缓冲减少小 IO、io_uring 批量异步 IO、CAS 自旋避免锁竞争进内核。strace 与 perf 可观测系统调用占比。"
    points:
      - "切换含上下文保存、内核执行与缓存局部性破坏"
      - "单次微秒级，高频累积成本可观"
      - "批量、缓冲、io_uring 是三大削减方向"
      - "CAS 自旋避免锁竞争陷入内核"
      - "strace/perf 观测系统调用占比"

  - title: "fork 与写时复制的原理"
    content: "fork 复制当前进程产生子进程，返回值区分父子：子进程得到 0，父进程得到子 pid。fork 逻辑上复制全部地址空间，但物理内存并不立即复制：父子共享同一份物理页，页表被标记为只读；任何一方第一次写某页时触发缺页异常，内核才真正复制该页，双方各持副本——这就是写时复制 COW。它成立的前提是 fork 后通常紧跟 exec 换程序映像，立即复制是纯浪费，COW 让 fork 的成本降到接近页表大小而非内存大小。"
    points:
      - "fork 返回值区分父子：0 为子进程"
      - "物理页共享，页表标记只读"
      - "首次写触发缺页，内核复制该页"
      - "fork 常伴随 exec，延迟复制避免浪费"
      - "成本从 O(内存) 降到 O(页表)"

  - title: "写时复制的应用与风险"
    content: "COW 最经典的应用是 Redis 的 bgsave 与 AOF 重写：fork 出子进程后，子进程看到的页表与主进程一致，天然拿到某一时刻的一致性快照；主进程继续写时才逐页复制，读请求完全不受阻塞。风险也随之而来：写密集场景下主进程大量缺页复制，内存占用可短时间翻倍，必须预留余量；fork 本身复制页表的耗时随进程内存增大，大实例 fork 会有明显卡顿；开启 THP 后复制粒度变成 2MB 大页，进一步放大复制成本。Shell 的命令执行（fork+exec）是同一机制的最日常应用。"
    points:
      - "Redis bgsave 靠 COW 获得一致性快照"
      - "写密集时缺页复制导致内存暴涨"
      - "fork 耗时随进程内存增大，大实例卡顿"
      - "THP 把复制粒度放大到 2MB"
      - "Shell 命令执行是 fork+exec 的日常形态"

  - title: "inode 与软硬链接的区别"
    content: "inode 是文件的元数据节点，存储权限、大小、时间戳与数据块指针；文件名反而存在目录项里——目录本质是文件名到 inode 号的映射表，所以一个文件可以有多个名字。硬链接用 ln 创建，是另一个指向同一 inode 的目录项，链接计数加一，删掉任一名字只要计数大于零文件就还在，但不能跨文件系统、不能对目录使用（防环）；软链接是独立文件，内容是目标路径，可跨文件系统、可指向目录，但目标删除后变成悬空链接。磁盘满有两种：数据块满与 inode 满（海量小文件，df -i 查看）。"
    points:
      - "文件名在目录项，元数据在 inode"
      - "硬链接同 inode，计数归零才释放"
      - "硬链接不可跨文件系统、不可指目录"
      - "软链接存路径，目标删除即悬空"
      - "inode 耗尽也是磁盘满的一种，df -i 排查"

  - title: "OOM killer 的行为与排查链路"
    content: "内存泄漏的系统级演进：available 持续下降 → swap 启用系统变卡 → 物理内存与 swap 耗尽 → OOM killer 出场，内核按 oom_score 杀进程。Java 进程无声消失而日志无 OOM，多半是 OS 杀的而非 JVM OOM——-Xmx 不覆盖堆外、元空间与线程栈。排查用 dmesg 找 killed process，容器查 cgroup 的 memory.events；防控靠内存限额、available 告警与关键进程调低 oom_score_adj。"
    points:
      - "泄漏演进：available 下降 → swap 启用 → OOM"
      - "OOM killer 按 oom_score 挑进程杀死"
      - "Java 进程无声消失多半是 OS OOM 非 JVM OOM"
      - "dmesg 查记录，容器查 cgroup memory.events"
      - "关键进程可用 oom_score_adj 保护"

  - title: "信号量与互斥锁的分工及生产者消费者模板"
    content: "互斥锁是二值锁，同一时刻只有一个持有者，专职保护临界区，强调谁加锁谁解锁；信号量是计数器，P 减一可等待、V 加一唤醒等待者，表达可用资源的数量，且不绑定持有者。生产者消费者的标准模板是：两个信号量控制资源——empty 初值 N 表示空位、full 初值 0 表示存货，一个互斥锁保护缓冲区本身；生产者依次 P(empty)、P(mutex)、放数据、V(mutex)、V(full)，消费者对称。陷阱：P 的顺序不能颠倒——先 P(mutex) 再 P(empty) 会持有锁等待资源，造成死锁。"
    points:
      - "互斥锁二值保临界区，信号量计数表资源"
      - "empty 表空位、full 表存货，mutex 保护缓冲区"
      - "生产者 P(empty) 后 P(mutex)，消费者对称"
      - "先 mutex 后资源信号量会死锁"
      - "实现层：短临界区自旋 CAS，长竞争 futex"

  - title: "进程调度算法的演进与 Linux CFS"
    content: "调度算法的演进是一场公平与效率的平衡：FCFS 简单但短任务被长任务堵死（护航效应）；SJF 短作业优先平均等待最优，但长任务饥饿且时长难预知；RR 时间片轮转保证响应公平，时间片太大退化成 FCFS，太小切换开销过高；优先级调度让高优先级先跑，用老化（等待越久优先越高）缓解低优先级饥饿；多级反馈队列综合三者——新进程进最高队列，用完时间片降级，交互型短任务滞留高层、批处理沉底，无需预知时长。Linux 的现实答案是 CFS：按虚拟运行时间 vruntime 保证公平，红黑树选最左节点执行。"
    points:
      - "FCFS 有护航效应，SJF 让长任务饥饿"
      - "RR 时间片权衡：太大退化 FCFS，太小开销高"
      - "优先级调度用 aging 防饥饿"
      - "MLFQ 融合 RR、优先级与老化，无需预知时长"
      - "Linux CFS 按 vruntime 红黑树选最左"
