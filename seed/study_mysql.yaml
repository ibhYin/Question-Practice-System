# 八股文库：MySQL 体系文档 + 陈述式背诵卡片
category: MYSQL
doc:
  title: "MySQL 知识体系全景"
  content: |
    # 一、索引体系：查询加速的地基

    InnoDB 选 B+ 树是围绕减少磁盘 IO 设计：哈希不支持范围查询，二叉树太高，B+ 树多叉矮胖，三到四层支撑千万级数据。非叶子节点只存键，叶子节点串成双向链表，范围扫描顺链即达。聚簇索引叶子存整行，二级索引叶子存索引列加主键，由此衍生回表——覆盖索引可避免。联合索引靠最左前缀原则工作，等值列在前、范围列在后；函数运算、隐式转换、前导模糊会让索引失效，索引下推 ICP 则减少无效回表。主键选择影响整棵树：自增主键无页分裂，UUID 随机插入既慢又让二级索引膨胀。

    # 二、事务与 MVCC：并发下的正确性

    ACID 各有一位监护人：原子性靠 undo log 反向补偿，持久性靠 redo log 的 WAL，隔离性靠 MVCC 加锁，一致性是前三者与应用层约束共同达成的目的。隔离级别逐级消除脏读、不可重复读与幻读，InnoDB 默认可重复读。MVCC 三要素是隐藏列、版本链与 ReadView：读不加锁，沿版本链找对当前快照可见的版本；RC 每查新建 ReadView，RR 复用首查快照，这一差别是两种级别行为差异的来源。快照读靠 MVCC、当前读靠临键锁防幻读，混用仍会出现残留幻读。

    # 三、锁体系：写并发的秩序

    锁分三层：全局锁管备份；表级 MDL 锁解释了长事务期间做 DDL 会阻塞全表，意向锁免去逐行检查；行级锁挂在索引上。行锁三形态中，RR 当前读的默认单位是左开右闭的临键锁，等值命中唯一索引退化为行锁；没走索引的更新近似锁全表；插入意向锁调和间隙锁与并发插入。死锁来自相反顺序争锁，等待图会回滚代价小的一方，工程解法是统一加锁顺序、缩小事务、合理建索引。

    # 四、日志体系：可靠性的三根支柱

    redo log 是物理日志，把随机写变顺序写，管崩溃恢复与持久性；undo log 是逻辑日志，管回滚与 MVCC 版本链；binlog 在 Server 层，是主从复制的原料。一次 UPDATE 按序经历：写 undo 记旧值、改 Buffer Pool 脏页、写 redo 置 prepare、写 binlog、redo 置 commit。两阶段提交让两份日志逻辑一致：崩溃恢复时用 binlog 是否完整裁决 prepare 状态的 redo 提交还是回滚，否则主从必然分叉。

    # 五、SQL 执行与优化：从 EXPLAIN 到治理

    慢 SQL 先分类：偶尔慢查锁等待与脏页，一直慢才看执行计划。EXPLAIN 里 type 至少要 range，Extra 里 Using index 是奖励、filesort 与 temporary 是预警。深分页慢在扫描并丢弃，游标翻页与延迟关联是标准解；ORDER BY 在索引序与 sort_buffer 间二选一；JOIN 优先小表驱动大表，8.0 的 Hash Join 接管无索引连接。治理按总耗时排序慢日志、归因分级处置，再用 SQL 审核卡增量。

    # 六、复制与扩展：从单机到集群

    复制链路是主库写 binlog、从库拉取写 relay log 再重放；异步复制有丢数据窗口，半同步用至少一个从库确认缩到极小。延迟应对是强制读主、GTID 等待、业务展示处理中，治本靠并行复制与缩小事务。单表逼近两千万行才考虑分库分表，代价是跨库 join、分布式事务、全局 id 与扩容迁移的组合难题。大表加字段防 MDL 阻塞，低峰执行或交给 gh-ost；金额用 DECIMAL、字符集用 utf8mb4 建表时定对。底线是备份演练：没恢复过的备份等于没备份。
cards:
  - title: "B+ 树成为 InnoDB 索引结构的原因"
    content: "InnoDB 的索引设计围绕减少磁盘 IO 展开。哈希表只支持等值查询，范围与排序无能为力；二叉树结构树高随数据量线性增长，百万级数据约二十层，每层一次磁盘 IO；B+ 树是多叉矮胖结构，三到四层就能支撑约两千万行数据。相比 B 树，B+ 树非叶子节点只存键不存数据，单页能容纳更多键，树更矮 IO 更少；所有查询都落到叶子节点，性能稳定；叶子节点用双向链表串联，范围扫描顺着链表遍历即可，不必像 B 树那样中序回溯。"
    points: ["非叶子节点只存键，树更矮 IO 更少", "叶子双向链表支持范围扫描", "3~4 层支撑千万级数据（16KB 页）", "哈希不支持范围、二叉树 IO 太多"]
  - title: "聚簇索引与二级索引的分工"
    content: "InnoDB 是聚簇索引组织表，数据按主键顺序存储在主键索引的叶子节点上，一张表只有一个聚簇索引。二级索引的叶子节点存的是索引列值加主键值，而不是整行数据——这个设计让二级索引更小、维护更轻，但也埋下了回表的伏笔。查询列全部包含在某个二级索引中时可以直接在该索引上取全数据，Extra 显示 Using index，这就是覆盖索引；反之 SELECT * 是回表最常见的诱因。主键选择还影响全局：所有二级索引的叶子都要存一份主键，主键越长索引越膨胀。"
    points: ["聚簇索引叶子存整行，全表仅一个", "二级索引叶子存索引列 + 主键", "覆盖索引可免回表（Using index）", "主键体积被所有二级索引复制"]
  - title: "回表的成因与覆盖索引的规避"
    content: "回表指通过二级索引拿到主键后，再回到聚簇索引查一次完整行，等于两次树查找。例如按 name 索引查 SELECT *，先在二级索引定位 id，再用 id 去主键索引取整行。规避的核心是覆盖索引：把高频查询需要的列建进联合索引，让查询直接在二级索引上完成。深分页的延迟关联也是同一思路——子查询只扫索引取 id，外层再回表。日常写法上避免 SELECT *、按查询画像设计索引，是控制回表次数最有效的两个习惯。"
    points: ["回表 = 二级索引查主键再查聚簇索引", "覆盖索引让查询停在二级索引", "延迟关联先取 id 再回表", "避免 SELECT * 是第一习惯"]
  - title: "联合索引的最左前缀原则"
    content: "联合索引按列顺序排序存储，查询条件必须从最左列开始连续命中才能使用。对索引 (a,b,c)：a=1 命中一列，a=1 AND b=2 命中两列，全条件命中三列；缺 a 直接查 b 或 c 完全不命中；a=1 AND c=3 只用 a，c 在扫描范围内过滤。遇到范围条件后中断：a>1 AND b=2 里 b 无法继续走索引。排序同理，ORDER BY a,b 能用索引序而 b,a 不行。设计口诀：等值列在前、范围列在后、区分度高的尽量靠前。"
    points: ["必须从最左列开始连续命中", "范围列后面的列失效", "ORDER BY 与 WHERE 遵循同一原则", "等值在前、范围在后、区分度优先"]
  - title: "索引失效的常见场景"
    content: "索引失效多源于查询写法破坏了索引的有序性。对索引列做函数或运算，如 YEAR(create_time)=2024、id+1=10，索引存的是原始值无从匹配，应改写为范围条件；字符串列用数字查询触发隐式类型转换，相当于对列套函数；LIKE 前导通配符 %abc 无法定位起点，abc% 则可以；联合索引跳过最左列失效；OR 连接了不走索引的列会拖累整体走全表；回表代价太大时优化器会主动放弃索引，这属于代价选择而非失效。排查时以 EXPLAIN 的 type 与 key 为准。"
    points: ["函数、运算、隐式转换破坏匹配", "LIKE 前导 % 失效，后缀 % 可用", "OR 串联非索引列拖垮整体", "优化器判定全表更快会弃用索引"]
  - title: "索引下推 ICP 的优化原理"
    content: "索引下推把本该由 Server 层做的过滤条件下推到存储引擎，在二级索引内部完成。以联合索引 (name,age) 查 WHERE name LIKE '张%' AND age=10 为例：like 前缀可定位，age 因断层无法继续导航；5.6 之前要把所有命中前缀的记录全部回表再过滤，回表了大量注定被丢弃的行；有了 ICP，引擎在索引里就用 age 过滤，只对通过筛选的行回表。Extra 显示 Using index condition。等值列放前、范围列放后能最大化利用它。"
    points: ["过滤条件下推到引擎层索引内完成", "减少断点后列的无效回表", "Extra 标志：Using index condition", "等值列在前让 ICP 收益最大化"]
  - title: "自增主键优于 UUID 的原因"
    content: "InnoDB 数据按主键顺序物理存储，自增主键的插入总是追加到 B+ 树末尾，页写满就开新页，是纯粹的顺序写，页利用率高且没有页分裂。UUID 的随机性让插入位置飘忽，频繁触发页分裂与碎片，写性能差、缓存命中率低；36 字符的长度还会被每个二级索引的叶子复制一份，索引体积成倍膨胀。分布式场景的折中是 UUIDv7 或雪花算法这类把时间戳放高位的有序 id，接近自增效果。自增也有局限：分库分表后各库冲突，需要换号段或雪花方案。"
    points: ["自增 = 顺序追加，无页分裂", "UUID 随机插入引发分裂与碎片", "主键长度被全部二级索引放大", "有序 id（雪花/UUIDv7）是分布式替代"]
  - title: "事务 ACID 特性的支撑机制"
    content: "ACID 各有明确的实现载体。原子性靠 undo log：修改前记录旧值，回滚时反向补偿，要么全成功要么全还原。持久性靠 redo log：WAL 机制先顺序写日志再择机刷数据页，宕机后前滚恢复，提交的数据不丢。隔离性靠 MVCC 与锁的组合：读用快照避免脏读与不可重复读，写用行锁与间隙锁防止相互覆盖。一致性是最终目的，由前三者加应用层约束共同达成，主键、唯一索引、业务校验都在为它兜底。"
    points: ["原子性 ← undo log 反向补偿", "持久性 ← redo log 的 WAL", "隔离性 ← MVCC + 锁", "一致性是目的，由 AID 共同保障"]
  - title: "四个隔离级别与三类并发读问题"
    content: "并发事务的三类读问题依次是脏读（读到未提交数据，回滚后成错值）、不可重复读（同一行两次读值不同，焦点在 UPDATE）与幻读（同一范围两次读行数不同，焦点在 INSERT）。读未提交三者皆存在；读已提交解决脏读，是 Oracle 与 PostgreSQL 的默认；可重复读再解决不可重复读，且 InnoDB 额外用 MVCC 加间隙锁基本解决了幻读，是 MySQL 的默认级别；串行化最安全但并发最差。锁行能防不可重复读，防幻读必须锁间隙。"
    points: ["脏读未提交、值变是不可重复读、行数变是幻读", "RC 解决脏读，RR 再解决不可重复读", "InnoDB 的 RR 基本解决幻读", "查看命令 SELECT @@transaction_isolation"]
  - title: "MVCC 的实现原理与三要素"
    content: "MVCC 用数据多版本实现读写不冲突，读操作不加锁，只在 RC 与 RR 级别生效。三要素：隐藏列 DB_TRX_ID 记录最后修改事务、DB_ROLL_PTR 指向 undo 旧版本；多次修改经回滚指针串成版本链；读时生成 ReadView，含活跃事务列表与高低水位。可见性判断从最新版本沿链回溯，找到第一个对当前 ReadView 可见的版本。RC 与 RR 的差别全在 ReadView 生成时机：RC 每查新建所以能看到最新提交，RR 复用首查快照所以全程一致。"
    points: ["隐藏列：TRX_ID + ROLL_PTR", "undo 版本链串起历史版本", "ReadView 决定可见性", "RC 每查新建 ReadView，RR 复用首查快照"]
  - title: "可重复读级别下幻读的解决程度"
    content: "结论是快照读基本解决、当前读未完全解决。普通 SELECT 走 MVCC，全程读同一快照，别人插入的新行不可见，没有幻读；SELECT FOR UPDATE、UPDATE、DELETE 这类当前读读最新已提交版本，靠临键锁锁住记录与间隙阻止范围内插入，也没有幻读。残留场景在两种读混用时出现：同一事务先快照读后当前读，会看到先前快照里没有的行，形成读到了但改不到的错位。规避方法是事务内保持读法一致，查了就改的场景直接用 FOR UPDATE 当前读。"
    points: ["快照读靠 ReadView 防幻读", "当前读靠 Next-Key Lock 防插入", "混用两种读会出现残留幻读", "同一事务内保持读法一致"]
  - title: "InnoDB 锁体系的三个层级"
    content: "按粒度分三层。全局锁 FTWRL 用于全库逻辑备份。表级锁包含表锁、元数据锁 MDL 与意向锁：增删改查自动加 MDL 读锁，DDL 加 MDL 写锁，所以长事务未提交期间做 DDL 会阻塞后续所有请求；意向锁是表级标记，让表锁判断不必逐行检查。行级锁加在索引记录上，是并发控制的主力。三层各自的触发点不同，但危险场景常在交界处：DDL 撞上长事务的 MDL 读锁、未走索引的更新把行锁放大成近似锁表。"
    points: ["全局锁管备份", "MDL 解释 DDL 阻塞全表现象", "意向锁避免逐行检查", "行锁挂在索引上，没索引近似锁全表"]
  - title: "行锁的三种形态与加锁规则"
    content: "RR 级别下当前读的默认加锁单位是临键锁，即记录锁加间隙锁的左开右闭区间。记录锁锁单条索引记录；间隙锁锁记录之间的空隙防止插入，只在 RR 级别出现；临键锁是前两者的组合。加锁规则有退化路径：等值命中唯一索引退化为纯记录锁，等值未命中锁住所在间隙，范围查询锁住扫描到的全部区间。插入前会先拿插入意向锁，它与间隙锁冲突而与同间隙的其他插入不冲突，是并发插入与间隙锁之间的调和器。热点范围上的长事务当前读会大面积阻塞插入。"
    points: ["Next-Key = Record + Gap，左开右闭", "等值命中唯一索引退化为行锁", "间隙锁仅 RR 级别存在", "插入意向锁只与间隙锁冲突"]
  - title: "死锁的产生与排查规避"
    content: "死锁来自两个事务互相持有对方需要的锁并互相等待，典型是按相反顺序更新两行，或以不同顺序对同一范围执行当前读。InnoDB 用锁等待图主动检测，回滚代价小的事务并报 Deadlock found，另有 innodb_lock_wait_timeout 默认五十秒兜底。排查用 SHOW ENGINE INNODB STATUS 看 LATEST DETECTED DEADLOCK。规避四条：按相同顺序访问资源、事务小而快、事务内不做 RPC、合理建索引避免行锁膨胀。"
    points: ["相反顺序争锁是典型成因", "等待图检测，回滚代价小者", "SHOW ENGINE INNODB STATUS 看死锁", "统一加锁顺序 + 小事务"]
  - title: "三大日志的分工与特点"
    content: "redo log 是 InnoDB 层的物理日志，记录某页做了某修改，循环写，负责崩溃恢复与持久性；undo log 是逻辑日志，记录反向操作，负责回滚与 MVCC 版本链；binlog 是 Server 层的逻辑日志，追加写，负责主从复制与数据恢复。三者层次、内容、用途互不相同。binlog 的格式选择里，STATEMENT 有非确定性函数导致主从不一致的风险，ROW 记录行变更绝对一致且是 CDC、闪回工具的依赖，生产默认推荐 ROW。"
    points: ["redo 物理、循环写、管恢复", "undo 逻辑、管回滚与 MVCC", "binlog 逻辑、追加写、管复制", "binlog 格式生产选 ROW"]
  - title: "两阶段提交保证日志一致性"
    content: "redo log 与 binlog 是两份独立日志，提交若不分阶段就会在崩溃时出现一有一无的分裂。两阶段提交的顺序是 redo 写入并置 prepare、写 binlog、redo 置 commit。崩溃恢复时 redo 处于 prepare 状态，用 binlog 完整性裁决：binlog 完整说明已到达可复制状态，提交事务；不完整则回滚。这样保证了主库与从库永远不会出现一边有一边没有的差异，是主从一致性的第一道闸门。"
    points: ["顺序：redo prepare → binlog → commit", "恢复时以 binlog 完整性裁决 prepare", "防止主从日志分裂", "UPDATE 全流程即按此序执行"]
  - title: "一条 UPDATE 的完整执行流程"
    content: "Server 层依次经过连接器鉴权、分析器解析、优化器选索引定 join 顺序（查询缓存 8.0 已移除），执行器校验权限后调用 InnoDB。InnoDB 侧顺序是关键：先写 undo log 记旧值，再改 Buffer Pool 数据页形成脏页，然后写 redo 并置 prepare，执行器写 binlog，最后 redo 置 commit 完成两阶段提交。更新不立刻落盘，脏页由后台线程择机刷回；崩溃恢复靠 redo 前滚，从库同步靠 binlog。"
    points: ["Server 四组件：连接、分析、优化、执行", "先 undo、改脏页、再 redo prepare", "binlog 写入后 redo commit", "刷盘异步化，靠 WAL 保证恢复"]
  - title: "EXPLAIN 关键字段的解读"
    content: "EXPLAIN 是 SQL 体检报告。type 表示访问类型，从好到差依次是 const、eq_ref、ref、range、index、ALL，线上要求至少 range；key 与 key_len 显示实际使用的索引及长度，可判断联合索引用了几列；rows 是预估扫描行数；Extra 信号最值得读——Using index 表示覆盖索引是奖励，Using filesort 表示额外排序要消除，Using temporary 表示临时表要警惕。偶尔慢先查锁等待与脏页，一直慢才从执行计划入手。"
    points: ["type 至少 range，ALL 要优化", "key_len 判断联合索引用了几列", "Using index 好，filesort/temporary 差", "先区分偶慢与常慢再动手"]
  - title: "深分页慢的根源与优化方案"
    content: "LIMIT 1000000,10 慢在要先按索引顺序取出前一百万零一十条再丢弃前一百万条，偏移越大扫描与回表越多。首选优化是游标翻页：记录上一页最后一条的 id，下一页用 WHERE id 大于该值 ORDER BY id LIMIT 10 直接定位，性能恒定，要求排序键单调。必须跳页时用延迟关联：子查询只用覆盖索引取出目标页的 id，外层再回表取整行，快一个数量级。产品层面限制最大页数、默认连续翻页，是搜索引擎的通行做法。"
    points: ["慢在扫描后丢弃", "游标翻页性能恒定（首选）", "延迟关联：先取 id 再回表", "产品上限制最大页数"]
  - title: "ORDER BY 的两种执行路径"
    content: "ORDER BY 有理想与兜底两条路。理想路径是索引排序：排序列与所用索引顺序一致时，按索引扫描天然有序，8.0 降序索引让倒序也能走。兜底是 filesort：在 sort_buffer 中排序，行数少用全字段排序一次成型，放不下退化为 rowid 排序——只排排序列加主键，排完再回表，由 max_length_for_sort_data 阈值决定。sort_buffer 每连接分配，调大有限度；ORDER BY RAND() 是全表排序反模式，覆盖索引是消除 filesort 的正解。"
    points: ["索引序扫描天然有序（理想）", "filesort 分全字段与 rowid 两种算法", "sort_buffer 每连接分配，谨慎调大", "覆盖索引消除 filesort"]
  - title: "JOIN 的三种执行算法"
    content: "内表连接列有索引时走 Index Nested-Loop：外表逐行用连接列查内表索引，成本约等于外表行数乘索引查找，是最常见形态。无索引时 8.0.18 前用 Block Nested-Loop，把外表分块装进 join buffer，一块只扫一遍内表；之后由 Hash Join 接管——小表建哈希表、大表逐行探测，等值连接近似线性完成。优化原则始终是小表驱动大表、内表连接列建索引、避免 SELECT * 让 join buffer 提前溢出，深分页配 join 用延迟关联。"
    points: ["有索引走 INL：外表驱动内表索引", "无索引 BNL → 8.0.18 后 Hash Join", "小表驱动大表是总原则", "join buffer 溢出源于 SELECT *"]
  - title: "主从复制的流程与延迟应对"
    content: "复制链路是主库写 binlog，从库 IO 线程拉取写入本地 relay log，SQL 线程重放。方式分三档：异步复制是默认，主库提交即返回可能丢数据；半同步要求至少一个从库确认收到 binlog 才返回成功，把丢数据窗口压到极小，超时会退化为异步；组复制 MGR 走多数派。主从延迟源于从库单线程重放、大事务与机器差异，应对次序是：写后立读的请求强制走主库，读前用 GTID 等待确认复制完成，业务上先展示处理中，治本靠并行复制与缩小事务。"
    points: ["binlog → relay log → SQL 重放", "半同步把丢数据窗口缩到极小", "强制读主是最常用应对", "并行复制与缩小事务治本"]
  - title: "分库分表的时机与引入的问题"
    content: "触发时机是单表逼近两千万行后索引层级增长性能下降，或单库写入成为瓶颈；动手前先穷尽索引优化、冷数据归档与读写分离。垂直拆分按业务分库、按字段分表，水平拆分按分片键哈希或范围打散。拆完的组合难题包括：跨库 join 消失，改冗余字段或应用层组装；分布式事务上本地消息表、TCC 等方案；跨分片查询与分页靠 ES 二级索引或异构宽表；自增 id 失效，换雪花或号段模式；扩容靠双写迁移加灰度切换。工具以 ShardingSphere 为代表。"
    points: ["两千万行是经验阈值，先优化再拆", "垂直按业务、水平按分片键", "全局 id、跨库查询、分布式事务是三大代价", "扩容走双写迁移加灰度"]
  - title: "大表 Online DDL 的安全操作"
    content: "DDL 需要 MDL 写锁，若长事务持着 MDL 读锁，排队的 DDL 会阻塞后续所有请求导致全表不可用。规范流程：先查 information_schema.INNODB_TRX 清掉长事务，设小 lock_wait_timeout 拿不到锁就退避，低峰执行并显式声明 ALGORITHM=INPLACE、LOCK=NONE，不支持就报错而非降级。MySQL 8.0 加列 INSTANT 算法秒级完成；更大的表交给 gh-ost 或 pt-osc，影子表加增量同步加原子改名，全程可暂停可限速。"
    points: ["MDL 写锁撞长事务 = 全表阻塞", "先查 INNODB_TRX 清场", "8.0 加列 INSTANT 秒级", "超大表用 gh-ost / pt-osc"]
  - title: "常用数据类型的选择要点"
    content: "char 定长适合手机号、MD5 等长度固定的值；varchar 变长按实际长度存储更省空间，n 是字符数不是字节数。int(11) 的 11 只是显示宽度，与存储和取值范围无关，8.0 已废弃。金额必须用 DECIMAL 而非 float 或 double，状态用 tinyint。字符集一律 utf8mb4——MySQL 的 utf8 最多三字节，存不了 emoji；转字符集要注意索引长度限制，且是大 DDL 要低峰操作。计数一律用 count(*)，语义清晰且优化器选最小可用索引。"
    points: ["char 定长、varchar 变长省空间", "int(11) 的 11 仅显示宽度", "金额用 DECIMAL，字符集用 utf8mb4", "计数用 count(*)"]
