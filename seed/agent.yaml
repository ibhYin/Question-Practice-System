# Agent 开发经典面试题
- title: "Agent 和 Workflow、Chain 的本质区别是什么？什么场景该用 Agent？"
  difficulty: 2
  tags: ["Agent", "Workflow", "架构"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **三者递进关系**：
       - **Chain（链）**：固定顺序的调用编排（A→B→C），流程在代码里写死；
       - **Workflow（工作流）**：预定义的图结构（可分支/循环），节点由 LLM 或代码执行，但**控制流是开发者预先设计的**；
       - **Agent（智能体）**：把控制权交给模型——模型在循环中**自主决定**下一步调什么工具、是否继续、何时结束。流程不是写死的，是模型一步步"想"出来的。
    2. **一句话区分**：Workflow 是"人定流程，LLM 填空"；Agent 是"LLM 定流程，人给工具和边界"。
    3. **选型原则**（Anthropic 的观点，业界共识）：**能用 workflow 就不要用 agent**——
       - 任务路径可预见、要求确定性/低成本/可审计 → workflow；
       - 任务开放性强、步数不定、需要模型灵活应变（深度研究、复杂编码、多源信息整合）→ agent；
    4. **代价对比**：Agent 灵活但成本高（多轮推理）、延迟大、行为不确定、难测试——"自主性是按可预测性付费买的"。
    5. **加分点**：实践中常混合——外层 workflow 定骨架，个别节点内嵌 agent 处理开放子任务。

- title: "ReAct 模式是什么？讲一下它的循环过程。"
  difficulty: 1
  tags: ["ReAct", "Agent循环"]
  position_tags: ["agent"]
  answer: |
    1. **ReAct = Reasoning + Acting**：让模型交替进行"推理"和"行动"——用思考指导行动，用行动结果修正思考，直到得出最终答案（论文 2022，现役 Agent 的基础范式）。
    2. **循环过程**：
       - **Thought**：模型分析当前状况，决定下一步该做什么、为什么；
       - **Action**：选择一个工具并给出参数（如 search("杭州天气")）；
       - **Observation**：执行工具，把结果喂回模型；
       - 回到 Thought……直到模型判断信息足够，输出 **Final Answer**。
    3. **为什么有效**：
       - 把"想"显式化——中间推理步骤提高复杂任务的正确率（CoT 效应）；
       - 工具补足模型短板（实时数据、计算、外部系统）；
       - Observation 提供纠错信号——搜不到就换关键词，报错就换参数。
    4. **现代演进**：显式的 "Thought:" 文本协议已逐渐被 Function Calling 替代（模型直接输出结构化工具调用，更可靠），但"推理→行动→观察"的循环本质不变；推理模型（o1/R1）把 Thought 内化。
    5. **加分点**：能指出 ReAct 的失败模式——工具选错、循环空转（反复搜同一关键词）、过早放弃，对应引出循环控制话题。

- title: "Agent 的规划（Planning）怎么做？任务分解有哪些方法？"
  difficulty: 2
  tags: ["规划", "任务分解", "Planner"]
  position_tags: ["agent"]
  answer: |
    1. **两种规划范式**：
       - **先规划后执行（plan-then-execute）**：Planner 先把任务拆成有依赖关系的子任务 DAG，再逐步执行（必要时重规划）。全局感强、可并行、易审计；
       - **边走边规划（ReAct 式）**：每一步基于最新观察决定下一步。灵活但容易迷失方向、难并行。
       - 实践常混合：粗粒度先规划，子任务内 ReAct。
    2. **分解方法**：
       - **自顶向下分解**：让模型输出子任务列表 + 依赖关系（适合目标明确的任务）；
       - **自底向上组合**：复杂任务先做相似案例检索（Anthropic 的研究模式）；
       - **层次化（分层 Agent）**：主 Agent 拆解 → 子 Agent 各自再拆解执行（BFS/DFS 遍历任务树）。
    3. **关键工程点**：
       - **重规划（replan）**：执行偏差或子任务失败时，带着失败原因重新调整计划，而不是硬着头皮走完；
       - 子任务要 **可验证**（有明确的完成判据），否则执行 Agent 不知道何时该停；
       - 计划存外部存储（不是只在上下文里），防长任务丢失。
    4. **加分点**：指出规划质量的瓶颈常在"任务描述的清晰度"——子任务间接口（输入输出格式）定义清楚，多步正确率才有保障。

- title: "Agent 的记忆系统怎么设计？短期记忆和长期记忆分别怎么实现？"
  difficulty: 2
  tags: ["记忆", "架构"]
  position_tags: ["agent"]
  answer: |
    1. **三层记忆模型**（对齐认知科学的分层）：
       - **短期记忆（工作记忆）**：即上下文窗口——当前对话和工具结果的直接载体，容量有限、随会话消失；
       - **长期记忆**：跨会话持久化的事实与偏好（用户信息、历史结论），需外部存储；
       - **工作记忆压缩**：短期内容定期摘要/结构化后转存长期（防止窗口爆掉）。
    2. **长期记忆实现方案**：
       - **向量库语义检索**：把历史对话/文档向量化，按当前任务语义召回相关记忆（主流）；
       - **结构化记忆**：提取为用户画像/事实三元组存数据库（确定性事实优于向量模糊召回）；
       - **分层组织**：情景记忆（episodic，"做过什么"）+ 语义记忆（semantic，"学到什么"）分库管理。
    3. **读写策略**：写——什么值得记（用户偏好、任务结论、失败教训）要有提取管道，全存等于噪音；读——任务开始时按相关性检索注入 prompt（又是一个 RAG）。
    4. **框架参考**：MemGPT/Letta 的分层记忆管理（主上下文 + 外存 + 自主换页）、LangMem、OpenAI 的 memory 功能。
    5. **加分点**：记忆要有**遗忘和去重**机制（过时信息覆盖更新），否则长期记忆库会自我污染；提到记忆一致性（多 Agent 共享记忆的并发写）。

- title: "Multi-Agent 系统有哪些协作模式？什么时候值得上多 Agent？"
  difficulty: 3
  tags: ["Multi-Agent", "协作"]
  position_tags: ["agent"]
  answer: |
    1. **常见协作拓扑**：
       - **Supervisor（主管模式）**：一个协调者 Agent 拆解任务、分派给专职子 Agent（researcher/writer/critic）、汇总结果——最常用、最可控；
       - **Swarm/去中心化**：Agent 之间点对点交接（handoff），无中心节点——灵活但行为难预测（OpenAI Swarm 是此风格的实验框架）；
       - **流水线（Pipeline）**：按工序接力（大纲→初稿→润色→审校），每棒专注一件事；
       - **Debate/评审（Evaluator）**：生成者与批评者对抗，多轮互相挑错提升质量（写代码+code review 的 AI 版）；
       - **小组讨论（Group chat）**：多个角色共享对话按发言策略轮流（AutoGen 风格）。
    2. **什么时候值得多 Agent**：
       - 任务天然可**并行**（多方向调研）→ 拆开跑省时间；
       - 需要不同 persona/工具集/上下文（上下文隔离，避免单一窗口被塞爆）；
       - 需要**对抗制衡**（生成+评审降低单点错误率）。
    3. **什么时候不值**：简单任务套多 Agent 纯增加成本和故障面——每多一个 Agent 就多一处信息传递损耗（A 的结论压缩给 B 必然失真）。
    4. **工程要点**：Agent 间通信格式标准化、每个子 Agent 有独立上下文与工具白名单、结果聚合要有冲突消解策略。
    5. **加分点**：引用经验结论——多 Agent 不是银弹，收益最大的是"上下文隔离"和"并行"，而非"更多智能"。

- title: "MCP（Model Context Protocol）是什么？解决了什么问题？"
  difficulty: 2
  tags: ["MCP", "协议", "工具生态"]
  position_tags: ["agent"]
  answer: |
    1. **一句话**：Anthropic 推出的开放协议，统一"AI 应用 ↔ 外部能力（工具/数据）"的连接标准——类比 USB-C：以前每个模型接每个工具都要单独适配（M×N 问题），现在各方都实现 MCP 就变成 M+N。
    2. **架构**：
       - **MCP Host/Client**：AI 应用侧（Claude Desktop、IDE、你的 Agent）内嵌的协议客户端；
       - **MCP Server**：能力提供方，暴露三类原语——
         - **Tools**：模型可调用的函数（查数据库、发消息）；
         - **Resources**：可读取的数据（文件、数据库记录）；
         - **Prompts**：预置的提示模板；
       - 传输：stdio（本地进程）或 Streamable HTTP（远程服务）。
    3. **核心收益**：
       - 工具生态复用——写一次 MCP Server（GitHub/Slack/Postgres 已有官方实现），所有支持 MCP 的客户端都能用；
       - 动态发现能力、统一的鉴权与调用语义；
       - 应用与工具解耦，换模型/换框架不用重写集成。
    4. **局限与现状**：协议本身不解决安全（Server 拥有什么权限仍要人管）、性能多一层间接；各家支持度在快速演进（OpenAI/Google 已跟进兼容）。
    5. **加分点**：能对比 Function Calling——FC 是模型侧的调用格式（模型怎么"说"要调工具），MCP 是应用与工具之间的标准接口（工具从哪来、怎么挂载），两者互补而非替代。

- title: "A2A（Agent-to-Agent）协议了解吗？和 MCP 什么关系？"
  difficulty: 3
  tags: ["A2A", "协议", "Multi-Agent"]
  position_tags: ["agent"]
  answer: |
    1. **A2A 是什么**：Google 2025 推出的智能体互联协议——让**不同厂商/不同框架的独立 Agent** 相互发现、协商任务、通信协作。提供 Agent Card（能力发现）、任务生命周期管理（提交/流转/产物）、消息与 artifacts 交换格式。
    2. **和 MCP 的分工（关键考点）**：
       - **MCP 解决 Agent ↔ 工具/数据**（纵向：Agent 怎么用锤子）；
       - **A2A 解决 Agent ↔ Agent**（横向：木匠 Agent 怎么和电工 Agent 合作）；
       - 一个 Agent 同时是两者的节点：向下用 MCP 拿工具，横向用 A2A 找伙伴。
    3. **典型场景**：企业内部不同部门/不同供应商的 Agent 组队（你的行程规划 Agent 找航空公司的订票 Agent），跨组织协作无法共享代码和上下文，只能走标准协议。
    4. **现状认知**：A2A 较新，生态早期，实际生产采用有限——面试表达"了解定位、知道与 MCP 的层次差异"即可，不必夸大成熟度。
    5. **加分点**：把协议分层讲成完整图景——HTTP 之下、模型协议（工具调用格式）之上，中间是 MCP（工具接入）和 A2A（Agent 互联），类似"应用层里的 RPC 生态"。

- title: "给 Agent 设计工具有哪些原则？什么样的工具是好工具？"
  difficulty: 2
  tags: ["工具设计", "Function Calling"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **命名与描述**：
       - 动词+宾语命名（search_orders / create_ticket），名字即语义；
       - **description 是给模型看的提示词**——写清楚用途、适用时机、不适用场景、返回结构，一个含糊的描述毁掉一个工具；
       - 参数名自解释，别用 id1/type2 这种。
    2. **接口设计**：
       - **原子正交**：一个工具一件事，工具间职责不重叠（search_user 和 get_user_by_name 并存会让模型选择困难）；
       - **参数少而严**：必填 ≤5，枚举约束取值范围，数值给 min/max，杜绝模型自由发挥；
       - **幂等与安全分级**：读操作随便调；写操作幂等设计（带唯一请求号）；危险操作（删除/转账/发送）要么拆出确认环节，要么在描述里注明"需要用户明确授权后才能调用"；
       - **返回对模型友好**：结构化 JSON、错误信息写明"哪里错了、该怎么改参数"（模型能据此自我修正），大数据量分页或支持过滤参数。
    3. **工具数量**：一个 Agent 挂 10~20 个为宜，太多选择困难——按需分组（多 Agent 各带子集）或提供"工具目录"工具让模型两级查找。
    4. **加分点**：提"少即是多"——移除低频工具常常提升整体表现；提工具的版本兼容（改参数名等于换了个工具，存量 Agent 行为会变）。

- title: "Agent 的循环怎么控制？如何避免无限循环和成本爆炸？"
  difficulty: 2
  tags: ["循环控制", "预算", "工程化"]
  position_tags: ["agent"]
  answer: |
    1. **终止条件设计**（多层防护）：
       - **任务完成**：模型输出最终答案（最理想）；
       - **最大步数**：硬上限（如 25 步），到顶强制收口——必配，防失控的保险丝；
       - **Token/费用预算**：每会话 token 预算，超限熔断；
       - **超时墙钟**：整体任务 deadline；
       - **无进展检测**：连续 N 步工具调用相同/结果雷同 → 判定卡死，注入提示或终止。
    2. **防循环空转**：
       - 观察到重复行为时**主动打断并注入反思提示**（"你在重复搜索 X，换个思路或总结现有信息"）；
       - 工具结果带缓存标记（"该查询结果与上一步相同"），帮模型意识到徒劳；
       - 把已尝试路径记进上下文（尝试清单），避免模型遗忘后重蹈覆辙。
    3. **成本控制**：
       - 步数 × 每步 token 双维度计费统计，随 trace 落库；
       - 中间步骤用小模型、关键决策用大模型的路内路由；
       - 早停：评估器发现已有信息足够即可提前收束。
    4. **加分点**：提"循环上限是产品决策不只是技术参数"——上限太低截断复杂任务、太高烧钱，要按任务价值校准；提优雅降级（超限时让模型基于已有信息给部分答案而非直接报错）。

- title: "什么是反思（Reflexion）/自我纠错？怎么在 Agent 里落地？"
  difficulty: 2
  tags: ["反思", "自我纠错", "Reflexion"]
  position_tags: ["agent"]
  answer: |
    1. **思想**：Agent 执行后不直接交付，而是**审视自己的过程和结果**，发现错误→总结教训→下次改进。对应人类"复盘"。Reflexion 论文的核心：把失败经验以文字形式存入上下文/记忆，指导下一次尝试。
    2. **落地形式**：
       - **自评（self-critique）**：生成后追加一轮"检查上述结果，列出问题并修正"——简单的两段式就有稳定收益；
       - **外部反馈**：比自评更可靠——单元测试结果（代码 Agent 跑测试）、lint/编译错误、搜索验证（claim 是否可被检索佐证）作为纠错信号；
       - **反思记忆**：失败的教训写入记忆库，跨任务复用（同类错误不再犯）；
       - **Evaluator-Optimizer 循环**：批评者 Agent 与执行者 Agent 对抗迭代 N 轮。
    3. **关键权衡**：
       - 反思是延迟和成本的倍增器（每轮多一次推理），只对高价值任务开启；
       - **自我纠错有天花板**——模型自己发现不了自己的系统性盲区（自我偏好），外部可执行反馈（测试/校验器）才是硬信号；
       - 防止"越改越坏"：保留版本，反思后效果变差要能回滚。
    4. **加分点**：代码 Agent 是反思范式最成功的落地（跑测试→看报错→修，反馈客观可执行），能举这个例子说明对本质的理解。

- title: "Agent 系统怎么评估和测试？为什么比普通应用难？"
  difficulty: 3
  tags: ["评估", "测试"]
  position_tags: ["agent"]
  answer: |
    1. **难在哪**：
       - **非确定性**：同一输入多次运行路径不同（温度采样、检索变化），传统单测断言失效；
       - **多步复合误差**：10 步任务每步 90% 正确率，整体只有 ~35%——单点小损失会指数放大；
       - **路径与结果分离**：结果对但过程违规（调了不该调的工具、绕远路）也算不合格；
       - **环境依赖**：工具是真实外部系统，测试要 mock 或沙箱。
    2. **评估方法分层**：
       - **组件级**：单步工具选择准确率（给定状态该调哪个工具）、参数填写正确率——可做确定性断言；
       - **轨迹级（trajectory）**：对比执行路径与参考路径（必须包含哪些关键步骤、禁止哪些）、步数效率；
       - **端到端**：最终任务完成率（能否通过外部可验证的判据——测试是否通过、答案是否匹配、人工评分）。
    3. **工程实践**：
       - 建**任务集**（覆盖典型/边界/陷阱场景）+ 每个任务的**可执行验收判据**（程序可判的不用 LLM judge）；
       - 同一任务跑 N 次看**通过率与方差**（pass@k / 平均通过率），单次结果无意义；
       - 环境 mock：工具返回录制好的 fixture（录制回放），保证可复现且不产生副作用；
       - 上线后按失败聚类（选错工具/参数错/循环/上下文丢失）驱动针对性改进。
    4. **加分点**：提"用 Agent 评估 Agent"（强模型当裁判评轨迹）的可行性与偏差；提成本——评估本身就是烧钱的，任务集要精选。

- title: "LangGraph 的核心概念是什么？它相比 LangChain Agent 解决了什么问题？"
  difficulty: 2
  tags: ["LangGraph", "框架"]
  position_tags: ["agent"]
  answer: |
    1. **核心抽象：状态机/图**：
       - **StateGraph**：节点（函数或 LLM 调用）+ 边（固定跳转 or 条件边）+ **共享 State**（TypedDict，每个节点读写并返回更新）；
       - **条件边**（conditional edges）：按状态路由——if 有工具调用 → 回工具节点，否则 → END，Agent 循环本质是一个带条件边的环；
       - **Checkpointing**：每步状态自动存档（内存/SQLite/Postgres），实现**断点恢复、时间旅行调试、Human-in-the-loop 中断**；
       - **Subgraph**：图嵌图，多 Agent 的每个成员可以是一张子图。
    2. **对比旧 AgentExecutor 解决的问题**：
       - AgentExecutor 是黑盒 ReAct 循环，改不动流程；LangGraph 把循环展开成显式的图——**控制流白盒可编程**（分支、并行 fan-out/fan-in、循环上限、按节点改 state）；
       - 持久化与恢复原生支持（长任务、跨请求的多轮交互）；
       - 并行节点、多 Agent 编排、中断审批都是图上的自然表达。
    3. **周边生态**：LangSmith（trace）、LangGraph Platform/Studio（可视化调试、部署）。
    4. **同类对比**：AutoGen 侧重多 Agent 对话协作、CrewAI 侧重角色化流水线、LangGraph 侧重**底层可控的状态机编排**——要精细控制选 LangGraph。
    5. **加分点**：明白"LangGraph 不是 Agent 框架而是图编排引擎，Agent 只是用它实现的模式之一"。

- title: "Human-in-the-loop 在 Agent 里怎么落地？哪些环节必须有人？"
  difficulty: 2
  tags: ["Human-in-the-loop", "审批"]
  position_tags: ["agent"]
  answer: |
    1. **哪些环节必须有人**（风险驱动）：
       - **不可逆操作前**：支付、发外部邮件、删数据、提交生产变更——模型判断"想执行"，人批准后才真执行；
       - **模糊授权**：用户意图存在多种解释、影响面大的决策；
       - **低置信收口**：模型自评不确定/评估器打分低时升级人工；
       - **合规要求**：金融医疗等强监管场景的留痕审批。
    2. **技术落地**（以 LangGraph 为例）：
       - **interrupt 中断点**：Agent 执行到危险工具前暂停，状态持久化（checkpoint）；
       - 人工在 UI 上查看"打算调什么工具、什么参数"→ 批准/修改/拒绝；
       - **resume 恢复**：从 checkpoint 继续执行，人工输入作为新状态注入；
       - 关键：暂停期间状态不丢（持久化是 HITL 的前提），工具调用要支持**人工改参后再执行**。
    3. **产品设计**：
       - 审批信息要给出**决策依据**（模型为什么想这么做、依据什么信息），不是光秃秃的参数；
       - 批准粒度分级（单次批准/本次会话记住偏好/白名单免审）；
       - 审批超时策略与升级链路。
    4. **加分点**：提"信任随表现累积"——信任分数高的操作链路逐步免审（自动化率随安全记录提升），而不是永远全人工。

- title: "什么是上下文工程（Context Engineering）？和 Prompt 工程有什么区别？"
  difficulty: 3
  tags: ["上下文工程", "Context Engineering"]
  position_tags: ["agent"]
  answer: |
    1. **定义**：上下文工程 = **决定模型在每一步能看到什么**的系统设计——管理进入上下文窗口的全部信息（系统指令、记忆、工具结果、检索片段、历史轨迹）的选取、压缩、组织与淘汰。Prompt 工程优化"怎么问"，上下文工程优化"喂什么"。
    2. **为什么 Agent 时代它比 prompt 工程更关键**：
       - 单轮对话一个 prompt 定胜负；Agent 跑几十步，上下文持续累积——**长任务的主要失败模式不是"不会"而是"上下文被污染/爆窗/关键信息被稀释"**（lost in the middle）；
       - 工具返回值动辄几十 KB，几次调用就吃掉窗口，必须管理。
    3. **核心手法**：
       - **选取**：每步按需注入（当前子任务相关的记忆/工具结果），不是全量打包；
       - **压缩**：工具输出结构化提取（把 HTML 抽成字段）、历史对话滚动摘要、旧步骤折叠为"已完成+结论"；
       - **结构化组织**：清晰的分区标记（指令/资料/历史/当前任务），重要内容置顶或置尾；
       - **淘汰**：过时信息出窗，任务切换时清理无关残留；
       - **外置**：能查的别塞（把参考资料变成可检索工具），文件式上下文（Claude Code 的 CLAUDE.md/plan 文件）代替塞满窗口。
    4. **加分点**：这是 2024~2025 的热词（Karpathy 等人推），能讲出"上下文是 Agent 最稀缺的资源，工程化地花好每一个 token"这一层就到位了。

- title: "子 Agent（Sub-agent）模式怎么用？和单 Agent 挂全部工具比有什么优势？"
  difficulty: 2
  tags: ["子Agent", "上下文隔离"]
  position_tags: ["agent"]
  answer: |
    1. **模式**：主 Agent 把子任务委派给专职子 Agent——子 Agent 有自己的上下文窗口、工具子集和系统提示，干完活把**结果摘要**（不是全过程）返回主 Agent。
    2. **核心价值——上下文隔离**：
       - 单 Agent 干研究类任务，检索结果/网页全文很快塞爆窗口且互相干扰；子 Agent 在自己窗口里消化海量原始内容，只回传几十 token 的结论——**主 Agent 的上下文保持干净聚焦**；
       - 每个子 Agent 的提示词/工具集针对子任务定制，不用一个提示词兼容所有场景。
    3. **其他收益**：
       - **并行**：多个子 Agent 同时跑（多角度调研/多文件分析），墙钟时间大幅缩短；
       - **工具权限隔离**：子 Agent 只能碰自己的工具，爆炸半径小；
       - 递归分解：子 Agent 可以再派孙 Agent（Claude Code 的 research 子代理、Deep Research 的层次化调研都是此模式）。
    4. **代价**：信息传递有损（子 Agent 压缩结论必然丢细节）、每层多一份系统提示开销、结果质量依赖子 Agent 的任务描述质量（接口要定义清楚：输入是什么、必须返回什么格式）。
    5. **加分点**：什么时候不用——子任务很轻（一次查询的事）没必要开子 Agent，开销大于收益；子 Agent 返回结论要求带"引用来源"以便主 Agent 能追溯。

- title: "常见的 Agent 架构模式有哪些？（Router / Planner-Executor / Evaluator-Optimizer）"
  difficulty: 2
  tags: ["架构模式", "Router", "Planner-Executor"]
  position_tags: ["agent"]
  answer: |
    1. **Router（路由器/.prompt Router）**：入口先分类（意图识别/难度判断），把请求分发到不同的专业链路（FAQ 直答、RAG、Agent、人工）。价值：简单请求不过 Agent（省钱提速）、各链路各自优化。实现上就是一个 LLM 分类节点或小分类模型 + 规则兜底。
    2. **Planner-Executor（规划-执行）**：Planner 拆任务出计划（可能带依赖 DAG）→ Executor 逐步执行 → 执行结果反馈触发 Replan。适合目标明确但路径长的任务（数据处理、批量操作、深度调研）。要点：计划显式存储、可中断可重排、子任务可验证。
    3. **Evaluator-Optimizer（生成-评审循环）**：生成器产出 → 评估器（模型/规则/测试）打分给反馈 → 生成器改进 → 循环到达标或轮次上限。适合质量敏感且反馈可判定的任务（写作、代码、翻译）。**评估器越客观（可执行测试 > LLM judge > 自评）效果越好**。
    4. **组合现实**：生产系统通常是洋葱结构——外层 Router 分流，中层 Workflow 定骨架，内层嵌 Evaluator 循环或子 Agent，不是纯单一模式。
    5. **加分点**：能针对一个具体业务（智能客服）现场画出"Router → FAQ/RAG/工单 Agent → 人工兜底"的洋葱图，说明何时升级降级。

- title: "LangChain、LlamaIndex、CrewAI、AutoGen 这些框架怎么选？还是不用框架裸写？"
  difficulty: 2
  tags: ["框架对比", "选型"]
  position_tags: ["agent"]
  answer: |
    1. **定位速览**：
       - **LangChain/LangGraph**：全家桶——LangChain 提供组件（模型抽象/工具/检索集成），LangGraph 负责编排（状态图/持久化/HITL），生态最大、抽象层多；适合需要完整生态和深度定制编排的团队；
       - **LlamaIndex**：以**数据/检索为中心**（文档加载、索引、查询引擎做最深），RAG 场景开箱体验最好；Agent 能力是后来加的；
       - **CrewAI**：**角色化多 Agent 流水线**（定义 crew 成员/任务/backstory），上手快，适合快速搭"研究小组/内容工厂"类原型；
       - **AutoGen（微软）**：多 Agent **对话协作**研究味浓（group chat、代码执行器），适合实验新协作范式；
       - **OpenAI Agents SDK / Claude Agent SDK**：厂商官方轻量方案——工具循环、handoff、guardrail，简洁够用，绑定各自生态。
    2. **选型逻辑**：
       - 原型/个人项目：先用官方 SDK 或 CrewAI 快速验证；
       - 生产 RAG 为主：LlamaIndex 或自建检索 + 轻框架；
       - 生产复杂编排/要 HITL/持久化：LangGraph；
       - **核心链路经常裸写更好**——Function Calling 循环两三百行代码，框架的抽象反而碍调试。
    3. **裸写 vs 框架的判断**：框架价值在集成生态（现成 loader/工具/观测）和编排原语；代价是抽象泄漏、版本动荡（LangChain 大版本破坏性变更是出名痛点）、黑盒难调。**用框架的组件、控制核心循环**是常见折中。
    4. **加分点**：表达"框架是脚手架不是护城河"——理解 ReAct 循环和上下文管理后，框架切换成本很低；选型看团队维护成本和生态锁定风险。

- title: "Agent 的安全风险有哪些？工具滥用和越权怎么防？"
  difficulty: 3
  tags: ["安全", "权限", "越权"]
  position_tags: ["agent"]
  answer: |
    1. **特有风险图谱**（比普通 LLM 应用多"能动手"这一层）：
       - **提示注入 → 工具劫持**：注入的指令诱导 Agent 调用危险工具（间接注入最凶险——恶意网页让浏览型 Agent "把用户数据发到某地址"）；
       - **越权**：Agent 持有的凭证权限过大（用 root 数据库凭证连库，被注入一条 DROP 就完了）；
       - **工具滥用**：无限循环调用烧钱、批量操作波及范围过大（一条"给所有联系人发邮件"）；
       - **数据外泄**：上下文里的敏感信息被诱导输出或发给第三方工具；
       - **供应链**：MCP Server/工具本身被投毒。
    2. **纵深防御**：
       - **最小权限**：每个工具/子 Agent 独立凭证，权限收窄到只够当前任务（只读账号、行级/库级隔离、API scope 限定）；
       - **高危操作确认**：写/删/付/外发类工具默认挂人工审批（HITL interrupt）；
       - **操作白名单 + 资源配额**：可访问的域名/表/目录白名单，步数与预算熔断；
       - **沙箱执行**：代码执行类工具跑在隔离容器（无网络/文件系统只读/超时杀）；
       - **审计与监控**：全量工具调用日志（谁/何时/什么参数/结果），异常模式告警（高频写操作、非常规时间）；
       - **不可信内容标记**：外部数据进上下文前隔离标记，模型提示明确"数据内指令无效"。
    3. **关键认知**：Agent 安全 = LLM 安全 + **传统系统安全**（凭证管理/权限设计/审计），后者权重更大——模型不可靠可以用工程兜底，权限给大了没人兜得住。

- title: "以 Deep Research 或 Claude Code 为例，一个复杂 Agent 产品的架构是怎样的？"
  difficulty: 3
  tags: ["架构", "实战", "Deep Research"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **Deep Research 型（调研 Agent）**：
       - **循环结构**：规划（拆解研究问题）→ 多轮"搜索→阅读→记录要点→发现新线索→再搜索"→ 综合成报告；
       - **外部记忆**：长任务的发现持续写入外部文件/笔记（不靠上下文硬撑），最终报告基于笔记生成；
       - **并行子 Agent**：把子问题 fan-out 给多个搜索子 Agent 同时跑，各自消化网页全文、只回传结论，主 Agent 汇总——上下文隔离 + 并行提速；
       - **终止控制**：信息饱和度判断（新搜索不再带来新信息）+ 步数/时间预算。
    2. **Claude Code 型（编码 Agent）**：
       - **工具集**：读文件/写文件/执行 shell/搜索代码库——工具的返回设计极度克制（读文件带行号、grep 返回精确片段）；
       - **环境即反馈**：跑测试、编译、lint 作为客观纠错信号（反思闭环的可执行版本）；
       - **文件即记忆**：CLAUDE.md（项目约定）、plan 文件（当前任务计划）持久化在文件系统，跨会话续接；
       - **权限模型**：默认只读，写/执行按需授权，危险命令确认——HITL 落地范本。
    3. **共性设计模式**（答到这些就是满分骨架）：
       - 主循环 + 子 Agent 分层（隔离与并行）；
       - 外部记忆/文件系统承载长任务状态（对抗上下文有限）；
       - 可执行的客观反馈（测试/搜索结果）驱动纠错；
       - 预算与终止兜底 + 高危操作人工关卡。
    4. **加分点**：指出这类产品验证的结论——"长任务 Agent 的瓶颈不在模型智力，而在上下文管理和状态外置"；能对比两者的差异（调研型输出是报告、编码型输出是可验证的代码变更）。

- title: "Agent 开发怎么调试和排错？讲讲你的调试工作流。"
  difficulty: 3
  tags: ["调试", "可观测性", "实战"]
  position_tags: ["agent"]
  answer: |
    1. **先有 trace 再谈调试**：每次运行记录全轨迹——每步的 prompt 全文、模型输出、工具调用参数与返回、token 消耗。Langfuse/LangSmith 或自建；没有 trace 的 Agent 调试等于盲改。
    2. **典型故障与定位**：
       - **选错工具**：看 description 是否含糊、工具是否职责重叠 → 改描述/拆并工具；
       - **参数填错**：schema 缺枚举/类型约束，或参数语义没写清 → 补约束；模型反复填错同一参数通常是描述问题不是模型问题；
       - **循环空转**：观察重复模式 → 加无进展检测、注入反思提示、查是否工具返回报错信息模型读不懂；
       - **上下文丢失**（早期决策后期遗忘）：上下文超长或关键信息被冲掉 → 压缩历史、关键结论外置（记事本模式）、重要信息置顶；
       - **中途幻觉**：检索没召回到相关内容模型硬编 → 问题在检索侧不在生成侧，查 chunk 和召回。
    3. **调试手段**：
       - **逐步回放**：基于 checkpoint 从任意步重放，改了 prompt 从该步重跑（不用整条重来）；
       - **A/B 单变量**：一次只改一处（prompt/工具/参数），跑固定任务集对比通过率；
       - **单元化**：把"工具选择"从整链路里拆出来单独测（给定状态快照，断言应选的工具）——Agent 的单测就是状态快照测试；
       - **失败聚类**：积累 bad case 按失败类型归档，同类问题一次修复全局验证。
    4. **加分点**：强调"先复现再修复"——把失败 case 固化成回归测试；讲一个自己排错的具体故事比背方法论有说服力。
