# 计算机网络经典面试题
- title: "TCP 三次握手和四次挥手的过程？为什么是三次和四次？"
  difficulty: 1
  tags: ["TCP", "握手挥手"]
  position_tags: ["java", "backend", "python", "golang", "cpp", "test", "dba"]
  answer: |
    1. **三次握手**：客户端 SYN(seq=x) → 服务端 SYN+ACK(seq=y, ack=x+1) → 客户端 ACK(ack=y+1)。
       **为什么三次**：双方都需要确认"我能发、你能收 + 你能发、我能收"。两次无法确认服务端的发送能力（且旧的重复 SYN 会让服务端白建连接浪费资源）；四次中 SYN+ACK 可合并所以是三次。
    2. **四次挥手**：主动方 FIN → 被动方 ACK（此时被动方可能还有数据要发）→ 被动方发完数据后 FIN → 主动方 ACK，主动方进入 **TIME_WAIT** 等 2MSL 后关闭。
       **为什么四次**：关闭是全双工两个方向各关一次；被动方 ACK 和 FIN 之间可能还有数据要发，不能合并（特殊情况下可合并成三次）。
    3. **TIME_WAIT 为什么等 2MSL**：确保最后的 ACK 能重传到达（若对方没收到 FIN 的 ACK 会重发 FIN）；让本连接的旧报文在网络中消亡，避免污染新连接。

- title: "服务器出现大量 TIME_WAIT 怎么办？"
  difficulty: 2
  tags: ["TCP", "TIME_WAIT"]
  position_tags: ["backend", "dba", "golang", "cpp", "java"]
  answer: |
    1. **先理解**：TIME_WAIT 出现在**主动关闭方**，2MSL（通常 60s）后消失。大量 TIME_WAIT 说明本机频繁主动断连——典型是**每请求新建短连接**（HTTP 短连接、DB/Redis 每次新建）。
    2. **本质解决（治本）**：
       - **连接复用**：HTTP Keep-Alive / 连接池（数据库连接池、Redis 连接池、HTTP client 连接池）——这是正解，TIME_WAIT 自然消失；
       - 长连接保活配置合理。
    3. **参数缓解（治标）**：
       - `net.ipv4.tcp_tw_reuse=1`：客户端侧快速复用 TIME_WAIT 端口（依赖时间戳）；
       - `tcp_max_tw_buckets` 限制总量（超出直接销毁，有风险）；
       - **不要开 tcp_tw_recycle**（NAT 下出问题，已从内核移除）。
    4. **判断方向**：大量 TIME_WAIT 在服务端出现，通常说明客户端（包括自己的下游调用方）没用长连接，推动调用方改连接池。

- title: "TCP 如何保证可靠传输？"
  difficulty: 2
  tags: ["TCP", "可靠性"]
  position_tags: ["java", "backend", "python", "golang", "cpp"]
  answer: |
    1. **序列号 + 确认应答（seq/ack）**：每个字节编号，接收方 ACK 确认，数据有序且不丢。
    2. **超时重传**：RTO 基于 RTT 动态计算，超时未确认重发；**快速重传**：收到 3 个重复 ACK 立即重发，不等超时。
    3. **滑动窗口（流量控制）**：接收方通过窗口字段告知自己缓冲区剩余能力，发送方控制发送速率，防止淹没对方。
    4. **拥塞控制**：慢启动（指数增）、拥塞避免（线性增）、快速重传 + 快速恢复，探测网络容量避免压垮网络。
    5. **校验和**：检测传输过程的数据损坏。
    6. **去重**：序列号丢弃重复报文。

- title: "HTTPS 的握手过程？为什么既用非对称又用对称加密？"
  difficulty: 2
  tags: ["HTTPS", "TLS"]
  position_tags: ["java", "backend", "python", "golang", "cpp", "test"]
  answer: |
    1. **TLS 1.2 握手（RSA 版）**：
       - ClientHello：客户端发随机数 + 支持的加密套件；
       - ServerHello + Certificate：服务端选套件、发随机数和**证书**（含公钥）；
       - 客户端**验证证书链**（CA 签名、域名、有效期），生成预主密钥用**服务端公钥加密**发送；
       - 双方用 两个随机数+预主密钥 派生**会话密钥**，互发 Finished 验证；之后用会话密钥对称加密通信。
    2. **TLS 1.3**：握手 1-RTT（甚至 0-RTT），废弃 RSA 密钥交换，用 ECDHE —— 具备**前向安全**（私钥泄露也解不开历史流量）。
    3. **为什么混合加密**：
       - **非对称**（RSA/ECDHE）只用于**密钥协商和身份认证**——安全但慢（千倍于对称）；
       - **对称**（AES/ChaCha20）用于**数据传输**——快，适合大流量；
       - **证书 + CA 签名**解决"公钥是不是真服务端"的中间人问题。

- title: "从浏览器输入 URL 到页面展示，中间发生了什么？"
  difficulty: 1
  tags: ["综合题", "HTTP", "DNS"]
  position_tags: ["java", "backend", "python", "golang", "cpp", "test", "frontend"]
  answer: |
    1. **URL 解析**：补协议、HSTS 判断是否强制 HTTPS。
    2. **DNS 解析**：浏览器缓存 → 系统缓存/hosts → 本地 DNS 服务器 →（根 → 顶级域 → 权威域，递归/迭代）拿到 IP；CDN 场景在 DNS 层就近调度。
    3. **建立 TCP 连接**：三次握手；HTTPS 再加 TLS 握手。
    4. **发送 HTTP 请求**：请求行 + 头 + 体；服务端经过负载均衡 → 网关 → 应用处理（可能查缓存/DB）返回响应。
    5. **浏览器渲染**：解析 HTML 构建 DOM 树 → CSSOM → 合成渲染树 → 布局（回流）→ 绘制（重绘）→ 合成；遇到 JS 阻塞解析（script 有 defer/async 区别）。
    6. **连接管理**：Keep-Alive 复用连接，Connection: close 才关闭。
    7. **面试加分**：能结合自己项目讲优化——CDN、HTTP/2 多路复用、缓存（强缓存/协商缓存）、静态资源压缩、服务端缓存链路（本地缓存 → Redis → DB）。
