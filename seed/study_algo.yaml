# 八股文库：算法题型套路（陈述式背诵卡，非具体题解）
category: ALGO
doc:
  title: "算法题型套路体系全景"
  content: |
    算法面试的本质不是背题库，而是掌握十几个有限的题型套路，在读题时识别题眼、套用对应模板。按数据结构与思想分类，可以组织成五条主线。

    **线性结构：双指针与滑动窗口。** 双指针三大形态各有识别信号：有序数组找配对用对撞指针，收缩方向由比较结果决定；链表的中点、环、倒数第 k 用快慢指针，速度差制造确定性相遇；原地删除与分区用前后指针，慢指针维护已处理区的边界。单调性是双指针正确性的共同前提。滑动窗口是同向双指针的标准形态，右扩左缩、每步更新答案，窗口内维护的统计量——字符频次、distinct 计数、最高频次——决定具体解法。

    **链表与树。** 链表题有三条纪律：哑结点消除头部边界分支，画图确定指针操作顺序，先存 next 再改指针防断链。反转、合并、判环是三个母题，绝大多数变体是它们的组合。二叉树四种遍历是全部骨架，BST 的中序有序性专治验证与第 k 小；需要汇总子树信息的问题统一走后序自底向上框架，LCA 是标准范例；直径与平衡树这类题要把递归返回值与全局答案分成两个变量记账。LRU 是设计题代表：哈希表定位加双向链表维护顺序，两个 O(1) 各司其职。

    **查找与排序。** 二分的核心是区间语义一致——闭区间配 while(left<=right)，左闭右开配小于号，混用必错；变体沿着「命中后继续收缩」演化出找左边界与找右边界模板，旋转数组先判哪半有序，二分答案把最值问题转成判定问题。排序对比抓复杂度、稳定性、场景三个维度：快排原地不稳、归并稳定费空间、堆排抗最坏，近乎有序时插入排序接近 O(n)，TopK 用 k 大小的小顶堆做到 O(n log k)。

    **DP 与图。** 动态规划的叙述框架是三要素：状态定义、转移方程、初始化与遍历顺序；转移的母题是「选与不选」——不选继承前状态，选则扣资源加收益取 max，背包、打家劫舍、LCS 全是它的变体。网格问题本质是图遍历：flood fill 计连通分量，多源 BFS 让所有源头同时入队，层号即最短扩散时间；栈类题从括号匹配进化到单调栈，「下一个更大」与「最近大小关系」是它的识别信号。

    **实战心法。** 先想暴力解再想优化方向；每个模板先过边界（空、单元素、两元素）；复杂度说出口前先数循环层数。识别信号背熟——有序配对想对撞、连续子串想窗口、嵌套匹配想栈、最优子结构想 DP、连通计数想 flood fill——考场上就是把题目关键词翻译成套路的翻译题。
cards:
  - title: "双指针三大形态的识别信号"
    content: "双指针把 O(n²) 的暴力降到 O(n)，前提是两端信息具有单调性——一侧不可能再优时才能安全收缩。三大形态各有识别信号：有序数组找配对（两数之和、回文判断、盛水容器）用对撞指针，收缩方向由比较结果决定；链表的中点、环、倒数第 k 用快慢指针，速度差制造位移差；原地删除、分区、荷兰国旗用前后指针，慢指针维护已处理区的边界。看到有序配对想对撞、看到原地操作想快慢前后、看到连续区间想窗口，是双指针的选题直觉。"
    points:
      - "单调性是双指针正确性的前提"
      - "有序配对 → 对撞指针"
      - "链表中点/环/倒数 k → 快慢指针"
      - "原地删除与分区 → 前后指针"
      - "双指针把 O(n²) 降到 O(n)"

  - title: "快慢指针解决链表中点、环与倒数第 k"
    content: "快慢指针用速度差或路程差构造确定性相遇。判环：fast 每次走 2、slow 走 1，有环必在环内相遇，无环 fast 先到尾；求入环点：相遇后把一个指针放回头部，同速前进再次相遇处即入口，依据是头部到入口的距离等于相遇点到入口加整数圈；找中点：fast 到尾时 slow 恰在中点；找倒数第 k：fast 先走 k 步再同速前进。实现细节易错：访问 fast.next.next 前必须先判 fast.next 非空，否则空指针。"
    points:
      - "快 2 慢 1 相遇即有环"
      - "相遇后一头从头走，再相遇即入环点"
      - "fast 到尾时 slow 在中点"
      - "fast 先走 k 步求倒数第 k"
      - "判空在前：先查 fast.next 再查 next.next"

  - title: "滑动窗口的通用模板"
    content: "滑动窗口是同向双指针的标准形态，模板三句话：右指针逐格扩张探索，窗口条件被破坏时左指针收缩恢复合法，每一步更新答案。它适用的问题有统一特征——连续子串或子数组上的最长、最短或计数（无重复字符最长子串、最小覆盖子串、至多 K 个不同字符）。窗口内维护什么统计量决定解法：字符频次表、distinct 计数、窗口内最高频次都是常见选择。注意合法性判断要放在收缩完成之后；最小窗口题的节奏是先扩张到满足、再收缩到刚好不满足取最短。"
    points:
      - "右扩左缩，每步更新答案"
      - "适用连续子串/子数组的最值与计数"
      - "统计量（频次、distinct、maxFreq）决定解法"
      - "合法性判断放收缩完成后"
      - "最小窗口：先满足再收缩取最短"

  - title: "滑动窗口的经典变体套路"
    content: "滑动窗口的变体都围绕统计量做文章。无重复最长子串用哈希表记录字符最近下标，遇重复且仍在窗口内时左指针直接跳到上次出现位置加一，比逐格收缩更快；至多 K 个不同字符用频次表加 distinct 计数，超过 K 就收缩左端直至恢复；字符替换后最长连续（424）维护窗口内最高频次，窗口长度减最高频次超过 k 才收缩；最小覆盖子串（76）先扩张到覆盖目标，再收缩到最小。所有变体的共同骨架不变，变化的只是收缩条件与维护的统计量。"
    points:
      - "无重复子串：左指针跳到上次出现 +1"
      - "至多 K 不同：distinct 超 K 即收缩"
      - "替换后最长：len − maxFreq > k 才收缩"
      - "最小覆盖：先满足后收缩找最短"
      - "骨架不变，变的是收缩条件与统计量"

  - title: "链表题的三条防错纪律"
    content: "链表题正确率低的根源在指针操作顺序与边界，三条纪律覆盖绝大多数翻车点。第一，哑结点 dummy：在头部加哨兵节点，让头插、删除头节点的分支消失，合并有序链表、删除重复节点都靠它省掉 if 判断；第二，画图定顺序：每一步指针改动前画出改动前后的示意，确定先后依赖；第三，先存后改：修改 curr.next 前先把 next 存进临时变量，反转链表里丢了 next 引用就直接断链。空链表、单节点、尾节点三个边界每个题都必须过一遍。"
    points:
      - "哑结点消除头部边界分支"
      - "画图确定指针操作顺序"
      - "先存 next 再改 curr.next，防断链"
      - "空链表、单节点、尾节点三边界必查"
      - "反转链表是链表指针操作的基本功"

  - title: "链表三母题：反转、合并、判环"
    content: "反转、合并、判环是链表题的三个母题，变体基本是它们的组合。反转链表用 prev/curr 双指针迭代，每次把 curr.next 指回 prev 后整体右移，O(n) 时间 O(1) 空间，递归版先反转后半部分再接回；合并两个有序链表用哑结点加双指针比大小接尾，O(m+n)，K 条链表合并用分治两两归并或小顶堆，都是 O(N logK)；判环与求入环点靠快慢指针的确定性相遇。把三个母题写成无 bug 代码，链表题就拿下了一大半。"
    points:
      - "反转：prev/curr 迭代，O(1) 空间"
      - "合并：哑结点 + 双指针接尾"
      - "K 路合并：分治或堆，O(N logK)"
      - "判环与入环点：快慢指针"
      - "母题组合出绝大多数链表变体"

  - title: "二叉树遍历四式与迭代要点"
    content: "四种遍历构成树的全部访问骨架：前中后序属 DFS，用递归或显式栈；层序属 BFS，队列逐层处理。中序与前序或后序组合可唯一重建二叉树，BST 的中序遍历是升序序列——验证 BST、找第 k 小都依赖它。迭代实现的要点各不同：前序用栈先压右再压左；中序一路向左压栈，弹栈访问再转向右子树；后序可用前序变形（根右左）再逆序的技巧，或用 lastVisited 双条件判断。Morris 遍历利用线索指针把空间降到 O(1)，是进阶加分项。"
    points:
      - "前中后序属 DFS，层序属 BFS"
      - "中序 + 前序/后序可唯一重建二叉树"
      - "BST 中序即升序：验证 BST、第 k 小"
      - "中序迭代：压左到底，弹栈访问转右"
      - "后序迭代可走根右左再逆序"

  - title: "自底向上的后序递归框架"
    content: "需要汇总子树信息的问题统一用后序递归框架：先递归左右子树拿到结果，再在当前节点合并——最近公共祖先（LCA）是标准范例：左右子树分别找 p 与 q，两边都命中说明当前节点是 LCA，单边命中则把命中结果上抛，都空返回 null，O(n) 一遍完成。最大深度、平衡二叉树判断、二叉树直径都是同一框架的实例：子树信息先汇总，父层再决策。后序天然适合自底向上，因为返回值就是子树给父节点的完整答卷。BST 的 LCA 有捷径：值介于 p 与 q 之间即为答案，不必遍历全树。"
    points:
      - "先递归子树再合并：后序自底向上"
      - "LCA：两边都命中当前节点即答案"
      - "单边命中上抛，双空返回 null"
      - "深度、平衡、直径同属此框架"
      - "BST 的 LCA 按值域直接判定，O(h)"

  - title: "哈希表加双向链表实现 O(1) LRU"
    content: "LRU 缓存要求 get 与 put 都 O(1)，单一数据结构做不到，标准解是组合：哈希表负责 key 到节点的定位，双向链表负责访问顺序，头部最新、尾部最旧。get 命中则摘下移到头部；put 已存在则更新并移头，不存在则头插，超容删尾节点并同步删哈希条目。用哑头哑尾节点消除两端边界判断。工程捷径：LinkedHashMap(accessOrder=true) 重写 removeEldestEntry；工业级如 Redis 用采样近似 LRU，因维护全序链表开销大；LFU 补充频次维度。"
    points:
      - "哈希表定位 + 双向链表维护顺序"
      - "get/put 均 O(1)，超容删尾"
      - "哑头哑尾消除边界判断"
      - "LinkedHashMap accessOrder 是工程捷径"
      - "Redis 用采样近似 LRU 换取低开销"

  - title: "二分查找的区间语义统一"
    content: "二分查找的 bug 九成出在区间语义与循环条件不配套。闭区间 [l, r] 配 while(l <= r)，收缩 l=mid+1 或 r=mid-1；左闭右开 [l, r) 配 while(l < r)，收缩 r=mid。任选一种语义贯彻到底，混用必错。mid 用 left+(right-left)/2 防加法溢出。命中即返回是标准二分；找边界则命中不返回、继续收缩，结束时 left 即边界。死循环的根源是区间未缩小，必须保证每轮 left 或 right 至少移动一格。"
    points:
      - "闭区间配 <=，左闭右开配 <，不可混用"
      - "mid 用防溢出写法：left + (right-left)/2"
      - "命中即返回是标准二分"
      - "找边界命中不返回，继续收缩"
      - "死循环根源：区间未缩小"

  - title: "找左右边界的二分变体模板"
    content: "「第一个/最后一个满足条件的位置」即 lower_bound 与 upper_bound 模板。找左边界：命中后不返回，right=mid-1，结束时 left 即首个大于等于 target 的位置；找右边界对称：命中后 left=mid+1。口诀：找左排除右侧、找右排除左侧。旋转数组：先比较 nums[l] 与 nums[mid] 判断哪半有序，再看 target 落不落在有序半区；含重复元素时 l==mid 无法判断，退化为 l++ 缩界。二分答案把最小化最大值问题转为对答案区间二分。"
    points:
      - "lower_bound：命中不返回，right=mid-1"
      - "upper_bound 对称：left=mid+1"
      - "口诀：找左排除右侧，找右排除左侧"
      - "旋转数组先判哪半有序再定位"
      - "二分答案：对答案区间二分验证"

  - title: "快排的分区写法与防退化优化"
    content: "快排的骨架是选 pivot、分区、递归两侧，面试推荐 Lomuto 分区：pivot 取末尾，i 维护小于区右界，j 线扫，遇小于 pivot 的与 i 交换，最后把 pivot 换到分界处。有序数组配固定 pivot 退化 O(n²)，防御：随机 pivot 或三数取中；大量重复元素用三路分区；小区间切插入排序。对比：快排平均 O(nlogn) 原地不稳定，归并稳定费 O(n) 空间，堆排原地且最坏 O(nlogn)。JDK DualPivotQuicksort 即插排加堆排兜底的混合策略。"
    points:
      - "Lomuto 分区：pivot 取尾，i 界 j 扫"
      - "随机 pivot/三数取中防有序退化"
      - "三路分区应对重复元素"
      - "快排原地不稳，归并稳定费空间，堆排原地抗最坏"
      - "工业排序是插排与堆排兜底的混合策略"

  - title: "排序算法的选型对比框架"
    content: "排序对比抓住三个维度：复杂度、稳定性、适用场景。比较排序的下界是 O(nlogn)：快排平均 O(nlogn) 最坏 O(n²) 原地不稳定；归并 O(nlogn) 稳定但 O(n) 辅助空间，外排序与链表排序天然用它；堆排原地不稳定，TopK 与部分有序场景价值突出；冒泡与插入 O(n²)，但近乎有序时插入排序接近 O(n)，这是 TimSort 的基础。非比较的计数/桶/基数排序在值域有限时达 O(n)，代价是空间与适用条件。选型按规模、有序度、稳定性要求、内存约束四点展开。"
    points:
      - "比较排序下界 O(nlogn)"
      - "快排原地不稳，归并稳定费空间，堆排原地抗最坏"
      - "近乎有序时插入排序接近 O(n)"
      - "计数/桶/基数在值域有限时突破下界"
      - "选型四要素：规模、有序度、稳定性、内存"

  - title: "动态规划的三要素与叙述框架"
    content: "动态规划的叙述固定走三步：状态定义——dp[i] 的含义一句话说清；转移方程——dp[i] 由哪些更小的状态推出；初始化与遍历顺序——依赖前者就从小到大。爬楼梯 dp[i]=dp[i-1]+dp[i-2] 本质是斐波那契，滚动变量压空间到 O(1)；打家劫舍取 max(dp[i-1], dp[i-2]+nums[i])，即不偷本间与偷本间，环形版拆两次线性取最大；LIS 定义为以 i 结尾的长度，O(n²) 可用贪心加二分优化到 O(nlogn)。状态定义偏了就回头重定义，这是常态而非失败。"
    points:
      - "三要素：状态定义、转移方程、初始化与顺序"
      - "爬楼梯即斐波那契，滚动变量压空间"
      - "打家劫舍：不偷本间与偷本间取 max"
      - "LIS 贪心 + 二分优化到 O(nlogn)"
      - "状态定义偏了就重定义"

  - title: "选与不选是 DP 的决策母题"
    content: "大多数 DP 的转移都在回答同一个问题：当前元素选还是不选。打家劫舍的不偷本间对应不选、偷本间对应选；0-1 背包的 dp[i][w]=max(不放 i, 放 i 加价值) 是最完整的表达；编辑距离、最长公共子序列在两串末尾字符相同与不同之间做分支——本质也是对最后一个元素的处置决策。识别出「选与不选」结构后，转移方程的写法就从背题变成推导：不选则继承前状态，选则扣减资源加收益取 max。记忆化搜索（自顶向下）与递推（自底向上）是同一转移的两种实现，面试可任选但要一致。"
    points:
      - "不选继承前状态，选则扣资源加收益取 max"
      - "打家劫舍、背包、LCS 都是这个母题"
      - "0-1 背包：不放与放的 max"
      - "LCS 与编辑距离按末尾字符分支"
      - "记忆化搜索与递推等价，实现取一"

  - title: "栈类题的匹配层次与单调栈进阶"
    content: "栈的天然属性是匹配嵌套层次。有效括号是入门：左括号入栈，右括号检查栈顶是否为对应左括号，匹配弹出，结束时栈空才合法——两类易错：纯右括号中途失败、纯左括号结束栈非空；最小栈用辅助栈同步压入当前最小值，getMin 保持 O(1)，注意相等值也要压。进阶是单调栈：栈内保持单调性，弹栈时结算——下一个更大元素、柱状图中最大矩形、每日温度都靠它，每个元素至多入栈出栈一次，均摊 O(n)。识别信号：出现「下一个更大/更小」或「最近的大小关系」就是单调栈。"
    points:
      - "栈匹配嵌套层次：括号匹配、字符串解码"
      - "有效括号：右括号查栈顶，结束栈空才合法"
      - "最小栈：辅助栈同步压最小值，相等值也压"
      - "单调栈弹栈时结算，均摊 O(n)"
      - "下一个更大/最近大小关系 → 单调栈"

  - title: "网格问题的 flood fill 与多源 BFS"
    content: "网格问题的本质是图遍历。岛屿数量是连通分量计数：遍历每个格子，遇到未访问的陆地就把计数加一，从它出发 flood fill（DFS 递归或 BFS 队列）把整个连通块标记掉，每个格子至多访问一次，O(m×n)。BFS 相对 DFS 的优势在于能求最短路径类答案：腐烂的橘子、01 矩阵距离都是多源 BFS——所有源头同时入队作为第一层，层号就是扩散时间或距离。易错点是标记时机：入队时就标记而不是出队时，否则同一格重复入队导致内存爆炸；大网格的 DFS 递归可能爆栈，改用显式栈或 BFS。"
    points:
      - "网格问题本质是图遍历"
      - "岛屿数量：遍历 + flood fill 计连通分量"
      - "多源 BFS：源头同时入队，层号即距离"
      - "入队时标记防重复入队"
      - "大网格递归 DFS 有爆栈风险"

  - title: "TopK 问题的小顶堆套路"
    content: "从海量数据中取最大的 k 个，标准解法是维护一个 k 大小的小顶堆：堆里始终保存当前最大的 k 个元素，新元素大于堆顶（当前第 k 大）就替换堆顶并下沉调整，扫完一遍堆里即答案。复杂度 O(n log k)，当 k 远小于 n 时远优于整体排序；空间 O(k)，适合流式数据与内存受限场景。取最小的 k 个则对称地用大顶堆。对比：整体排序 O(nlogn) 浪费；快速选择平均 O(n) 但需全量数据在内存。此套路在堆排、PriorityQueue、海量数据面试题中反复出现。"
    points:
      - "最大 k 个用 k 大小的小顶堆"
      - "新元素大于堆顶即替换下沉"
      - "复杂度 O(n log k)，空间 O(k)"
      - "最小 k 个对称用大顶堆"
      - "流式与内存受限场景首选"

  - title: "双指针的分区形态：移动零与荷兰国旗"
    content: "前后指针的分区形态解决原地重排问题。移动零：慢指针指向非零区的下一个位置，快指针扫描，遇非零就与慢指针交换并右移慢指针，非零元素保持原序且零全部沉尾；颜色分类（荷兰国旗）用三指针一次扫描：low 管 0 区右界、high 管 2 区左界、mid 扫描，遇 0 换 low 前进、遇 2 换 high 后退、遇 1 只动 mid——注意与 high 交换后 mid 不能前进，因为换来的元素还未检查。快排的 partition 是同一形态的变体。这类题考的是「一趟扫描原地完成」的不变量维护能力。"
    points:
      - "移动零：慢指针维护非零区边界"
      - "保持相对顺序用交换而非覆盖"
      - "荷兰国旗三指针：low/mid/high"
      - "与 high 交换后 mid 不前进（换来的未检查）"
      - "快排 partition 是同形态变体"

  - title: "二叉树直径与深度类题的递归信息传递"
    content: "求深度类与路径类二叉树题共享一个技巧：递归函数返回给父节点的信息与全局答案所需的信息不同。二叉树直径是标准案例：递归返回的是深度（单边路径长度），而全局答案在每层用左深加右深更新最大值——返回值是向上汇报的，答案是全局记账的。平衡二叉树判断同理：返回高度，发现左右高差超过一就上报不平衡标记。把这两个变量分开，就不会陷入「既想返回深度又想返回直径」的混乱。此模式可推广到任何需要子树局部信息与全局最优并存的问题。"
    points:
      - "返回值与全局答案是两个变量"
      - "直径：递归返回深度，全局记 left+right 最大"
      - "平衡树：返回高度，超差上报不平衡"
      - "混乱根源：混淆向上汇报与全局记账"
      - "模式可推广到子树信息加全局最优类题"
