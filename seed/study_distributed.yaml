# 八股文库：分布式体系文档 + 陈述式背诵卡片
category: DISTRIBUTED
doc:
  title: "分布式系统知识体系全景"
  content: |
    # 一、理论基石：CAP 与 BASE

    CAP 的正确读法不是三选二：网络分区是常态而非选项，决策发生在分区那一刻——CP 拒绝不一致的请求保数据正确，AP 继续服务但可能返回旧值。无分区时 C 与 A 可兼得，CAP 描述的是分区下的动态行为。BASE 是 AP 的工程化延伸：基本可用允许降级限流，软状态允许中间态，最终一致承认收敛需要时间。注册中心是这套理论的直接投影：ZooKeeper 是 CP，Eureka 是 AP，Nacos 让临时实例走 AP、持久实例走 CP。

    # 二、数据分片：一致性哈希

    普通哈希取模的致命伤在节点数变化：几乎全部 key 重新映射，缓存大面积失效。一致性哈希把值域组织成环，key 顺时针归属第一个节点，增减节点只搬移相邻区段的 1/N。虚拟节点把每个物理节点散布成一百多个点，解决数据倾斜并支持按性能加权。Redis Cluster 的 16384 槽是同一思想的具体化，预分配槽位比纯哈希环更利于精确迁移与路由。

    # 三、一致性工程：分布式事务与最终一致

    跨库后本地事务失效，方案按一致性与成本排布：2PC/XA 强一致但同步阻塞；TCC 业务层两阶段预留与确认，性能好但要处理空回滚与悬挂，解法是事务控制表记录 Try 是否执行；SAGA 把长事务拆成本地事务加逆序补偿，适合长流程；本地消息表与事务消息用业务与消息同事务加异步投递实现最终一致，是互联网首选。落地模式一脉相承：本地消息表、事务消息、CDC 订阅 binlog 零侵入同步、状态机加定时对账兜底，消费端幂等与死信重试缺一不可。

    # 四、协调原语：分布式锁

    Redis 锁以 SET NX EX 起步，Lua 解锁防误删，看门狗续期——快，但主从切换可能丢锁；ZooKeeper 用临时顺序节点加监听前驱，崩溃锁自动消失但慢；etcd 以 Raft 加 Lease 提供更现代的 CP 方案。Martin 与 antirez 之争的结论：锁只做效率优化时 Redis 足够，做正确性保证时必须配 fencing token——递增令牌加存储层校验拒绝旧令牌——或换 CP 系统，且锁内业务永远要有幂等兜底。

    # 五、异步解耦：消息队列的可靠性三角

    不丢：生产端 acks 与本地消息表兜底，Broker 端副本与同步刷盘，消费端先处理后提交 offset。不重：at-least-once 语义下重复不可避免，防御靠消费端幂等——唯一键去重加状态机条件更新加唯一约束。有序：同 key 路由同分区、分区内天然有序、消费端单线程，绝大多数业务只要分区序。Kafka 靠顺序写、零拷贝、页缓存、批量压缩与分区并行做到百万级吞吐；选型上大数据管道归 Kafka，交易特性归 RocketMQ，轻量灵活归 RabbitMQ。

    # 六、服务治理：注册中心、拆分与可观测

    微服务拆分的第一原则是默认不拆，模块化单体是多数阶段的正确答案；独立伸缩、独立部署、技术栈差异、故障隔离四类信号出现后才动手，按业务能力与限界上下文拆、一服务一库、绞杀者渐进迁移，警惕服务拆了库还共享的分布式单体。服务网格把治理逻辑下沉到 Sidecar，多语言大规模场景才划算。链路追踪用 Trace 与 Span 树描述请求全程，跨进程靠标准头注入提取，MQ 场景把 traceId 写进消息属性，配头部或尾部采样控制成本——可观测性是拆分后一切定位的前提。
cards:
  - title: "CAP 理论的真实含义与 BASE 的工程化"
    content: "CAP 的正确理解是：网络分区是分布式系统的常态而非可选项，真正的取舍发生在分区发生的那一刻——CP 系统拒绝可能不一致的请求保数据正确，可用性受损；AP 系统继续服务但可能返回旧值，一致性受损。无分区时一致性与可用性可以兼得，CAP 不是静态的三选二标签而是分区下的动态行为。BASE 是 AP 路线的工程化延伸：基本可用允许降级限流，软状态允许同步中、待确认这类中间态存在，最终一致承认数据经过一段时间收敛。"
    points: ["P 是常态，实际是 CP 与 AP 的选择", "无分区时 C 与 A 可兼得", "BASE：基本可用 + 软状态 + 最终一致", "ZK/etcd 是 CP，Eureka 是 AP"]
  - title: "一致性哈希与虚拟节点的原理"
    content: "普通哈希取模在节点数变化时几乎全部 key 重新映射，缓存大面积失效引发雪崩。一致性哈希把哈希值域组织成环，节点与 key 都哈希到环上，key 顺时针归属第一个遇到的节点，节点增减只影响相邻区段，数据迁移量仅约 1/N。虚拟节点解决物理节点少时环上分布不均导致的倾斜：每个物理节点生成一百到两百个虚拟节点散布环上，key 先落虚拟节点再映射真实节点，既均衡负载又支持按机器性能加权。Redis Cluster 的哈希槽与 Memcached 客户端分片都是这一思想的应用。"
    points: ["环上顺时针归属，迁移量 1/N", "虚拟节点解决数据倾斜", "支持按性能加权配比", "Redis 槽、Memcached 分片同源"]
  - title: "分布式事务的四种主流方案"
    content: "按一致性与成本排布：2PC/XA 由协调者两阶段提交，强一致但同步阻塞、协调者单点、锁持有时间长，数据库层方案性能差少用。TCC 在业务层做两阶段，Try 预留资源、Confirm 确认、Cancel 释放，性能好控制力强但每个操作写三个方法，还要处理空回滚与悬挂。SAGA 把长事务拆成 N 个本地事务各配补偿动作，失败逆序补偿，适合跨公司长流程，无隔离性需业务容忍中间态。本地消息表与 RocketMQ 事务消息把业务与消息放同一本地事务再异步投递，最终一致且简单可靠，是互联网首选。"
    points: ["2PC 强一致但同步阻塞", "TCC 业务层两阶段，注意空回滚悬挂", "SAGA 逆序补偿，适合长流程", "本地消息表/事务消息是首选"]
  - title: "TCC 的空回滚与悬挂问题"
    content: "空回滚是 Try 没执行（网络丢失或超时）而协调者超时触发 Cancel，Cancel 发现资源从未预留却要释放。解法是建事务控制表记录 XID 的 Try 是否执行，Cancel 查无记录时插入一条 Cancel 记录后直接返回成功。悬挂是迟到的 Try 在 Cancel 执行完才到达，资源被冻结且再无 Cancel 释放造成泄漏；解法是 Try 执行前查控制表，发现已有 Cancel 记录则拒绝执行。控制表操作与业务操作同事务保证原子，按 XID 幂等是共同前提，Seata 已内建处理。"
    points: ["空回滚：Cancel 先于 Try 到达", "事务控制表记录执行痕迹", "悬挂：迟到 Try 遇已完成的 Cancel", "按 XID 幂等是共同前提"]
  - title: "最终一致性的四种落地模式"
    content: "模式一是本地消息表：业务与消息同一本地事务落库，定时任务扫描未发送记录投递 MQ，成功后标记，简单可靠自带重试。模式二是事务消息：RocketMQ 先发 half 消息再执行本地事务，提交或回滚，回查机制兜底。模式三是事件驱动加 CDC：业务变更经 Canal 或 Debezium 订阅 binlog 进入 MQ，下游构建缓存、ES 等视图，业务代码零侵入且天然不丢。模式四是状态机加对账：异步链路每步状态落库，定时比对修复差异，是兜底中的兜底。配套的消费端幂等、死信重试与积压监控缺一不可。"
    points: ["本地消息表：同事务落库 + 扫描投递", "事务消息：half 消息 + 回查", "CDC 订阅 binlog 零侵入", "对账是最后一道兜底"]
  - title: "Redis、ZooKeeper、etcd 三种分布式锁的对比"
    content: "Redis 锁以 SET NX 加唯一 value 与 Lua 释放实现，Redisson 有看门狗续期，快但主从切换可能丢锁，适合效率场景配合业务幂等。ZooKeeper 锁用临时顺序节点加监听前驱，CP 语义下客户端崩溃锁自动释放，正确性强但写要过半数确认，性能明显慢，Curator 开箱即用。etcd 基于 Raft 加 Lease 租约与事务 API，更现代的 CP 方案，K8s 生态标配。选型：性能优先选 Redis，正确性绝对优先选 ZK 或 etcd，锁内业务必须幂等。"
    points: ["Redis 快但主从切换可能丢锁", "ZK 临时顺序节点，CP 且崩溃安全", "etcd：Raft + Lease，更现代", "锁内业务必须幂等兜底"]
  - title: "fencing token 对锁正确性的补强"
    content: "分布式锁单靠互斥覆盖不了所有异常路径：持有者可能 GC 停顿或网络分区，恢复后自以为仍持锁，而服务端早已把锁授予别人，两个持有者同时写造成事故。fencing token 的思路是锁服务每次授予锁时给出单调递增令牌，持有者带令牌访问存储层，存储层记录最大令牌并拒绝更旧的——旧持有者的请求被硬性挡下。共识：锁做效率优化时 Redis 足够，做正确性保证时必须加 token 或换 CP 协调服务。"
    points: ["GC 停顿让持有与服务端判断分裂", "递增令牌 + 存储层校验拒绝旧值", "效率场景 Redis 够用", "正确性场景 token 或换 CP 系统"]
  - title: "Kafka 高性能的来源"
    content: "Kafka 的吞吐来自五个设计。顺序写：消息追加到分区日志末尾，磁盘顺序写接近内存随机写的速度，无寻址开销。零拷贝：消费者拉取走 sendfile，数据从页缓存直达网卡，跳过用户态拷贝与内核切换。页缓存：读写全走操作系统的 page cache，进程重启缓存仍在。批量与压缩：生产者攒批加 lz4 或 zstd 压缩，减少网络与 IO 次数，broker 整批存储转发。分区并行：多分区多副本分布在多 broker 上并行读写，消费组水平扩展。稀疏索引加速日志定位是辅助手段。"
    points: ["磁盘顺序写 ≈ 内存随机写", "sendfile 零拷贝", "page cache 重启仍在", "批量压缩 + 分区并行"]
  - title: "消息不丢的三段链路保障"
    content: "消息可靠是生产、Broker、消费三段各自设防。生产端同步发送加确认，Kafka 配 acks=all 加重试，配本地消息表兜底——先落库后发送定时补偿。Broker 端靠副本机制，Kafka 要求 min.insync.replicas 至少为二并配合 acks=all 拒绝单副本写入，RocketMQ 用同步刷盘加主从同步，不做写内存即成功。消费端先处理完再提交 offset，关闭自动提交或用手动 ACK。可靠性配置拉低吞吐，按业务分级：金融全开，日志可异步。"
    points: ["生产端：acks=all + 本地消息表", "Broker：副本 + 同步刷盘", "消费端：先处理后提交 offset", "按业务分级配置可靠性"]
  - title: "消费端幂等的设计方法"
    content: "at-least-once 语义下重复不可避免，重试、rebalance 都会产生重复消息，防御目标是重复不产生副作用即消费端幂等。分层方案：消息携带 msgId 或业务单号，消费前用 Redis SETNX 或去重表快速判重，拦截绝大多数；业务层用状态机条件更新如 WHERE status 等于 INIT、数据库唯一索引兜底、upsert 语义实现硬保证；Redis 快判与 DB 唯一约束形成软硬两层。rebalance 造成的瞬时重复与乱序也由幂等根治，它是消息系统里比顺序更根本的防线。"
    points: ["重复不可避免，幂等是根本解", "Redis 判重拦截 + DB 唯一约束兜底", "状态机条件更新实现业务幂等", "唯一业务单号是幂等键"]
  - title: "顺序消费的保证手段"
    content: "顺序靠三段共同保证。生产端把同一业务键哈希路由到同一分区，Kafka 按 key 分区、RocketMQ 用 MessageQueueSelector；Broker 端分区内天然有序；消费端保证该分区单线程消费——Kafka 的分区只属于组内一个消费者，RocketMQ 用 MessageListenerOrderly 加分区锁。绝大多数业务只要同一订单内有序而非全局有序，全局顺序意味着单分区性能塌方。热点 key 分区倾斜要拆 key；顺序消费的失败重试会阻塞后续消息，需要容忍或跳过策略。"
    points: ["同 key 路由同分区", "分区内天然有序", "消费端单线程，牺牲并行换顺序", "只要分区序，不要全局序"]
  - title: "Kafka、RocketMQ、RabbitMQ 的选型"
    content: "Kafka 优势是百万级吞吐、持久化日志与消费组水平扩展，生态最大、流处理原生集成，弱项是无原生延迟消息、消息查询弱，适合大数据管道与日志采集。RocketMQ 亲和 Java，事务消息、任意精度延迟消息、顺序消息、消息轨迹完善，经电商交易验证，适合订单超时与顺序扣减。RabbitMQ 路由灵活、延迟微秒级、管理界面友好，弱项是吞吐万级、堆积性能差，适合中小规模与复杂路由。选型还看已有设施与运维熟悉度，堆积能力上 Kafka 无压力而 RabbitMQ 会崩。"
    points: ["Kafka：吞吐与流处理生态", "RocketMQ：事务/延迟/顺序齐备", "RabbitMQ：轻量灵活低延迟", "消息堆积能力差异巨大"]
  - title: "Nacos 注册中心的原理与 AP/CP 切换"
    content: "服务启动注册实例信息，消费者订阅列表，推送与拉取结合：客户端定时拉取，服务端经长连接推送变更。健康检查分两路：临时实例由客户端每五秒心跳，十五秒不健康三十秒剔除，走 Distro 协议的 AP 模式；持久实例由服务端主动探测，走 Raft 的 CP 模式。切换粒度在实例级 ephemeral 参数而非全局开关——注册发现要可用性，持久配置要一致性。Nacos 同时是配置中心，长轮询监听变更，2.x 推送演进到 gRPC 长连接。"
    points: ["push + pull 结合的订阅", "临时实例心跳走 AP，持久实例探测走 CP", "ephemeral 按实例选择", "注册与配置中心一体"]
  - title: "微服务拆分的时机信号"
    content: "拆分的第一原则是默认不拆：分布式事务、网络故障面、运维复杂度乘以服务数、团队接口成本都是真实代价，模块化单体加清晰边界是绝大多数阶段的正确答案。动手的信号有四类：独立伸缩需求，某模块流量或资源特征迥异需要单独扩容；独立部署节奏，多团队改同一仓库互相阻塞发布；技术栈差异，如 AI 服务要 Python 而交易要 Java；故障隔离需求，一个模块 OOM 不能拖垮全站。组织规模也是驱动因素，康威定律决定服务边界最终跟随团队结构，两披萨团队对应细粒度服务。"
    points: ["默认不拆，模块化单体优先", "四类信号：伸缩/部署/技术栈/隔离", "康威定律：架构跟团队走", "拆前先铺可观测性"]
  - title: "微服务拆分的原则与门槛"
    content: "拆分原则的核心是按业务能力与限界上下文拆，订单、商品、库存、用户各自成服务，绝不按技术分层拆出 DAO 服务这类反模式；一个服务一个数据库，禁止跨库 join，靠接口与冗余字段协作；用绞杀者模式渐进迁移，新功能进新服务、老模块逐步挪，拒绝大爆炸重写。落地门槛要先备齐：容器化与 K8s、成熟的 CI/CD、注册发现配置熔断限流等服务治理组件、API 契约管理，不具备先补课。最大的反面警示是分布式单体——服务拆了数据库还共享，付出全部成本零收益。"
    points: ["按业务能力拆，不按技术层拆", "一服务一库，禁跨库 join", "绞杀者渐进，拒绝大爆炸", "分布式单体是最大反模式"]
  - title: "服务网格 Service Mesh 的定位"
    content: "微服务治理逻辑如重试、熔断、加密、认证、流量切分反复写在每个服务的 SDK 里，多语言成本高、升级难、与业务耦合。服务网格把这些能力下沉到 Sidecar：每个 Pod 旁挂 Envoy，业务零侵入，所有流量经代理，控制面 Istiod 负责配置下发与证书管理。能力包括金丝雀按比例发布、故障注入混沌测试、mTLS 自动加密零信任、遥测自动采集。代价是每请求多两跳的延迟与运维复杂度，中小规模用 SDK 更划算，大规模多语言才体现价值，演进方向是 eBPF 与 Ambient Mesh。"
    points: ["治理能力下沉到 Sidecar", "业务零侵入，流量全经代理", "mTLS + 金丝雀 + 故障注入", "中小规模 SDK 更划算"]
  - title: "链路追踪的数据模型"
    content: "链路追踪用三层模型描述请求：Trace 是全程，Span 是一段带时间与属性的操作，Span 树表达调用层级；SpanContext 携带 traceId、spanId、parentSpanId。跨进程靠注入提取：HTTP 用 W3C traceparent 头，MQ 把 traceId 写进消息属性，消费端提取后开新 span；进程内用 ThreadLocal 串日志，异步线程池用 TTL 装饰防丢失。头部采样在网关决定整链一致，尾部采样保错误与慢查询。OpenTelemetry 已统一协议。"
    points: ["Trace → Span 树 → SpanContext", "跨进程靠标准头注入提取", "MQ/异步要显式传递上下文", "头部采样一致，尾部采样保错误慢查询"]
  - title: "可观测性三支柱的协作"
    content: "Metrics、Tracing、Logging 构成可观测三支柱且互相串接。Metrics 回答有没有问题：错误率、延迟分位、吞吐与告警；Tracing 回答问题在哪：traceId 串起跨服务调用链定位慢点；Logging 回答为什么：结构化日志带 traceId，从告警跳链路再跳日志完成归因。日志入 Elasticsearch 或 Loki 按天滚动索引，traceId 由网关生成经 MDC、HTTP header 与 MQ 属性传递；exemplar 让指标点直接跳到 trace。"
    points: ["Metrics 有没有 / Tracing 在哪 / Logs 为何", "traceId 串起三者的查询入口", "网关生成 → MDC/header/MQ 传递", "结构化日志是检索前提"]
