# Agent 开发背诵卡片（陈述式）
category: AGENT
doc:
  title: "Agent 开发知识体系全景"
  content: |
    Agent 开发的知识体系沿"范式定位 → 核心机制 → 协作与协议 → 编排与工具 → 工程与安全"五段展开。

    一、范式定位。Chain（固定链路）、Workflow（人定流程的图）、Agent（模型自主决定流程）三者递进；选型共识是能用 workflow 就不要用 agent——自主性是按可预测性付费买的。Agent 的基础范式是 ReAct：Thought→Action→Observation 循环，显式推理配合工具行动，现代实现用 Function Calling 承载工具调用。常见架构是洋葱结构：外层 Router 分流，中层 Workflow 定骨架，内层嵌 Evaluator-Optimizer 循环或子 Agent。

    二、核心机制。规划分 plan-then-execute 与 ReAct 式边走边看两种，子任务必须可验证、失败带原因重规划。记忆分三层：上下文窗口是工作记忆，长期记忆靠向量检索或结构化存储，压缩转存防爆窗。上下文工程是 Agent 时代比 prompt 工程更关键的能力——长任务的主要失败模式不是"不会"，而是上下文被污染、爆窗、关键信息被稀释；核心手法是选取、压缩、组织、淘汰、外置。循环控制必须多层防护：最大步数、token 预算、超时、无进展检测。反思（Reflexion）让 Agent 复盘纠错，但外部可执行反馈（测试、编译）比自评更可靠。

    三、协作与协议。Multi-Agent 的收益来自并行与上下文隔离，Supervisor 模式最常用最可控；子 Agent 在自己窗口消化海量原始内容，只回传结论摘要。协议层：MCP 统一"Agent 与工具"的连接，暴露 Tools、Resources、Prompts 三类原语，把 M×N 适配变成 M+N；A2A 解决"Agent 与 Agent"的横向互联，两者互补而非替代。

    四、编排与工具。LangGraph 用 StateGraph 加条件边加 Checkpointing 把黑盒循环变成白盒状态图，支持断点恢复与 Human-in-the-loop 中断审批，它本质是图编排引擎而非 Agent 框架。工具设计原则：description 即提示词、原子正交、参数少而严、错误结构化、数量 10~20 个为宜。工具滥用与越权要用纵深防御：最小权限、高危确认、沙箱执行、审计监控。

    五、工程与安全。评估分组件级、轨迹级、端到端三层，同一任务跑 N 次看通过率与方差；调试先有 trace——每步 prompt、输出、工具调用全留档，参数填错多半是描述问题不是模型问题。Deep Research 与 Claude Code 验证了共性结论：长任务 Agent 的瓶颈不在模型智力，而在上下文管理与状态外置。成本核算要记住任务等于 N 次调用的乘数，四级降级链路加预算护栏防死循环烧钱；模型热更新即生产变更，任一变更都走变更流程。
cards:
  - title: "Agent 与 Workflow、Chain 的本质区别与选型"
    content: "Chain 是固定链路编排；Workflow 是预定义图结构，可分支循环，控制流由开发者预先设计；Agent 把控制权交给模型，在循环中自主决定调什么工具、是否继续、何时结束。一句话区分：Workflow 是人定流程 LLM 填空，Agent 是 LLM 定流程人给工具和边界。选型共识：能用 workflow 就不要用 agent——路径可预见、要确定性低成本可审计用 workflow；任务开放、步数不定用 agent。实践中常混合：外层 workflow 定骨架，节点内嵌 agent。"
    points: ["Chain 固定链路，Workflow 人定流程，Agent 模型定流程", "能用 workflow 就不用 agent", "确定性与可审计选 workflow，开放任务选 agent", "自主性是按可预测性付费买的"]
  - title: "ReAct 模式：推理、行动、观察的循环"
    content: "ReAct 即 Reasoning 加 Acting：Thought 分析现状决定下一步，Action 选择工具并给参数，Observation 把执行结果喂回模型，循环直到输出最终答案。有效原因有三：把想显式化，中间推理提升复杂任务正确率；工具补足实时数据与计算短板；Observation 提供纠错信号，搜不到就换关键词、报错就换参数。现代实现用 Function Calling 取代文本协议，更可靠，但推理、行动、观察的循环本质不变。典型失败模式是工具选错、循环空转与过早放弃。"
    points: ["循环：Thought → Action → Observation", "显式推理提正确率，工具补短板，观察纠错", "Function Calling 取代文本协议，循环本质不变", "失败模式：选错工具、空转、过早放弃"]
  - title: "Agent 的规划范式与任务分解方法"
    content: "两种规划范式：先规划后执行由 Planner 把任务拆成有依赖关系的子任务图再逐步执行，全局感强、可并行、易审计；ReAct 式边走边规划每步基于最新观察决策，灵活但易迷失、难并行，实践常粗粒度先规划、子任务内 ReAct。分解方法有自顶向下输出子任务列表加依赖、自底向上先检索相似案例、层次化主 Agent 拆解后子 Agent 再拆解。关键工程点：子任务必须可验证、有明确完成判据；失败时带原因重规划而不是硬走完；计划存外部存储防长任务丢失；子任务间输入输出接口定义清楚。"
    points: ["plan-then-execute 全局可控，ReAct 灵活易迷失", "分解方法：自顶向下、自底向上、层次化", "子任务要可验证，失败带原因重规划", "计划外置存储，接口定义清楚"]
  - title: "Agent 记忆系统的三层设计"
    content: "三层记忆模型：短期记忆即上下文窗口，是当前对话与工具结果的直接载体，容量有限随会话消失；长期记忆是跨会话持久化的事实与偏好，需外部存储；工作记忆压缩把短期内容定期摘要后转存长期，防止窗口爆掉。长期记忆实现有向量库语义检索（按当前任务召回相关记忆，主流方案）、结构化记忆（提取为用户画像或事实三元组，确定性优于模糊召回）、情景与语义记忆分层分库。写入要有提取管道，只记偏好、结论、失败教训，全存等于噪音；读取按相关性检索注入 prompt，本质又是一个 RAG。记忆还要有遗忘与去重防自我污染。"
    points: ["三层：上下文窗口、长期外存、压缩转存", "向量语义检索为主，结构化事实更确定", "写入有提取管道，全存等于噪音", "读取按相关性注入，本质是 RAG", "要遗忘与去重，防记忆库自我污染"]
  - title: "Multi-Agent 协作模式与适用判断"
    content: "常见协作拓扑：Supervisor 主管模式由协调者拆解任务、分派给专职子 Agent、汇总结果，最常用最可控；Swarm 去中心化点对点交接，灵活但难预测；流水线按工序接力；Debate 评审让生成者与批评者对抗多轮挑错提升质量。值得上多 Agent 的情形：任务可并行、需要工具集与上下文隔离、需要对抗制衡。简单任务套多 Agent 只增加成本与故障面——每多一个 Agent 就多一处信息传递损耗。收益最大的是隔离与并行，而非更多智能。"
    points: ["Supervisor 最可控，Swarm 灵活难预测", "值得多 Agent：并行、上下文隔离、对抗制衡", "每多一个 Agent 多一处信息传递损耗", "收益来自隔离与并行，不是更多智能"]
  - title: "MCP 协议：统一 Agent 与工具的连接标准"
    content: "MCP 是 Anthropic 推出的开放协议，统一 AI 应用与外部能力的连接标准，类比 USB-C：模型接工具从 M×N 适配变成 M+N。MCP Server 暴露三类原语：Tools 模型可调用的函数、Resources 可读取的数据、Prompts 预置提示模板。核心收益是工具生态复用，写一次 Server 所有支持 MCP 的客户端可用，应用与工具解耦。与 Function Calling 互补：FC 是模型侧调用格式，MCP 是应用与工具间的标准接口。"
    points: ["M×N 适配变 M+N，类比 USB-C", "三类原语：Tools、Resources、Prompts", "stdio 本地传输，HTTP 远程传输", "FC 管模型怎么说，MCP 管工具从哪来"]
  - title: "A2A 协议与 MCP 的分层分工"
    content: "A2A 是 Google 2025 年推出的智能体互联协议，让不同厂商与框架的独立 Agent 相互发现、协商任务、协作，提供 Agent Card 能力发现与任务生命周期管理。与 MCP 的分工是关键考点：MCP 解决 Agent 与工具数据的纵向连接，即 Agent 怎么用锤子；A2A 解决 Agent 与 Agent 的横向协作，即木匠怎么和电工合作；一个 Agent 向下用 MCP 拿工具，横向用 A2A 找伙伴。典型场景是跨部门、跨供应商的 Agent 组队，只能走标准协议。"
    points: ["MCP 纵向管工具，A2A 横向管协作", "Agent Card 能力发现加任务生命周期管理", "跨组织组队只能走标准协议", "生态早期，知道定位与差异即可"]
  - title: "Agent 工具设计原则：什么是好工具"
    content: "工具用动词加宾语命名让名字即语义，description 是给模型看的提示词，要写清用途、适用时机、不适用场景与返回结构，一个含糊的描述毁掉一个工具。接口设计四原则：原子正交，一个工具一件事，职责重叠让模型选择困难；参数少而严，必填不超过五个，枚举约束取值，数值给范围；幂等与安全分级，读操作随便调，写操作幂等带唯一请求号，危险操作拆确认环节；返回对模型友好，错误信息写明哪里错、该怎么改参数。工具数量以 10~20 个为宜，太多选择困难，可按需分组或提供工具目录。移除低频工具常常反而提升整体表现。"
    points: ["description 就是给模型的提示词", "原子正交，参数不超过 5 个且枚举约束", "写操作幂等，危险操作挂确认", "错误信息要指明怎么改参数", "10~20 个为宜，少即是多"]
  - title: "Agent 循环控制与成本防爆炸"
    content: "终止条件要多层防护：任务完成输出最终答案是最理想出口；最大步数硬上限如 25 步必配，是防失控的保险丝；token 与费用预算超限熔断；无进展检测发现连续多步调用相同或结果雷同即判定卡死。防空转手段：观察到重复行为主动打断并注入反思提示；工具结果带缓存标记帮模型意识到徒劳；把已尝试路径记进上下文避免重蹈覆辙。成本控制按步数与每步 token 双维度统计随 trace 落库，中间步骤用小模型、关键决策用大模型，早停在信息足够时收束。循环上限是产品决策，超限优雅降级给部分答案而非直接报错。"
    points: ["多层终止：步数上限、预算熔断、超时、无进展检测", "重复行为打断并注入反思提示", "已尝试路径记入上下文防重蹈覆辙", "超限优雅降级给部分答案"]
  - title: "反思与自我纠错：Reflexion 的落地形式"
    content: "Reflexion 的思想是执行后不直接交付，而是审视过程与结果，把失败经验以文字存入记忆指导下一次尝试。落地形式：自评在生成后追加一轮检查列出问题并修正，简单两段式就有稳定收益；外部反馈比自评更可靠，单元测试、lint 编译错误、搜索验证作为纠错信号；反思记忆把失败教训写入记忆库跨任务复用；Evaluator-Optimizer 循环让批评者与执行者对抗迭代。权衡：反思是延迟成本倍增器，只对高价值任务开启；外部可执行反馈才是硬信号；保留版本防越改越坏。代码 Agent 是最成功的落地。"
    points: ["失败教训以文字存入记忆指导下次", "外部反馈（测试、lint）比自评可靠", "反思是延迟成本倍增器，按任务价值开启", "保留版本可回滚，防越改越坏"]
  - title: "Agent 评估为什么难与分层测试方法"
    content: "Agent 评估难在四点：非确定性，同一输入多次运行路径不同，传统单测断言失效；多步复合误差，十步任务每步九成正确整体只剩约三成五；路径与结果分离，结果对但过程违规也算不合格；环境依赖，工具是真实外部系统，测试要 mock 或沙箱。评估分三层：组件级测单步工具选择与参数填写准确率，可做确定性断言；轨迹级对比执行路径与参考路径，看关键步骤与步数效率；端到端看任务完成率，用程序可判的验收判据。实践：建覆盖典型、边界、陷阱的任务集，同任务跑 N 次看通过率与方差，工具返回用录制回放保证可复现。"
    points: ["每步九成正确，十步整体仅约三成五", "组件级、轨迹级、端到端三层评估", "同任务跑 N 次看通过率与方差", "工具录制回放保证可复现"]
  - title: "LangGraph 核心概念：把黑盒循环变成白盒状态图"
    content: "LangGraph 的核心是状态机图：StateGraph 由节点、边与共享 State 组成，节点读写并返回状态更新；条件边按状态路由，Agent 循环本质是带条件边的环；Checkpointing 每步状态自动存档，支持断点恢复、时间旅行调试与中断审批。相比旧 AgentExecutor 的黑盒循环，它把循环展开成显式图，控制流白盒可编程，支持分支、并行与持久化恢复。定位上它不是 Agent 框架而是图编排引擎，Agent 只是用它实现的模式之一。"
    points: ["StateGraph 加条件边加共享 State", "Checkpointing 支持恢复、调试与中断审批", "循环展开为显式图，控制流白盒可编程", "本质是图编排引擎，不是 Agent 框架"]
  - title: "Human-in-the-loop 的落地环节与技术实现"
    content: "必有人环节由风险驱动：不可逆操作前，支付、发外部邮件、删数据、提交生产变更，模型判断想执行但人批准后才真执行；模糊授权，意图有多种解释且影响面大。技术落地以 LangGraph 为例：在危险工具前设 interrupt 中断点，状态持久化到 checkpoint；人工在 UI 查看打算调什么工具、什么参数，批准、修改或拒绝；从 checkpoint resume 恢复执行。暂停期间状态不丢是 HITL 的前提，工具调用要支持人工改参后再执行。审批要给决策依据，信任随表现累积逐步免审。"
    points: ["不可逆操作、模糊授权、低置信必须有人", "interrupt 暂停加 checkpoint 持久化加 resume 恢复", "审批展示决策依据，不只是参数", "信任分数高逐步免审，自动化率随安全记录提升"]
  - title: "上下文工程：Agent 时代比 Prompt 工程更关键"
    content: "上下文工程是决定模型每一步能看到什么的系统设计，管理进入窗口的全部信息——指令、记忆、工具结果、检索片段、历史轨迹——的选取、压缩、组织与淘汰。Prompt 工程优化怎么问，上下文工程优化喂什么。Agent 时代它更关键：Agent 跑几十步上下文持续累积，长任务的主要失败模式不是不会，而是上下文被污染、爆窗、关键信息被稀释。核心手法：选取按需注入；压缩结构化提取与滚动摘要；分区组织重要内容置顶置尾；淘汰过时信息；外置能查的别塞，参考资料变工具。上下文是 Agent 最稀缺的资源。"
    points: ["Prompt 管怎么问，上下文工程管喂什么", "长任务失败主因是上下文污染与爆窗", "手法：选取、压缩、组织、淘汰、外置", "能查的别塞，参考资料变工具"]
  - title: "子 Agent 模式：上下文隔离与并行"
    content: "子 Agent 模式由主 Agent 把子任务委派给专职子 Agent，后者有自己的上下文窗口、工具子集与系统提示，干完活只回传结果摘要而非全过程。核心价值是上下文隔离：单 Agent 做研究类任务，检索结果很快塞爆窗口；子 Agent 在自己窗口消化海量原始内容，只回传几十 token 结论，主 Agent 上下文保持聚焦。代价是信息传递有损、每层多一份系统提示开销、质量依赖任务描述的接口定义。轻子任务不必开子 Agent；返回结论要求带引用来源。"
    points: ["子 Agent 独立窗口，只回传结论摘要", "核心价值：上下文隔离加并行", "工具权限隔离，爆炸半径小", "轻子任务不值得开，接口定义要清楚"]
  - title: "三种常见架构模式：Router、Planner-Executor 与 Evaluator-Optimizer"
    content: "Router 在入口先分类分流，简单请求不过 Agent 省钱提速，实现是 LLM 分类节点加规则兜底。Planner-Executor：拆任务出计划、逐步执行、结果触发重规划，适合目标明确路径长的任务，要点是计划显式存储、子任务可验证。Evaluator-Optimizer：生成器与评估器循环迭代到达标，适合质量敏感且反馈可判定的任务，评估器越客观越好，可执行测试优于 judge 优于自评。生产多为洋葱结构：Router 分流、Workflow 骨架、内层嵌评审循环或子 Agent。"
    points: ["Router 分流省钱提速，简单请求不过 Agent", "Planner-Executor 适合路径长的明确任务", "评估器越客观越好：测试优于 judge 优于自评", "生产多为洋葱组合而非单一模式"]
  - title: "Agent 框架选型与裸写的取舍"
    content: "框架定位：LangChain 与 LangGraph 是全家桶，组件加编排生态最大；LlamaIndex 以数据检索为中心，RAG 开箱体验最好。选型逻辑：原型先用官方 SDK 或 CrewAI 验证；生产 RAG 为主选 LlamaIndex；复杂编排要 HITL 持久化选 LangGraph；核心链路经常裸写更好——Function Calling 循环两三百行代码，框架抽象反而碍调试。框架价值在生态与编排原语，代价是抽象泄漏；用框架组件、控制核心循环是常见折中。"
    points: ["LangGraph 管复杂编排，LlamaIndex 管检索", "原型官方 SDK，生产复杂编排 LangGraph", "核心循环裸写两三百行，抽象碍调试", "用框架组件、控制核心循环的折中"]
  - title: "Agent 安全风险图谱与纵深防御"
    content: "Agent 比普通应用多出能动手这一层风险：提示注入诱导工具劫持，间接注入最凶险，恶意网页可让浏览型 Agent 外传数据；越权，Agent 持有凭证权限过大；工具滥用，无限循环烧钱、批量操作波及过大。纵深防御：最小权限，每个工具独立凭证收窄到只够当前任务；高危操作默认挂人工审批；白名单加资源配额熔断；代码执行跑隔离沙箱；全量调用日志与异常告警；外部数据进上下文前标记隔离。Agent 安全等于 LLM 安全加传统系统安全，权限给大了没人兜得住。"
    points: ["特有风险：注入劫持工具、越权、滥用、外泄", "最小权限：独立凭证、只读账号、API scope", "高危操作人工确认加白名单配额加沙箱", "权限设计比模型可靠性更根本"]
  - title: "Deep Research 与 Claude Code 的架构范式"
    content: "Deep Research 型调研 Agent：规划拆解研究问题，多轮搜索阅读记录要点，最后综合成报告；长任务发现持续写入外部笔记而非靠上下文硬撑；子问题 fan-out 给多个子 Agent 并行跑，只回传结论。Claude Code 型编码 Agent：工具集为读写文件、执行 shell、搜索代码，返回设计极度克制；环境即反馈，跑测试、编译、lint 作为客观纠错信号；文件即记忆，计划与约定跨会话续接。共性结论：长任务 Agent 的瓶颈不在模型智力，而在上下文管理与状态外置。"
    points: ["调研型并行 fan-out 加笔记外置记忆", "编码型环境即反馈：测试编译是硬信号", "文件即记忆，跨会话续接", "瓶颈在上下文管理与状态外置"]
  - title: "Agent 调试工作流：先有 trace 再谈排错"
    content: "每次运行记录全轨迹——每步 prompt、输出、工具调用与 token 消耗，没有 trace 的调试等于盲改。典型故障定位：选错工具看 description 是否含糊、职责是否重叠；参数反复填错通常是描述问题不是模型问题，补枚举与语义说明；循环空转查工具报错是否模型读不懂，加无进展检测；上下文丢失靠压缩历史、关键结论外置。调试手段：checkpoint 从任意步重放；单变量 A/B 跑固定任务集；工具选择用状态快照单测；bad case 按失败类型聚类并固化成回归测试。"
    points: ["trace 记录每步 prompt、输出、工具调用与 token", "参数填错多是描述问题，不是模型问题", "checkpoint 逐步回放，单变量 A/B", "状态快照单测加失败聚类"]
  - title: "Agent 前端交互：把过程变成产品体验"
    content: "Agent 任务跑几十秒到几分钟，过程不可见用户就以为卡死，把过程变成产品体验是 Agent 第一 UX 问题。后端按阶段推结构化事件流：thinking、tool_call（工具名加参数）、tool_result（摘要）、message_delta（答案 token）、done，前端按类型渲染卡片。思考链默认折叠可展开，透明不轰炸；工具卡片展示名称、参数与耗时；复杂任务展示计划清单打钩；最终回答流式渲染加引用角标。工程要点是 SSE 断线重连、事件去重、参数脱敏。"
    points: ["事件流：thinking、tool_call、tool_result、delta", "思考默认折叠，工具卡片可展开", "随时停止加危险确认加后台化", "SSE 重连、去重、脱敏，透明分级"]
  - title: "代码解释器的沙箱安全设计"
    content: "Agent 生成的代码等于任意程序，可读写文件、访问网络、耗尽资源，执行它等于给模型一个 shell，必须硬隔离。沙箱方案：容器每任务一个 Docker，文件系统只读白名单、默认无网络、资源限额、用完即销毁，是主流方案；microVM 如 Firecracker 隔离更彻底，是多租户生产标准。权限最小化：AST 扫描 subprocess、eval 等危险调用，网络默认禁或白名单，输出截断，产物存对象存储返回 URL。流程为生成、静态审查、沙箱执行超时强杀、结构化返回、继续推理。"
    points: ["执行生成代码等于给模型一个 shell，必须隔离", "容器为主流，microVM 是多租户标准", "AST 扫描危险调用，网络默认禁", "超时强杀，产物走对象存储"]
  - title: "Agent 成本核算与降级链路设计"
    content: "先核算：网关埋点记录每次调用的 token 与单价，算出单次任务与单用户成本；Agent 要注意任务等于 N 次调用的乘数，一次深度调研可能二十次以上调用。优化顺序：prompt 瘦身是乘以调用次数的杠杆，做历史压缩、工具结果截断、片段精选；模型路由让简单步骤用小模型、关键决策用大模型；语义缓存加前缀缓存；离线批量走 batch API 半价。降级链路四级：旗舰加完整工具、次旗舰、小模型精简、有损兜底（缓存答案、规则模板或转人工）；网关自动切换，恢复后回升。"
    points: ["任务成本等于单次调用乘调用次数", "prompt 瘦身是乘数杠杆，先做", "四级降级：旗舰、次旗舰、小模型、兜底", "预算护栏防死循环烧钱"]
  - title: "Agent 生产事故的复盘方法"
    content: "Agent 特有事故包括模型升级行为漂移、循环调用烧钱、工具误操作、注入越权、上下文污染。应急三步先止血：止损开关做功能降级切规则模板、模型秒切回滚、预算熔断；用 trace 全轨迹定位哪步决策错、输入是什么，没有 trace 的事故没法查；按工具调用日志反查影响面。复盘：时间线还原、五 Why 追根因、归为系统而非模型——模型不可靠是前提，防线缺失才是根因。每次事故至少沉淀一个回归 case、一条告警规则、一个防护机制，事故回流评测集。文化上无责复盘，模型热更新即生产变更。"
    points: ["先止血：降级开关、模型回滚、预算熔断", "trace 是定位前提，没有 trace 没法查", "根因归为系统防线缺失，不是模型", "每次事故沉淀 case、告警与防护", "模型热更新即生产变更"]
  - title: "Claude Code 为什么用 Agentic Search 而非 RAG 检索代码"
    content: "RAG 检索代码的困境：代码语义跨文件连续，切块破坏依赖与命名一致性；改动频繁索引时效差；检索多为精确符号匹配，embedding 模糊语义反而失真。Agentic Search 不建索引，Agent 用基础工具主动探索——grep 做符号与正则精确搜索、glob 按文件模式定位、read 读相关片段，像工程师一样多轮迭代收敛。优势：grep 对符号匹配百分之百准确；零索引维护，新代码立即可查；带着推理目的按需读，上下文高效；代价是多轮耗时，编码场景准确性优先值得。"
    points: ["切块破坏代码跨文件语义，索引时效差", "grep、glob、read 多轮迭代，符号匹配全准", "零索引维护，新代码立即可查", "检索从一次查询变成迭代探索"]
