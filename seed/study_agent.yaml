category: AGENT
doc:
  title: Agent 开发知识体系全景
  content: "Agent 开发的知识体系沿\"范式定位 → 核心机制 → 协作与协议 → 编排与工具 → 工程与安全\"五段展开。\n\n一、范式定位。Chain（固定链路）、Workflow（人定流程的图）、Agent（模型自主决定流程）三者递进；选型共识是能用\
    \ workflow 就不要用 agent——自主性是按可预测性付费买的。Agent 的基础范式是 ReAct：Thought→Action→Observation 循环，显式推理配合工具行动，现代实现用\
    \ Function Calling 承载工具调用。常见架构是洋葱结构：外层 Router 分流，中层 Workflow 定骨架，内层嵌 Evaluator-Optimizer 循环或子 Agent。\n\
    \n二、核心机制。规划分 plan-then-execute 与 ReAct 式边走边看两种，子任务必须可验证、失败带原因重规划。记忆分三层：上下文窗口是工作记忆，长期记忆靠向量检索或结构化存储，压缩转存防爆窗。上下文工程是\
    \ Agent 时代比 prompt 工程更关键的能力——长任务的主要失败模式不是\"不会\"，而是上下文被污染、爆窗、关键信息被稀释；核心手法是选取、压缩、组织、淘汰、外置。循环控制必须多层防护：最大步数、token\
    \ 预算、超时、无进展检测。反思（Reflexion）让 Agent 复盘纠错，但外部可执行反馈（测试、编译）比自评更可靠。\n\n三、协作与协议。Multi-Agent 的收益来自并行与上下文隔离，Supervisor\
    \ 模式最常用最可控；子 Agent 在自己窗口消化海量原始内容，只回传结论摘要。协议层：MCP 统一\"Agent 与工具\"的连接，暴露 Tools、Resources、Prompts 三类原语，把\
    \ M×N 适配变成 M+N；A2A 解决\"Agent 与 Agent\"的横向互联，两者互补而非替代。\n\n四、编排与工具。LangGraph 用 StateGraph 加条件边加 Checkpointing\
    \ 把黑盒循环变成白盒状态图，支持断点恢复与 Human-in-the-loop 中断审批，它本质是图编排引擎而非 Agent 框架。工具设计原则：description 即提示词、原子正交、参数少而严、错误结构化、数量\
    \ 10~20 个为宜。工具滥用与越权要用纵深防御：最小权限、高危确认、沙箱执行、审计监控。\n\n五、工程与安全。评估分组件级、轨迹级、端到端三层，同一任务跑 N 次看通过率与方差；调试先有 trace——每步\
    \ prompt、输出、工具调用全留档，参数填错多半是描述问题不是模型问题。Deep Research 与 Claude Code 验证了共性结论：长任务 Agent 的瓶颈不在模型智力，而在上下文管理与状态外置。成本核算要记住任务等于\
    \ N 次调用的乘数，四级降级链路加预算护栏防死循环烧钱；模型热更新即生产变更，任一变更都走变更流程。\n\n\n**Agent Harness：把模型变成系统的运行时骨架。** Harness 是包裹 LLM 的宿主代码——组装上下文、调模型、解析输出、执行工具、结果回填、循环往复。它与框架的关系是整机与积木（LangChain 给积木，Harness 是你搭的机器），与工作流的区别在控制权归属（工作流人定路径、Harness 模型自主）。最小骨架五大件：主循环（while 未完成→组装→调用→执行工具→回填）、上下文组装器、工具层（schema+执行器）、终止条件（最终回答/轮数上限/用户中断）、轨迹观测。上下文工程是提示工程的上位概念——持续决定每轮给模型看什么；窗口将满时做 compaction（把旧轮次折叠成摘要）并配合结构化外记（TODO 文件、决策日志、dead ends 清单），Claude Code 的「文件系统即记忆」正是这一思路的典范。子代理模式把调研类大消耗任务隔离到独立窗口，主上下文只收结论。健壮性三支柱：报错作为工具结果回喂让模型自纠、超时与轮数预算封顶、重复调用与无进展检测防死循环。安全上权限分级（只读放行、写确认、危险操作硬闸）加沙箱隔离，提示注入靠纵深防御——权限模型是被骗后的最后一道闸。\n\n### Harness 主循环与上下文工程\n\n```mermaid\nflowchart TD\n    A[任务输入] --> B[组装上下文<br>系统提示 + 历史 + 笔记]\n    B --> C[调用 LLM] --> D{输出类型?}\n    D -- 工具调用 --> E[执行工具<br>超时/报错捕获]\n    E -- 报错回喂自纠 --> B\n    D -- 最终回答 --> F[输出结果]\n    G[窗口将满?] -- 是 --> H[compaction 压缩<br>+ 决策外记文件]\n    H --> B\n    C -. 子代理隔离大搜索 .-> I[独立窗口调研<br>只回传结论]\n```\n\n# \U0001F4CC 知识速览图\n\n把上面正文的零散知识串成一张张图——先自己复述，再对照图检验。\n\
    \n### ReAct 循环与容错\n\n```mermaid\nflowchart TD\n    A[任务输入] --> B[Thought<br>分析当前状况]\n    B --> C[Action<br>选工具\
    \ + 参数]\n    C --> D[Observation<br>执行返回结果]\n    D --> E{信息足够?}\n    E -- 否 --> B\n    E -- 是 -->\
    \ F[Final Answer]\n    D -. 工具报错回喂自纠 .-> C\n    C -. 无进展检测 .-> G[熔断收口]\n```\n"
cards:
- title: Agent 与 Workflow、Chain 的本质区别与选型
  content: Chain 是固定链路编排；Workflow 是预定义图结构，可分支循环，控制流由开发者预先设计；Agent 把控制权交给模型，在循环中自主决定调什么工具、是否继续、何时结束。一句话区分：Workflow
    是人定流程 LLM 填空，Agent 是 LLM 定流程人给工具和边界。选型共识：能用 workflow 就不要用 agent——路径可预见、要确定性低成本可审计用 workflow；任务开放、步数不定用
    agent。实践中常混合：外层 workflow 定骨架，节点内嵌 agent。
  points:
  - Chain 固定链路，Workflow 人定流程，Agent 模型定流程
  - 能用 workflow 就不用 agent
  - 确定性与可审计选 workflow，开放任务选 agent
  - 自主性是按可预测性付费买的
- title: ReAct 模式：推理、行动、观察的循环
  content: ReAct 即 Reasoning 加 Acting：Thought 分析现状决定下一步，Action 选择工具并给参数，Observation 把执行结果喂回模型，循环直到输出最终答案。有效原因有三：把想显式化，中间推理提升复杂任务正确率；工具补足实时数据与计算短板；Observation
    提供纠错信号，搜不到就换关键词、报错就换参数。现代实现用 Function Calling 取代文本协议，更可靠，但推理、行动、观察的循环本质不变。典型失败模式是工具选错、循环空转与过早放弃。
  points:
  - 循环：Thought → Action → Observation
  - 显式推理提正确率，工具补短板，观察纠错
  - Function Calling 取代文本协议，循环本质不变
  - 失败模式：选错工具、空转、过早放弃
- title: Agent 的规划范式与任务分解方法
  content: 两种规划范式：先规划后执行由 Planner 把任务拆成有依赖关系的子任务图再逐步执行，全局感强、可并行、易审计；ReAct 式边走边规划每步基于最新观察决策，灵活但易迷失、难并行，实践常粗粒度先规划、子任务内
    ReAct。分解方法有自顶向下输出子任务列表加依赖、自底向上先检索相似案例、层次化主 Agent 拆解后子 Agent 再拆解。关键工程点：子任务必须可验证、有明确完成判据；失败时带原因重规划而不是硬走完；计划存外部存储防长任务丢失；子任务间输入输出接口定义清楚。
  points:
  - plan-then-execute 全局可控，ReAct 灵活易迷失
  - 分解方法：自顶向下、自底向上、层次化
  - 子任务要可验证，失败带原因重规划
  - 计划外置存储，接口定义清楚
- title: Agent 记忆系统的三层设计
  content: 三层记忆模型：短期记忆即上下文窗口，是当前对话与工具结果的直接载体，容量有限随会话消失；长期记忆是跨会话持久化的事实与偏好，需外部存储；工作记忆压缩把短期内容定期摘要后转存长期，防止窗口爆掉。长期记忆实现有向量库语义检索（按当前任务召回相关记忆，主流方案）、结构化记忆（提取为用户画像或事实三元组，确定性优于模糊召回）、情景与语义记忆分层分库。写入要有提取管道，只记偏好、结论、失败教训，全存等于噪音；读取按相关性检索注入
    prompt，本质又是一个 RAG。记忆还要有遗忘与去重防自我污染。
  points:
  - 三层：上下文窗口、长期外存、压缩转存
  - 向量语义检索为主，结构化事实更确定
  - 写入有提取管道，全存等于噪音
  - 读取按相关性注入，本质是 RAG
  - 要遗忘与去重，防记忆库自我污染
- title: Multi-Agent 协作模式与适用判断
  content: 常见协作拓扑：Supervisor 主管模式由协调者拆解任务、分派给专职子 Agent、汇总结果，最常用最可控；Swarm 去中心化点对点交接，灵活但难预测；流水线按工序接力；Debate
    评审让生成者与批评者对抗多轮挑错提升质量。值得上多 Agent 的情形：任务可并行、需要工具集与上下文隔离、需要对抗制衡。简单任务套多 Agent 只增加成本与故障面——每多一个 Agent 就多一处信息传递损耗。收益最大的是隔离与并行，而非更多智能。
  points:
  - Supervisor 最可控，Swarm 灵活难预测
  - 值得多 Agent：并行、上下文隔离、对抗制衡
  - 每多一个 Agent 多一处信息传递损耗
  - 收益来自隔离与并行，不是更多智能
- title: MCP 协议：统一 Agent 与工具的连接标准
  content: MCP 是 Anthropic 推出的开放协议，统一 AI 应用与外部能力的连接标准，类比 USB-C：模型接工具从 M×N 适配变成 M+N。MCP Server 暴露三类原语：Tools
    模型可调用的函数、Resources 可读取的数据、Prompts 预置提示模板。核心收益是工具生态复用，写一次 Server 所有支持 MCP 的客户端可用，应用与工具解耦。与 Function
    Calling 互补：FC 是模型侧调用格式，MCP 是应用与工具间的标准接口。
  points:
  - M×N 适配变 M+N，类比 USB-C
  - 三类原语：Tools、Resources、Prompts
  - stdio 本地传输，HTTP 远程传输
  - FC 管模型怎么说，MCP 管工具从哪来
- title: A2A 协议与 MCP 的分层分工
  content: A2A 是 Google 2025 年推出的智能体互联协议，让不同厂商与框架的独立 Agent 相互发现、协商任务、协作，提供 Agent Card 能力发现与任务生命周期管理。与
    MCP 的分工是关键考点：MCP 解决 Agent 与工具数据的纵向连接，即 Agent 怎么用锤子；A2A 解决 Agent 与 Agent 的横向协作，即木匠怎么和电工合作；一个 Agent
    向下用 MCP 拿工具，横向用 A2A 找伙伴。典型场景是跨部门、跨供应商的 Agent 组队，只能走标准协议。
  points:
  - MCP 纵向管工具，A2A 横向管协作
  - Agent Card 能力发现加任务生命周期管理
  - 跨组织组队只能走标准协议
  - 生态早期，知道定位与差异即可
- title: Agent 工具设计原则：什么是好工具
  content: 工具用动词加宾语命名让名字即语义，description 是给模型看的提示词，要写清用途、适用时机、不适用场景与返回结构，一个含糊的描述毁掉一个工具。接口设计四原则：原子正交，一个工具一件事，职责重叠让模型选择困难；参数少而严，必填不超过五个，枚举约束取值，数值给范围；幂等与安全分级，读操作随便调，写操作幂等带唯一请求号，危险操作拆确认环节；返回对模型友好，错误信息写明哪里错、该怎么改参数。工具数量以
    10~20 个为宜，太多选择困难，可按需分组或提供工具目录。移除低频工具常常反而提升整体表现。
  points:
  - description 就是给模型的提示词
  - 原子正交，参数不超过 5 个且枚举约束
  - 写操作幂等，危险操作挂确认
  - 错误信息要指明怎么改参数
  - 10~20 个为宜，少即是多
- title: Agent 循环控制与成本防爆炸
  content: 终止条件要多层防护：任务完成输出最终答案是最理想出口；最大步数硬上限如 25 步必配，是防失控的保险丝；token 与费用预算超限熔断；无进展检测发现连续多步调用相同或结果雷同即判定卡死。防空转手段：观察到重复行为主动打断并注入反思提示；工具结果带缓存标记帮模型意识到徒劳；把已尝试路径记进上下文避免重蹈覆辙。成本控制按步数与每步
    token 双维度统计随 trace 落库，中间步骤用小模型、关键决策用大模型，早停在信息足够时收束。循环上限是产品决策，超限优雅降级给部分答案而非直接报错。
  points:
  - 多层终止：步数上限、预算熔断、超时、无进展检测
  - 重复行为打断并注入反思提示
  - 已尝试路径记入上下文防重蹈覆辙
  - 超限优雅降级给部分答案
- title: 反思与自我纠错：Reflexion 的落地形式
  content: Reflexion 的思想是执行后不直接交付，而是审视过程与结果，把失败经验以文字存入记忆指导下一次尝试。落地形式：自评在生成后追加一轮检查列出问题并修正，简单两段式就有稳定收益；外部反馈比自评更可靠，单元测试、lint
    编译错误、搜索验证作为纠错信号；反思记忆把失败教训写入记忆库跨任务复用；Evaluator-Optimizer 循环让批评者与执行者对抗迭代。权衡：反思是延迟成本倍增器，只对高价值任务开启；外部可执行反馈才是硬信号；保留版本防越改越坏。代码
    Agent 是最成功的落地。
  points:
  - 失败教训以文字存入记忆指导下次
  - 外部反馈（测试、lint）比自评可靠
  - 反思是延迟成本倍增器，按任务价值开启
  - 保留版本可回滚，防越改越坏
- title: Agent 评估为什么难与分层测试方法
  content: Agent 评估难在四点：非确定性，同一输入多次运行路径不同，传统单测断言失效；多步复合误差，十步任务每步九成正确整体只剩约三成五；路径与结果分离，结果对但过程违规也算不合格；环境依赖，工具是真实外部系统，测试要
    mock 或沙箱。评估分三层：组件级测单步工具选择与参数填写准确率，可做确定性断言；轨迹级对比执行路径与参考路径，看关键步骤与步数效率；端到端看任务完成率，用程序可判的验收判据。实践：建覆盖典型、边界、陷阱的任务集，同任务跑
    N 次看通过率与方差，工具返回用录制回放保证可复现。
  points:
  - 每步九成正确，十步整体仅约三成五
  - 组件级、轨迹级、端到端三层评估
  - 同任务跑 N 次看通过率与方差
  - 工具录制回放保证可复现
- title: LangGraph 核心概念：把黑盒循环变成白盒状态图
  content: LangGraph 的核心是状态机图：StateGraph 由节点、边与共享 State 组成，节点读写并返回状态更新；条件边按状态路由，Agent 循环本质是带条件边的环；Checkpointing
    每步状态自动存档，支持断点恢复、时间旅行调试与中断审批。相比旧 AgentExecutor 的黑盒循环，它把循环展开成显式图，控制流白盒可编程，支持分支、并行与持久化恢复。定位上它不是 Agent
    框架而是图编排引擎，Agent 只是用它实现的模式之一。
  points:
  - StateGraph 加条件边加共享 State
  - Checkpointing 支持恢复、调试与中断审批
  - 循环展开为显式图，控制流白盒可编程
  - 本质是图编排引擎，不是 Agent 框架
- title: Human-in-the-loop 的落地环节与技术实现
  content: 必有人环节由风险驱动：不可逆操作前，支付、发外部邮件、删数据、提交生产变更，模型判断想执行但人批准后才真执行；模糊授权，意图有多种解释且影响面大。技术落地以 LangGraph 为例：在危险工具前设
    interrupt 中断点，状态持久化到 checkpoint；人工在 UI 查看打算调什么工具、什么参数，批准、修改或拒绝；从 checkpoint resume 恢复执行。暂停期间状态不丢是
    HITL 的前提，工具调用要支持人工改参后再执行。审批要给决策依据，信任随表现累积逐步免审。
  points:
  - 不可逆操作、模糊授权、低置信必须有人
  - interrupt 暂停加 checkpoint 持久化加 resume 恢复
  - 审批展示决策依据，不只是参数
  - 信任分数高逐步免审，自动化率随安全记录提升
- title: 上下文工程：Agent 时代比 Prompt 工程更关键
  content: 上下文工程是决定模型每一步能看到什么的系统设计，管理进入窗口的全部信息——指令、记忆、工具结果、检索片段、历史轨迹——的选取、压缩、组织与淘汰。Prompt 工程优化怎么问，上下文工程优化喂什么。Agent
    时代它更关键：Agent 跑几十步上下文持续累积，长任务的主要失败模式不是不会，而是上下文被污染、爆窗、关键信息被稀释。核心手法：选取按需注入；压缩结构化提取与滚动摘要；分区组织重要内容置顶置尾；淘汰过时信息；外置能查的别塞，参考资料变工具。上下文是
    Agent 最稀缺的资源。
  points:
  - Prompt 管怎么问，上下文工程管喂什么
  - 长任务失败主因是上下文污染与爆窗
  - 手法：选取、压缩、组织、淘汰、外置
  - 能查的别塞，参考资料变工具
- title: 子 Agent 模式：上下文隔离与并行
  content: 子 Agent 模式由主 Agent 把子任务委派给专职子 Agent，后者有自己的上下文窗口、工具子集与系统提示，干完活只回传结果摘要而非全过程。核心价值是上下文隔离：单 Agent
    做研究类任务，检索结果很快塞爆窗口；子 Agent 在自己窗口消化海量原始内容，只回传几十 token 结论，主 Agent 上下文保持聚焦。代价是信息传递有损、每层多一份系统提示开销、质量依赖任务描述的接口定义。轻子任务不必开子
    Agent；返回结论要求带引用来源。
  points:
  - 子 Agent 独立窗口，只回传结论摘要
  - 核心价值：上下文隔离加并行
  - 工具权限隔离，爆炸半径小
  - 轻子任务不值得开，接口定义要清楚
- title: 三种常见架构模式：Router、Planner-Executor 与 Evaluator-Optimizer
  content: Router 在入口先分类分流，简单请求不过 Agent 省钱提速，实现是 LLM 分类节点加规则兜底。Planner-Executor：拆任务出计划、逐步执行、结果触发重规划，适合目标明确路径长的任务，要点是计划显式存储、子任务可验证。Evaluator-Optimizer：生成器与评估器循环迭代到达标，适合质量敏感且反馈可判定的任务，评估器越客观越好，可执行测试优于
    judge 优于自评。生产多为洋葱结构：Router 分流、Workflow 骨架、内层嵌评审循环或子 Agent。
  points:
  - Router 分流省钱提速，简单请求不过 Agent
  - Planner-Executor 适合路径长的明确任务
  - 评估器越客观越好：测试优于 judge 优于自评
  - 生产多为洋葱组合而非单一模式
- title: Agent 框架选型与裸写的取舍
  content: 框架定位：LangChain 与 LangGraph 是全家桶，组件加编排生态最大；LlamaIndex 以数据检索为中心，RAG 开箱体验最好。选型逻辑：原型先用官方 SDK 或
    CrewAI 验证；生产 RAG 为主选 LlamaIndex；复杂编排要 HITL 持久化选 LangGraph；核心链路经常裸写更好——Function Calling 循环两三百行代码，框架抽象反而碍调试。框架价值在生态与编排原语，代价是抽象泄漏；用框架组件、控制核心循环是常见折中。
  points:
  - LangGraph 管复杂编排，LlamaIndex 管检索
  - 原型官方 SDK，生产复杂编排 LangGraph
  - 核心循环裸写两三百行，抽象碍调试
  - 用框架组件、控制核心循环的折中
- title: Agent 安全风险图谱与纵深防御
  content: Agent 比普通应用多出能动手这一层风险：提示注入诱导工具劫持，间接注入最凶险，恶意网页可让浏览型 Agent 外传数据；越权，Agent 持有凭证权限过大；工具滥用，无限循环烧钱、批量操作波及过大。纵深防御：最小权限，每个工具独立凭证收窄到只够当前任务；高危操作默认挂人工审批；白名单加资源配额熔断；代码执行跑隔离沙箱；全量调用日志与异常告警；外部数据进上下文前标记隔离。Agent
    安全等于 LLM 安全加传统系统安全，权限给大了没人兜得住。
  points:
  - 特有风险：注入劫持工具、越权、滥用、外泄
  - 最小权限：独立凭证、只读账号、API scope
  - 高危操作人工确认加白名单配额加沙箱
  - 权限设计比模型可靠性更根本
- title: Deep Research 与 Claude Code 的架构范式
  content: Deep Research 型调研 Agent：规划拆解研究问题，多轮搜索阅读记录要点，最后综合成报告；长任务发现持续写入外部笔记而非靠上下文硬撑；子问题 fan-out 给多个子
    Agent 并行跑，只回传结论。Claude Code 型编码 Agent：工具集为读写文件、执行 shell、搜索代码，返回设计极度克制；环境即反馈，跑测试、编译、lint 作为客观纠错信号；文件即记忆，计划与约定跨会话续接。共性结论：长任务
    Agent 的瓶颈不在模型智力，而在上下文管理与状态外置。
  points:
  - 调研型并行 fan-out 加笔记外置记忆
  - 编码型环境即反馈：测试编译是硬信号
  - 文件即记忆，跨会话续接
  - 瓶颈在上下文管理与状态外置
- title: Agent 调试工作流：先有 trace 再谈排错
  content: 每次运行记录全轨迹——每步 prompt、输出、工具调用与 token 消耗，没有 trace 的调试等于盲改。典型故障定位：选错工具看 description 是否含糊、职责是否重叠；参数反复填错通常是描述问题不是模型问题，补枚举与语义说明；循环空转查工具报错是否模型读不懂，加无进展检测；上下文丢失靠压缩历史、关键结论外置。调试手段：checkpoint
    从任意步重放；单变量 A/B 跑固定任务集；工具选择用状态快照单测；bad case 按失败类型聚类并固化成回归测试。
  points:
  - trace 记录每步 prompt、输出、工具调用与 token
  - 参数填错多是描述问题，不是模型问题
  - checkpoint 逐步回放，单变量 A/B
  - 状态快照单测加失败聚类
- title: Agent 前端交互：把过程变成产品体验
  content: Agent 任务跑几十秒到几分钟，过程不可见用户就以为卡死，把过程变成产品体验是 Agent 第一 UX 问题。后端按阶段推结构化事件流：thinking、tool_call（工具名加参数）、tool_result（摘要）、message_delta（答案
    token）、done，前端按类型渲染卡片。思考链默认折叠可展开，透明不轰炸；工具卡片展示名称、参数与耗时；复杂任务展示计划清单打钩；最终回答流式渲染加引用角标。工程要点是 SSE 断线重连、事件去重、参数脱敏。
  points:
  - 事件流：thinking、tool_call、tool_result、delta
  - 思考默认折叠，工具卡片可展开
  - 随时停止加危险确认加后台化
  - SSE 重连、去重、脱敏，透明分级
- title: 代码解释器的沙箱安全设计
  content: Agent 生成的代码等于任意程序，可读写文件、访问网络、耗尽资源，执行它等于给模型一个 shell，必须硬隔离。沙箱方案：容器每任务一个 Docker，文件系统只读白名单、默认无网络、资源限额、用完即销毁，是主流方案；microVM
    如 Firecracker 隔离更彻底，是多租户生产标准。权限最小化：AST 扫描 subprocess、eval 等危险调用，网络默认禁或白名单，输出截断，产物存对象存储返回 URL。流程为生成、静态审查、沙箱执行超时强杀、结构化返回、继续推理。
  points:
  - 执行生成代码等于给模型一个 shell，必须隔离
  - 容器为主流，microVM 是多租户标准
  - AST 扫描危险调用，网络默认禁
  - 超时强杀，产物走对象存储
- title: Agent 成本核算与降级链路设计
  content: 先核算：网关埋点记录每次调用的 token 与单价，算出单次任务与单用户成本；Agent 要注意任务等于 N 次调用的乘数，一次深度调研可能二十次以上调用。优化顺序：prompt 瘦身是乘以调用次数的杠杆，做历史压缩、工具结果截断、片段精选；模型路由让简单步骤用小模型、关键决策用大模型；语义缓存加前缀缓存；离线批量走
    batch API 半价。降级链路四级：旗舰加完整工具、次旗舰、小模型精简、有损兜底（缓存答案、规则模板或转人工）；网关自动切换，恢复后回升。
  points:
  - 任务成本等于单次调用乘调用次数
  - prompt 瘦身是乘数杠杆，先做
  - 四级降级：旗舰、次旗舰、小模型、兜底
  - 预算护栏防死循环烧钱
- title: Agent 生产事故的复盘方法
  content: Agent 特有事故包括模型升级行为漂移、循环调用烧钱、工具误操作、注入越权、上下文污染。应急三步先止血：止损开关做功能降级切规则模板、模型秒切回滚、预算熔断；用 trace 全轨迹定位哪步决策错、输入是什么，没有
    trace 的事故没法查；按工具调用日志反查影响面。复盘：时间线还原、五 Why 追根因、归为系统而非模型——模型不可靠是前提，防线缺失才是根因。每次事故至少沉淀一个回归 case、一条告警规则、一个防护机制，事故回流评测集。文化上无责复盘，模型热更新即生产变更。
  points:
  - 先止血：降级开关、模型回滚、预算熔断
  - trace 是定位前提，没有 trace 没法查
  - 根因归为系统防线缺失，不是模型
  - 每次事故沉淀 case、告警与防护
  - 模型热更新即生产变更
- title: Claude Code 为什么用 Agentic Search 而非 RAG 检索代码
  content: RAG 检索代码的困境：代码语义跨文件连续，切块破坏依赖与命名一致性；改动频繁索引时效差；检索多为精确符号匹配，embedding 模糊语义反而失真。Agentic Search 不建索引，Agent
    用基础工具主动探索——grep 做符号与正则精确搜索、glob 按文件模式定位、read 读相关片段，像工程师一样多轮迭代收敛。优势：grep 对符号匹配百分之百准确；零索引维护，新代码立即可查；带着推理目的按需读，上下文高效；代价是多轮耗时，编码场景准确性优先值得。
  points:
  - 切块破坏代码跨文件语义，索引时效差
  - grep、glob、read 多轮迭代，符号匹配全准
  - 零索引维护，新代码立即可查
  - 检索从一次查询变成迭代探索
- title: Agent 自主性五级模型：按任务风险选级别
  difficulty: 2
  tags:
  - Agent
  - 自主性
  - 架构
  position_tags:
  - agent
  - ai_app
  content: 'Agent 的自主性不是越强越好，而是按"任务可逆性与风险"分五级：L0 纯提示（LLM 一次性回答，无工具）；L1 提示 + 预定义工作流（LLM 填空，流程固定）；L2 单工具调用（模型决定用哪个工具，一轮）；L3
    多步工具循环（ReAct 式自主决策步序，人定边界）；L4 全自主（自定目标拆解、自我修正，人只看结果）。级别越高，能处理的任务越开放，但可预测性、可审计性、成本都越差。工程上的正确做法：默认选最低能完成任务的级别，仅在"任务开放性确实需要"时升级；高危操作（支付、删除、外发）无论哪一级都强制人工确认。面试官问"你的
    Agent 多自主"，考察的正是"你是否理解自主性是用可控性换来的"这个权衡。

    关键判据：任务路径能否预见（能→低级别）、错误的可逆性（不可逆→降级+审批）、步数预算是否可控。'
  points:
  - L0 提示 → L1 工作流填空 → L2 单工具 → L3 多步循环 → L4 全自主
  - 级别越高越开放，但可控性与成本越差
  - 默认选最低能完成任务的级别
  - 高危操作无论哪级都强制人工确认
- title: 生产级 Agent 的可靠性六件套
  difficulty: 3
  tags:
  - 可靠性
  - 工程化
  - Agent
  position_tags:
  - agent
  - backend
  content: 'Agent 从 demo 到生产，可靠性靠六个机制的组合而非单一手段：①幂等——工具调用必须可安全重试（带唯一请求号、服务端去重），因为重试是常态；②超时——每步工具、每次 LLM
    调用、整个任务三层超时，任何一层卡死都有出口；③重试——指数退避 + 最大次数，重试前判断"是参数错还是服务错"（参数错重试无意义）；④成本护栏——会话级 token/费用上限，超限熔断并降级；⑤权限分级——工具按危险度分级，高危操作强制人工确认（HITL）；⑥可观测——全轨迹
    trace（每步的 prompt/输出/工具调用），没有 trace 的线上事故无法排查。六件套缺一不可：只做超时没有幂等，重试就会造成重复下单；只有限流没有 trace，出问题就是黑盒。

    面试表达：按"失败模式 → 对应机制"讲，比背清单有说服力。'
  points:
  - 幂等：工具调用可安全重试（唯一请求号）
  - 三层超时：单工具 / 单次调用 / 整个任务
  - 重试带指数退避，先分辨参数错还是服务错
  - 成本护栏：token/费用上限熔断
  - 权限分级 + 全轨迹 trace 缺一不可
- title: 上下文的三种病症：中毒、注意力分散、信息冲突
  difficulty: 3
  tags:
  - 上下文工程
  - Context Engineering
  - 调试
  position_tags:
  - agent
  - ai_app
  content: '上下文工程策略卡讲"怎么管理"，这张讲"管理不好会得什么病"——诊断视角：①上下文中毒（Context Poisoning）：一条错误/幻觉内容被写进上下文（如工具返回了错误数据、模型早期的一次误判），后续每一步都引用它持续放大——识别特征是"早期某个错误结论被反复沿用"；修复：关键结论落盘前校验、支持对历史步骤打"作废"标记、给
    trace 加传播分析。②注意力分散（Distraction）：上下文过长后模型被无关内容带偏，重复浏览已试过的路径——对应 Lost in the Middle；修复：压缩历史、按需注入、把不相关内容移出窗口。③信息冲突（Confusion/Clash）：新旧版本信息同时存在（改过的计划
    vs 旧计划），模型随机采用其一——修复：覆盖式更新（同一事实只留一份最新）、版本号标记。三种病都指向同一原则：上下文是稀缺资源，写进去的每一条都要"值得模型看"。

    面试加分：能说"先诊断是哪种病，再选对应的上下文工程手段"。'
  points:
  - 中毒：错误结论被写进上下文持续放大
  - 分散：上下文过长后模型被无关内容带偏
  - 冲突：新旧信息并存，模型随机采用
  - 修复分别对应：落盘校验 / 压缩注入 / 覆盖式更新
- title: 12-Factor Agents：Agent 工程化的十二条军规
  difficulty: 3
  tags:
  - 工程化
  - 架构
  - 12-Factor
  position_tags:
  - agent
  - backend
  content: '借鉴 12-Factor App，AgentGuide 与社区总结的 Agent 工程原则，核心几条：①**自有控制流**——Agent 循环写在自己的代码里而不是框架黑盒中（可调试、可中断）；②**状态外置**——会话状态存数据库/文件而非仅存上下文窗口，崩溃可恢复；③**工具是标准接口**——schema
    化、可版本化，不散落硬编码；④**接触最小权限**——凭证按工具粒度分发；⑤**一切皆可恢复**——每个步骤可重放（checkpoint）；⑥**prompt 与代码分离**——prompt 版本化可独立迭代；⑦**人类可审查的中间产物**——计划/结果落成可见工件而非只在对话里。这组原则的底层思想与"微服务拆分的克制"同源：Agent
    是工程系统，不是模型调用脚本。

    实践意义：评审一个 Agent 项目时按这十二条过一遍，能快速暴露"换框架就瘫、崩了没状态、事故无痕迹"三类通病。'
  points:
  - 自有控制流：循环写在自己代码里
  - 状态外置：崩溃可恢复
  - 工具 schema 化 + 最小权限
  - 一切步骤可重放（checkpoint）
  - prompt 与代码分离、版本化
- title: 手撕 ReAct 循环：不用框架的代码级实现要点
  difficulty: 3
  tags:
  - ReAct
  - 实现
  - 编程实战
  position_tags:
  - agent
  - ai_app
  - python
  content: '不用框架手写一个最小可用 ReAct Agent，核心四件：①**工具注册表**——`TOOLS = {"search": {"desc": "...", "schema": {...},
    "fn": callable}}`，注册即生成 LLM 的 tools 参数（Function Calling 格式）；②**主循环**——`while step < MAX_STEPS:` 调
    LLM（带历史+工具定义）→ 返回 tool_calls 则逐个执行 → 结果以 role="tool" 消息 append → 无 tool_calls 即最终答案 break；③**解析容错**——模型输出的参数
    JSON 可能非法，捕获解析失败后把错误信息作为工具结果回喂（让模型自己修正参数），而不是直接崩；④**终止与预算**——步数上限、token 计数、无进展检测（连续相同调用）三道保险。加分细节：系统提示里写清"工具失败时如何自救"；工具结果超长截断；历史超长做滚动摘要。两百行内可写出生产可用骨架——这正是"框架是脚手架不是护城河"的底气。'
  points:
  - 工具注册表：desc + schema + fn
  - 主循环：tool_calls 执行回喂，无则答案
  - 参数解析失败回喂错误让模型自纠
  - 终止三保险：步数 / token / 无进展检测
- title: Tool Registry（工具注册表）的设计与实现
  difficulty: 2
  tags:
  - 工具设计
  - Tool Registry
  position_tags:
  - agent
  - backend
  content: Tool Registry 是 Agent 的"工具户口系统"，职责四件：**注册**——装饰器式声明（@tool(name, description, schema)），自动把函数签名转成
    JSON Schema 给 LLM；**发现**——运行时按名称/标签检索工具，支持按角色/会话过滤可见集合（不同 Agent 看到不同工具子集）；**校验**——调用前对参数做 schema 校验（pydantic），非法参数在进函数前拦截并把校验错误回喂模型自纠；**执行**——统一入口做超时、重试、审计日志，业务函数只写逻辑。设计要点：description
    即提示词（写清用途/时机/边界）；版本管理（改参数语义等于换工具，需灰度）；权限元数据（danger_level、required_scope）供守卫使用；结果标准化（成功返回数据、失败返回"错误+修正建议"，让模型能自愈）。直接决定
    Agent 选工具的准确率——工具层的质量上限就是 Agent 行为的上限。
  points:
  - 注册：装饰器声明，签名转 JSON Schema
  - 发现：按名称/角色过滤可见工具集
  - 校验：调用前 pydantic 拦截非法参数
  - 执行：统一超时/重试/审计入口
  - description 即提示词，决定选工具准确率
- title: Agentic RL 与自进化 Agent：依据执行反馈改进自身
  difficulty: 3
  tags:
  - Agentic RL
  - 自进化
  - 前沿
  position_tags:
  - agent
  - ai_app
  content: '2026 前沿方向：让 Agent 从自己的执行轨迹中持续变强，两条路线：①**Agentic RL（强化学习路线）**——以任务成败为奖励信号（代码跑通、检索命中、任务完成）训练模型的多步决策能力，区别于单轮对齐的
    RLHF；代表如搜索/编码 Agent 的 RL 训练，难点在奖励稀疏、长轨迹信用分配、环境构建成本。②**自进化 Agent（Self-Improving，符号路线）**——不改模型权重，改"工作的工件"：Agent
    根据执行反馈自动迭代自己的提示词、工具描述、技能库与工作流（如 Voyager 的技能库、Reflexion 的经验记忆、Prompt 优化的 DSPy 思路）。特征是"经验 → 提炼 → 更新工件
    → 下次复用"的闭环。

    工程现实：自进化必须配防退化护栏——每次工件更新都跑回归评测集，效果下降即回滚；否则"自我改进"会漂移成"自我劣化"。

    面试表达：两条路线的取舍（RL 改模型成本高上限高；符号路线便宜见效快），以及"评测集是自进化的安全带"。'
  points:
  - Agentic RL：任务成败为奖励训多步决策
  - 自进化：不改权重，改提示/工具/工作流工件
  - 闭环：经验 → 提炼 → 更新工件 → 复用
  - 防退化护栏：每次更新跑回归评测，降级即回滚
- title: Agent 工具调用的并发与超时处理
  difficulty: 2
  tags:
  - 并发
  - 超时
  - 工具调用
  position_tags:
  - agent
  - backend
  - python
  content: '工具调用层的工程细节，直接影响 Agent 延迟与稳定性：①**并行执行**——模型一次返回多个独立工具调用时应并发执行（asyncio.gather / 线程池），延迟从"之和"降到"最大值"；但有依赖的调用必须串行（先查订单再发货），判断依据是模型返回顺序与业务语义。②**逐工具超时**——每个工具独立
    timeout（HTTP 类 10~30s、代码执行类按沙箱配额），超时返回结构化的"timeout"结果让模型决定重试/换路/放弃，而不是让整个循环挂死。③**失败降级顺序**——工具报错时：参数错误
    → 回喂模型修正重试；服务不可用 → 换备用工具或跳过并在最终答案声明数据缺失；连续失败 → 触发熔断进入兜底。④**并发安全**——共享状态（缓存/配额）的并发访问加锁或原子操作；写类工具禁止隐式并发。⑤**结果一致性**——并行结果按调用顺序回填（不能因完成顺序错乱消息序）。

    加分点：能讲"哪些工具值得并行"（独立只读）与"必须串行"（有依赖、写操作）的判别。'
  points:
  - 独立只读调用并发执行，延迟取最大值
  - 有依赖或写操作必须串行
  - 逐工具超时，超时返回结构化结果
  - 降级顺序：修正重试 → 换工具 → 声明缺失
  - 并行结果按调用顺序回填消息序
- title: Agent 可解释性与决策审计
  difficulty: 2
  tags:
  - 可解释性
  - 审计
  position_tags:
  - agent
  - backend
  - dba
  content: 'Agent 替人做决策后，"为什么这么做"从加分项变成硬要求：①**决策审计链**——每个动作必须可回答"依据什么信息、走了什么规则/推理、产生了什么结果"——落成结构化 trace（输入快照、prompt
    版本、工具调用、置信信号），而非自由文本日志；②**推理可视化**——给用户看"计划清单+每步依据摘要"（不是原始思考链，是摘要级理由），给审计方看完整 trace；③**归因能力**——答案中的每个结论能关联到来源（引用、工具输出、记忆条目），防"结论无出处"；④**事后回放**——基于
    checkpoint 从任意步重放决策过程，复盘与改进都靠它。合规场景（金融/医疗）还要决策规则可导出（这次交易符合哪条策略）。

    与可观测性的关系：tracing 解决"发生了什么"，可解释性解决"为什么这么做"——后者需要结构化的决策记录而不只是日志。

    加分点：提"可解释性分层"——用户层要简洁可信、开发层要完整可复现、审计层要规则可导出。'
  points:
  - 决策审计链：依据/推理/结果结构化落盘
  - 推理可视化分层：用户摘要级、审计完整级
  - 结论可归因到来源（引用/工具输出/记忆）
  - checkpoint 回放支撑复盘与改进
- title: Agent 多轮会话的 KV Cache 与成本优化
  difficulty: 3
  tags:
  - KV Cache
  - 成本
  - 多轮会话
  position_tags:
  - agent
  - ai_app
  - backend
  content: 'Agent 每轮都带着越来越长的历史调用 LLM，成本与延迟的优化核心是"对齐 KV Cache 的前缀结构"：①**前缀稳定**——把系统提示、工具定义、Few-shot 等不变内容放最前且逐字节稳定（不要在中间插入时间戳等易变内容），API
    的 prompt caching 才能命中（缓存部分按 1/10 价格计费，首 token 延迟也降）；②**追加而非改写**——多轮对话只在尾部追加新消息，不改前面的内容（改一个字节，其后所有
    token 的缓存全部失效）；③**历史压缩的边界**——滚动摘要会破坏缓存前缀，应在"阶段边界"做压缩（如每完成一个子任务），压缩点之后重建缓存；④**工具结果瘦身**——进历史前截断/结构化，长尾
    token 主要来自工具输出；⑤**模型路由**——中间步骤用小模型（各自的缓存独立管理）。实测：一个 50 轮工具调用的 Agent，做好前缀缓存可省 60%+ 成本。

    加分点：能讲 OpenAI/Anthropic/DeepSeek 各家 prompt caching 的计费与命中条件的差异要点。'
  points:
  - 前缀稳定：不变内容置顶且逐字节一致
  - 只追加不改写：改一字节缓存全失效
  - 历史压缩在阶段边界做
  - 工具结果进历史前截断瘦身
  - 做好前缀缓存可省 60%+ 成本
- title: Agent Harness 的定义与框架工作流的区别
  content: Harness 是包裹 LLM 的运行时骨架（宿主代码）——组装系统提示与上下文、调用模型、解析输出、执行工具、把结果回填，循环往复直到任务完成。模型是大脑，Harness 是身体与神经系统。它与框架的关系是整机与积木——LangChain 这类框架提供模型抽象、工具封装、记忆组件等积木，Harness 是用积木或裸写搭出来的整机，用框架不等于有好骨架。与工作流引擎的区别在控制权——工作流由人定义好路径、模型在节点里填空，Harness 把下一步决策交给模型。实践常混合，外层固定关键节点、内层模型自主探索。
  points:
  - Harness = 主循环 + 上下文组装 + 工具执行 + 结果回填
  - 框架是积木，Harness 是搭出来的整机
  - 工作流人定路径，Harness 模型自主决策
  - 骨架质量是模型能力的放大系数
- title: Agent Harness 的最小组成与主循环
  content: 最小 Harness 五大件——主循环（while 未完成则组装上下文、调模型、解析输出、有工具调用就执行并回填、无则退出）、上下文组装器（系统提示 + 历史 + 工具结果按预算拼接）、工具层（schema 定义 + 执行器 + 结果序列化，工具描述就是给模型看的 API 文档）、终止条件（最终回答、最大轮数、用户中断、不可恢复错误）、观测（每轮 token 与工具轨迹，没有轨迹就没法调试）。关键细节三条——工具结果原样回填（报错也是有效反馈）、每轮上下文整体重发（API 无状态）、轮数上限防失控。
  points:
  - 五大件——主循环/组装器/工具层/终止条件/观测
  - 报错信息原样回填，模型据此自纠
  - 每轮整体重发上下文，服务端不记忆
  - 轮数上限典型 20-50 防失控烧钱
- title: Harness 的上下文工程与 compaction
  content: 上下文工程是提示工程的上位概念——不再是写好一段 prompt，而是持续决定每一轮给模型看什么。窗口将满时全量历史会稀释指令、粗暴截断会丢关键结论，核心思路是分层——热区保真、冷区压缩。compaction 把旧轮次（尤其大体积工具输出）折叠成摘要，保留任务目标、已做决策、关键结论、待办，丢弃原始大段内容；配合结构化外记（TODO 文件、决策日志）把状态落到上下文之外，每轮注入笔记而非全量历史——Claude Code 的文件系统即记忆正是此思路。压缩是有损的，要显式记录 dead ends 防止绕圈重试。
  points:
  - 分层策略——热区保真、冷区压缩
  - compaction 保留目标/决策/结论/待办
  - 结构化外记——笔记与日志落到上下文外
  - 压缩有损，dead ends 清单防绕圈
- title: 子代理模式的上下文隔离与并行
  content: 子代理是主 Agent 派出的独立执行体——有自己的上下文窗口、工具循环与 system prompt，跑完只把结论文本回传主 Agent，中间过程对主上下文完全不可见。解决的核心问题是上下文污染——全库搜索读几百个文件会把主窗口塞爆，任务指令被稀释。对比大窗口直读——按 200k 满窗计费、注意力被无关内容稀释，子代理消耗的是廉价一次性窗口，还支持多任务并行缩短墙钟时间。代价是派单 prompt 要写清目标边界与输出格式，结论回传是有损压缩，嵌套深度通常不超两层。
  points:
  - 子代理过程隔离，主上下文只收结论
  - 治上下文污染——防任务指令被稀释
  - 比大窗口直读更省钱、更聚焦、可并行
  - 派单要写清边界，回传有损，嵌套≤2 层
- title: 工具循环的健壮性与防死循环
  content: 健壮性三支柱。报错回喂——工具异常捕获后把结构化错误信息当工具结果回填（如 error 字段写明路径不存在、提示先列目录），模型下一轮自我修正，绝不让单次工具失败崩掉整个循环。预算封顶——单工具超时、全场轮数上限、token 预算三道闸，顶到就优雅退出并输出已完成部分。死循环检测——同工具同参数连续失败注入提醒换思路、轮数增长但任务状态无变化触发检查点、A 到 B 交替的震荡模式识别。错误要分类处理——模型参数错让它自纠、环境错回填事实换路、系统性错重试无用需升级。
  points:
  - 报错结构化回喂，模型自纠而非崩溃
  - 超时/轮数/token 三重预算封顶
  - 重复调用、无进展、震荡三类死循环检测
  - 错误三分法——自纠/换路/升级
- title: Harness 的权限沙箱与提示注入防御
  content: 最小权限原则——只读工具默认放行、写操作每次确认或白名单路径、危险操作（删库、强推、对外发请求）强制人工确认并明示后果，粒度到工具加参数级。沙箱隔离——代码执行跑在容器或微 VM 里，限制文件系统范围、网络白名单、资源配额，文件操作限定项目根目录并防路径穿越。提示注入的攻击面是 Agent 读取的网页、邮件、文档里可能藏着恶意指令，以数据身份进入上下文被执行；完全防住在理论上不可能（内容与指令同通道），共识是纵深防御——外部内容标记包裹、权限模型做被骗后的最后一道闸、出站内容做敏感信息扫描、高危动作永远人在环。
  points:
  - 工具按风险分级，危险操作硬闸确认
  - 沙箱限文件系统/网络/资源，防路径穿越
  - 间接注入以数据身份进上下文，更隐蔽
  - 纵深防御——权限模型是最后一道闸
- title: Claude Code 作为 Harness 典范的可借鉴设计
  content: Claude Code 把模型包进一套面向真实软件工程的骨架，多处设计值得抄——文件系统即记忆（进度、决策、约定落 AGENTS.md 与笔记文件，会话压缩重启后不丢，上下文只是工作集）；工具链贴工程实际（Edit 要求 old_string 唯一匹配，逼模型先读再改防盲改，工具结果带行号可精确引用）；权限分级加交互确认（默认只读、写按模式确认、危险命令列后果）；子代理隔离探索类大消耗任务；流式随时可打断、任务可从断点续跑；斜杠命令把常用流程固化复用。背后原则是模型能力固定时上下文质量决定输出质量。批判视角——多项目记忆一致性、子代理回传损耗、长会话压缩漂移是它仍在演进的边界。
  points:
  - 文件系统即记忆——笔记外挂、上下文当工作集
  - 工具设计逼模型先读再改，结果带行号
  - 权限分级进产品交互，危险命令列后果
  - 可打断可续跑是生产级体验的分水岭
- title: compaction 后决策遗忘的症状与补救
  content: 压缩摘要保得住做了什么，最容易丢的是为什么——否决方案的理由、用户隐性偏好、bug 根因结论。遗忘的典型症状是绕圈——重试已否决的方案、重复问已确认的问题、反复 debug 已定位的 bug。补救分三步——事前把决策显式落盘（决策日志记选择与一句理由、dead ends 清单记失败路径与原因、用户约束单独成文件每轮注入）；事中压缩时用结构化字段（目标、现状、结论、待办、禁区）而非自由叙述，结构化不易被摘要丢掉；事后原始轨迹落库，靠检索工具按需查回细节。再加行为检测——重复调用触发时提醒模型查阅笔记，把遗忘损害限制在一轮内。
  points:
  - 遗忘症状是绕圈——重试已否决方案
  - 事前——决策日志 + dead ends + 约束文件
  - 事中——结构化字段强制保留摘要骨架
  - 事后——轨迹落库，按需检索查回细节
