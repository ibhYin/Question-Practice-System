# 题库扩充批次：算法补充（每题显式 category）
- title: "岛屿数量怎么求？DFS/BFS 在网格问题中的应用？"
  category: ALGO
  difficulty: 2
  tags: ["DFS", "BFS", "网格"]
  position_tags: ["backend", "fullstack", "ai_app"]
  answer: |
    1. **问题（LeetCode 200）**：'1' 是陆地、'0' 是水，求连通的陆地岛屿数——连通分量计数问题。
    2. **解法骨架**：遍历每个格子，遇到未访问的 '1' → 计数 +1 → **从它出发 flood fill**（DFS 递归或 BFS 队列）把整个连通块标记为已访问（原地改 '0' 或 visited 数组）。
    3. **DFS 实现**：越界或非 '1' 直接返回；标记当前格；向四方向递归。BFS 实现：队列初始为起点，出队时标记并扩散四邻——BFS 更适合求最短路径类变体（1 天内扩散 = 多源 BFS，如 1162 地图分析、腐烂的橘子 994）。
    4. **复杂度**：每个格子至多访问一次 O(m·n) 时间；DFS 递归栈最坏 O(m·n)（大网格递归爆栈时改 BFS 或显式栈）。
    5. **易错**：标记时机（入队时就标记，否则队列里重复入队爆内存）；原地修改 vs visited 的取舍（保留原数据用 visited）。
    6. **加分点**：多源 BFS（所有 '1' 同时入队求最短扩散时间）；并集查（Union-Find）解法与连通分量的通用性；"网格问题的本质是图遍历"这个抽象。

- title: "双指针有哪些经典套路？各解决什么类型的问题？"
  category: ALGO
  difficulty: 2
  tags: ["双指针", "套路"]
  position_tags: ["backend", "fullstack", "ai_app"]
  answer: |
    1. **对撞指针（两端向中间）**：有序数组两数之和（167）、回文判断（125）、盛水容器（11）——收缩方向由比较结果决定；有序性是对撞的前提。
    2. **快慢指针（同向不同速）**：链表环检测（快 2 慢 1）、找中点（快到尾慢在中）、倒数第 k 个（先走 k 步）；数组原地操作（26 删除有序数组重复项——慢指针指向不重复区末尾）。
    3. **同向滑动窗口**：无重复最长子串、最小覆盖子串（76）——右扩左缩，窗口维护统计量（见滑动窗口专题）。
    4. **前后指针（分区）**：快排 partition、移动零（283，非零前移）、颜色分类（75 荷兰国旗三指针）。
    5. **识别信号**："有序数组找配对"→对撞；"原地删除/分区"→快慢前后；"连续子串最值"→窗口；"链表中点/环"→快慢。
    6. **加分点**：能证明双指针的正确性（单调性——一侧不可能再优所以收缩）；双指针把 O(n²) 暴力降到 O(n) 的条件（两端信息单调）。

- title: "用栈解决有效括号匹配和最小栈？栈类题的通用思路？"
  category: ALGO
  difficulty: 1
  tags: ["栈", "设计"]
  position_tags: ["backend", "fullstack", "ai_app"]
  answer: |
    1. **有效括号（20）**：左括号入栈；右括号检查栈顶是否为对应左括号（不匹配/栈空 → false），匹配则弹出；结束栈空才合法。映射用 dict（')': '('）。易错：只有右括号的串（结束时栈空但中途失败）与纯左括号（结束栈非空）。
    2. **最小栈（155）**：getMin 也要 O(1)——**辅助栈与主栈同步压入"当前最小值"**（每次 push 都压 min(栈顶辅助, 新值)，pop 同步弹），空间 O(n)；优化：辅助栈只在 min 变化时压入（pop 时比较长度回弹）。
    3. **栈题通用思路**：括号/嵌套结构（栈天然匹配层次：32 最长有效括号、394 字符串解码）；单调栈是进阶套路（下一个更大元素 496、柱状图最大矩形 84——栈内保持单调递减，弹栈时结算）。
    4. **易错**：空栈 peek；匹配方向（右括号查栈顶）；最小栈的同步策略别只压"变小才压"漏了相等值。
    5. **加分点**：单调栈的 O(n) 证明（每元素至多入栈出栈一次）；两个栈实现队列/两个队列实现栈的摊还分析。
