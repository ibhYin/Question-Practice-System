# AI 应用开发背诵卡片（陈述式）
category: AI_APP
doc:
  title: "AI 应用开发知识体系全景"
  content: |
    AI 应用开发的知识体系沿"LLM 基础 → RAG → 微调对齐 → 工程化 → 安全"五段主线展开，每一段都有必须吃透的核心机制与工程判断。

    一、LLM 基础。Transformer 自注意力是全部大模型的底座：Q 表示"要找什么"，K 表示"能提供什么标签"，V 携带实际内容，softmax(QKᵀ/√d_k)·V 完成语义聚合，O(n²·d) 的复杂度决定长上下文的成本。推理侧靠 KV Cache 消除历史重复计算，GQA/MQA 共享 KV 头压缩缓存，vLLM 的 PagedAttention 消除显存碎片、continuous batching 提吞吐。Tokenizer（BPE 迭代合并高频对）把文本切成 token——它同时是计费与上下文长度的计量单位，中文词表压缩比直接影响成本。训练三阶段：预训练产出会续写的 base model，SFT 注入指令遵循能力，RLHF/DPO 完成人类偏好对齐，应用必须使用 chat 版模型。

    二、RAG。这是应用层最重要的范式：大模型知识冻结、缺私有数据、会幻觉，检索外部知识喂给模型补齐这三点。离线链路是加载→清洗→分块→向量化→入库；在线链路是查询改写→混合检索（向量+BM25）→重排→拼 Prompt→生成。分块策略决定检索粒度，Embedding 选型看 C-MTEB 榜单与指令前缀，向量库按数据量选（原型用 Chroma、已有 PG 用 PGVector、亿级用 Milvus），rerank 交叉编码器精排是检索侧性价比最高的提升，引用溯源让答案可信。幻觉只能缓解不能根除，RAG 是第一缓解手段。

    三、微调与对齐。选型框架是先提示工程（零成本），知识问题用 RAG，行为、风格、格式问题才微调；想灌知识而微调是常见误区。LoRA 基于权重变化低秩假设只训 B·A 两个小矩阵，QLoRA 把底座量化到 4bit，消费级显卡即可微调 7B 级模型。DPO 把奖励建模与强化学习合并为一步监督学习，稳定且便宜。

    四、工程化。结构化 JSON 输出是生命线：JSON mode、解析容错、Pydantic 校验、repair loop 四层保障；流式输出用 SSE 把感知延迟降到亚秒级；成本靠语义缓存、prompt 前缀缓存、模型路由与 prompt 瘦身；评估先行——先建评测集再优化，检索层看召回与 MRR，生成层看忠实度，LLM-as-judge 可批量但要防位置与长度偏差；可观测性靠全链路 trace 加版本三元组。Lost in the Middle 提醒重要信息放两端、上下文能短则短。

    五、安全。提示注入位列 OWASP LLM Top 1 且没有完美解法，核心思路是假设注入必然发生：输入侧检测与不可信内容隔离、架构侧最小权限、高危操作人工确认、输出侧 guardrails 过滤。

    贯穿全线的工程观：AI 产品 = 20% 模型 + 80% 工程与数据，成败关键在数据质量与反馈闭环，而不在模型选型。
cards:
  - title: "Transformer 自注意力：Q、K、V 的含义与计算"
    content: "自注意力是大模型的核心算子：Query 表示当前要找什么信息，Key 表示各位置能提供什么标签，Value 携带实际内容。每个位置用自己的 Q 与所有位置的 K 做点积得相关性，除以 √d_k 防止维度增大导致 softmax 饱和，softmax 归一成权重后对 V 加权求和。多头机制让不同头学习句法、指代等不同关系模式。复杂度 O(n²·d)，序列翻倍算力乘四，这是长上下文昂贵的根源；相比 RNN 它可全序列并行、任意两 token 直接交互，这是取代 RNN 的原因。"
    points: ["Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V", "除 √d_k 防点积过大致 softmax 饱和、梯度消失", "多头：各组独立 Q/K/V 投影学不同关系模式", "复杂度 O(n²·d)，长上下文成本的根源", "全并行且信息路径 O(1)，取代 RNN 的关键"]
  - title: "KV Cache 的加速原理与显存估算"
    content: "Decoder 自回归生成时每步要对全部历史 token 算注意力。KV Cache 把每层已算出的 K、V 缓存下来，新 token 只算自己的 Q/K/V 追加进缓存，历史直接复用，单步计算从 O(n²) 降到 O(n·d)。显存 ≈ 2×层数×KV 头数×head_dim×序列长×batch×字节，7B 模型 4K 上下文单序列约 2GB，长上下文时可能超过模型权重。优化方向有 GQA/MQA 减少 KV 头数、KV 量化、PagedAttention 分页管理与长文本滑窗。"
    points: ["历史 K/V 缓存复用，新 token 只算自己的 Q/K/V", "单步推理从 O(n²) 降到 O(n·d)", "显存 ≈ 2×层数×KV头数×head_dim×序列长×batch×字节", "GQA/MQA 压缩 KV 头数，PagedAttention 消除碎片", "prefill 是算力瓶颈，decode 是显存带宽瓶颈"]
  - title: "Tokenizer 与 BPE：token 是计费与上下文的计量单位"
    content: "Tokenizer 负责文本与 token 序列的双向转换，token 是模型计算的最小单位，也是计费与上下文长度的计量单位。BPE 从字符级词表出发，统计相邻 token 对频次并迭代合并最高频对，直到词表达到目标容量——高频词融合成单 token，长尾词保持子词切分，byte-level 兜底保证无 OOV。通用 GPT 词表下中文按字或字节切分，压缩比差导致成本高、上下文利用率低，Qwen、GLM 扩充中文词表后显著改善。tokenizer 与模型强绑定不可混用。"
    points: ["BPE：统计频次迭代合并最高频对，无 OOV", "token 是计费与上下文长度的计量单位", "中文压缩比差是成本与上下文利用率问题", "tokenizer 与模型强绑定，不可混用"]
  - title: "大模型训练三阶段：预训练、SFT 与 RLHF/DPO 对齐"
    content: "预训练在万亿 token 无标注文本上做下一词预测，获得语言能力与世界知识，产物是会续写不会对话的 base model，成本最高。SFT 用万到百万条高质量指令与回答对教会模型按指令回答，数据质量大于数量，LoRA 让成本可控，领域模型主要在此注入行业行为。RLHF 先训奖励模型再 PPO 最大化奖励；DPO 把奖励建模与强化学习合并为偏好对上的一步监督学习，稳定便宜成主流。对齐阶段决定体验上限，也可能带来能力略降的对齐税。应用必须使用 chat 版模型而非 base 版。"
    points: ["预训练产出 base model，SFT 学指令遵循", "SFT 数据质量大于数量，LoRA/QLoRA 控成本", "DPO 合并 RM 与 RL 为一步监督学习", "base 会续写、chat 会回答，应用用 chat 版", "对齐决定体验上限，存在对齐税"]
  - title: "RAG 的完整链路与核心价值"
    content: "大模型知识冻结在训练截止日、缺私有数据、参数化记忆不可更新且会幻觉，RAG 用检索外部知识喂给模型补齐这三点，知识更新只需更新索引不必重训。离线索引链路：文档加载→清洗→分块→Embedding 向量化→存入向量库（同时存原文与元数据）。在线问答链路：query 改写→向量化→top-k 检索（可混合 BM25）→重排→拼 Prompt→生成并带引用。核心价值是可溯源、知识实时、成本远低于微调。常见失败在检索侧——检索不到比生成不好更常见，优化重点通常在检索侧。"
    points: ["离线：分块→向量化→入库（存原文与元数据）", "在线：改写→检索→重排→拼 Prompt→生成", "知识实时可溯源，成本远低于微调", "多数失败在召回侧，优化优先检索链路"]
  - title: "chunking 分块策略与块大小选择"
    content: "常见分块策略五种：固定长度切分加 10%~20% 重叠，简单但可能切断语义；递归字符切分按段落、句子层级递归，是 LangChain 默认推荐；结构化切分按标题或代码边界切并拼接标题路径；语义切分在相似度突变处切，效果最好成本最高；父子分块用小块检索、大块生成，兼顾精准与上下文完整。块大小 256~1024 token 起步：太大检索噪声多、表征被稀释，太小上下文碎片化。chunk 必须保留来源、标题层级等元数据便于溯源，上线前先做分块质量评测。"
    points: ["五种策略：固定/递归/结构化/语义/父子分块", "父子分块：小块检索精准，大块生成完整", "块大小 256~1024 token 起步，先评测再上线", "chunk 带来源与标题元数据便于溯源"]
  - title: "Embedding 模型原理与选型要点"
    content: "Embedding 模型把文本映射为固定维度的稠密向量，语义相近的文本在向量空间距离近，用向量距离近似语义相似度。选型看五个维度：C-MTEB 榜单效果（中文首选 BGE 系列）、维度与成本权衡、最大输入长度、API 与私有化部署方式、指令前缀要求——BGE、E5 对 query 和 passage 加不同前缀，用错效果骤降。相似度默认选余弦：只看方向、对模长不敏感，向量归一化后与欧氏距离排序等价。query 与文档必须用同一模型，换模型必须全量重建索引。"
    points: ["向量距离近似语义相似度", "选型看 C-MTEB、维度成本、输入长度、部署方式", "BGE/E5 类指令模型前后缀用错效果骤降", "归一化后余弦与欧氏排序等价，默认余弦", "换 Embedding 模型必须全量重建索引"]
  - title: "向量数据库选型：FAISS、PGVector、Chroma 与 Milvus"
    content: "FAISS 是向量检索库而非数据库，没有 CRUD 与分布式，性能极强，适合单机百万级和科研场景。PGVector 是 PostgreSQL 插件，向量与结构化数据同库同事务，SQL 生态完整可 JOIN 过滤，适合千万级以下且已有 PG 的团队。Chroma、Qdrant 等轻量易用、自带元数据过滤，适合原型与千万级。Milvus 分布式支持十亿级向量、多副本多分片，适合大规模生产但运维成本高。选型看数据量、过滤需求、运维成本与混合检索需求，已有 ES 时 8.x 的 kNN 也可承接。"
    points: ["FAISS 是库不是数据库服务，单机百万级", "PGVector：向量与业务数据同库同事务", "Milvus：十亿级、分布式，运维成本高", "决策看数据量、过滤需求、运维与混合检索"]
  - title: "混合检索：BM25 与向量检索互补"
    content: "纯向量检索对专有名词、型号、错误码这类精确匹配 query 会因语义泛化而失真。混合检索同时跑 BM25 关键词检索（精确词频匹配、可解释、零训练成本）与向量检索（语义泛化），取两路并集后用 RRF 按排名倒数融合或加权合并。BM25 与向量恰好互补，中文需先分词或用 IK 分词器。典型架构是 ES 8.x 同时存倒排与向量，或向量库加独立 ES 双路后融合。工业界结论：混合检索加 rerank 是检索侧性价比最高的组合。"
    points: ["精确词匹配场景纯向量失真，BM25 补位", "两路并集用 RRF 或加权分数融合", "中文 BM25 需分词（如 IK）", "混合检索加 rerank 是检索侧性价比之王"]
  - title: "Rerank 与两阶段检索设计"
    content: "召回阶段为了速度用双塔架构近似检索，query 与文档独立编码、离线建库，精度有限，top-5 可能混入主题相关但答非所问的段落。Rerank 用交叉编码器把 query 与文档拼在一起逐对精算相关性，精度远高于双塔但无法离线建索引，只能处理小候选集。两阶段设计：召回取 top-50~100（向量加 BM25）→ rerank 精排 → 取 top-3~5 进 Prompt，用延迟换精度。rerank 不改索引、可灰度，是 RAG 优化第一优先级。"
    points: ["双塔快而粗，交叉编码器慢而准", "召回 top-50~100 → 重排 → top-3~5 进 Prompt", "常用 BGE-reranker、Cohere Rerank", "不改索引可灰度，是 RAG 优化第一优先级"]
  - title: "查询改写与 HyDE 提升召回质量"
    content: "用户 query 口语化、带指代、过短或与文档用词不一致，直接检索召回质量差。Query Rewrite 用 LLM 补全指代（结合对话历史做 query 独立化）、拆解多轮问题、扩展同义词，是多轮对话 RAG 的必备环节。HyDE 先让 LLM 生成一个假想的答案文档，用它的向量去检索真实文档——答案与答案的语义空间比问题与答案更接近，query 很短或长尾问答时效果明显。改写多一次 LLM 调用，重要场景值得，简单 FAQ 不必。"
    points: ["改写补指代、拆多轮、扩同义词", "HyDE 用假想答案的向量检索真实文档", "答案与答案的空间比问题与答案更近", "多一次 LLM 调用，按场景取舍"]
  - title: "RAG 引用溯源的三层实现"
    content: "RAG 的信任来自可验证，企业合规要求可追溯，无引用的答案用户不敢用。实现分三层：元数据层在 chunk 入库时带上文档名、章节路径、页码、URL 锚点；Prompt 层给检索片段编号，指令要求每个论点标注来源、资料未覆盖就说不确定，输出内联引用；前端层解析编号映射原文，点击跳转加片段高亮。可信增强手段是引用校验——把模型给出的引用与实际检索片段做相似度比对防假引用，句子级归因验忠实度。无引用答案降级为仅供参考标记，被质疑的引用回流评测集。"
    points: ["元数据层：chunk 带来源、页码、锚点", "Prompt 层：编号引用，资料未覆盖就说不确定", "前端层：引用跳转与片段高亮", "引用校验防假引用，句子级归因验忠实度"]
  - title: "大模型幻觉的成因与缓解手段"
    content: "成因有三：LLM 本质是预测下一个 token 的分布，目标是最像而非最真；训练后新知识不存在、长尾覆盖弱，模型倾向编造而非拒答；temperature 高时采样更放飞。缓解按性价比排序：RAG 检索增强并要求仅依据资料回答；Prompt 约束不知道就说不知道并给拒答示例；事实任务 temperature 降到 0~0.3；关键数值日期用规则校验；高频固定场景微调内化领域知识；self-consistency 多次采样取一致。幻觉只能缓解不能根除，产品要有引用溯源、人工兜底与免责设计。"
    points: ["成因：概率生成求最像而非最真加知识边界加采样", "RAG 是第一缓解手段，Prompt 约束拒答", "事实任务 temperature 0~0.3", "幻觉只能缓解不能根除，产品层要兜底"]
  - title: "采样参数 temperature、top_p、top_k 的机制与调法"
    content: "temperature 对 logits 缩放后再 softmax：值越低分布越尖锐、输出稳定保守，0 附近近似贪心解码，越高越平坦、多样性越强。top_p 核采样只保留累计概率达到 p 的候选集合，动态截断长尾；top_k 只保留概率最高的 k 个候选，固定窗口截断。调参经验：事实问答、代码与结构化输出用 0~0.3，创意文案用 0.7~1.0，top_p 一般 0.9~0.95，top_k 与 top_p 二选一不要同时猛调。"
    points: ["temperature 缩放 logits，低稳高散", "top_p 动态截断累计概率，top_k 固定窗口", "事实与代码 0~0.3，创意 0.7~1.0", "top_k 与 top_p 二选一，不要同时猛调", "temperature=0 仍非严格确定"]
  - title: "Function Calling 原理与工具 schema 设计"
    content: "Function Calling 把工具名称、描述、参数 JSON Schema 随请求发给模型，模型需要工具时输出结构化调用意图（工具名加参数 JSON）而非自然语言，应用层执行后把结果回传，模型基于结果继续生成。可靠性远高于自己解析文本，因为模型经专门训练学会输出工具调用模式。schema 设计要点：description 就是给模型的提示词，写清何时用、何时不用、参数含义；必填参数 3~5 个内并用枚举约束取值；工具职责正交不重叠；执行失败返回结构化错误让模型自行重试换参。"
    points: ["模型输出结构化调用意图，应用层执行后回传", "description 是给模型的提示词，决定选择准确率", "必填参数不超过 5 个，枚举约束取值", "工具职责正交，错误信息结构化供模型自纠"]
  - title: "微调、RAG 与提示工程的选型决策框架"
    content: "决策原则是先低成本后高成本：提示工程调整指令、few-shot 与输出格式，零成本先试；知识问题（事实、私有数据、时效性）首选 RAG，可更新可溯源；行为、风格、格式问题才考虑微调——稳定输出特定格式、学会领域术语、蒸馏小模型降本。常见误区是想灌知识而微调：知识注入微调效率低且易幻觉，知识类需求九成该用 RAG。微调与 RAG 不互斥，微调学行为加 RAG 供知识是常见组合。成本为提示小于 RAG 小于全参微调；最重要的前置是先建评测集再选路线。"
    points: ["先提示工程，知识问题用 RAG，行为格式问题微调", "灌知识微调是误区，知识需求九成用 RAG", "微调学行为加 RAG 供知识可组合", "成本：提示 < RAG < 全参微调", "先建评测集再选路线"]
  - title: "LoRA 低秩适配：为什么比全参微调便宜"
    content: "LoRA 的核心假设是微调引起的权重变化矩阵 ΔW 低秩，可用两个小矩阵乘积近似：ΔW ≈ B·A，秩 r 取 4~64 远小于维度 d。训练时冻结原权重只训 A 和 B，新增参数仅为原模型百分之零点几，推理时把 BA 合并回 W，零额外延迟。便宜的原因是可训练参数少，优化器状态与梯度显存骤减，消费级显卡可微调 7B，每个适配器仅几十 MB 可热切换。QLoRA 把底座量化到 4bit 再训 LoRA，48G 单卡可微调 65B。r 取 8~16 常够，目标模块通常选注意力的 q、v 投影。"
    points: ["低秩假设：ΔW ≈ B·A，r 取 4~64", "冻结底座只训 A/B，推理可合并零延迟", "QLoRA：4bit 量化底座加 LoRA", "r 取 8~16 常够，数据质量大于数量"]
  - title: "RAG 系统的分层评估方法"
    content: "评估分两层：检索层用标注 query 与文档对测召回率、MRR 与 nDCG；生成层评忠实度（答案是否忠于检索内容）、答案相关性与拒答正确性。LLM-as-judge 用强模型按维度打分可批量，RAGAS 涵盖 faithfulness、relevancy、context precision 与 recall，但要防位置与长度偏差，用 pairwise 加顺序交换缓解。工程要点：先建 100 条以上真实 query 的评测集再优化，每次改动跑回归，线上负反馈按钮是北极星指标。"
    points: ["检索层看召回与 MRR，生成层看忠实度与相关性", "RAGAS：faithfulness、relevancy、context 指标", "LLM-as-judge 可批量，需防位置与长度偏差", "没有评测集的优化都是盲调"]
  - title: "Lost in the Middle 与长上下文管理"
    content: "模型对上下文开头和结尾的信息利用最好，中部信息容易被忽略，长上下文不等于长上下文利用能力——很多模型标称 128K 但有效利用约 32K~64K。应对策略：控制上下文长度，RAG 只喂 top-k 精选片段而非全塞；重要信息放两端，系统指令放头、关键资料放前、问题放尾；信息压缩，历史对话滚动摘要、工具输出截断；显式引用，要求模型基于第几段回答，用引用锚点强迫关注具体片段。成本视角：注意力计算随长度平方级增长，长 prompt 首 token 延迟明显，能短则短。"
    points: ["中部信息易被忽略，窗口大不等于利用得好", "重要信息放两端，指令放头问题放尾", "历史滚动摘要，工具输出截断", "注意力随长度平方增长，能短则短"]
  - title: "Prompt 工程最佳实践：结构、few-shot 与 CoT"
    content: "prompt 基础结构是角色设定、任务描述、约束条件、上下文资料与输出示例，指令要清晰具体，说用不超过三条要点而不是简洁一点。few-shot 给 2~5 个输入输出示例让模型模仿格式与风格，对格式统一和分类任务立竿见影，示例要覆盖边界情况。CoT 让模型先一步步推理再给答案，数学逻辑与多步任务准确率大幅提升；推理模型已内化 CoT，普通模型仍需显式提示。工程化要求 prompt 版本化管理、建评测集防回归、上线前 A/B。"
    points: ["结构：角色、任务、约束、资料、示例", "few-shot 两到五例覆盖边界，格式任务立竿见影", "CoT 显式推理提升多步任务，推理模型已内化", "prompt 版本化加评测集防回归"]
  - title: "结构化 JSON 输出的四层保障"
    content: "结构化输出是 LLM 工程化的生命线，所有编排都依赖下游可靠消费模型输出。四层保障：模型层用 JSON mode 或 structured outputs 保证语法合法，约束解码屏蔽非法 token 是根治方案；Prompt 层给明确 schema 加完美示例并要求只输出 JSON；解析层容错：剥离代码块标记、截取首尾大括号、用 json_repair 修复；校验层用 Pydantic 校验，失败把错误加原输出回传模型修正，超限降级。temperature 降到 0~0.2 显著提升稳定性。"
    points: ["JSON mode 与 structured outputs 模型层兜底", "Prompt 给 schema 加示例，只输出 JSON", "解析容错加 Pydantic 校验加 repair loop", "temperature 0~0.2 提升稳定性"]
  - title: "LLM 应用的成本与延迟优化"
    content: "缓存是第一杠杆：精确与语义缓存把相同相似 query 的答案存 Redis，FAQ 场景命中率高；prompt 前缀缓存对系统指令与固定资料复用 KV-cache，API 按缓存价格大幅折扣。模型路由让简单 query 走小模型、复杂才升级，长尾固定任务微调小模型替换大模型可降一个数量级成本。Prompt 瘦身删冗余示例、压缩检索片段、历史滚动摘要——token 直接决定成本与首字延迟。流式输出让感知延迟降到亚秒级；离线任务用 batch API 半价。"
    points: ["语义缓存加 prompt 前缀缓存两路复用", "模型路由：简单走小模型，复杂升大模型", "prompt 瘦身直接省成本与 TTFT", "流式输出改善感知延迟，batch API 半价"]
  - title: "提示注入攻击的防护分层"
    content: "提示注入在数据里夹带指令劫持模型行为，位列 OWASP LLM Top 1。直接注入是用户输入忽略之前的指令；间接注入更危险，RAG 文档、网页、邮件里藏指令，模型检索到后执行，Agent 场景等于数据获得了代码执行权；典型危害包括泄露系统提示与密钥、诱导调用危险工具。防护分四层：输入侧注入检测与不可信内容标记隔离；架构侧最小权限，高危操作强制人工确认，检索来源可信分级；输出侧 guardrails 脱敏过滤；提示侧加固只是缓解不是根治。核心思路是假设注入必然发生，把爆炸半径做小。"
    points: ["直接注入问用户，间接注入藏在检索内容里", "输入检测加不可信内容标记隔离", "最小权限加高危操作人工确认", "没有完美解法，目标是缩小爆炸半径"]
  - title: "SSE 流式输出的实现与协议选择"
    content: "LLM 生成完整回答要几秒到几十秒，逐 token 推送把感知延迟降到亚秒级。后端返回 text/event-stream 响应头保持长连接，按帧逐块写入；前端用 EventSource 或 fetch 流式读取，按 delta token 增量渲染，结尾帧发 DONE。SSE 单向、基于 HTTP、自动重连，流式输出够用；WebSocket 双向适合高频推送场景。工程细节：Nginx 要关 proxy_buffering，注意心跳与断线续传。"
    points: ["text/event-stream 长连接，按帧推 delta", "前端 EventSource 或 fetch 流式读取", "SSE 单向够用，双向场景才需要 WebSocket", "Nginx 关 buffering，处理心跳与重连"]
  - title: "私有化部署：vLLM、Ollama 与量化"
    content: "私有化的动机是数据不出域、可控成本、低延迟与深度定制。vLLM 用 PagedAttention 加 continuous batching，吞吐高一个数量级，提供 OpenAI 兼容 API，适合服务化集群；Ollama 一行命令跑 GGUF 模型，易用但并发有限，适合开发调试。量化把权重压到 INT8/INT4，显存近似减半、精度小降，Q4 是甜点位。路径：开发用 Ollama，生产上 vLLM 加 OpenAI 兼容层，业务代码无感切换。"
    points: ["vLLM：PagedAttention 加 continuous batching 高吞吐", "Ollama 单机易用，开发调试用", "量化 INT8/INT4，Q4 是甜点位", "显存 = 权重 + KV-cache + 激活值", "生产 vLLM 加 OpenAI 兼容层，切换无感"]
