category: SCENARIO
doc:
  title: 场景设计题体系：从秒杀到迁移的方法论
  content: "场景设计题考察的不是背 API，而是把限流、缓存、异步、幂等、对账这些武器按流量漏斗组织起来的能力。所有高并发系统的通用骨架都是：前端与网关削减流量，缓存与内存挡住热点读，异步消息缓冲写峰值，数据库用条件更新兜底，最后靠幂等与对账保证最终一致。\n\
    \n秒杀是这套骨架的集中演练。流量侧按钮置灰、答题打散、CDN 静态化、网关令牌桶限流，让大部分请求死在进数据库之前；库存侧预热进 Redis，Lua 脚本把判断与扣减合成原子操作防超卖，扣减成功发\
    \ MQ 异步建单，数据库再用 stock 大于 0 的条件更新做最后防线；链路独立部署、热点分桶、超时未支付回补库存、对账任务修正 Redis 与 DB 的偏差。抢红包是它的姊妹题：发侧预拆分明细，抢侧\
    \ Redis List 弹出防超领，DB 唯一索引防重复，资金宁可发不出去不能透支。\n\n热点读走多级缓存：CDN 与浏览器缓存静态化，本地缓存 Caffeine 扛纳秒级极热数据并接受秒级不一致，Redis\
    \ 集群共享，DB 只做回源；防击穿用分布式锁或单飞重建，防雪崩靠 TTL 随机化，热点探测动态发现 top key 加入本地缓存。\n\n写一致性的通用问题是幂等：重复点击、网络重试、MQ 重复投递都会造成重复执行。天然幂等的查询、按唯一条件更新之外，最强保证是业务单号加唯一索引这道硬防线，防重\
    \ token 与分布式锁做前置拦截，状态机用 WHERE status 条件防止非法流转；一人一单就是唯一索引思想的典型落地。\n\n支撑性组件也有标准答案。分布式 ID 要全局唯一、趋势递增，号段模式简单可控，雪花算法本地发号但必须处理时钟回拨；延迟任务首选\
    \ MQ 延迟消息，Redis ZSet 与任务表轮询是轻量与可靠的备选；限流四算法中固定窗口有临界突刺，滑动窗口平滑，漏桶整形，令牌桶允许突发，与熔断降级组成稳定性三件套；数据迁移走存量同步、增量双写、灰度切读、校验对账、下线旧库五步；导出千万级\
    \ Excel 用游标分页读加 EasyExcel 流式写加异步任务下载，读写两侧都不进内存；日志系统以结构化、traceId 串联、EFK 聚合、分级保留为骨架。\n\n# \U0001F4CC\
    \ 知识速览图\n\n把上面正文的零散知识串成一张张图——先自己复述，再对照图检验。\n\n### 秒杀流量漏斗\n\n```mermaid\nflowchart TD\n    A[百万请求]\
    \ --> B[前端<br>按钮置灰 / 验证码打散]\n    B --> C[网关限流<br>只放行库存同量级]\n    C --> D[Redis Lua 原子扣减<br>防超卖主战场]\n\
    \    D --> E[MQ 削峰<br>异步创建订单]\n    E --> F[DB 条件更新<br>WHERE stock > 0 最后防线]\n    F --> G[对账兜底<br>Redis\
    \ 与 DB 一致]\n```\n"
cards:
- title: 秒杀系统的流量漏斗设计
  content: 秒杀的本质是用流量漏斗把百万请求削减到库存量级。前端按钮置灰防重复点击，答题或验证码打散请求，静态资源走 CDN，网关用令牌桶只放行与库存同量级的请求——大部分流量死在进数据库之前。秒杀链路独立部署成单独服务与独立库，失败不影响主站；用户维度限流、黑名单风控拦截刷子。记住主旨：限流是第一道闸，让后续每一层只处理自己扛得住的量。
  points:
  - 按钮置灰、答题打散、CDN 静态化
  - 网关限流只放行库存量级的请求
  - 秒杀链路独立部署隔离故障
- title: 秒杀库存的 Redis 原子扣减方案
  content: 库存方案是秒杀的核心：库存预热进 Redis，用 Lua 脚本把判断与扣减合成一个原子操作，防超卖绝不靠先查后改；扣减成功发 MQ 异步创建订单，消费端按数据库能力匀速消费削峰填谷；数据库再用
    UPDATE 加 stock 大于 0 的条件更新做最后防线。热点商品可用库存分桶扣减分散热点 key，前端下单后轮询或 WebSocket 查询排队结果，超时未支付把库存回补进 Redis。
  points:
  - Lua 原子扣减，不靠先查后改
  - MQ 削峰，DB 条件更新兜底
  - 分桶扣减分散热点 key
- title: 秒杀系统的兜底与对账设计
  content: 秒杀除了主链路还要有完整的兜底体系：订单号唯一索引保证消息幂等，重复消费直接报错；对账任务定时比对 Redis 剩余库存、数据库剩余库存与订单明细合计，发现偏差自动修正；超时未支付的订单释放库存回补
    Redis；全链路准备降级预案，任何一层故障都切换到有损模式。一句话总结：限流是第一道闸，Redis 原子扣减是主战场，MQ 削峰是缓冲带，DB 条件更新是最后防线，幂等和对账是保险丝。
  points:
  - 订单号唯一索引保证消息幂等
  - 对账修正 Redis 与 DB 偏差
  - 幂等与对账是最后的保险丝
- title: 热点数据的多级缓存架构
  content: 爆款商品详情这类热点读用多级缓存层层挡：浏览器缓存与 CDN 静态化在最外层，本地缓存 Caffeine 在应用内存里提供纳秒级读取，Redis 集群提供共享的毫秒级读取，数据库只做回源。本地缓存只放极热且允许短暂不一致的数据，容量上限加
    W-TinyLFU 淘汰，过期时间短，并通过 Redis pub/sub 或 MQ 广播删除消息做主动失效。一致性方案是更新 DB 后删 Redis 再广播删本地缓存，TTL 兜底，秒级不一致是设计前提。
  points:
  - CDN、本地缓存、Redis、DB 四级递进
  - 本地缓存只放极热且容忍不一致的数据
  - 更新后删缓存并广播失效各节点
- title: 本地缓存的要点与热点探测
  content: 本地缓存的使用要点：只放极热数据，不要把大列表整包塞进每个应用节点；必须设容量上限防 OOM；更新靠广播失效而不是干等长 TTL。热点探测方面，客户端统计访问频次找出 top key，动态把新热点加入本地缓存，京东开源的
    hotkey 就是这个思路。缓存重建要防击穿：分布式锁或 singleflight 保证同一 key 并发只有一个请求回源，其余等结果；热点数据可以永不过期加异步刷新，防雪崩则靠 TTL 随机化。
  points:
  - 容量上限加淘汰策略防 OOM
  - 热点探测动态发现 top key
  - 单飞重建防击穿，TTL 随机防雪崩
- title: 分布式 ID 的方案对比
  content: 分布式 ID 要满足全局唯一、趋势递增、高可用高性能、不暴露业务量。UUID 本地生成无依赖，但无序导致 InnoDB 页分裂、36 字符太长，不适合做 MySQL 主键。数据库号段模式一次取一段号在内存分配，双
    buffer 预取消除取号毛刺，简单可控但强依赖 DB。Redis INCR 原子自增实现简单，可用号段方式批量取减少网络往返。中小规模号段够用，高性能低延迟选雪花算法，美团的 Leaf 同时支持两种模式。
  points:
  - UUID 无序不适合做主键
  - 号段模式双 buffer 消除毛刺
  - 高性能场景选雪花算法
- title: 雪花算法的结构与时钟回拨
  content: 雪花算法用 64 位：1 位符号、41 位毫秒时间戳（可用 69 年）、10 位机器 id、12 位序列号，单机每毫秒可发 4096 个，本地生成、趋势递增、性能极高。两大坑：一是时钟回拨——机器时间倒退可能发出重复
    ID，处理方式是回拨小时拒绝发号或等待追平，或用备用位记录回拨状态；二是机器 id 分配需要管理，通过 ZooKeeper、数据库或配置中心统一分配避免重复。它是最主流的高性能发号方案。
  points:
  - 41 位时间戳加 10 位机器 id 加 12 位序列
  - 时钟回拨时拒绝发号或等待
  - 机器 id 需统一分配管理
- title: 接口幂等的多层防御
  content: 幂等指同一操作执行一次和多次结果相同，触发场景包括用户重复点击、网络重试、MQ 重复投递。天然幂等的有查询、按唯一条件的 UPDATE、按 id 删除。非幂等操作的方案按强度排序：唯一索引是最后防线，订单号或业务流水号建唯一索引，重复插入直接报错；防重
    token 前置拦截重复提交；分布式锁串行化；状态机用 WHERE status 条件防非法流转；去重表记录处理过的单号返回上次结果。设计原则是唯一索引硬保证，Redis 拦截提体验。
  points:
  - 唯一索引是最后一道硬防线
  - 防重 token 与分布式锁前置拦截
  - MQ 消费端必须幂等
- title: 一人一单的两种实现
  content: 一人一单是秒杀和抢购的刚需：同一用户对同一商品只能下一单。实现手段一：Redis 用 SETNX 写入 userId 加商品 id 的 key 并设过期时间，写入失败说明已抢过直接拒绝；手段二：数据库唯一索引兜底，user_id
    加商品 id 建唯一约束，并发穿透 Redis 的重复请求插入时直接报错回滚。两层配合即可在极端并发下保证一人一单，这也是唯一索引作为最后防线思想的具体应用。
  points:
  - Redis SETNX 快速拦截重复
  - DB 唯一索引兜底并发穿透
  - 两层配合保证极端并发下不重复
- title: 千万级数据导出 Excel 防 OOM
  content: 从 MySQL 导出千万级数据有两个 OOM 点：一次 SELECT 全量加载进内存，以及 POI 的 XSSFWorkbook 把整个 Excel 驻留内存。读侧用游标分页 WHERE
    id 大于上批末尾 ORDER BY id LIMIT batch，避免深分页；或 JDBC 流式查询 fetchSize 设为 Integer.MIN_VALUE、MyBatis Cursor
    逐行消费，走从库低峰执行。写侧用 EasyExcel 或 SXSSFWorkbook 流式写，边查边写边刷盘。交互上做成异步任务：落任务表、后台生成传对象存储、通知下载链接。
  points:
  - 游标分页替代深分页 offset
  - EasyExcel 流式写不驻留内存
  - 异步任务加对象存储返回下载链接
- title: 短链接服务的整体设计
  content: 短链服务的需求是长 URL 换短码、点击 301 或 302 跳转，典型量级是日增百万、读写比 100 比 1。6 位 62 进制短码有约 568 亿组合，足够使用。存储用 MySQL
    存 code 到 long_url 的映射，code 建唯一索引，Redis 缓存热码命中率极高，再加本地缓存两级；非法短码用布隆过滤器前置拦截。跳转选 302 保证每次都经过服务端可做统计，301
    会被浏览器缓存导致统计丢失，业务要统计就用 302。
  points:
  - 6 位 62 进制约 568 亿组合
  - MySQL 唯一索引加 Redis 两级缓存
  - 要统计跳转量用 302 而非 301
- title: 短码生成的发号器方案
  content: 短码生成推荐发号器加 62 进制编码：全局自增 id 用号段模式批量取，转成小写字母、大写字母加数字的 62 进制字符串作为短码——无冲突、趋势可预估，比哈希截断加查重简单可靠。哈希方案的代价是每次都要查重再重试，且短码分布不可控。可以预生成短码池放内存，扛突发发放。配套做长链幂等：同一长
    URL 可加 hash 二级索引返回同一短码；过期短码惰性清理归档，跳转逻辑可下沉到网关层降低耗时。
  points:
  - 发号器加 62 进制无冲突
  - 预生成短码池扛突发
  - 长链幂等返回同一短码
- title: Feed 流的推拉结合模式
  content: Feed 流有时间线的两种极端：推模式发布时把内容写进每个粉丝的收件箱，读时 O(1)，但千万粉丝的大 V 写入爆炸；拉模式读时聚合关注者各自时间线，写简单但读昂贵。工业界主流是推拉结合：普通用户发布全推，大
    V 发布不推，粉丝读时把大 V 最新内容与自己的收件箱归并。存储上收件箱用 Redis ZSet 以时间戳为 score，限制长度超出落库，全量内容库按 user_id 分库分表，翻页用时间戳加
    id 的游标。
  points:
  - 推模式读快写爆炸，拉模式相反
  - 大 V 不推，读时合并拉取
  - 收件箱 ZSet 限量，游标翻页
- title: 抢红包系统的资金安全
  content: 抢红包分发与抢两阶段：发红包先冻结或预扣资金，生成红包记录并用二倍均值法随机拆分金额明细，金额全部用分（long）计算杜绝浮点误差；抢红包把明细列表预热进 Redis List，LPOP
    弹出即抢到，单线程原子天然防超领，也可用 Lua 脚本原子扣减；抢到后写数据库明细，user_id 加 red_id 唯一索引防重复抢，发 MQ 异步入账，数据库条件更新 status 为 UNCLAIMED
    做最后防线。资金安全：宁可发不出去不能透支，24 小时未领完自动退回，对账任务核对三方数字。
  points:
  - 发侧预拆明细，抢侧 LPOP 原子弹出
  - 唯一索引防重复抢，MQ 异步入账
  - 金额用分计算，宁发不出不透支
- title: 延迟任务的实现方案选型
  content: 延迟任务的实现按可靠性排序：MQ 延迟消息是生产首选，RocketMQ 支持延迟等级与任意精度，可靠、可重试、可观测；数据库任务表加定时轮询简单可靠可查询，精度等于轮询间隔，量大需要分片；Redis
    ZSet 以执行时间戳为 score 轮询取到期任务，取到即删要用 Lua 原子，多实例需抢锁防重复消费；时间轮 O(1) 插入删除适合调度器内核；Redis key 过期通知不可靠，通知可能延迟或丢失，只能做提示。订单超时关闭、红包退回、定时提醒都是典型场景。
  points:
  - MQ 延迟消息是生产首选
  - 任务表轮询简单可靠可查询
  - 过期通知不可靠，只做提示
- title: 四种限流算法的取舍
  content: 固定窗口计数器实现最简，INCR 加 EXPIRE 即可，但窗口交界瞬间可能放行两倍流量的临界突刺；滑动窗口把窗口切成小格统计最近 N 格总和，平滑无突刺，代价是内存与计算略增；漏桶以恒定速率放行，输出绝对平滑，适合保护脆弱下游，但无法利用突发容量；令牌桶按速率生成令牌、请求取令牌，允许突发又控制平均速率，是网关的默认算法。选型：保护下游用漏桶，容忍突发要均速用令牌桶，简单口径用计数器，精细统计用滑动窗口。
  points:
  - 固定窗口有临界突刺
  - 漏桶强制整形，令牌桶允许突发
  - 滑动窗口平滑但开销略增
- title: 限流熔断降级的组合使用
  content: 限流只是稳定性三件套之一，要与熔断降级组合使用：限流挡住超额流量保护自己；熔断在下游故障时快速失败，防止线程池被拖垮引发雪崩；降级提供有损服务兜底，返回缓存数据、默认值或引导文案。分层部署：网关层做粗粒度全局限流，服务层做接口级限流，热点资源单独限制。分布式限流用
    Redis 加 Lua 集中计数，注意网络开销，常见做法是本地限流加 Redis 全局限流双层。Sentinel、Guava RateLimiter 是常用实现，自适应限流按 RT 或 CPU 动态调阈值。
  points:
  - 限流、熔断、降级三件套缺一不可
  - 网关粗粒度、服务层细粒度分层
  - 本地加 Redis 双层分布式限流
- title: 数据库不停机迁移五步法
  content: 数据库不停机迁移的核心套路是存量迁移加增量双写加灰度切读加校验对账加下线旧库。第一步全量迁移历史数据并记录位点；第二步上线双写开关，写旧库同时写新库，用 binlog 订阅或比对任务追平差异，先写旧后写新保权威源；第三步按用户或比例灰度读新库，开关随时秒级回切；第四步全量分片
    checksum 加抽样比对，双写差异计数器归零后确认；第五步停写旧库观察、删双写代码、归档保留可回滚。工具链有 canal、Debezium、gh-ost、云厂商 DTS。
  points:
  - 存量迁移、增量双写、灰度切读
  - 校验对账归零后再下线旧库
  - 切读开关随时秒级回滚
- title: 双写迁移的一致性细节
  content: 双写的坑主要在一致性与事务边界：两库之间没有事务，只能靠最终一致加对账补偿；同步双写会增加写延迟，新库写入失败要告警加补偿任务，不能长时间阻塞主流程；写顺序必须先写旧库再写新库，保证权威源不出错。对账修复任务是双写方案的标配：定时比对两库差异行，以旧库为准修复新库，差异计数器归零才能进入切读阶段。回滚预案是切读开关秒级回切，旧库在下线前保留完整可写状态。
  points:
  - 两库无事务，靠最终一致加对账
  - 先写旧库保权威源
  - 差异计数器归零才切读
- title: 日志系统的设计规范
  content: 日志系统先规范打日志：ERROR 影响功能必须告警，WARN 可自愈异常，INFO 记关键业务动作并控制量，DEBUG 生产关闭；采用 JSON 结构化格式带 traceId、userId、耗时，机器可解析是聚合检索的前提；敏感信息脱敏，密码与
    token 永不落日志。链路上网关生成 traceId 经 MDC 注入日志、HTTP header 与 MQ 传递，跨服务可串。采集聚合走 EFK：Filebeat 采集、Kafka 缓冲、Elasticsearch
    滚动存储加冷热分层、Kibana 检索。治理上分级保留，日志即负债。
  points:
  - 分级语义清晰，结构化 JSON 输出
  - traceId 全链路串联跨服务日志
  - EFK 聚合检索，分级保留控成本
