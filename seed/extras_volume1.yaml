# 题库扩充批次：MySQL + Redis（每题显式 category）
- title: "为什么推荐自增主键？用 UUID 做主键有什么问题？"
  category: MYSQL
  difficulty: 2
  tags: ["主键", "索引"]
  position_tags: ["java", "backend", "dba"]
  answer: |
    1. **InnoDB 是聚簇索引组织表**：数据按主键顺序物理存储。自增主键顺序插入，总是追加到 B+ 树最后，页写满就开新页——**顺序写、页利用率高、无页分裂**。
    2. **UUID 的问题**：
       - **随机性**：插入位置随机，频繁触发页分裂和碎片，写性能差、缓存命中率低；
       - **太长**：36 字符 vs bigint 8 字节，所有二级索引的叶子节点都要存一份主键，索引体积膨胀数倍；
       - 无序导致 buffer pool 命中率下降。
    3. **有序 UUID 变体**（UUIDv7、雪花算法）把时间戳放高位，接近自增效果——分布式场景下的主流替代。
    4. **自增的局限**：分库分表后各库自增冲突（要换号段/雪花）；主从切换可能回退；自增值不保证连续（回滚/批量插入会跳号）。
    5. **加分点**：能讲页分裂的动态过程（中间插入→分裂→上层节点更新→树变高），以及"主键选择影响的是整棵 B+ 树 + 所有二级索引"这一全局视角。

- title: "ORDER BY 的工作原理？什么时候走索引排序，什么时候 filesort？"
  category: MYSQL
  difficulty: 2
  tags: ["排序", "SQL优化", "sort buffer"]
  position_tags: ["java", "backend", "dba"]
  answer: |
    1. **索引排序（理想）**：如果 ORDER BY 的列与 WHERE 用到的索引匹配（联合索引顺序一致、方向一致），MySQL 按索引顺序扫描天然有序，explain 的 Extra 无 filesort。8.0 支持降序索引（DESC 索引），倒序也能走。
    2. **filesort 两种算法**：
       - **全字段排序**：把 select 的所有列 + 排序列放入 sort_buffer 排完直接返回——不回表但 buffer 占用大；
       - **rowid 排序**：排序字段太多放不下时，只放排序列 + 主键，排完再回表取整行——省内存但多一次回表。
       - 由 `max_length_for_sort_data`（默认 4KB）阈值决定。
    3. **sort_buffer_size**：每连接分配的排序缓冲，不够就落临时文件多路归并——调大有上限，别按连接数放大。
    4. **优化思路**：建覆盖索引消除 filesort；控制单次返回行数；`ORDER BY RAND()` 是典型反模式（全表排序）。
    5. **加分点**：能讲"sort_buffer 是每连接的"与连接池的放大效应；group by 无索引时也有类似临时表+排序过程。

- title: "JOIN 的执行原理？Nested-Loop Join、Block Nested-Loop、Hash Join 有什么区别？"
  category: MYSQL
  difficulty: 3
  tags: ["JOIN", "执行计划"]
  position_tags: ["java", "backend", "dba"]
  answer: |
    1. **Simple Nested-Loop**：外表每行都全表扫内表——没人这么用，必然走内表索引。
    2. **Index Nested-Loop（最常见）**：外表逐行，用连接列去**内表索引**查找——要求内表连接列有索引，成本 = 外表行数 × 索引查找。
    3. **Block Nested-Loop（无索引时）**：把外表分块装进 join buffer，**一块只扫一遍内表**，减少内表扫描次数；8.0.18 后被 Hash Join 替代（BNL 移除）。
    4. **Hash Join（8.0.18+，无索引连接的主力）**：小表建 hash 表，大表逐行探测——等值连接一次完成，复杂度近似线性。
    5. **优化原则**：小表驱动大表（filtered/rows 估算）；内表连接列建索引；避免 `SELECT *` 让 join buffer 提前溢出；大偏移深分页 + join 慢的用延迟关联。
    6. **加分点**：能对比笛卡尔积代价、讲 8.0 各版本 Hash Join 演进（18 引入等值、22 支持跨库 hash）。

- title: "binlog 的三种格式（statement/row/mixed）怎么选？"
  category: MYSQL
  difficulty: 2
  tags: ["binlog", "主从复制"]
  position_tags: ["dba", "backend", "java"]
  answer: |
    1. **STATEMENT**：记录 SQL 语句原文。日志量小；但**非确定性函数**（NOW()、UUID()、LIMIT 无 ORDER BY）在主从重放结果可能不一致——复制不安全的重灾区。
    2. **ROW**：记录行的实际变更（前后镜像）。复制绝对一致；但一条 UPDATE 全表 = 海量 binlog，日志量大。Canal/Debezium 等 CDC 工具只能解析 ROW。
    3. **MIXED**：默认 statement，遇不安全语句自动切 row——折中，但边界行为不透明。
    4. **生产推荐 ROW**：一致性 > 日志体积，且生态（CDC、闪回、审计）全依赖 row 格式；配合 `binlog_row_image=FULL/MINIMAL` 控制镜像大小。5.7.7 起默认就是 ROW。
    5. **加分点**：row 格式 + binlog2sql/MyFlash 可以做**数据闪回**（误删恢复）；讲 ROW 下大事务对主从延迟的影响。

- title: "半同步复制是什么？解决了异步复制的什么问题？"
  category: MYSQL
  difficulty: 2
  tags: ["主从复制", "高可用"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **异步复制的问题**：主库提交即返回，binlog 还没传到从库就宕机 → 这部分事务**永久丢失**（RPO > 0）。
    2. **半同步（semi-sync）**：主库事务在**至少一个从库确认收到 binlog（写入 relay log）**后才返回客户端成功——把丢数据窗口缩到"从库 ACK 前宕机"极小概率。
    3. **两种模式**：AFTER_SYNC（5.7.2+ 默认推荐，binlog 先 sync 再等待 ACK，GTID 一致性更好）、AFTER_COMMIT。
    4. **代价与退化**：每个事务多一次网络 RTT，写入延迟上升；**超时退化**（rpl_semi_sync_master_timeout）——从库超时未 ACK 自动降级回异步，避免可用性被拖死（但此时又可能丢数据，要监控降级告警）。
    5. **进阶**：无损复制 + MGR（组复制，多数派 Paxos）更强；金融场景半同步是标配，超时调优与降级告警是运维重点。
    6. **加分点**：能画出异步/半同步/MGR 三档在 RPO/RTO 上的取舍。

- title: "MySQL 的备份与恢复方案有哪些？mysqldump 和 XtraBackup 怎么选？"
  category: MYSQL
  difficulty: 2
  tags: ["备份恢复", "运维"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **逻辑备份 mysqldump**：导出 SQL 语句。可读、跨版本、可选择性导表；但大库慢、恢复逐条执行耗时长。要点：`--single-transaction`（InnoDB 一致性快照不锁表）、`--master-data/--source-data` 记录 binlog 位点、配合 `--set-gtid-purged`。
    2. **物理备份 XtraBackup（Percona）**：直接拷贝数据文件，备份时不阻塞读写（备份 redo 应用），恢复 = 拷回 + apply log——**大库（TB 级）唯一现实选择**；全量 + 增量（基于 LSN）组合。
    3. **克隆插件（8.0.17+）**：物理克隆，常用于 MGR 加节点。
    4. **binlog 补位**：全量备份 + 备份起点之后的 binlog 重放 = 恢复到任意时间点（PITR）；误删数据的紧急恢复就是"全量 + binlog 截取回放"。
    5. **演练是命门**：备份有效性只有靠定期恢复演练验证；备份文件放异机/异地；延迟从库（delayed replica 1 小时）是误操作的最后一道保险。
    6. **加分点**：能讲 XtraBackup 备份期间的一致性原理（拷贝 + redo 追赶）；知道 mydumper/myloader 多线程加速。

- title: "线上慢查询如何做系统化治理？（不只是优化单条 SQL）"
  category: MYSQL
  difficulty: 3
  tags: ["慢查询", "SQL治理", "运维"]
  position_tags: ["dba", "backend", "java"]
  answer: |
    1. **发现问题**：开启 `slow_query_log`（long_query_time 0.5~1s + log_queries_not_using_indexes）或用 performance_schema.events_statements_summary 汇总；云库用自带洞察。pt-query-digest / PMM 分析日志，**按总耗时排序**（频率×耗时）而不是单次最长。
    2. **归因分类**：缺索引（EXPLAIN type=ALL）、索引选择性差、深分页、大事务、锁等待（innodb_lock_waits）、隐式转换、返回列过多、扫描行数虚高（统计信息不准 → ANALYZE TABLE）。
    3. **分级处置**：SQL 改写（覆盖索引/延迟关联/游标分页）→ 加索引（大表用 gh-ost）→ 架构层（读写分离、缓存挡读、归档历史数据、分库分表）。
    4. **长效机制**：上线前 SQL 审核（集成 Yearning/Archery 或自研规则：强制 EXPLAIN、禁 SELECT *、禁无 LIMIT 查询）；慢查询周报 + TOP N 治理闭环；slow log 接告警（突增 = 索引失效或流量异常）。
    5. **加分点**：强调"治理对象是模式不是单条"——同一 ORM 生成的同模式 SQL 一起治；提回收站思路：先限流降级止血再优化。

- title: "什么是索引下推（ICP，Index Condition Pushdown）？"
  category: MYSQL
  difficulty: 3
  tags: ["索引", "ICP"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **背景**：联合索引 (name, age)，查询 `WHERE name LIKE '张%' AND age=10`——like 前缀能走索引，但 age 无法继续用（范围/模糊后中断）。
    2. **无 ICP（5.6 前）**：存储引擎把所有 `name LIKE '张%'` 的索引记录**全部回表**取整行，再由 Server 层过滤 age——回表了很多"注定被过滤"的行。
    3. **有 ICP**：把 age 条件**下推到存储引擎**，在索引里就用 age 过滤（二级索引里有 age 列），只对通过过滤的行回表——回表次数大幅减少。EXPLAIN 的 Extra 显示 `Using index condition`。
    4. **适用**：5.6+，InnoDB/MyISAM 的二级索引 + 范围/模糊条件后的其余列过滤。
    5. **加分点**：能联系最左前缀讲"断点后的列从'不能定位'变成'可以在索引内过滤'"；提索引设计时把等值列放前、范围列放后能最大化利用。

- title: "什么是插入意向锁（Insert Intention Lock）？"
  category: MYSQL
  difficulty: 3
  tags: ["锁", "间隙锁"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **定义**：插入意向锁是**插入前**在目标间隙上加的一种特殊意向锁——表示"我想往这个间隙里插入一行"。多个事务插入**同一间隙的不同位置不冲突**，只与**间隙锁（Gap Lock）冲突**。
    2. **工作过程**：RR 级别下 INSERT 前先拿插入意向锁；若该间隙被别的事务加了间隙锁/临键锁，插入阻塞并等待（show engine innodb status 可见 lock_mode X locks gap before rec insert intention waiting）。
    3. **设计意义**：它是"间隙锁与并发插入"之间的调和——没有它，任何事务的插入都要等所有间隙锁释放；有了它，同间隙并发插入互不阻塞，只有真正持锁范围冲突才等待。
    4. **实践关联**：高并发插入表上如果有长事务做范围当前读（FOR UPDATE），会大面积阻塞插入——这就是"热点行/区间插入被间隙锁卡住"的常见线上问题；对策：降 RC（无间隙锁）、缩短事务、避免在热点范围加 FOR UPDATE。
    5. **加分点**：能区分插入意向锁与" intention lock（表级 IX）"完全不是一回事，名字易混。

- title: "数据库连接池的原理？为什么需要？关键参数怎么设？"
  category: MYSQL
  difficulty: 2
  tags: ["连接池", "HikariCP", "性能"]
  position_tags: ["java", "backend", "python"]
  answer: |
    1. **为什么需要**：建立 MySQL 连接 = TCP 三次握手 + TLS + 鉴权 + 会话初始化，几十毫秒级；高频短连接打不满且浪费；连接池**复用长连接**，把建连成本摊销掉。
    2. **核心机制**：初始化预热若干连接；业务借连接（maxWait 等待超时）→ 归还；空闲检测（keepalive 心跳防 8 小时 wait_timeout 断连）；泄漏检测（借了不还的连接报警）。
    3. **关键参数**（HikariCP 视角）：
       - **maximumPoolSize**：不是越大越好！连接数上限受 `max_connections` 与内存约束，CPU 密集场景连接数 ≈ 核数 ×2 就够，IO 密集按公式 `核数 × (1 + 等待/计算)`；连接过多反而上下文切换加剧；
       - minimumIdle、maxLifetime（略小于 MySQL wait_timeout）、connectionTimeout、leakDetectionThreshold。
    4. **实践坑**：执行流式查询/游标的连接必须独占归还前禁用自动回收；事务内连接绑定事务；连接池打满通常是慢 SQL 或泄漏，加连接数只是掩盖。
    5. **加分点**：HikariCP 快的原因（字节码级优化、ConcurrentBag 无锁设计）；MySQL 服务端 `max_connections` 与应用侧池总量的乘积关系（多实例部署时算总账）。

- title: "Redis 字典的渐进式 rehash 是怎么做的？为什么要渐进？"
  category: REDIS
  difficulty: 3
  tags: ["字典", "rehash", "数据结构"]
  position_tags: ["dba", "backend", "java"]
  answer: |
    1. **背景**：Redis 的 dict 有两张哈希表 ht[0]（主表）和 ht[1]（仅在 rehash 期间使用）。负载因子超阈值（扩容 ≥1 且无 BGSAVE 时 / ≥5 有子进程时；缩容 <0.1）触发 rehash。
    2. **渐进过程**：
       - rehash 开始：给 ht[1] 分配新表，置 rehashidx=0，此后**每次增删改查顺带把 ht[0] 中 rehashidx 桶上的链表整体迁移到 ht[1]**，rehashidx++；另有机会时后台定时任务每次迁移 100 桶；
       - 迁移期间**读查两张表**（先 0 后 1），**新增只写 ht[1]**，保证 ht[0] 只减不增；
       - 全部迁完：释放 ht[0]，ht[1] 变 ht[0]，rehashidx=-1。
    3. **为什么渐进**：Redis 单线程，千万级 key 一次性 rehash 会长时间阻塞服务（卡顿数秒）——把 O(n) 摊到每次操作里，用小的常数开销换平滑。
    4. **关联考点**：扩容缩容时机与 bgrewriteaof/bgsave 的关系（有子进程时提高阈值避免 COW 内存翻倍）；大 key 迁移同样卡顿——这也是 cluster 槽迁移要分批的原因。
    5. **加分点**：能说清"rehash 期间 GET 需要查两次表"的性能影响，以及 redis-benchmark 里 rehash 期间的毛刺现象。

- title: "SDS（简单动态字符串）相比 C 字符串有什么优势？"
  category: REDIS
  difficulty: 2
  tags: ["SDS", "数据结构"]
  position_tags: ["dba", "backend", "cpp", "golang"]
  answer: |
    1. **C 字符串的问题**：以 `\0` 结尾获取长度 O(n)（strlen 遍历）、不能含二进制数据（\0 截断）、拼接必须手动 realloc 易缓冲区溢出。
    2. **SDS 结构**：`len`（已用长度）+ `alloc`（分配总长）+ `flags`（类型标记）+ `buf[]`。
       - **O(1) 取长度**：直接读 len；
       - **二进制安全**：按 len 处理，内容可含 \0（能存图片序列化数据）；
       - **杜绝溢出**：拼接前检查 alloc-len，不足先扩容；
       - **空间预分配**：扩容时多分配一倍（<1MB）或多 1MB（>1MB），减少连续拼接的 realloc 次数；
       - **惰性释放**：缩短不立即归还，留着重用（可手动释放）。
    3. **redisObject 编码联动**：短字符串用 embstr（SDS 头与 redisObject 一次分配连续内存，缓存友好），>44 字节转 raw。
    4. **加分点**：flags 支持 sdshdr5/8/16/32/64 多种头规格按长度选型省内存；"二进制安全"是 Redis 能存序列化对象、图片缩略图的基础。

- title: "RDB 持久化 fork 子进程时，写时复制（COW）是怎么工作的？有什么坑？"
  category: REDIS
  difficulty: 3
  tags: ["RDB", "fork", "COW", "持久化"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **流程**：bgsave → 主进程 fork 子进程 → **父子共享同一份物理内存页**（页表复制但指向相同物理页）→ 子进程遍历内存生成 RDB 快照写盘 → 完成后替换旧 RDB。
    2. **COW 生效**：fork 后主进程继续处理写请求，**被修改的页**先复制一份新页，主进程在新页上改，子进程仍读旧页——保证子进程看到的是 fork 瞬间的一致快照。
    3. **坑一：内存翻倍**：fork 后若写入量大（比如缓存大批量刷新），被改的页都要复制——**最坏情况内存占用近乎翻倍**，触发 OOM。对策：错峰执行、控制单机数据量、提高写入可控性。
    4. **坑二：fork 本身耗时**：fork 复制页表（不是内存），页表越大越慢——10GB 数据 fork 可能卡顿几十至上百毫秒，主进程阻塞。大实例用主从+从库做持久化规避。
    5. **AOF 重写同样用 fork+COW**：重写期间新写命令进 aof_rewrite_buf，重写完成后追加。
    6. **加分点**：`info stats` 的 latest_fork_usec 监控 fork 耗时；THP（透明大页）开着会放大 COW 复制粒度（2MB 一页）导致内存暴涨——**生产必须关 THP**。

- title: "AOF 文件损坏了怎么办？AOF 的写入和修复机制讲一下？"
  category: REDIS
  difficulty: 3
  tags: ["AOF", "持久化", "修复"]
  position_tags: ["dba"]
  answer: |
    1. **损坏来源**：磁盘写一半宕机（命令不完整）、磁盘满写失败、文件被截断。
    2. **启动检查**：Redis 启动加载 AOF 时校验完整性——发现尾部截断默认**拒绝启动**并提示修复；`aof-load-truncated yes` 可容忍尾部截断（丢弃不完整命令，数据可能少最后一条）。
    3. **修复工具**：`redis-check-aof --fix appendonly.aof`——截掉末尾不完整的命令（直到最后一个合法命令），不可逆操作前先备份文件。AOF 是文本协议（RESP），肉眼可读可修。
    4. **Multi-Part AOF（7.0）**：AOF 拆为 base（重写产物）+ incr（增量）+ manifest 清单文件——重写不再需要 aof_rewrite_buf 双写，修复工具可一次检查 base+incr 集合（`redis-check-aof --fix` 支持 multi-part）。
    5. **预防**：appendfsync everysec + 磁盘余量监控 + 备份 RDB/AOF 双轨；重要数据 Redis 只是缓存层的话，修复丢尾部可接受，若做存储则必须双持久化 + 异地备份。
    6. **加分点**：能讲 AOF 重写期间"旧 AOF 继续追加 + 新文件完成后原子替换"的可用性设计（7.0 前 aof_rewrite_buf 溢出会阻塞）。

- title: "Redis 的慢查询日志怎么用？能查到什么？"
  category: REDIS
  difficulty: 1
  tags: ["慢查询", "运维"]
  position_tags: ["dba", "backend", "java"]
  answer: |
    1. **两个参数**：`slowlog-log-slower-than`（阈值微秒，默认 10000=10ms，设 0 记录所有、-1 关闭）、`slowlog-max-len`（内存环形队列长度，默认 128，生产建议 256~1024）。
    2. **记录内容**：每条含 ID、发生时间戳、**耗时微秒、完整命令及参数**（SLOWLOG GET 查看先进先出保最近）——注意记录的是**命令本身**不含网络/排队时间。
    3. **典型发现**：KEYS * / SMEMBERS 大集合 / HGETALL 大 hash / SORT / 大 key 的 DEL——大部分慢查询根源是**大 key 和错误命令**；配合 `redis-cli --bigkeys`、`--hotkeys` 定位。
    4. **运维方式**：SLOWLOG LEN 看堆积、SLOWLOG RESET 清空；生产上定时采集慢日志入 ES/监控做趋势——慢查询突增告警优先排查新上线代码和 bigkey。
    5. **加分点**：知道客户端还另有耗时统计（info commandstats 的 usec_per_call）；单线程模型下一个 10ms 命令 = 全部请求排队 10ms，所以阈值要远小于业务 RT 预算。

- title: "用 Redis 做限流有哪些方案？各自优缺点？"
  category: REDIS
  difficulty: 2
  tags: ["限流", "高并发"]
  position_tags: ["backend", "java", "golang", "ai_app"]
  answer: |
    1. **固定窗口计数**：`INCR key` + 首次 `EXPIRE`（用 Lua 保证原子）超过阈值拒绝。实现最简单；**窗口边界突刺**（两个窗口交界瞬间可能放行 2 倍流量）。
    2. **滑动窗口（ZSet）**：ZADD 记录每次请求时间戳，ZREMRANGEBYSCORE 清窗口外，ZCARD 计数判断。平滑无突刺；每次请求多几次命令、内存随请求量增长（高 QPS 下用估算/采样）。
    3. **漏桶**：恒定速率放行、超速排队或拒绝。用 Redis + Lua 维护（water, last_ts）模拟——**整形平滑**但无法应对突发合法流量。
    4. **令牌桶**：Lua 维护（tokens, last_ts），按速率补充令牌，请求扣令牌。**允许突发 + 平均速率受控**，是网关（如 Spring Cloud Gateway）默认算法。
    5. **工程要点**：所有方案必须 **Lua 原子**（读-判-写三步在单线程外被穿插就超卖）；集群限流用 Redis 集中式计数有网络开销，本地限流 + Redis 全局限流双层；分布式场景时钟统一不重要（都用 Redis 服务器时间或传入）。
    6. **加分点**：滑动窗口小时间片优化（切片桶，如按 1s 分片计数）；Redis-Cell 模块自带令牌桶；网关层与应用层双层限流的分工。

- title: "如何用 Redis 实现分布式 Session？"
  category: REDIS
  difficulty: 2
  tags: ["Session", "分布式", "认证"]
  position_tags: ["backend", "java", "fullstack"]
  answer: |
    1. **问题**：多实例部署后，Session 存在本地内存则请求打到别的节点就"未登录"。方案：粘性会话（ip_hash，节点挂会话丢）、Session 复制（广播浪费）、**集中存储（Redis）——标准解**。
    2. **实现要点**：
       - 登录时 `SET session:{sid} = 用户信息(JSON) EX ttl`（30min 滑动过期：每次访问 EXPIRE 续期）；
       - Cookie 只放 sid（HttpOnly + Secure + SameSite）；所有实例从 Redis 读 Session——无状态水平扩展；
       - 序列化用 JSON（跨语言）或框架自带（Spring Session Data Redis 一行接入，透明替换 HttpSession）。
    3. **注意**：Session 数据别放太大（几 KB 内），大对象存 id 关联；Redis 挂了=全员掉线，所以 Redis 要高可用（哨兵/集群）+ 本地缓存兜底可选；敏感信息不进 Session 明文（Redis 无加密）。
    4. **演进关系**：分布式 Session 是"有状态集中化"；JWT 是"无状态去中心化"——两者选型见 JWT 题；大公司常混合：短期 access token 无状态 + 长期 refresh 可吊销（存 Redis，本质还是分布式 Session 思想）。
    5. **加分点**：能讲 Spring Session 的实现原理（Filter 包装 request 重写 getSession）；踢人下线 = DEL session key，这是相对 JWT 的核心优势。

- title: "布隆过滤器的原理？误判率怎么控制？有哪些变体和实践？"
  category: REDIS
  difficulty: 2
  tags: ["布隆过滤器", "缓存穿透"]
  position_tags: ["backend", "ai_app", "java"]
  answer: |
    1. **原理**：位数组 + k 个独立哈希函数。添加元素：k 个位置置 1。查询：k 个位置全 1 → **可能存在**（哈希冲突导致误判）；任一为 0 → **一定不存在**（无漏判）。
    2. **关键性质**：只能加不能删（删 1 会误伤其他元素）；误判率由位数组大小 m、元素数 n、哈希数 k 决定——最优 k ≈ (m/n)ln2；标准参数下 1% 误判约需每元素 9.6 bit。**务必预估容量**，装超了误判率飙升。
    3. **实践**：Redis 4.0+ 用 **RedisBloom 模块**（BF.ADD/BF.EXISTS，支持自动扩容）；Java 侧 Guava BloomFilter（单机）。
    4. **应用**：**缓存穿透前置拦截**（不存在的 key 直接挡）、爬虫 URL 去重、推荐已曝光去重、RAG 文档入库判重。
    5. **变体**：
       - **Counting Bloom Filter**：位数组改计数器，支持删除；
       - **Cuckoo Filter（布谷鸟）**：支持删除、空间效率相近、查询更快（RedisBloom 亦提供）；
       - 分层布隆（冷热数据多层）。
    6. **加分点**：能算误判率公式并说明"先预估容量再创建"；提 redis-py 的 BF 命令需要 RedisBloom 模块，纯 Redis 无法原生实现（位图 + 多哈希可模拟但删除仍不行）。

- title: "Redis 7 有哪些重要新特性？"
  category: REDIS
  difficulty: 2
  tags: ["Redis7", "新特性"]
  position_tags: ["dba", "backend"]
  answer: |
    1. **Multi-Part AOF**：AOF 拆成 base + incr + manifest——重写不再需要 aof_rewrite_buf 双写缓冲（此前重写期间写入压力大时会阻塞），修复工具也按集合工作。
    2. **Function**：服务端持久化的函数库（替代 eval 临时脚本）——Lua 脚本可随主从复制持久化，避免"脚本只在客户端代码里、换客户端就丢"的问题。
    3. **sharded Pub/Sub**：Pub/Sub 按 slot 分片，订阅者只连负责对应槽的节点——解决 cluster 模式下普通 Pub/Sub 广播全集群的放大问题。
    4. **AOF 时间戳注释**（按时间点恢复更方便）、`listpack` 全面替代 ziplist（修复级联更新 O(n²) 问题，6.2 逐步引入 7 全面化）。
    5. **命令级变化**：SINTERCARD 等带 limit 参数命令、CONFIG REWRITE 改进、ACL 增强。
    6. **加分点**：说得出"升级 7 的动机通常是 Multi-Part AOF（消除重写毛刺）或 sharded Pub/Sub"；提 listpack 替代 ziplist 是底层存储的结构性优化。

- title: "Redis 的事件模型是什么？epoll 在其中扮演什么角色？"
  category: REDIS
  difficulty: 3
  tags: ["事件模型", "epoll", "网络IO"]
  position_tags: ["dba", "backend", "cpp"]
  answer: |
    1. **Reactor 模式**：Redis 单线程跑事件循环——**I/O 事件**（文件事件：socket 可读/可写）与**时间事件**（serverCron 等定时任务）统一在 aeMain 循环处理。
    2. **多路复用层**：ae.c 封装了 select/poll/epoll/kqueue 四种实现，**Linux 上默认 epoll**——`aeApiPoll` 等待就绪 fd，把就绪事件放入队列，逐个分发给对应处理器（accept→createClient、read→解析命令→执行→写回）。
    3. **为什么单线程够快**：epoll 事件驱动 + 非阻塞 IO，线程永远在"处理命令"而不是"等 IO"；命令执行本身是内存操作（微秒级）；配合 client 的 querybuf/output buffer 缓冲。
    4. **6.0 的分工**：网络读写与协议解析可交给 IO 线程池（io-threads），但**命令执行仍单线程**——保住原子性语义，只并行化最耗时的 syscall 部分。
    5. **阻塞点清单**（面试常追问"单线程还会卡吗"）：大 key 的同步删除（用 UNLINK）、KEYS/全集合读、fork、AOF fsync 磁盘慢、swap——epoll 解决网络等待，解决不了慢命令。
    6. **加分点**：能讲 level-triggered vs edge-triggered 的选择；"时间事件在文件事件处理后按调度阈值执行"的循环细节。

- title: "Redis 主从复制有哪些调优参数？repl-backlog 怎么设置？"
  category: REDIS
  difficulty: 3
  tags: ["主从复制", "调优", "运维"]
  position_tags: ["dba"]
  answer: |
    1. **核心参数**：
       - **repl-backlog-size**（默认 1MB）：环形积压缓冲区，决定主从闪断后能否增量同步——**按"断线时长 × 写入速率"估**，如高峰写入 20MB/s、容忍 60s 断线 → ≥1.2GB；太小则触发全量同步（RDB 重建，代价大）；
       - repl-backlog-ttl：无从库后 backlog 保留时间；
       - client-output-buffer-limit replica 256mb 64mb 60：从库拉取期间的输出缓冲上限，防主库内存被慢从库拖爆；
       - min-replicas-to-write / min-replicas-max-lag：写入需至少 N 个健康从库——防止脑裂期间数据孤写。
    2. **全量同步的代价控制**：repl-diskless-sync（无盘直接流式传输，磁盘慢/大实例开）、repl-timeout（大数据量传输时调大防误判超时反复全量）。
    3. **常见线上故障**：网络抖动 → backlog 溢出 → 全量同步风暴 → 主库 COW 内存暴涨/OOM。预案：加大 backlog、错峰重启从库、主库内存预留 50%。
    4. **监控**：master_repl_offset 与 slave_repl_offset 差值（复制延迟字节）、connected_slaves、sync_full（全量次数计数，非 0 增长要查）。
    5. **加分点**：能算 backlog 公式并解释"全量同步风暴"的雪崩链路；提 7.0 的部分重同步 PING/PSYNC 细节不必展开但知道滚回退机制。

- title: "String 的 intern() 方法是什么？new String(\"a\") 创建了几个对象？"
  category: JAVA
  difficulty: 2
  tags: ["String", "常量池"]
  position_tags: ["java"]
  answer: |
    1. **常量池**：字符串字面量在编译期进入 class 常量池，运行期常量池中 String 实例在堆上被 intern 去重共享（JDK7 起常量池在堆内，intern 可回收）。`s.intern()` 返回常量池中的等值引用；池中没有则**将当前引用放入池**（JDK7+ 不再复制对象）。
    2. **经典题 `new String("a")`**："a" 字面量在常量池已创建一个对象，new 又在堆上创建一个——**1 或 2 个**（常量池已有则只 new 一个）。`s3 = s1 + s2` 编译期不确定 → new StringBuilder 拼接产生新堆对象，不在池；`final` 常量折叠则进池。
    3. **intern 的用途**：大量重复长字符串（如城市名、枚举名解析结果）intern 后共享一份，省内存；JDK6 常量池在永久代慎用（OOM）。
    4. **关联坑**：`==` 比较 String 比较引用；equals 比较内容；switch 内部用 hashCode+equals；字符串拼接循环里用 StringBuilder。
    5. **加分点**：JDK7 的 intern 行为变化导致的经典面试题输出差异；-XX:StringTableSize 调优（大量 intern 时桶数不足退化链表）。

- title: "Integer 缓存池（-128~127）是什么？== 比较包装类有哪些坑？"
  category: JAVA
  difficulty: 1
  tags: ["包装类", "缓存"]
  position_tags: ["java"]
  answer: |
    1. **缓存池**：`Integer.valueOf(-128~127)` 返回缓存的同一对象（IntegerCache，上限可用 -XX:AutoBoxCacheMax 调）。所以 `Integer a=100, b=100; a==b` 为 true，`a=200, b=200` 为 false（各 new 对象）。
    2. **规则**：包装类 `==` 只在两边都是基本类型或都确定是同一缓存实例时才安全；**与基本类型比较会自动拆箱**，NPE 风险（Integer null 拆箱炸）。
    3. **实践铁律**：包装类之间一律 `equals` 或 Objects.equals；拆箱运算前判空；`Long == Long` 坑是线上 bug 常客（缓存范围内的巧合相等掩盖问题，范围外爆雷）。
    4. **衍生**：拆装箱在循环/集合里的性能损耗；三目运算符两分支类型不一致时的自动拆箱 NPE（经典：`flag ? intVal : integerObj`）。
    5. **加分点**：知道 Float/Double 无缓存池、Boolean 缓存 true/false、Character 缓存 0~127；阿里巴巴规约明确"所有包装类比较用 equals"。

- title: "什么是泛型擦除？带来哪些限制？通配符 ? extends / ? super 怎么用？"
  category: JAVA
  difficulty: 2
  tags: ["泛型", "类型擦除"]
  position_tags: ["java"]
  answer: |
    1. **擦除机制**：泛型只存在于编译期，运行时 `List<String>` 和 `List<Integer>` 都是 `List`（字节码 Signature 属性仅保留给反射用）。T 擦成 Object 或上界。
    2. **带来的限制**：不能 `new T()` / `T.class` / `instanceof T`；不能泛型数组 `new T[]`；静态成员不能用类的泛型参数；重载 `(List<String>)` 与 `(List<Integer>)` 冲突；基本类型不能作泛型参数（要装箱）。
    3. **绕过手段**：传 `Class<T>` 用反射 new；超类型通配符；运行时靠签名桥接（桥方法）。
    4. **通配符（PECS 原则）**：`? extends T` 上界（生产者，只读出为 T）；`? super T` 下界（消费者，只写入 T）——**Producer Extends, Consumer Super**。`List<? extends Number>` 不可 add（不知道确切类型），`List<? super Integer>` 可 add Integer。
    5. **加分点**：桥方法的生成原因（协变返回值维持多态）；Gson/Fastjson 用 TypeToken 保存泛型实参绕过擦除的原理（匿名子类把泛型写进字节码 Signature，反射可读）。

- title: "Java 反射的原理？为什么慢？怎么优化？"
  category: JAVA
  difficulty: 2
  tags: ["反射", "性能"]
  position_tags: ["java"]
  answer: |
    1. **原理**：Class 对象是方法区的运行时元数据入口（JDK8 前 PermGen/8+ Metaspace），`getMethod` 等在元数据中查找并封装 Method 对象；调用时经 `MethodAccessor`——native 版直接进 JVM，或生成字节码的 GeneratedAccessor（15 次阈值切换 inflation，可 -Dsun.reflect.inflationThreshold 调）。
    2. **为什么慢**：查方法要遍历/安全检查（AccessControl）、参数装箱与 Object[] 装箱拆箱、无法内联优化、JIT 对反射调用优化有限。
    3. **优化**：**缓存 Method/Field 对象**（第一次查到存起来，这是最大的收益）；setAccessible(true) 跳过检查；高频热点用 **MethodHandle / LambdaMetafactory**（生成直接调用的实现，接近原生速度）或代码生成（ByteBuddy/ASM）；JDK17+ 模块封装限制反射需 --add-opens（框架普遍受影响）。
    4. **应用与代价**：Spring/SPI/ORM 全靠反射实现"开箱即用"；但热路径（每请求百万次）反射是瓶颈——框架最终都会演进到"启动期反射 + 运行期字节码"。
    5. **加分点**：知道 AOT/Native Image 对反射的限制（需配置文件声明）；Method.invoke 的 synchronized 演进（JDK18+ 无锁化）。

- title: "JDK 动态代理和 CGLIB 的区别？Spring AOP 用的哪个？"
  category: JAVA
  difficulty: 2
  tags: ["动态代理", "CGLIB", "AOP"]
  position_tags: ["java"]
  answer: |
    1. **JDK 动态代理**：`Proxy.newProxyInstance` 运行时生成实现**接口**的代理类（$Proxy0，字节码），方法调用转发给 InvocationHandler——**必须有接口**。
    2. **CGLIB**：ASM 字节码库生成**目标类的子类**，方法拦截进 MethodInterceptor，FinalInterceptor 调 super——**类和 final 方法不可代理**；构造两次（目标+子类）。
    3. **Spring AOP 默认策略**：有接口默认 JDK 代理；可 `proxyTargetClass=true` 强制 CGLIB（Spring Boot 2.x 起 **Aop 默认 CGLIB**，spring.aop.proxy-target-class 默认 true）——统一行为，避免注入实现类时报CastException。
    4. **性能**：JDK8 后两者差距可忽略；代理对象多时 CGLIB 生成类多占 Metaspace（注意元空间泄漏：类加载器不卸载）。
    5. **加分点**：能讲 AspectJ 编译期织入与 Spring AOP 运行时代理的本质区别（Spring AOP 只拦截 Bean 方法调用，同类内部调用不走代理）；JDK17+ CGLIB 反射兼容性问题催生 Spring 6 自研代理。

- title: "什么是 SPI？为什么需要打破双亲委派加载它？"
  category: JAVA
  difficulty: 3
  tags: ["SPI", "双亲委派", "类加载"]
  position_tags: ["java"]
  answer: |
    1. **SPI（Service Provider Interface）**：JDK 内置的服务发现——接口由核心库定义（如 java.sql.Driver），实现在第三方 jar 的 `META-INF/services/接口全名` 文件里声明，`ServiceLoader.load` 运行时加载全部实现——"接口在上、实现在下"的插件化标准（JDBC 驱动、Spring 的 spring.factories 同思想）。
    2. **与双亲委派的冲突**：核心接口由 Bootstrap 加载，第三方实现类在 classpath（AppClassLoader）——**父加载器看不见子加载器的类**。JDK 的解法是**线程上下文类加载器**（TCCL）：ServiceLoader 用当前线程的 TCCL（默认 AppClassLoader）去加载实现——父委派模型的"合法后门"。
    3. **打破双亲委派的其他场景**：Tomcat 的 WebappClassLoader（每个 webapp 独立加载器隔离，先自己加载实现隔离部署）；OSGi/模块化（Jigsaw）；热部署框架。
    4. **实践坑**：ServiceLoader 是懒加载且无法按名选择（全量实例化）；多实现冲突排查 META-INF/services 重复文件合并问题（fat jar 打包时 Maven Shade 需 ServicesResourceTransformer 合并）。
    5. **加分点**：讲 JDBC DriverManager 里 TCCL 的实际应用；Spring Boot 2.7 起从 spring.factories 迁移到 imports 文件的动机（同 SPI 思想的自研实现）。

- title: "BIO、NIO、AIO 的区别？"
  category: JAVA
  difficulty: 2
  tags: ["IO模型", "NIO"]
  position_tags: ["java", "backend"]
  answer: |
    1. **BIO（同步阻塞）**：一连接一线程，read/write 阻塞直到完成——简单但线程数随连接数线性增长，万级连接线程爆炸。适合连接少且固定的场景。
    2. **NIO（同步非阻塞，JDK1.4）**：Channel + Buffer + **Selector（多路复用）**——一个线程用 selector 监听大量 channel 的就绪事件，就绪才读写；非阻塞指"没数据立即返回不挂起线程"。Netty 基于 NIO 封装（Reactor 主从多线程模型：acceptor + IO worker + business 线程池）。适合高并发长连接。
    3. **AIO（异步非阻塞，JDK1.7）**：发起 IO 后立即返回，完成后**回调**通知（Proactor）。理论最优，但 Linux 底层仍是 epoll 模拟、回调编程复杂，Netty 曾移除 AIO 支持——实战以 NIO 为王。
    4. **对比记忆**：BIO"等人上菜"，NIO"服务员叫号"，AIO"做好送上门"。本质是同步/异步 × 阻塞/非阻塞四象限。
    5. **加分点**：NIO 零拷贝（FileChannel.transferTo → sendfile）；epoll 水平触发下 Netty 的处理细节；多路复用与 Redis 的 epoll 模型同源——能跨领域联系是大加分。

- title: "Java 内部类有哪些？匿名内部类为什么只能捕获 effectively final 变量？"
  category: JAVA
  difficulty: 2
  tags: ["内部类", "语法"]
  position_tags: ["java"]
  answer: |
    1. **四种内部类**：
       - **成员内部类**：依附外部实例，持有 Outer.this，可访问外部所有成员；
       - **静态内部类**：不依赖外部实例（HashMap.Node 风格），不能访问外部非静态成员——**工具类首选**；
       - **局部内部类**：方法/作用域内定义；
       - **匿名内部类**：无名字一次性实现（回调、Comparator），JDK8 后多被 Lambda 替代。
    2. **effectively final 的原因**：内部类/lambda 捕获的是**局部变量的副本**（编译期复制到合成字段 this$0/val$x）。若允许修改，副本与栈上真值会不一致——干脆要求不修改即 effectively final（JDK8 放宽到"不再赋值即可"）。
    3. **实践**：静态内部类实现单例（利用类加载机制线程安全）；匿名类与 lambda 的 this 语义差异（匿名类 this 指内部类实例，lambda this 指外围）；非静态内部类隐式持 Outer 引用导致 GC 泄漏（Handler 内存泄漏经典）。
    4. **加分点**：编译器如何用 synthetic 字段/方法访问外部私有成员（access$xxx）；lambda 与匿名类的字节码差异（invokedynamic vs newclass）。

- title: "Comparable 和 Comparator 的区别？"
  category: JAVA
  difficulty: 1
  tags: ["排序", "接口"]
  position_tags: ["java"]
  answer: |
    1. **Comparable（内部比较器）**：类实现 `compareTo(T o)` 定义"自然顺序"——单一、固化（String 按字典序、Integer 按数值）。Collections.sort(list) 直接用。
    2. **Comparator（外部比较器）**：独立对象 `compare(a, b)` 定义比较规则——可定义多套、临时定制、不改源码（不可修改的第三方类只能用它）。sort(list, comparator)。
    3. **工程实践**：JDK8 的 Comparator 链式 API 极大提升可读性：`Comparator.comparing(User::getAge).thenComparing(User::getName).reversed()`；nullsFirst/nullsLast 处理 null 排序坑。
    4. **一致性契约**：compare/compareTo 必须与 equals 一致才安全（TreeSet/TreeMap 的"比较相等即同一元素"会导致不一致行为）；禁止用减法比较 int（溢出！用 Integer.compare）。
    5. **加分点**：TreeMap 用 Comparator 时 get 也要走比较逻辑（key 的比较规则变了就 get 不到）；Objects.compare 工具方法。

- title: "BeanUtils/Hibernate 拷贝对象有哪些坑？深浅拷贝在工程里怎么落地？"
  category: JAVA
  difficulty: 2
  tags: ["对象拷贝", "性能"]
  position_tags: ["java"]
  answer: |
    1. **Spring BeanUtils.copyProperties**：反射逐属性拷贝——**浅拷贝**（嵌套对象共享引用）、性能一般、**字段名不同不拷**（静默丢失）、类型不匹配忽略、重载歧义（src/dst 参数顺序在 Spring 与 Apache 相反！经典事故源）。
    2. **Apache BeanUtils**：性能更差（每属性做大量检查），阿里规约禁用。
    3. **推荐方案**：**MapStruct**——编译期生成映射代码（零反射、类型安全、编译期发现字段不匹配、支持自定义转换）；手写 copy 构造器最清晰。
    4. **浅拷贝的隐蔽 bug**：拷贝 DTO 后修改内嵌 List/Map，原对象跟着变；List 拷贝只复制引用集合。
    5. **实践**：DTO/VO 转换层统一用 MapStruct（@Mapper 注解生成 Impl）；拷贝大对象树要自定义递归或序列化法；转换逻辑集中管理防散落。
    6. **加分点**：MapStruct 与 Lombok 共存的注解处理器顺序坑（lombok-mapstruct-binding）；拷贝性能实测数据量级（反射拷贝 vs MapStruct 差一个数量级）。

- title: "CountDownLatch、CyclicBarrier、Semaphore 的区别与使用场景？"
  category: CONCURRENT
  difficulty: 2
  tags: ["JUC", "同步工具"]
  position_tags: ["java"]
  answer: |
    1. **CountDownLatch（倒数门闩）**：`countDown()` 减计数，`await()` 等到 0。**一次性**，不可重置。场景：主线程等 N 个子任务全部完成再汇总；多条件并行预加载。
    2. **CyclicBarrier（循环栅栏）**：N 个线程互相等，都到齐再一起走；**可重用**（Cyclic），支持回调动作（栅栏打开时先执行）。场景：分片计算各片算完再合并、多轮压测同步起跑。对比：latch 是"一个等多个"，barrier 是"大家互相等"。
    3. **Semaphore（信号量）**：permits 个许可，acquire/release——**限流/资源池**控制并发数（数据库连接池模拟、接口限流、抢车位）。fair 参数支持公平模式。
    4. **底层都是 AQS**：latch 共享模式、semaphore 共享模式、barrier 组合了 ReentrantLock+Condition（tripped 时 signalAll）。
    5. **加分点**：latch 的 countDown 泄漏（子任务异常没减计数导致永久 await——finally 里 countDown）；barrier 的 BrokenException（有线程超时中断全体复位）；CompletableFuture.allOf 在异步编排中常替代 latch。

- title: "CompletableFuture 怎么做异步编排？有哪些常用 API 和坑？"
  category: CONCURRENT
  difficulty: 3
  tags: ["CompletableFuture", "异步编排"]
  position_tags: ["java", "backend"]
  answer: |
    1. **创建**：`supplyAsync(有返回)/runAsync(无返回)`——**默认用 ForkJoinPool.commonPool()，IO 任务必传自定义线程池**（commonPool 并行度=核数-1，被 IO 阻塞会拖垮全 JVM 异步）。
    2. **编排 API**：
       - 串联：thenApply（转换）/ thenAccept / thenRun / thenCompose（异步串联，避免嵌套）；
       - 并联组合：thenCombine（两结果合并）/ allOf / anyOf；
       - 结果处理：exceptionally / handle（成功失败都走）/ whenComplete；默认在同一线程执行，`xxxAsync` 后缀换池执行。
    3. **超时与容错**：JDK9+ `orTimeout(timeout)` / `completeOnTimeout(defaultValue, timeout)`——异步链必备；get() 要带超时参数。
    4. **常见坑**：忘记异常处理导致异常被吞（completion 阶段无 observer 时静默）；thenApply 阻塞在 ForkJoinPool 拖垮系统；循环里串行 await 失去并行意义（先收集 future 列表再 join）。
    5. **加分点**：能现场画"并行调三个下游 → allOf 汇聚 → 超时兜底 → 统一异常处理"的编排图；提 JDK21 结构化并发（StructuredTaskScope）是官方演进方向。

- title: "读写锁 ReadWriteLock 和 StampedLock 是什么？乐观读怎么提性能？"
  category: CONCURRENT
  difficulty: 3
  tags: ["读写锁", "StampedLock"]
  position_tags: ["java"]
  answer: |
    1. **ReadWriteLock（ReentrantReadWriteLock）**：读读共享、读写/写写互斥——读多写少场景吞吐大增（缓存元数据、配置表）。注意：**写饥饿**问题（读持续到来写拿不到）——公平模式缓解但吞吐降。
    2. **StampedLock（JDK8）**：
       - **乐观读**：`tryOptimisticRead()` 拿 stamp（不加锁不阻塞），读完后 `validate(stamp)` 校验期间是否有写——失败则升级悲观读锁重读。**读操作完全无阻塞无 CAS 开销**，写少读极多的场景性能质变；
       - 写锁 tryWriteLock；悲观读 readLock；**不可重入**！重入死锁是头号坑；
       - `tryConvertToWriteLock` 读到一半要写时升级，避免释放重抢。
    3. **选型**：普通读多写少→ReentrantReadWriteLock（可重入、支持 Condition）；极致读性能且逻辑简单（一两个 long 字段）→StampedLock（内部还有写偏向的 ReadWriteLockView）；单变量高频读直接用 volatile/原子类。
    4. **加分点**：能讲乐观读为什么快（读用内存屏障 + 版本校验，全程无内核交互）；StampedLock 不支持 Condition 的限制。

- title: "JDK 21 虚拟线程是什么？和平台线程的区别？什么场景用？"
  category: CONCURRENT
  difficulty: 3
  tags: ["虚拟线程", "JDK21"]
  position_tags: ["java", "backend"]
  answer: |
    1. **是什么**：JVM 调度的轻量线程（用户态，几 KB 栈、百万级可建），挂载在少量**平台线程（载体线程 carrier）**上；阻塞时 JVM 把虚拟线程从载体上**卸载（unmount）**，载体去跑别的虚拟线程——"阻塞变便宜了"。
    2. **与平台线程区别**：平台线程 1:1 映射 OS 线程（MB 级栈、几千上限），虚拟线程 M:N 调度（KB 级、百万级）；编程模型回归**同步阻塞写法**（Thread.ofVirtual().start() 或 Executor executor = Executors.newVirtualThreadPerTaskExecutor()），却拥有异步的并发能力——不再需要回调/响应式编排。
    3. **适用**：**IO 密集高并发**（HTTP 服务每请求一线程、爬虫、聚合调用）；**不适用 CPU 密集**（无益）和**池化复用**（设计上就是一次性用完即弃，池化虚拟线程是反模式）。
    4. **关键限制——Pin（钉死）**：`synchronized` 块内阻塞、native 方法阻塞时虚拟线程无法卸载，钉死载体线程——**用 ReentrantLock 替代 synchronized**（JDK24 起已修复大部分）；ThreadLocal 滥用在百万线程下内存爆炸（作用域值 ScopedValue 是演进方向）。
    5. **加分点**：能讲"为什么有了虚拟线程还要响应式框架"的辩论（同步模型 + 虚拟线程 ≈ 更可维护）；排查 pin 的 jcmd Thread.dump_to_file -json。

- title: "常见阻塞队列有哪些？各自特点和选型？"
  category: CONCURRENT
  difficulty: 2
  tags: ["阻塞队列", "线程池"]
  position_tags: ["java"]
  answer: |
    1. **ArrayBlockingQueue**：数组、**有界**、一把锁（生产消费竞争）、构造时可指定公平——容量可控防 OOM，线程池标配。
    2. **LinkedBlockingQueue**：链表、默认**无界**（Integer.MAX_VALUE，务必显式设容量！）、读写两把锁分离吞吐更高。
    3. **SynchronousQueue**：零容量，put 必须等 take 接走——直接交付，newCachedThreadPool 用它（无限线程的根源）。
    4. **PriorityBlockingQueue**：优先级堆、无界——任务分级（核心任务插队）；DelayQueue：到期才能取出——**延迟任务**的 JDK 实现（ScheduledThreadPoolExecutor 内部用它）。
    5. **LinkedTransferQueue**：take 前先尝试直接交给等待消费者（无锁化，性能最强）；适合高吞吐中间者场景。
    6. **选型口诀**：线程池任务队列→有界 Array/LBQ；延迟任务→DelayQueue 或时间轮（Netty HashedWheelTimer/Kafka 时间轮）；高并发交换→Synchronous/Transfer；按优先级调度→Priority。
    7. **加分点**：put/take/offer/poll(超时) 方法在满/空时的行为矩阵；双端 LinkedBlockingDeque 的工作窃取模式。

- title: "JVM 对 synchronized 做了哪些锁优化？（自旋/锁消除/锁粗化等）"
  category: CONCURRENT
  difficulty: 3
  tags: ["锁优化", "JIT"]
  position_tags: ["java"]
  answer: |
    1. **自旋锁与适应性自旋**：轻量级锁竞争失败先自旋几圈（挂起/唤醒要内核切换，自旋更便宜）；**适应性**——上次自旋成功就转更多圈，失败就减少甚至直接挂起（JVM 根据历史动态调）。
    2. **锁消除（Lock Elimination）**：JIT 逃逸分析证明对象不会逃逸出线程，其上的同步直接删掉——如 StringBuffer 局部变量的 append 同步被抹掉（与"栈上分配/标量替换"同一套逃逸分析体系）。
    3. **锁粗化（Lock Coarsening）**：连续多次对同一对象加解锁（循环内 append），JIT 合并成一次大范围加锁，减少开销。
    4. **偏向锁**：无竞争时只记录线程 ID，后续该线程进入零成本——**JDK15 起废弃移除**（撤销成本高、收益在现代应用有限），面试要点：知道历史与移除原因。
    5. **轻量级/重量级**：CAS Mark Word → 膨胀 Monitor（mutex）；升级不可逆。
    6. **加分点**：锁优化的哲学——"大多数锁实际无竞争，把无竞争的锁变免费"；用 JMH + -XX:+PrintCompilation/-UnlockDiagnosticVMOptions 可观测锁消除。

- title: "LongAdder 为什么比 AtomicLong 在高并发下更快？"
  category: CONCURRENT
  difficulty: 3
  tags: ["LongAdder", "原子类", "分段"]
  position_tags: ["java"]
  answer: |
    1. **AtomicLong 的瓶颈**：所有线程 CAS 同一个 value——竞争激烈时大量 CAS 失败自旋重试，CPU 空转（写热点）。
    2. **LongAdder 的分段思想**：base + **Cell[] 数组**（每个 Cell 用 @Contended 填充避免伪共享）。累加时：无竞争直接 CAS base；**竞争则按线程探针哈希选一个 Cell 各自 CAS**——写压力摊到多个槽位。`sum()` = base + Σcells（**无原子快照**，并发下是近似值）。
    3. **取舍**：写（累加）吞吐高一个数量级；读（精确值）弱——**高写入低精确读**场景专用（计数器、指标统计、QPS 统计）。AtomicLong 适合"写少 + 需要精确 CAS 判断"（如 CAS 重试逻辑、生成序号）。
    4. **伪共享（False Sharing）**：同一缓存行放多个变量，一个核写导致其他核缓存行失效——@Contended 注解（需 -XX:-RestrictContended）在字段间填充隔离，这是 Cell[] 设计的关键细节。
    5. **加分点**：同思想族谱——ConcurrentHashMap 的 CounterCell、Stripe64 演进；LongAccumulator（自定义聚合函数版）；对比 Disruptor 的缓存行填充是同一原理。

- title: "synchronized 和 ReentrantLock 到底怎么选？"
  category: CONCURRENT
  difficulty: 2
  tags: ["锁", "选型"]
  position_tags: ["java"]
  answer: |
    1. **功能对比**：
       - synchronized：JVM 内置（monitorenter/ACC_SYNCHRONIZED），自动释放；JDK6 后有偏向/轻量级锁、自旋等优化，性能与 ReentrantLock 接近；
       - ReentrantLock：**可中断获取（lockInterruptibly）、超时获取（tryLock(time)）、公平锁、多 Condition 精准唤醒**——高级能力全在这；
       - 读写场景 ReentrantReadWriteLock / StampedLock；tryLock 非阻塞抢锁只有 lock 有。
    2. **选型原则（官方倾向）**：**默认 synchronized**（简单、不会忘 unlock、JVM 持续优化、dump 可见）；需要上述高级特性、且确实用得上时再上 ReentrantLock，必须 finally unlock。
    3. **实践坑**：ReentrantLock 忘 unlock（finally 缺失）；锁对象错误（String/int 缓存共享对象）；虚拟线程场景 synchronized 钉死问题优先 ReentrantLock（JDK21 限制）。
    4. **加分点**：能讲两者在 AQS/monitor 实现上的差异层次；JDK9 后 synchronized 在低竞争下的 invocation 性能数据反超；lock 生命周期的调试支持差异（jstack 显示 owner/waiters）。

- title: "Spring MVC 处理一个 HTTP 请求的完整流程？"
  category: SPRING
  difficulty: 2
  tags: ["SpringMVC", "请求流程"]
  position_tags: ["java", "fullstack"]
  answer: |
    1. **入口**：DispatcherServlet（前端控制器）收到请求（Servlet 容器 Tomcat 完成 HTTP 解析后交给它）。
    2. **流程链**：
       - 查 **HandlerMapping**（RequestMappingHandlerMapping 按 @RequestMapping 表）→ 返回 HandlerExecutionChain（Handler + 一串 HandlerInterceptor）；
       - **拦截器 preHandle** 依次执行（返回 false 终止）；
       - **HandlerAdapter** 适配执行 Handler（@Controller 方法）：参数解析（HandlerMethodArgumentResolver：@RequestBody→HttpMessageConverter 反序列化、@PathVariable/@RequestParam/@Valid 校验）→ 返回值处理（ReturnValueHandler：@ResponseBody → Jackson 序列化；视图名 → ViewResolver）；
       - **拦截器 postHandle** → 视图渲染 / 直接写响应；
       - **afterCompletion**（无论成败都执行，资源清理）。
    3. **异常出口**：HandlerExceptionResolver（@ExceptionHandler / @ControllerAdvice 全局兜底）在 postHandle 之前介入。
    4. **实践关联**：全局异常+全局拦截器+参数校验的组合就是围绕这条链定制；过滤器（Servlet 层）在 DispatcherServlet 之前，所以拿不到 Handler 信息。
    5. **加分点**：能讲 HttpMessageConverter 的协商过程（Content-Type/Accept 匹配 MappingJackson2HttpMessageConverter）；异步请求（DeferredResult/Callable）在链路上的挂起恢复。

- title: "拦截器（Interceptor）和过滤器（Filter）的区别？"
  category: SPRING
  difficulty: 1
  tags: ["拦截器", "过滤器"]
  position_tags: ["java", "fullstack"]
  answer: |
    1. **层级不同**：Filter 是 **Servlet 规范**组件，在 Servlet 容器层，包在 DispatcherServlet **外面**——所有请求都过（含静态资源）；Interceptor 是 **Spring MVC** 机制，只拦截进 DispatcherServlet 的 Handler 请求。
    2. **能力不同**：Filter 拿不到 Handler/ModelAndView/异常解析上下文；Interceptor 的 preHandle/postHandle/afterCompletion 与 MVC 生命周期绑定（能拿到 handler 方法、注解做细粒度控制）。**执行顺序：Filter → Servlet → Interceptor → Controller**。
    3. **异常处理**：Filter 抛的异常到不了 @ControllerAdvice（在 MVC 之外），需要自己 try-catch 或 ErrorPage 转发；Interceptor 的异常能被全局异常处理接住——鉴权失败返回统一 JSON 时这是关键差异。
    4. **分工惯例**：Filter 做**协议级**通用事务——编码、CORS、XSS 清洗、请求日志、链路 traceId 注入、防重放；Interceptor 做**业务级**——登录态校验、权限点检查、接口幂等切面配合。
    5. **加分点**：两者注册方式（FilterRegistrationBean 设置 URL 模式与顺序 / WebMvcConfigurer.addInterceptors + excludePathPatterns）；OncePerRequestFilter 防重入的原因（转发会二次进入）。

- title: "Spring Bean 的作用域有哪些？单例 Bean 有状态怎么解决？"
  category: SPRING
  difficulty: 2
  tags: ["Bean", "作用域"]
  position_tags: ["java"]
  answer: |
    1. **常用作用域**：**singleton**（默认，容器级单例）、**prototype**（每次获取新实例，容器不管理其销毁回调）、Web 专属 **request/session/application/websocket**（子上下文注册 RequestContextHolder 才可用）、自定义 scope（如 ConfigurableListableBeanFactory.registerScope，k8s 场景的 refresh scope）。
    2. **单例 + 有状态的坑**：singleton 被所有请求共享——**可变成员变量 = 并发事故**（计数器错乱、请求串数据）。解决：无状态化（状态放方法参数/ThreadLocal/Redis）；需要每请求实例就 @Scope("prototype") 或方法内 new；有状态必须共享时用同步或原子类。
    3. **prototype 依赖 singleton 的坑**：singleton 持有 prototype 字段只注入一次——prototype 失去"每次新"意义（解决办法：ObjectProvider<T>/Provider.get() 延迟获取、@Lookup 方法注入）。
    4. **生命周期钩子按 scope 区别**：singleton 有完整 destroy 回调；prototype 容器创建后不管销毁（要自己清理）。
    5. **加分点**：request scope 实现原理（Session/RequestAttributes 暴露到 ThreadLocal，异步线程需手动 RequestContextListener 传递）；@RefreshScope 的动态刷新原理（代理 + 销毁重建）。

- title: "@Autowired 和 @Resource 的区别？注入失败有哪些原因？"
  category: SPRING
  difficulty: 1
  tags: ["依赖注入"]
  position_tags: ["java"]
  answer: |
    1. **来源**：@Autowired 是 **Spring** 注解（JSR-330 @Inject 类似）；@Resource 是 **JDK 标准注解**（JSR-250，javax/jakarta.annotation）——不绑定 Spring，换容器也能用。
    2. **装配规则**：@Autowired **先按类型（byType）**，多个候选再用字段名/构造参数名匹配，或配 @Qualifier 指定、@Primary 标首选；@Resource **先按名称（byName）**，找不到再退按类型。
    3. **选型**：字段注入用 @Resource（名字即语义）更精准；构造器注入推荐 @Autowired（单个构造可省注解）——**构造器注入是最佳实践**（不可变、显式依赖、便于测试、循环依赖尽早暴露）。
    4. **注入失败排查清单**：类没被扫描到（包路径不在 @ComponentScan 下/缺 @Component）；接口多实现未指定；同类型多 Bean 无 @Primary/@Qualifier；prototype 注入进 singleton 的期望错位；lazy 初始化下代理类类型不匹配（@Autowired 具体实现类但被 CGLIB 包装）；Spring Boot 条件装配（@ConditionalOnMissingBean 被用户 Bean 抢注）。
    5. **加分点**：字段注入为何是反模式（隐藏依赖、不能 final、测试要反射）；@Lazy 解决循环依赖与延迟初始化的代价。

- title: "Spring 的事件机制是什么？ApplicationEvent 怎么用？"
  category: SPRING
  difficulty: 2
  tags: ["事件机制", "解耦"]
  position_tags: ["java"]
  answer: |
    1. **机制**：发布-订阅解耦——`ApplicationEventPublisher.publishEvent(event)` 发布，`@EventListener`（或实现 ApplicationListener）监听。同一容器内进程级事件，不是 MQ。
    2. **异步**：监听方法加 @Async（需 @EnableAsync + 线程池配置）即异步执行；@TransactionalEventListener（phase = BEFORE_COMMIT/AFTER_COMMIT/AFTER_ROLLBACK）——**事务提交后才处理**，解决"事件处理依赖事务数据可见性"的经典问题（订单创建事件必须在订单落库后消费）。
    3. **典型用途**：领域事件解耦（下单后发积分/通知/统计）、框架内置事件（ContextRefreshedEvent 做启动后初始化、ApplicationReadyEvent 做预热）、模块间单向通知。
    4. **边界**：进程内事件**不保证可靠投递**（异步异常无重试、宕机即丢）——要求可靠性（对账、补偿）必须 MQ；事件对象建议不可变；监听器里别再发同步事务事件引发死循环。
    5. **加分点**：AFTER_COMMIT 里再开新事务（REQUIRES_NEW）写库的细节；Spring Boot 启动各事件的时间线；与 Guava EventBus 的对比（无 dead event、类型层次匹配规则）。

- title: "参数校验 @Validated 和 @Valid 的区别？校验失败怎么统一处理？"
  category: SPRING
  difficulty: 2
  tags: ["参数校验", "Bean Validation"]
  position_tags: ["java", "fullstack"]
  answer: |
    1. **来源**：@Valid 是 **JSR-380 标准注解**（jakarta.validation），支持嵌套对象级联校验（字段上标 @Valid 深入校验子对象），但**不支持分组**；@Validated 是 **Spring 增强**，支持分组校验（groups），可用于类上（方法级校验），但**默认不级联**。
    2. **用法组合**：Controller 参数 `@Valid @RequestBody`（级联校验嵌套 DTO）；分组场景（新增/修改不同规则）用 `@Validated(UpdateGroup.class)` + DTO 字段注解指定 groups；Service 层方法参数校验在类上标 @Validated + 参数加约束注解（AOP 实现，ConstraintViolationException）。
    3. **常用约束**：@NotNull（容器对象）/ @NotBlank（字符串）/ @NotEmpty（集合）/ @Size / @Min @Max / @Pattern / @Email；自定义校验器：实现 ConstraintValidator + 自定义注解（如手机号、枚举值校验）。
    4. **统一处理**：@RestControllerAdvice + @ExceptionHandler 捕获 MethodArgumentNotValidException（body 校验）与 BindException（form），取 FieldError 拼接成友好错误信息返回统一错误结构——**决不能把 ConstraintDefinition 异常裸抛给前端**。
    5. **加分点**：分层校验原则（Controller 靠注解、Service 复杂业务规则手写）；@Validated 类级校验的性能开销；jakarta vs javax 命名空间的 Boot 2/3 迁移坑。

- title: "多个 AOP 切面的执行顺序怎么控制？"
  category: SPRING
  difficulty: 3
  tags: ["AOP", "顺序"]
  position_tags: ["java"]
  answer: |
    1. **排序规则**：切面实现 `Ordered` 接口或标 `@Order(n)`——**值越小优先级越高**（越靠外层）。未指定时无确定顺序（不保证注册序，不同版本可能不同）。
    2. **执行模型**：切面按序形成**责任链**——高优先级切面的 @Around 前半段 → 它的 @Before → 低优先级切面 @Around → ... → 目标方法 → 逆序返回。@After/@AfterReturning/@AfterThrowing 在**最内层**按逆序执行（Around 里 proceed 后的代码也在逆序段）。
    3. **控制手段**：@Order 数值；实现 Ordered；@EnableAspectJAutoProxy(order=...) 统一；同一 Aspect 内多个 advice 用 @Order 参数或注解声明相对顺序。
    4. **典型应用**：日志切面（Order 最高=最外层）→ 事务切面 → 幂等/限流切面贴目标。**事务切面与自定义切面的顺序**是经典坑：自定义 Around 在事务外层时，proceed 抛出的异常在事务回滚后还能 catch 到修改返回——注意行为差异。
    5. **坑**：@Order 在 @Transactional 上无效（事务切面顺序由 Ordered/LowestPriority 约定）；切面间依赖链过长难排查——用 trace 或打印 Order 数值链可视化。
    6. **加分点**：能画五层切面嵌套的执行序号图；提 AspectJ 的 precedence 规则更精细（AspectJ 5 privileged aspects）。

- title: "@Transactional 在自调用、多线程、捕获异常场景下还生效吗？"
  category: SPRING
  difficulty: 3
  tags: ["事务", "失效场景"]
  position_tags: ["java"]
  answer: |
    1. **本质**：事务 = AOP 代理（TransactionInterceptor 开启/提交/回滚）。**代理只拦截"外部调用"**——一切绕过代理的场景都失效。
    2. **失效清单**：
       - **同类自调用**（this.method()）——最常见，代理被绕过；解法：拆 Bean、注入自身代理（@Lazy self / AopContext.currentProxy + exposeProxy = true）、改用编程式 TransactionTemplate；
       - **方法非 public**（CGLIB/JDK 代理均不织入 protected/private）；
       - **异常被 catch 吞掉**——没抛出就不会回滚（rollbackFor 按异常匹配）；
       - **受检异常默认不回滚**——需 rollbackFor = Exception.class；
       - **多线程**：事务上下文绑 ThreadLocal（DataSource 上的 ConnectionHolder），**子线程不在同一事务**——子线程的 SQL 独立提交，主线程回滚带不动它；需要整体原子性时改用分布式事务或业务补偿；
       - **传播行为用错**：NOT_SUPPORTED 挂起事务、REQUIRES_NEW 各自独立提交；
       - **数据库层**：MyISAM 不支持事务、连接被池外使用。
    3. **排查手段**：开启 `logging.level.org.springframework.orm=DEBUG` 看事务 begin/commit 日志；看 DataSource 的 actual connection autocommit 状态。
    4. **加分点**：TransactionTemplate 编程式事务在自调用/异步场景的正确用法；@Transactional 加在接口上的隐患（JDK 代理可以、CGLIB 不行，混用出玄学）。

- title: "TCP 粘包/拆包是怎么回事？怎么解决？"
  category: NETWORK
  difficulty: 2
  tags: ["TCP", "粘包"]
  position_tags: ["backend", "java", "golang", "cpp", "fullstack"]
  answer: |
    1. **本质**：TCP 是**字节流协议，没有消息边界**——发送方两次 write 的数据可能被接收方一次 read 全读到（粘包），也可能一次 write 被多次 read（拆包，MTU/缓冲/Nagle 都会造成）。UDP 有边界无此问题。
    2. **解决方案（应用层自定义边界）**：
       - **定长消息**：每包固定字节，不足填充——简单浪费；
       - **分隔符**：如 \r\n（HTTP 头、Redis RESP 用 \r\n）——要转义防内容撞分隔符；
       - **长度前缀（最通用）**：包头 2/4 字节表示 body 长度（Netty 的 LengthFieldBasedFrameDecoder），变长消息标准解；
       - 协议自带边界：HTTP 用 Content-Length/chunked。
    3. **Netty 提供**：FixedLengthFrameDecoder / DelimiterBasedFrameDecoder / LengthFieldBasedFrameDecoder / LineBasedFrameDecoder 开箱即用。
    4. **实践坑**：长度字段字节序（网络序大端）；粘包在压力测试和长连接上必现，短连接偶发——"测试好好的上线就乱"的经典。
    5. **加分点**：能讲 Nagle 算法与延迟确认的相互作用加剧拆包；应用层协议设计（头+体+校验）是面试延伸题。

- title: "TCP 滑动窗口和拥塞控制的四个算法详细讲讲？"
  category: NETWORK
  difficulty: 3
  tags: ["TCP", "拥塞控制", "滑动窗口"]
  position_tags: ["backend", "cpp", "java"]
  answer: |
    1. **滑动窗口（流量控制）**：接收方通过 ACK 里的 window 字段通告剩余缓冲区（rwnd），发送方维持发送窗口 ≤ min(rwnd, cwnd)——**窗口内可连续发送无需等确认**，ACK 左移窗口右移。零窗口时有探测机制（持续计时器 + 窗口探测包）。
    2. **慢启动**：连接初期 cwnd 从 1 MSS 起**指数增长**（每 RTT 翻倍），达到 ssthresh 后进入拥塞避免。
    3. **拥塞避免**：每 RTT cwnd **线性 +1**，谨慎探测网络容量上限。
    4. **快速重传**：收到 **3 个重复 ACK** 立即重传丢失段（不等超时 RTO，快得多）。
    5. **快速恢复**：快速重传后 cwnd 减半 + ssthresh 更新，然后线性增长（而非回到 1）——Tahoe 没有这步（超时才减半），Reno 引入。
    6. **超时事件**：RTO 到期（比 3 重复 ACK 更严重的信号）→ cwnd 重置回 1 MSS 重新慢启动。
    7. **加分点**：BBR 不以丢包为拥塞信号而测瓶颈带宽×RTT；窗口调优与高延迟长肥管道（卫星/跨境）的关系；发送缓冲区 sndbuf 与 rwnd 的联动。

- title: "HTTP/1.1、HTTP/2、HTTP/3 的演进与核心区别？"
  category: NETWORK
  difficulty: 2
  tags: ["HTTP", "HTTP2", "HTTP3"]
  position_tags: ["fullstack", "frontend", "backend"]
  answer: |
    1. **HTTP/1.1 的痛点**：文本协议解析慢；**队头阻塞**——同一连接上一请求未响应，后续必须排队（Keep-Alive 复用连接后更明显）；浏览器用开 6 条连接缓解；头部无压缩（重复 UA/Cookie 每次全量发送）。
    2. **HTTP/2（2015）**：
       - **二进制分帧**：二进制协议，解析高效；
       - **多路复用**：一条 TCP 连接上多个流（Stream）交错传输，**应用层队头阻塞解决**；
       - **头部压缩 HPACK**（静态表+动态表+哈夫曼）；
       - 服务器推送（实际收益有限，已从 Chrome 移除）；
       - **遗留问题**：TCP 层队头阻塞仍在——一个包丢，所有流重传等待（TCP 字节序保证）。
    3. **HTTP/3（QUIC，RFC 9114）**：弃 TCP 改 **UDP 上的 QUIC**——流级别独立重传（彻底解决队头阻塞）、内嵌 TLS1.3（握手 1-RTT/0-RTT）、连接迁移（Connection ID 标识，WiFi 切 4G 不断连）、内置拥塞控制可插拔。
    4. **部署现实**：HTTP/2 需要 TLS（主流浏览器）；HTTP/3 走 UDP 443，需防火墙放行 + Alt-Svc/Upgrade 协商；Nginx 1.25+ 支持。
    5. **加分点**：能画三层队头阻塞图（HTTP/1.1 应用层、HTTP/2 TCP 层、HTTP/3 解决）；为什么多路复用后仍要做域名分片让位于 HTTP/2。

- title: "HTTP 状态码体系怎么理解？301/302、401/403、502/504 的区别？"
  category: NETWORK
  difficulty: 1
  tags: ["HTTP", "状态码"]
  position_tags: ["fullstack", "frontend", "backend"]
  answer: |
    1. **五大类**：1xx 信息；2xx 成功（200/201/204）；3xx 重定向；4xx 客户端错误；5xx 服务端错误。
    2. **3xx 对比**：**301 永久重定向**（SEO 权重转移，浏览器缓存，换域名/路径规范用）；**302 临时**（不缓存，登录跳转用）；307/308 保持请求方法的重定向版本（POST 不降级为 GET）；304 协商缓存命中（配合 ETag/If-None-Match）。
    3. **4xx 对比**：**400 参数格式错**（JSON 解析失败）；**401 未认证**（没登录/令牌无效，配 WWW-Authenticate）vs **403 已认证但无权限**（不让看）；404 资源不存在 vs 410 已删除；429 触发限流（配 Retry-After）；413 请求体超限。
    4. **5xx 对比**：500 代码异常；**502 Bad Gateway**——网关后面的服务挂了/连不上（Nginx 到上游 connection refused）；**504 Gateway Timeout**——上游连上了但超时没响应（慢 SQL 拖死接口的典型表现）；503 服务过载维护中（配 Retry-After）。
    5. **运维含义**：502/504 是网关排障第一信号——502 查上游进程存活与端口，504 查上游耗时（慢 SQL/下游依赖）。**200 包错误码**的反模式让监控全瞎。
    6. **加分点**：502 与 504 的根因分流排查话术；301 被浏览器强缓存导致改不回的坑（用 302 过渡）。

- title: "DNS 解析的详细过程？常见 DNS 记录类型有哪些？"
  category: NETWORK
  difficulty: 2
  tags: ["DNS"]
  position_tags: ["backend", "fullstack", "dba"]
  answer: |
    1. **解析链路**：浏览器缓存 → 系统 hosts/缓存 → **本地 DNS 服务器**（运营商/8.8.8.8，递归查询）→ 根域名服务器（返回 .com 的 NS）→ 顶级域服务器（返回 example.com 的 NS）→ **权威 DNS**（返回最终 A 记录）→ 逐级缓存 TTL。
    2. **递归 vs 迭代**：客户端到本地 DNS 是**递归**（帮我查到底）；本地 DNS 到各级服务器是**迭代**（一级级问）。
    3. **记录类型**：A（IPv4）、AAAA（IPv6）、**CNAME**（别名指向，CDN 接入常用）、NS（权威服务器）、MX（邮件）、TXT（域名验证/SPF）、SOA（起始授权）。
    4. **TTL 的权衡**：短 TTL 故障切换快但解析压力大；长 TTL 省解析但切流量慢——生产常用 60~600s。
    5. **实践坑**：智能解析与地域调度（CDN 依赖 DNS 视图）；DNS 劫持/污染与 DoH（DNS over HTTPS）加密解析；**预解析** `<link rel="dns-prefetch">` 优化首屏。
    6. **加分点**：DNS 负载均衡（多 A 记录轮询）与 weighted 调度；主从权威 DNS 与 zone transfer；本地 DNS 的缓存投毒风险。

- title: "CDN 的原理是什么？回源是什么？"
  category: NETWORK
  difficulty: 2
  tags: ["CDN", "性能"]
  position_tags: ["fullstack", "frontend", "backend"]
  answer: |
    1. **原理**：内容分发网络 = 源站 + 分布各地的**边缘节点**缓存。用户请求经 DNS 智能解析（CNAME 到 CDN 调度系统）→ 分配**就近节点** → 命中缓存直接返回（低延迟）；未命中 → 节点**回源**拉取并缓存后返回。
    2. **回源**：边缘节点向源站/上级节点取数据的过程。回源率 = 回源请求/总请求——**命中率是 CDN 的核心指标**。降低回源：预热（发布时主动推送）、合理 Cache-Control、边缘缓存 TTL 配置（如 `max-age` + CDN 覆写 s-maxage）、父节点层级回源（边缘→区域→中心，减少打穿源站）。
    3. **缓存失效**：URL 带内容 hash 是主动失效的正解（文件名变=新 URL）；也可调 API 主动 purge（有配额与延迟）。
    4. **动态内容**：静态走缓存；动态接口走 CDN 的**动态加速**（私有协议 + 链路优化回源，不缓存内容只优化路由）。
    5. **安全**：CDN 天然隐藏源站 IP（DDoS 缓冲）、WAF 集成；注意源站直连泄露（历史 DNS 记录扫描）。
    6. **加分点**：缓存键设计（忽略无意义 query 参数提高命中率）；Range 回源（大文件分段）；命中率怎么算与监控大盘。

- title: "正向代理和反向代理的区别？"
  category: NETWORK
  difficulty: 1
  tags: ["代理", "Nginx"]
  position_tags: ["fullstack", "backend"]
  answer: |
    1. **正向代理**：**代理客户端**——服务器不知道真实客户端是谁（客户端知道并配置代理）。用途：科学上网翻墙、内网机器统一出网、客户端匿名。部署在客户端侧。
    2. **反向代理**：**代理服务端**——客户端不知道真实后端（以为代理就是服务）。用途：负载均衡、TLS 终结、静态资源、缓存、安全屏蔽（隐藏真实 IP）、灰度分流。部署在服务端侧（Nginx 的标准用法）。
    3. **一句话**：正向代理藏客户端，反向代理藏服务器。
    4. **Nginx 常见反代配置语义**：proxy_pass + upstream 负载均衡（轮询/weight/ip_hash/least_conn）、proxy_set_header X-Real-IP/X-Forwarded-For 传递真实 IP（日志与风控依赖）、proxy_read_timeout/proxy_buffering 对 SSE/长连接的影响（关 buffering 否则流式输出被攒包）。
    5. **加分点**：X-Forwarded-For 链与伪造风险（只信任第一跳）；正向代理在企业里的统一出口管控（白名单+审计）；代理与网关/CDN 的层次关系（CDN 本质是分布在全球的反向代理+缓存）。

- title: "HTTP 断点续传是怎么实现的？Range 请求讲一下？"
  category: NETWORK
  difficulty: 2
  tags: ["HTTP", "断点续传", "Range"]
  position_tags: ["backend", "fullstack"]
  answer: |
    1. **核心机制**：客户端 `Range: bytes=start-end` 请求文件区间；服务端返回 **206 Partial Content** + `Content-Range: bytes start-end/total`；不完整下载时服务端返回 `Accept-Ranges: bytes` 告知支持区间请求。
    2. **续传流程**：下载中断 → 客户端记住已收字节数 → 重发 `Range: bytes=N-` → 服务端从 N 继续流式返回。全部完成返回 200（非区间）。
    3. **一致性保障**：`ETag` / `Last-Modified`——续传前用 If-Range 携带旧 ETag，**文件变了返回 200 全量**（防止拼接出拼错的文件）。
    4. **多线程下载**：并发发多个 Range 段并行拉取后本地拼接（下载器原理）；分段上传到云存储（OSS 分片上传）同理。
    5. **服务端实现要点**：Nginx 静态文件原生支持 Range；应用层实现要注意文件流式读取偏移、Content-Length 语义（本次返回的长度）；OSS/S3 SDK 的 range 参数。
    6. **加分点**：Upload resumption（上传续传）与下载续传是两套逻辑；HTTP/2 上 Range 并发段更高效；`416 Range Not Satisfiable` 的场景。

- title: "线上接口偶发超时，怎么用抓包和网络排查工具定位？"
  category: NETWORK
  difficulty: 3
  tags: ["抓包", "tcpdump", "排查"]
  position_tags: ["backend", "dba", "cpp"]
  answer: |
    1. **先分层定位（抓包前）**：应用日志（traceId 找慢请求）→ 应用层耗时埋点（DNS/建连/TTFB 分段，curl -w 模板）→ ping/mtr 看丢包路径 → ss -s 看连接状态分布。
    2. **抓包工具**：
       - **tcpdump**（服务器端首选）：`tcpdump -i any -w out.pcap port 443 and host x.x.x.x`，抓完 Wireshark 分析——看**三次握手耗时、重传/乱码（retransmission/dup ack）、RST、零窗口**；
       - **Wireshark**：过滤器 tcp.analysis.flags 一键列出异常；Follow TCP Stream 看交互；
       - **mtr/tracepath**：定位哪一跳丢包（机房内/运营商/对端）。
    3. **常见症状 → 根因**：大量 retransmission → 网络抖动/丢包（检查机房网络、跨可用区）；持续 dup ack + fast retransmit → 包序问题；Time_Wait 堆积 → 短连接风暴（上连接池/keepalive）；SYN_RCVD 堆积 → SYN Flood；零窗口 → 对端应用卡住不读数据。
    4. **TLS 场景**：HTTPS 内容加密，抓包看**握手耗时**（TLS1.2 两次 RTT vs 1.3 一次）与证书链——握手慢导致偶发超时的排查（会话复用 session resumption 是否生效）。
    5. **加分点**：能讲"超时在应用侧看到的是果，抓包看到的是因"的分层排查哲学；提 eBPF 工具（pixie/kyanos）做无侵入观测是演进方向。

- title: "设计一个短链接服务？"
  category: SCENARIO
  difficulty: 3
  tags: ["短链", "系统设计"]
  position_tags: ["backend", "fullstack", "ai_app"]
  answer: |
    1. **需求与量化**：长 URL → 短码（如 s.cn/Ab3xK9），点击 301/302 跳转；假设日新增百万、读远大于写（100:1），6 位 62 进制（a-zA-Z0-9）≈ 568 亿组合，够用。
    2. **短码生成方案**：
       - **哈希 + 冲突重试**（MurmurHash/Md5 截 6 位）——简单但要查重；
       - **发号器 + 62 进制编码（推荐）**：全局自增 id（号段/雪花）转 62 进制——无冲突、趋势可预估；发号器用 DB 号段批量取防单点；
       - 预生成短码池（内存号段直接用，扛突发）。
    3. **存储与查询**：`short_code → long_url` 用 MySQL（code 唯一索引）+ **Redis 缓存**（热码命中率极高）；长链幂等（同长 URL 返回同短码可加 hash 二级索引）。
    4. **跳转细节**：**301 vs 302**——301 浏览器缓存不再打到服务端（统计丢失），302 每次都走服务（可统计）——业务要统计用 302 或 301 + 前端埋点；跳转页可做防跳白名单（钓鱼拦截）。
    5. **高并发读优化**：Redis 缓存 + 本地缓存两级；布隆过滤器挡非法短码；过期短码惰性清理 + 归档。
    6. **加分点**：容量估算完整（码空间、QPS、存储行数）；能延伸讨论自定义短码、过期策略、防刷限流、跳转 302 的响应耗时优化（直接在边缘节点/网关层完成跳转）。

- title: "设计一个 Feed 流（朋友圈/微博时间线）？"
  category: SCENARIO
  difficulty: 3
  tags: ["Feed流", "系统设计", "推拉模式"]
  position_tags: ["backend", "java", "ai_app"]
  answer: |
    1. **两种模式**：
       - **推模式（写扩散）**：发布时把内容 ID 推进**每个粉丝**的收件箱（Redis ZSet/List）——读时 O(1) 直接取自己收件箱；大 V 千万粉丝写入爆炸（写扩散灾难）；
       - **拉模式（读扩散）**：粉丝读时聚合关注列表各自的时间线（查 N 个关注者最新内容排序）——写简单、读昂贵（大 V 读合并慢）；
       - **推拉结合（工业界主流）**：普通用户发布全推；**大 V 发布不推**，粉丝读时把"大 V 最新内容"与"收件箱"合并拉取。
    2. **存储设计**：收件箱 Redis ZSet（score=时间戳，限制长度 3000 条，超出落库分页）；全量内容库 MySQL 分库分表（user_id 维度）；大 V 主动内容单独表。
    3. **读时合并逻辑**：自己收件箱 + 关注的大 V 最新 N 条 → 按时间归并 → 分页游标（时间戳+id）。
    4. **一致性细节**：删除/屏蔽——收件箱是快照，删除后读时过滤（黑名单/已删标记）；已读游标按用户存。
    5. **扩展点**：冷热分离（热数据 Redis，历史归档 HBase/ES）；推荐流混排（关注流+推荐流混插）；消息推送（发布事件 → MQ → 扇出服务异步推，削峰大 V 发布）。
    6. **加分点**：推拉结合的阈值设计（粉丝数 > X 走拉）；扇出失败的补偿（MQ 重试）；收件箱超长截断后"翻旧微博"的去向（归档库查询链路）。

- title: "设计一个抢红包系统？"
  category: SCENARIO
  difficulty: 3
  tags: ["抢红包", "高并发", "资金安全"]
  position_tags: ["backend", "java"]
  answer: |
    1. **两阶段**：**发红包**（资金冻结/预扣 → 生成红包记录 + 随机拆分金额明细）→ **抢红包**（高并发抢 → 拆分明细认领 → 异步到账）。
    2. **金额拆分算法**：随机均分（每次随机 [0.01, 剩余/剩余人数×2]，二倍均值法）——先到手气不均但公平；固定均分（拼手气 vs 普通红包）。**精度**：用分（long）计算杜绝浮点误差。
    3. **抢红包核心（防超领）**：
       - 红包明细列表预热进 **Redis List**（LPOP 抢一个，单线程原子天然防超领）或 Lua 脚本原子扣减；
       - 抢到后写 DB 明细（唯一索引 user_id+red_id 防重复抢）+ 发 MQ 异步入账；
       - DB 兜底条件更新 `UPDATE ... WHERE status=UNCLAIMED`——最后一道防线。
    4. **并发量级**：瞬时抢购用 Redis 挡 + MQ 削峰入账；热点红包（群大）加本地缓存标记"已抢完"短路。
    5. **资金安全**：发红包先扣款（银行侧）再生成——**宁可发不出去不能透支**；24 小时未领完自动退回（延迟任务）；对账任务（Redis 剩余 vs DB 剩余 vs 明细合计）。
    6. **加分点**：能讲清"Redis 抢、DB 记、MQ 到账、对账兜底"四层各自职责与一致性边界；提到红包明细预拆分（发的时候拆好）避免抢时随机计算。

- title: "延迟任务有哪些实现方案？各自优缺点？"
  category: SCENARIO
  difficulty: 2
  tags: ["延迟任务", "方案对比"]
  position_tags: ["backend", "java"]
  answer: |
    1. **数据库轮询**：任务表 + 定时扫描（status+执行时间索引）。简单可靠、可查可视；精度 = 轮询间隔（秒级），量大扫描慢，需要分片。
    2. **JDK DelayQueue / ScheduledThreadPoolExecutor**：内存级，进程重启丢任务——单机小场景用。
    3. **时间轮（Netty HashedWheelTimer / Kafka 内部）**：O(1) 插入删除，精度=刻度；纯内存不持久，多级时间轮补精度——调度器内核方案。
    4. **Redis 方案**：
       - ZSet（score=执行时间戳，轮询 ZRANGEBYSCORE 取到期任务，取到即删需 Lua 原子）——简单，多实例需抢锁防重复消费；
       - Redis key 过期通知（keyspace notification）——**不可靠**（过期惰性/定期删除，通知可能延迟或丢失），只做提示不做依赖。
    5. **MQ 延迟消息（生产推荐）**：RocketMQ 延迟等级（5.x 支持任意精度）/ RabbitMQ TTL+死信（有队头阻塞坑）/ Kafka 无原生（借时间轮或分层 topic）。可靠性、可重试、可观测全有——**优先选**。
    6. **选型**：精度要求高+量大 → 时间轮/延迟 MQ；简单可靠 → 任务表轮询；轻量 → Redis ZSet。订单超时关闭、红包退回、定时提醒都是典型场景。
    7. **加分点**：能对比"延迟任务 vs 定时任务"（一次性 vs 周期性）；提 xxl-job/quartz 拿来做定时而非延迟的定位差异。

- title: "限流算法有哪些？四种算法的原理和取舍？"
  category: SCENARIO
  difficulty: 2
  tags: ["限流", "高并发"]
  position_tags: ["backend", "java", "golang", "ai_app"]
  answer: |
    1. **固定窗口计数器**：单位时间计数超阈值拒绝。实现最简；**临界突刺**（窗口边界 2 倍流量）。
    2. **滑动窗口计数器**：把窗口切小格（如 1s 一格）统计最近 N 格总和，格越细越平滑——解决突刺，内存与计算略增。
    3. **漏桶（Leaky Bucket）**：请求进桶，**恒定速率**流出，桶满拒绝——**强制整形**（输出绝对平滑），适合保护脆弱下游；无法利用突发容量。
    4. **令牌桶（Token Bucket）**：恒定速率生成令牌入桶（有上限），请求取令牌——**允许突发**（攒的令牌瞬间消费）+ 平均速率受控，网关默认算法（Guava RateLimiter/Sentinel 匀速排队即其变体）。
    5. **选型**：保护下游不被打挂 → 漏桶；容忍突发又要均速 → 令牌桶；简单统计口径 → 计数器；精细化 → 滑动窗口。分布式用 Redis+Lua 集中计数（见 Redis 限流题），单机 Sentinel/Guava。
    6. **体系化视角**：限流只是稳定性三件套之一——**限流（挡住超额）+ 熔断（下游坏了快速失败）+ 降级（有损服务兜底）** 组合使用；分层限流（网关粗 → 服务细 → 热点资源单独）。
    7. **加分点**：能讲漏桶"排队 vs 直接拒绝"两种模式；提自适应限流（按 RT/CPU 动态阈值，Sentinel 的自适应是 BBR 思想）。

- title: "数据库不停机迁移（换表/换库/分库分表）怎么做？"
  category: SCENARIO
  difficulty: 3
  tags: ["数据迁移", "双写", "灰度"]
  position_tags: ["backend", "dba", "java"]
  answer: |
    1. **核心套路：双写 + 存量迁移 + 灰度切读 + 校验回收**。
    2. **步骤**：
       - **存量同步**：全量迁移历史数据（脚本分批/工具 DTS），记录位点；
       - **增量双写**：上线双写开关——写旧库同时写新库（同步或 MQ 异步）；追平存量与增量的差（binlog 订阅/比对任务）；
       - **灰度切读**：按用户/比例灰度读新库（开关可秒回），观察数据一致性与性能；
       - **校验对账**：全量比对（分片 checksum）+ 抽样比对 + 双写差异计数器归零后确认；
       - **下线旧库**：先停写旧库观察 → 删双写代码 → 归档旧库（保留 N 天可回滚）。
    3. **双写的坑**：同步双写增加写延迟与不一致窗口（新库失败要告警补偿不能阻塞主流程太久）；事务边界（两库无事务，靠最终一致 + 对账）；**先写旧后写新**保权威源。
    4. **工具**：canal/Debezium 订阅 binlog 同步、gh-ost 处理单库内大表变更、云厂商 DTS。
    5. **加分点**：能讲"为什么直接停机导数不行"（时长不可控/回滚难）；双写不一致的对账修复任务设计；回滚预案（切读开关秒级回切）。

- title: "日志系统怎么设计？（分级/采集/聚合/告警）"
  category: SCENARIO
  difficulty: 2
  tags: ["日志", "可观测性"]
  position_tags: ["backend", "fullstack", "dba"]
  answer: |
    1. **打日志规范**：
       - 分级语义清晰：ERROR（影响功能，必须告警）、WARN（可自愈异常，值得看）、INFO（关键业务动作/状态变迁，控制量）、DEBUG（详细调试，生产关闭）；
       - **结构化日志**：JSON 格式（traceId、userId、耗时、参数摘要）——机器可解析是聚合检索的前提；
       - 不打敏感信息（手机号脱敏、密码/token 永不落日志）；慢 SQL/外部调用耗时必打。
    2. **链路关联**：全链路 traceId（网关生成 → MDC 注入日志 → HTTP header/MQ 传递）——一次请求跨服务日志可串。
    3. **采集与聚合（EFK）**：Filebeat/Fluent Bit 采集容器/文件日志 → Kafka 缓冲削峰 → Logstash 解析 → **Elasticsearch** 存储（索引按天滚动 + ILM 冷热分层）→ Kibana 检索。替代方案 Loki（轻量、标签检索）。
    4. **告警**：ERROR 率突增、关键字告警（死锁/OOM/支付失败）、业务日志量突变（突增=异常或攻击）；收敛策略（聚合去重、静默窗口）防告警风暴。
    5. **成本与治理**：日志量是大头——分级保留（ERROR 90 天/INFO 7 天）、冷数据转对象存储、采样 DEBUG；"日志即负债"，打之前想检索场景。
    6. **加分点**：TraceID 在异步线程/MQ 的传递细节；日志与 metrics/tracing 的三角关系（可观测性三支柱）；幂等重复日志的 dedup。

- title: "Transformer 的 Attention 怎么计算？Q、K、V 各是什么？复杂度是多少？"
  category: AI_APP
  difficulty: 3
  tags: ["Transformer", "Attention"]
  position_tags: ["ai_app", "agent"]
  answer: |
    1. **Q/K/V 的直观含义**：每个 token 的向量经三个投影矩阵得到 Query（我在找什么）、Key（我是什么标签）、Value（我携带的信息）。注意力 = "我的 Query 和所有 Key 算相似度，按相似度加权取 Value"。
    2. **计算**：`Attention(Q,K,V) = softmax(QK^T/√d_k)·V`——QK^T 得 n×n 相似度矩阵，除 √d_k 防点积过大 softmax 饱和梯度消失，softmax 归一化成权重，再对 V 加权求和。多头：h 个头的输出拼接后线性投影，各头学不同的关系模式（语法/指代/位置）。
    3. **复杂度**：自注意力 **O(n²·d)**（n 序列长）——序列翻倍计算量 4 倍，这是长上下文贵的根源；FFN 是 O(n·d²)。KV Cache 把推理时 K/V 存下来避免重算，但显存随 n 线性涨。
    4. **为什么替代 RNN**：并行计算（矩阵乘一次性算全序列 vs RNN 逐步）、任意两 token 直接交互（路径长度 O(1) vs O(n)，长依赖不衰减）、可解释（注意力权重可视化）。
    5. **加分点**：能推导"为什么除以 √d_k"（点积方差随 d 增大）；Causal Mask 在 Decoder 中的作用（只看过去）；稀疏/线性注意力的动机（降低 n²）。

- title: "KV Cache 的原理是什么？显存占用怎么估算？"
  category: AI_APP
  difficulty: 3
  tags: ["KV Cache", "推理优化"]
  position_tags: ["ai_app"]
  answer: |
    1. **为什么需要**：Decoder 生成第 t 个 token 时要对**全部历史 token** 算注意力——不缓存则每步都要重算历史 K/V，复杂度 O(t²) 累积。缓存后每步只算新 token 的 QKV，历史 K/V 直接查表——**时间复杂度降到每步 O(n·d)**。
    2. **原理细节**：每层缓存 K、V 两个矩阵（各 [batch, head, seq_len, head_dim]）；生成第 t 步时把新 token 的 K/V append 进 cache，Q 只用新的。GQA/MQA 直接减少 K/V 头数，cache 随之变小——这正是它们省显存的机制。
    3. **显存估算（必会）**：`2（K+V）× 层数 × KV头数 × head_dim × seq_len × batch × 每元素字节数`。例：7B 模型 32 层、d_model 4096、FP16：单序列 2K 上下文 ≈ 2×32×4096×2048×2B ≈ 1GB；batch 32 就是 32GB——**长上下文 + 大 batch 时 KV Cache 超过权重本身**。
    4. **优化手段**：量化 KV Cache（FP8/INT8）、PagedAttention（vLLM 按页管理消除碎片，等效提高 batch）、滑窗/重算丢弃远端、MQA/GQA 减头数。
    5. **加分点**：能现场算一个具体模型的 KV 显存并指出"prefill 阶段 vs decode 阶段谁是瓶颈"（prefill 算力瓶颈、decode 显存带宽瓶颈）。

- title: "RoPE 旋转位置编码的原理？为什么成为主流？"
  category: AI_APP
  difficulty: 3
  tags: ["RoPE", "位置编码"]
  position_tags: ["ai_app"]
  answer: |
    1. **为什么需要位置编码**：Attention 对 token 集合是置换不变的，没有位置信息"我爱你"和"你爱我"无法区分。
    2. **绝对 vs 相对**：正弦绝对编码（原始 Transformer）把位置加进输入，但"距离关系"要靠模型自己学；RoPE 把位置信息**注入到 Q/K 的旋转中**——对 q_m、k_n 各按位置旋转角度 θ·m / θ·n，则内积自然包含**相对位置 (m-n)**——绝对位置编码实现了相对位置感知。
    3. **实现**：按特征维度分对（2D 旋转），不同维度对用不同频率 θ_i = base^(-2i/d)（低频大跨度，高频细粒度）——类似多尺度时钟。
    4. **为什么主流（LLaMA/Qwen/DeepSeek 全在用）**：相对位置感知利于外推；**无额外参数**（纯数学变换）；与 KV Cache 完美兼容（cache 里存旋转后的 K/V）；长度外推可通过调整 base（NTK/YaRN 缩放频率）扩展上下文。
    5. **加分点**：能解释 YaRN/NTK-aware 外推为什么改 base 而不是线性插值；提 ALiBi（线性偏置）作为对比路线。

- title: "Tokenizer 是怎么工作的？BPE 的原理？"
  category: AI_APP
  difficulty: 2
  tags: ["Tokenizer", "BPE"]
  position_tags: ["ai_app"]
  answer: |
    1. **作用与代价**：文本 ↔ token 序列的转换，模型一切计算的基本单位。**词表决定成本**：压缩比差一个 token 的文本贵 30%，中文早期被词表坑（按字切，压缩比低）——Qwen 等中文优化的词表大幅改善。
    2. **BPE（字节对编码）流程**：从字符级词表起，统计语料中相邻 token 对频次，**合并最高频的一对为新 token**，重复直到词表达到目标大小——高频词（"the"、"的"）自然成为单 token，长尾词保持子词切分。
    3. **变体**：WordPiece（Google，合并时选"提升语言模型似然最大"的对）、Unigram（先大词表逐步剪枝）、**byte-level BPE**（GPT 系，字节级保证任意文本可编码，emoji/生僻字不炸）。
    4. **工程要点**：Tokenizer 与模型强绑定（换模型必须重切）；`tiktoken` 客户端精确计数控制上下文预算；特殊 token（<|im_start|> 等）承载对话模板与控制符，**不能被普通切分破坏**。
    5. **加分点**：中文数字/tokenizer 排序问题（数字按位切分对数学能力的影响）；词表大小 vs embedding 参数量 vs OOV 的权衡。

- title: "MHA、MQA、GQA 是什么？推理时怎么取舍？"
  category: AI_APP
  difficulty: 3
  tags: ["Attention变体", "KV Cache"]
  position_tags: ["ai_app"]
  answer: |
    1. **MHA（Multi-Head Attention）**：每个注意力头都有独立的 Q/K/V——表达力最强，但**推理时 KV Cache 与头数成正比**，长上下文显存与带宽爆炸。
    2. **MQA（Multi-Query）**：所有 Q 头共享**一组 K/V**——KV Cache 缩到 1/h（8~128 倍），带宽瓶颈大幅缓解；但表达力损失明显（所有头看同一个 K/V）。
    3. **GQA（Grouped-Query）折中**：Q 头分组，**每组共享一组 K/V**（如 32 个 Q 头分 8 组）——缓存省 4 倍、效果接近 MHA，LLaMA-2/3、Qwen2 主流选择。
    4. **取舍逻辑**：推理瓶颈常在 **KV Cache 读取带宽**（decode 阶段每 token 都要读全部 KV）——降 KV 头数直接提速；训练阶段用 MHA/GQA 均可，**开源模型默认 GQA**。MLA（DeepSeek）：低秩投影压缩 KV 到潜空间，缓存更小且效果不降，是更激进的方向。
    5. **加分点**：能算"7B 模型 MHA→GQA(8组) KV Cache 省 4 倍"的具体数字；讲 MQA→GQA 的"uptraining"迁移训练（少量 token 恢复效果）。

- title: "LLM 训练的三个阶段（预训练/SFT/RLHF）各自做什么？"
  category: AI_APP
  difficulty: 2
  tags: ["训练", "SFT", "RLHF"]
  position_tags: ["ai_app"]
  answer: |
    1. **预训练（Pre-training）**：海量无标注文本（万亿 token）做下一词预测——获得**语言能力 + 世界知识**，最贵（千卡×月）；产物是 base model（会续写但不会对话）。
    2. **SFT（监督微调）**：高质量指令-回答对（万~百万条）教模型"按指令回答"——学会对话格式、遵循指令、角色扮演。数据质量 > 数量（LIMA：1000 条精选即可显著对齐）；LoRA 高效微调主要发生在这一阶段。
    3. **RLHF/DPO（对齐阶段）**：让输出符合人类偏好——有用、诚实、无害。经典三步：SFT 起点 → 训练 **Reward Model**（人类对回答排序）→ PPO 强化学习最大化 RM 分数（KL 惩罚防跑偏）。DPO 直接用偏好对优化，跳过 RM 与 PPO，简单稳定成为主流。
    4. **各阶段产物差异**：base 会"补全"而 chat 会"回答"（问 base 模型问题它会续写更多问题）；SFT 决定能力下限，RLHF 决定体验上限。
    5. **加分点**：能讲 RLHF 后出现"对齐税"（通用能力略降）与"奉承模式"（sycophancy）；GRPO（DeepSeek，组内相对奖励免 critic）等新算法演进；预训练数据质量/去重的重要性。

- title: "DPO 相比 PPO-RLHF 的优势是什么？Reward Hacking 怎么理解？"
  category: AI_APP
  difficulty: 3
  tags: ["DPO", "RLHF", "对齐"]
  position_tags: ["ai_app"]
  answer: |
    1. **PPO-RLHF 的复杂度**：需要 4 个模型同时在线（actor/SFT 参考 RM/critic），在线采样 + 强化学习训练，工程极重、超参敏感、训练不稳。
    2. **DPO 的洞察**：RLHF 的目标（最大化奖励 + KL 约束）存在**闭式解**——最优策略可由 RM 分数直接解析表达，因此可以把"训练 RM + RL"合并成**一步监督学习**：直接在偏好对（chosen vs rejected）上优化 logistic 损失。优势：稳定、简单、便宜（2 个模型离线训练），小团队可落地。
    3. **取舍**：DPO 是离线方法——数据分布固定，模型偏离数据分布后改进有限（在线 PPO 能持续探索）；前沿实践组合拳：SFT → DPO → 在线 RLHF 迭代。
    4. **Reward Hacking（奖励作弊）**：模型找到"高分但不符人类意图"的捷径——**输出冗长**（RM 偏爱长答案）、堆砌关键词、奉承用户（"你说得太对了"）、复述问题凑字数；GRPO/DPO 训练中同样出现"长度偏置"。
    5. **缓解**：RM 数据去偏（长度归一化）、KL 惩罚调参、偏好对中控制长度变量、对抗训练、上线后监控模式化输出（见评估题）。
    6. **加分点**：能从 Bradley-Terry 模型推导 DPO 损失的来源（面试大加分）；GRPO 组内相对奖励免 critic 的思想。

- title: "复杂文档（表格/扫描件/图文混排）的 RAG 怎么做？"
  category: AI_APP
  difficulty: 3
  tags: ["RAG", "文档解析", "多模态"]
  position_tags: ["ai_app"]
  answer: |
    1. **问题本质**：RAG 的质量上限由**解析质量**决定——PDF 表格被解析成乱序文本、扫描件无文本层、双栏排版串行，检索自然不准。
    2. **分层解析策略**：
       - **文本型 PDF**：PyMuPDF 提文本 + 版面分析（标题层级/段落边界）保留结构；
       - **表格**：表格不切分！整表提取（camelot/pdftables 或 VLM 识别）转 Markdown/HTML 存储并单独索引，附"表格描述"文本供语义检索；
       - **扫描件/图片**：OCR（PaddleOCR）或 **VLM 直接理解**（图表转文字描述 + 数据抽取）；
       - **图文混排**：图片单独入库（多模态 Embedding 或描述文本），正文引用处保留锚点。
    3. **版面感知切分**：按**阅读顺序**重组（双栏先分栏再串联）；标题路径拼进 chunk（"第 3 章 > 3.2 节 > 收入表"）；页码元数据保留用于溯源。
    4. **索引增强**：父子分块（表格摘要块命中 → 返回整表）；列式内容（财报数字）考虑 Text-to-SQL 路线而非向量检索。
    5. **加分点**：能讲"解析即护城河"——RAG 项目 60% 的效果差异来自文档管道；提 MinerU/Marker 等开源解析框架和版面检测模型（LayoutLM）。

- title: "RAG 的答案引用与溯源（citation）怎么实现？"
  category: AI_APP
  difficulty: 2
  tags: ["RAG", "引用溯源"]
  position_tags: ["ai_app", "agent"]
  answer: |
    1. **为什么必须**：RAG 的信任来自可验证——无引用的答案用户不敢用，错误无法追责；企业场景合规硬要求。
    2. **实现三层**：
       - **检索层**：chunk 携带完整元数据（文档名、章节路径、页码、URL anchor）——入库时就规划好，检索结果天然带出处；
       - **Prompt 层**：给检索片段编号 [1][2][3]，指令要求"每个论点标注来源编号，资料未覆盖就说不确定"——模型输出内联引用；
       - **展示层**：解析输出中的 [n] 映射到原文，前端渲染可点击引用；悬浮展示原文片段高亮（页码定位用 PDF.js）。
    3. **可信增强**：**引用校验**——模型声称的引用与实际检索片段做相似度校验，防"假引用"（幻觉引用编号）；答案句子级归因（每个句子标注依据片段，NLI 模型或 LLM judge 校验忠实度）。
    4. **产品化细节**：引用失败降级（无引用答案标记"仅供参考"）；多文档冲突时并列展示双方观点；点击率高但被质疑的引用回流评测集。
    5. **加分点**：能讲 GraphRAG 式的"来源聚合"（一个结论对应多跳证据链）；提"引用即产品力"——Perplexity 的核心体验就是溯源。

- title: "AI 网关是什么？多模型路由、降级、预算控制怎么做？"
  category: AI_APP
  difficulty: 3
  tags: ["AI网关", "架构", "多模型"]
  position_tags: ["ai_app", "agent", "backend"]
  answer: |
    1. **为什么需要**：应用直接调 LLM API 的问题——多供应商接口不一、模型故障/限流无常备应对、成本无管控、无统一观测。**AI 网关 = LLM 时代的 API 网关**，应用只对网关说话。
    2. **核心能力**：
       - **统一协议**：对外一个 OpenAI 兼容接口，内部适配 OpenAI/Anthropic/国产模型——换模型零代码改动；
       - **路由**：按任务（embedding/chat/vision）、成本（便宜模型优先）、质量（评测分）、租户分级路由；语义路由（意图→擅长模型）进阶；
       - **降级与重试**：主模型超时/限流自动切备选（降级链：GPT-4o → 国产旗舰 → 小模型），重试带退避；**熔断**坏模型；
       - **预算与配额**：租户级 token 预算、按 feature 成本分摊、超额限流——成本失控的第一道闸；
       - **缓存**：语义缓存 + prompt 缓存透传；
       - **观测**：统一 trace、token 统计、质量抽检。
    3. **实现**：开源 OneAPI/Higress AI 网关/LiteLLM Proxy，或自建（httpx + 路由表 + 熔断器）；敏感场景支持私有化模型接入。
    4. **加分点**：能画"应用 → 网关（路由/缓存/预算/观测）→ 多模型供应商"的架构图；提"网关层做语义缓存命中可省 30%+ 成本"的量化意识。

- title: "提示词（Prompt）的版本管理怎么做？"
  category: AI_APP
  difficulty: 2
  tags: ["Prompt管理", "工程化"]
  position_tags: ["ai_app", "agent"]
  answer: |
    1. **为什么要管理**：prompt 是 AI 应用的"源代码"——改一个字效果天差地别；散落在代码里无法追溯"线上效果变化是谁改了什么"；多人协作互相覆盖。
    2. **版本管理实践**：
       - **集中存储**：prompt 存 DB/配置中心（Nacos），按 key + 版本管理，应用启动/热更拉取——改 prompt 不用发版；
       - **代码化**：重要 prompt 进 git（模板文件 + 变量插值），PR 评审 + 评测回归门禁——prompt 变更 = 代码变更同等级对待；
       - **元信息**：每个版本记录作者、变更原因、适用模型、评测分数。
    3. **评测门禁**：prompt 改动必须跑评测集（离线回归：旧版本 vs 新版本分数对比 + 关键 case 通过率）；LLM-as-judge 自动评分 + 人工抽检边界 case；不达标不发布。
    4. **线上策略**：A/B 灰度（按流量比例分流新旧版本，对比线上质量代理指标）；回滚开关（秒级切回旧版）；prompt 与模型版本绑定记录（trace 里全带上，出问题可归因）。
    5. **加分点**：提 prompt 管理平台（Langfuse Prompt Management/LangSmith Hub）；"prompt 是资产要像代码一样 CI"的理念表达。

- title: "什么是 Agentic RAG？和传统 RAG 的区别？"
  category: AGENT
  difficulty: 3
  tags: ["Agentic RAG", "RAG", "架构"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **传统 RAG 是固定管线**：检索一次 → 拼prompt → 生成。三个先天缺陷：检索查询就是原始问题（不优化）、只检索一次（信息不够也硬答）、无自检（检索到噪声也照用）。
    2. **Agentic RAG = 把 RAG 交给 Agent 循环**：LLM 自主决策——**改写 query**（多角度拆解）→ 检索 → **评估结果**（相关吗？够吗？）→ 不够就换关键词再查 / 换数据源（向量库/SQL/网页搜索）→ 信息充分才生成，不足就坦白说不知道。
    3. **实现形态**：检索作为工具（search_knowledge_base/query_database）进 Agent 工具列表；Self-RAG（模型自评是否需要检索、检索结果是否支持回答，用特殊 token 训练自适应）；CRAG（检索质量评估 + 纠正性检索，不够就补网页搜索）。
    4. **代价与适用**：多次 LLM 调用 → 延迟和成本翻倍；简单 FAQ 用传统 RAG 更快更省——**复杂多跳问题、多源数据、准确性敏感场景才值得 Agentic**。
    5. **加分点**：能讲"检索器也是可以优化的 agent 组件"（query planner 决定查哪个库）；提 Agentic RAG 与 Deep Research 的关系（后者是多轮 Agentic RAG + 报告生成）。

- title: "Agent 的前端交互怎么设计？（流式输出、思考过程、工具调用可视化）"
  category: AGENT
  difficulty: 3
  tags: ["Agent", "产品设计", "前端"]
  position_tags: ["agent", "fullstack", "ai_app"]
  answer: |
    1. **核心矛盾**：Agent 一次任务跑几十秒到几分钟，没有好的进度呈现 = 用户以为卡死。**把"过程"变成产品体验**是 Agent 产品的第一 UX 问题。
    2. **事件流协议**：后端按阶段推送结构化事件（SSE）——`thinking`（思考摘要）/ `tool_call`（调用什么工具+参数）/ `tool_result`（结果摘要）/ `message_delta`（最终回答 token）/ `done`——前端按事件类型渲染不同卡片。
    3. **可视化层次**：
       - **折叠的思考链**：默认收起"正在分析文档结构…"一行，点击展开——透明但不轰炸；
       - **工具调用卡片**：图标+工具名+关键参数+耗时+结果摘要（点击看原始返回）——建立信任与可解释；
       - **进度里程碑**：复杂任务显示计划步骤 checklist（planner 输出），完成打钩；
       - **最终回答流式渲染** + 引用角标。
    4. **中断与控制**：随时"停止"按钮（终止任务）、危险工具调用前弹确认（HITL）、任务可后台化（跑完通知）。
    5. **工程要点**：事件丢失重连（Last-Event-ID 续传）、长任务轮询兜底、敏感参数脱敏后再展示。
    6. **加分点**：参考 Claude Code/Devin 的界面范式（终端流 + 步骤折叠）；提"过度展示思考过程反而降低信任"的产品判断——分级透明。

- title: "代码解释器（Code Interpreter）类工具怎么安全实现？"
  category: AGENT
  difficulty: 3
  tags: ["沙箱", "代码执行", "安全"]
  position_tags: ["agent", "backend"]
  answer: |
    1. **为什么危险**：Agent 生成的代码 = 任意程序——读写文件、发起网络请求、消耗资源、攻击内网。**执行生成代码等于给模型一个 shell**，必须有硬隔离。
    2. **沙箱方案对比**：
       - **容器隔离（主流）**：每会话/每任务一个 Docker 容器（gVisor/Kata 增强隔离）——文件系统只读挂载白名单、**无网络或仅白名单出网**、CPU/内存/超时限额、执行完销毁；
       - **microVM（Firecracker）**：更轻更强的 VM 级隔离，多租户生产标准；
       - **WASM**：秒级启动、天然权限系统，适合纯计算（Python 解释器 wasm 版生态仍在成熟）；
       - 云托管方案：E2B、Modal 等沙箱即服务。
    3. **权限最小化清单**：禁止 subprocess/eval 危险调用（静态检查预过滤）；网络默认禁（要联网取数据走受控代理）；资源配额（CPU 秒数/内存/磁盘）；输出截断（防止日志风暴）。
    4. **工程细节**：代码先静态扫描（AST 检查危险 import/调用）再执行；执行结果结构化返回（stdout/文件产物/artifact URL）；长任务异步执行 + 超时强杀；产物存对象存储给前端展示（图表文件）。
    5. **加分点**：能讲"解释器工具让 Agent 从'会说'到'会做'——数据分析、图表生成、公式验证的质变"；提 OpenAI Code Interpreter / Claude analysis tool 的产品形态。

- title: "多模态 Agent 有哪些应用形态？"
  category: AGENT
  difficulty: 3
  tags: ["多模态", "VLM", "应用"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **形态谱系**（按交互媒介）：
       - **视觉理解 Agent**：截图诊断（把报错截图给 Agent 定位 bug）、UI 自动化测试（看屏幕操作页面）、单据/合同审核流水线（OCR+理解+校验规则）；
       - **GUI 操作 Agent**：VLM 看屏幕 + 模拟点击——电脑操作员（Anthropic computer use）、RPA 的 AI 化，浏览器 Agent 完成网页任务；
       - **设计/内容 Agent**：设计稿检查（对照规范找问题）、图表生成与解读、视频剪辑脚本（抽帧理解+素材编排）；
       - **具身/机器人 Agent**：VLA 模型（视觉-语言-动作）操控机械臂、家庭机器人任务规划。
    2. **技术栈要点**：视觉编码器 + LLM 的融合（LLaVA 式投影 or 原生多模态 GPT-4o/Qwen-VL）；**坐标定位能力（grounding）**是 GUI Agent 的命门（点哪都得准）；视频 = 抽帧策略 + 时序建模。
    3. **工程挑战**：图像 token 成本高（上下文预算管理）；实时性（GUI Agent 需低延迟决策）；安全（屏幕含敏感信息、误操作真实系统——高危动作确认）。
    4. **落地建议**：从"看+说"（理解类）起步最容易，"看+操作"（GUI 自动化） ROI 高但稳定性工程量大——按容错率选场景。
    5. **加分点**：能举"UI 自动化测试 Agent 替代传统脚本维护"这类高价值场景；提 VLM 的空间推理短板对坐标类任务的影响。

- title: "Agent 长期记忆的更新冲突怎么处理？"
  category: AGENT
  difficulty: 3
  tags: ["记忆", "一致性"]
  position_tags: ["agent"]
  answer: |
    1. **冲突来源**：信息会过时（"用户在杭州"→ 搬到上海）、矛盾（两次偏好相反）、重复（同一事实多种表述）、并发写（多 Agent/多会话同时更新同一用户画像）。
    2. **写侧策略**：
       - **结构化优先**：记忆存结构化字段（key-value/图谱三元组）而非自由文本——更新时**按 key 覆盖 + 保留时间戳**，天然解决"过时"；
       - **冲突检测**：新记忆入库前检索相似旧记忆（向量+语义判断），LLM 判定关系：更新/补充/矛盾/无关——矛盾时**新信息优先 + 保留历史**（时间线）；
       - **版本化**：记忆带版本与来源（哪次会话写入），可回溯可回滚。
    3. **并发写**：用户画像等热点 key 用 Redis 分布式锁或队列串行化写；多 Agent 共享记忆走统一"记忆服务"（写接口内置冲突合并），而不是各 Agent 直写库。
    4. **读侧兜底**：检索时按相关度+新鲜度加权（时间衰减因子）；矛盾记忆都召回时让 LLM 基于时间线推理（"用户 3 月说 A、6 月说 B，最新为准"）。
    5. **遗忘机制**：访问频次衰减 + 容量上限淘汰（LRU）——记忆库不治理会退化成噪音库，反而降低效果。
    6. **加分点**：提 Letta/MemGPT 的分层记忆管理实践；"记忆一致性是长期记忆从 demo 到产品的分水岭"这个判断。

- title: "Agent 的评测集怎么自动构建？"
  category: AGENT
  difficulty: 3
  tags: ["评测", "数据", "自动化"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **为什么要自动构建**：手写评测集慢且覆盖偏；线上真实 bad case 是最珍贵的种子——**自动放大 + 持续更新**才能跟上迭代节奏。
    2. **构建路径**：
       - **从真实流量采样**：按场景/难度分层抽样线上请求（避免全是简单 case），脱敏后入评测池；
       - **LLM 变异生成**：对种子任务做改写（换说法/加约束/加干扰条件/构造陷阱）生成变体——LLM-as-data-augmenter；
       - **Bad case 回流**：线上失败 case 经人工标注根因后进评测集（最重要的来源）；
       - **对抗生成**：专门构造"容易翻车"的输入（模糊指令、多约束冲突、诱导性提问）。
    3. **标注与判据**：任务目标明确时用**程序化验收**（代码跑通/查询结果匹配）；开放任务用 LLM-as-judge + 人工校准 judge（judge 与人工的一致率达标才用）；偏好对数据支持 pairwise 评估。
    4. **质量保障**：去重（语义相似度过滤）、难度分层标注、定期清洗过时 case（依赖外部状态的任务失效）、judge 的偏差监控（长度偏好/自我偏好）。
    5. **加分点**：提"评测集即产品需求"——它定义了什么叫"好"；合成数据 + 真实流量的配比控制（全合成会让模型过拟合评测分布）。

- title: "AI 应用/Agent 的成本怎么核算与优化降级链路设计？"
  category: AGENT
  difficulty: 3
  tags: ["成本", "降级", "工程化"]
  position_tags: ["agent", "ai_app", "backend"]
  answer: |
    1. **先核算再优化**：按 feature/租户维度记录每次调用的 token 消耗与模型单价（网关埋点）——得出**单次任务成本**与**单用户成本**；Agent 场景注意"一个任务 = N 次调用"的乘数效应（一次 Deep Research 可能 20+ 次调用）。
    2. **成本大头与优化顺序**：
       - **Prompt 瘦身**：历史压缩、工具结果截断、检索片段精选——直接乘以调用次数；
       - **模型路由**：简单步骤小模型、关键决策大模型（级联路由）；同任务换性价比模型（评测对比后切换）；
       - **缓存**：语义缓存（相似问题复用答案）+ Prompt 前缀缓存（系统指令部分折扣价）；
       - **批量与异步**：离线任务走 batch API（半价）。
    3. **降级链路设计**（可用性 × 成本平衡）：
       - L1 主链路：旗舰模型 + 完整工具集；
       - L2 降级：主模型限流/故障 → 次旗舰模型；
       - L3 兜底：小模型 + 精简工具 + 缩短输出；
       - L4 有损服务：缓存答案/规则模板/引导人工。
       - 每级有明确触发条件（错误率/延迟/预算）与自动切换，网关统一实现。
    4. **预算护栏**：会话级 token 上限（超出截断或提示）、租户月度配额、异常消耗告警（防刷/防循环调用事故）。
    5. **加分点**：能算一道具体账（Agent 任务 10 次调用 × 8K token × 价格 = 单次成本，月活用户的毛利倒推模型选型）；提"成本是产品竞争力"的定价思维。

- title: "生产级 Agent 出了事故怎么复盘？方法论是什么？"
  category: AGENT
  difficulty: 3
  tags: ["事故复盘", "运维"]
  position_tags: ["agent", "backend"]
  answer: |
    1. **Agent 事故的特有形态**：模型升级后行为漂移（隐性回归）、循环调用烧钱、工具误操作引发业务事故（发错消息/错误下单）、注入攻击导致越权、上下文污染输出错乱。
    2. **应急三步（先止血）**：
       - **止损开关**：功能降级开关（切规则/模板/缓存答案）、模型版本秒切回滚、预算熔断自动触发；
       - **定位**：拉 trace 看完整轨迹（哪一步决策错、输入是什么）——没有 trace 的 Agent 事故没法查；
       - **影响面评估**：这次事故影响了哪些用户/多少数据（工具调用日志反查）。
    3. **复盘框架**：时间线还原 → 根因分析（5 Why：为什么选错工具→为什么工具描述误导→为什么 review 没发现）→ 责任归为**系统而非模型**（模型不可靠是前提，防线缺失才是根因）→ 改进项闭环（prompt 修复 + 回归评测集 + 增加校验环节）。
    4. **沉淀为防线**：每次事故至少产出——一个回归评测 case、一条监控告警规则、一个防护机制（如新增人工确认点）；建立"事故 → 评测集"的自动回流。
    5. **文化**：无责复盘（blameless）聚焦系统改进；Agent 事故率随评测覆盖率上升而下降——用数据说话。
    6. **加分点**：能举一个具体案例结构（现象→定位→根因→防线）；提"模型热更新即生产变更"的认知——模型/prompt/工具三者任一变更都该走变更流程。

- title: "Claude Code 为什么不用 RAG 检索代码？agentic search 和 RAG 的取舍？"
  category: AGENT
  difficulty: 3
  tags: ["Claude Code", "代码检索", "架构"]
  position_tags: ["agent", "ai_app"]
  answer: |
    1. **问题背景**：代码库检索用传统 RAG（按文件/函数切块 → embedding → 检索）效果差——代码语义连续性强（跨文件依赖、命名一致性），切块破坏上下文；且代码改动频繁，索引实时性差。
    2. **Agentic Search 的做法**：不建索引，让 Agent 用**基础工具主动探索**——`grep`（正则搜关键词/标识符）、`glob`（文件模式）、`read`（精确读文件片段）——像人类工程师一样"先 grep 符号名，再打开相关文件看上下文"，多轮迭代收敛到目标代码。
    3. **为什么反而更好**：
       - **精确检索**：代码检索大多是**精确符号匹配**（找函数定义/调用点），grep 天然 100% 准确，而 embedding 语义检索对精确匹配反而模糊；
       - **零索引维护**：无建库成本、无时效问题、新代码立即可查；
       - **上下文可控**：Agent 按需读取相关片段，且带着"为什么读"的推理上下文；
       - 代价：多轮工具调用耗时与 token 成本——但对"准确性 > 速度"的编码场景值得。
    4. **什么场景仍用 RAG**：自然语言语义检索（"找处理退款的代码"且词面不匹配）、超大规模代码库的粗定位、非代码语料（文档/日志）。**混合策略**：语义检索粗召回 → agentic grep 精确定位。
    5. **加分点**：能讲清"agentic search 把检索从'一次向量查询'变成'带推理的迭代探索'"这一范式转变；联系 Deep Research 同样是 agentic search 思想。

- title: "前端错误监控体系怎么搭建？sentry 和 sourceMap 怎么用？"
  category: FULLSTACK
  difficulty: 3
  tags: ["前端监控", "sentry", "sourceMap"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **监控什么**：JS 运行时错误（window.onerror/unhandledrejection）、资源加载失败、接口错误率与耗时、白屏检测、性能指标（web-vitals 上报）、自定义业务异常。
    2. **采集 SDK**：自研（钩子全局错误 + 性能 API）或 Sentry（专业：自动聚合、指纹去重、 release 标记、面包屑回放、session replay）。上报要点：错误堆栈 + 设备/浏览器/版本 + 用户 id（脱敏）+ release 版本 + 采样率控制（错误 100%，性能 1~10%）。
    3. **sourceMap 关键链路**：生产构建生成 .map 文件**不上传到 CDN**（防源码泄露）→ 构建后上传到 Sentry（sentry-cli 或 webpack 插件）→ Sentry 用它把压缩堆栈还原成源码行号。**版本对齐**：release 名必须与 sourcemap 匹配，否则还原错乱。
    4. **告警闭环**：新错误（fingerprint 首次出现）即时告警（飞书/钉钉 webhook）；错误率与版本发布联动（发版后 1h 错误率对比）；issue 指派与修复状态流转。
    5. **加分点**：CSP report-only 模式发现 XSS 风险；跨域脚本错误 "Script error." 的解决（crossorigin 属性 + CORS 头）；错误聚合 fingerprint 的自定义规则。

- title: "前端埋点怎么做？三种方式与数据管道？"
  category: FULLSTACK
  difficulty: 3
  tags: ["埋点", "数据分析"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **三种埋点方式**：
       - **代码埋点**：业务代码里手动调用上报（精确、语义清晰；开发成本高、改版要发版）；
       - **全埋点（无痕埋点）**：SDK 自动采集所有点击/曝光/页面浏览（快、全；数据噪音大、语义弱、量大）；
       - **可视化埋点**：后台圈选页面元素配置上报（运营自助、免发版；依赖 DOM 稳定性，重构就失效）。
       - 实践组合：核心转化路径代码埋点（保证质量）+ 全埋点兜底探索。
    2. **采集内容**：事件名 + 属性（用户 id 匿名化、来源渠道、AB 实验分组、时间戳、设备）+ 性能与错误事件共用管道。
    3. **上报工程**：批量合并（队列 + sendBeacon 页面卸载兜底）、失败重试本地缓存、采样率分层（核心事件全量）、上报 SDK 独立 npm 包统一治理。
    4. **数据管道**：前端 → 收集网关（nginx log 或 kafka）→ 清洗（schema 校验/去重）→ 数仓（ODS→DWD→报表）→ BI/自助分析（神策/GrowingIO 自建 ClickHouse）。
    5. **质量治理**：埋点规范文档 + code review 卡点、埋点验证平台（实时校验上报是否进库）、元数据管理（事件字典）。
    6. **加分点**：sendBeacon 与 fetch keepalive 的区别；AB 实验数据与埋点打通（分组上报）；隐私合规（同意管理、匿名化）。

- title: "SSR、SSG、ISR 的区别是什么？水合（Hydration）是怎么回事？"
  category: FULLSTACK
  difficulty: 3
  tags: ["SSR", "SSG", "水合"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **三种渲染模式**：
       - **CSR（客户端渲染）**：浏览器下载空壳 JS → 拉数据 → 渲染。白屏时间长、SEO 差；服务器零成本；
       - **SSR（服务端渲染）**：每次请求在服务端渲染出 HTML 直出——首屏快、SEO 好；服务器有计算成本（Node 服务 + 缓存）；
       - **SSG（静态生成）**：构建时预渲染所有页面成静态 HTML（CDN 分发，最快）；内容固定场景（官网/博客/文档）；
       - **ISR（增量静态再生，Next.js）**：静态页 + 后台按 TTL 重新生成——静态的速度 + 准实时的内容，电商商品页利器。
    2. **水合（Hydration）**：SSR 输出的 HTML 只是"死"的——JS 加载后 React/Vue 在客户端**重建组件树并绑定事件**，让页面"活"起来。这一步要求客户端 JS 与服务端渲染结果**一致**，不一致就报 hydration mismatch（常见：服务端与客户端时间/随机值不同）。
    3. **水合的问题与演进**：整页水合阻塞交互（页面可见但点不动）——**渐进式水合/选择性水合**（React 18 流式 SSR + Suspense 分块水合）、**岛屿架构**（Astro：静态为主，交互组件单独水合）、Resumability（Qwik：不重执行，直接恢复）。
    4. **选型**：内容型 + SEO → SSG/ISR；动态个性化 → SSR（加缓存）；工具型后台 → CSR 足够。
    5. **加分点**：能讲 SSR 的双请求问题（服务端拉数据影响 TTFB）与缓存层设计；hydration mismatch 的典型 bug（Date.now/随机数/浏览器判断）。

- title: "移动端适配方案有哪些？rem、vw、响应式怎么选？"
  category: FULLSTACK
  difficulty: 2
  tags: ["移动端", "适配"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **rem 方案（经典）**：html font-size 随屏宽缩放（JS 设置或 postcss-pxtorem + flexible），设计稿 px 按比例转 rem——等比缩放，一稿适配所有宽度。坑：需要 JS 初始化、极端宽高比失真。
    2. **vw/vh 方案（现代主流）**：纯 CSS，postcss-px-to-viewport 把 px 编译成 vw——无 JS、无闪烁；同样等比缩放。
    3. **响应式布局（逻辑适配）**：flex/grid + 媒体查询 + clamp()——不同断点不同布局（PC/平板/手机各自最优）而非机械等比。内容型页面推荐。
    4. **选型**：营销页/H5 活动页（视觉还原优先）→ rem/vw 等比；中后台/内容站（可读性优先）→ 响应式断点；小程序同原理（rpx 是 rem 变体）。
    5. **其他细节**：viewport meta（width=device-width + 禁缩放按需）、1px 边框问题（transform scaleY / 边框图片）、安全区域 env(safe-area-inset-*)（刘海屏）、移动端 300ms 点击延迟已成历史（现代浏览器 + touch-action）。
    6. **加分点**：dpr 与物理像素/逻辑像素的关系；图片响应式（srcset + sizes）配合适配方案；等比方案下大屏（iPad）字号过大的权衡。

- title: "组件库/设计系统怎么建设？"
  category: FULLSTACK
  difficulty: 3
  tags: ["组件库", "设计系统"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **设计系统 = 设计语言 + 组件库 + 使用规范**：色板/字阶/间距 token（design tokens 统一管理，设计工具与代码同源）+ 可复用组件 + 文档站（Storybook）。
    2. **组件库工程**：
       - **Monorepo 管理**（pnpm workspace）：packages/ui（组件）、icons、hooks、docs 分包；
       - **组件开发**：TypeScript 类型完备、受控/非受控双模式、CSS 方案（CSS-in-JS / CSS 变量主题化 / utility class）、无障碍（a11y：键盘导航/ARIA/对比度）；
       - **质量**：Storybook 可视化 + 视觉回归测试（Chromatic/Playwright screenshot）+ 单测（交互逻辑）+ a11y 自动检查。
    3. **发布与消费**：语义化版本（breaking 变更走 major + 迁移指南）、CHANGELOG 自动生成、私仓发布（npm/CDN）、按需加载（tree-shaking 或 unplugin 按需引入）。
    4. **推广与治理**：组件库的价值在"被用起来"——贡献流程（RFC 评审新组件）、版本升级支持、使用率统计（埋点或依赖扫描）反哺优先级；与 Figma 设计侧建立 token 同步管道。
    5. **加分点**：headless 组件（Radix/Headless UI）思路——逻辑与样式分离的灵活度；多品牌多主题的 CSS 变量方案；"设计系统是产品，运营它比开发它更重要"。

- title: "前端测试策略怎么做？单测/集成/E2E 的比例？"
  category: FULLSTACK
  difficulty: 2
  tags: ["测试", "测试金字塔"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **测试金字塔**：单元测试（多、快、便宜）→ 集成测试（适量）→ E2E（少、慢、贵但保真实路径）。前端特有：大量 UI 细节不值得单测，**逻辑抽离后测逻辑**（hooks/utils/状态机）。
    2. **分层工具与实践**：
       - **单元**：Vitest/Jest 测纯函数、hooks（renderHook）、reducer；组件单测选择性做（复杂交互组件）——Testing Library 理念"测行为不测实现"（getByRole 按可访问性查询）；
       - **集成**：整组件树渲染 + mock 接口（MSW 拦截网络层）——性价比最高的前端测试层；
       - **E2E**：Playwright（多浏览器、自动等待、trace 调试，事实标准）——只覆盖核心路径：登录、下单、支付主流程；CI 里跑关键浏览器矩阵。
    3. **其他必配**：TypeScript（编译期一大半 bug）、ESLint 规约、视觉回归（组件库/关键页面截图 diff）、可访问性测试（axe 自动扫描）。
    4. **比例与投入**：新项目目标覆盖率 60~80%（核心模块 100%，展示性组件不硬凑）；遗留系统从"改哪测哪"起步；测试代码也是资产要维护——脆弱测试（依赖实现细节）负价值。
    5. **加分点**：MSW 在 dev 环境复用（mock 即文档）；flaky E2E 的治理（重试 + 隔离数据 + 失败截图 trace）；测试左移（需求评审时定验收标准 → 直接变成 E2E 断言）。

- title: "什么时候该把单体拆成微服务？拆分原则是什么？"
  category: FULLSTACK
  difficulty: 3
  tags: ["微服务", "架构演进"]
  position_tags: ["backend", "fullstack", "java"]
  answer: |
    1. **默认答案是"不拆"**：微服务的真实成本——分布式事务、运维复杂度（服务发现/链路/部署 ×N）、网络故障面扩大、团队协作接口成本。**单体优先**（模块化单体：清晰的模块边界 + 接口隔离），等痛点了再拆。
    2. **拆分信号（痛点驱动）**：
       - **独立伸缩需求**：某模块流量特征迥异（如导出服务吃内存）需单独扩容；
       - **独立部署节奏**：多团队改同一仓库互相阻塞（发布火车问题）；
       - **技术栈差异化**：AI 服务要 Python、交易要 Java；
       - **故障隔离**：一个模块 OOM 拖垮全站。
    3. **拆分原则**：
       - **按业务能力拆**（订单/商品/库存/用户），不按技术分层拆（DAO 服务/Service 服务是反模式）；
       - **围绕限界上下文**（DDD）：一个服务一个领域、独立数据库（禁止跨库 join，走接口/冗余）；
       - **先拆"最疼的"**：绞杀者模式渐进拆（新功能新服务 + 老模块逐步迁移），不做大爆炸重写；
       - 拆之前先把**可观测性**铺好（trace/监控），否则拆完是黑洞。
    4. **配套门槛**：CI/CD 成熟、容器化（K8s）、服务治理（注册发现/熔断限流）、API 契约管理——没这些先补课再拆。
    5. **加分点**：能讲"分布式单体"反模式（拆了服务还共享数据库 = 所有成本都付了没收益）；Amazon 两披萨团队的组织驱动逻辑；康威定律——服务边界最终跟随团队结构。

- title: "数据库 schema 变更（migration）怎么做才安全？"
  category: FULLSTACK
  difficulty: 2
  tags: ["migration", "DDL", "发布"]
  position_tags: ["backend", "fullstack", "dba"]
  answer: |
    1. **核心原则：schema 变更 = 代码变更，走同样的版本化与评审流程**——migration 文件进 git、编号有序、只增不改（已应用的 migration 永不修改）。
    2. **工具**：Flyway/Liquibase（Java）、Alembic（Python/SQLAlchemy）、golang-migrate；CI 里自动执行 + 记录版本表。
    3. **向后兼容铁律（支持滚动发布）**：部署是多实例灰度的，**新代码要能在旧 schema 上跑、旧代码要能在新 schema 上跑**——
       - 加列：先加可空/带默认值列（8.0 INSTANT 秒级），发布新代码用，老代码不感知；
       - 改列类型/改名：新增列 → 双写迁移 → 切读 → 删旧列（多版本周期）；
       - 删列：最后一步，确认所有版本不再读写后才删。
    4. **大表 DDL**：Online DDL 确认 ALGORITHM/LOCK（加索引 INPLACE、改类型可能 COPY）；超大表上 gh-ost/pt-osc；低峰执行 + 主从延迟监控。
    5. **配套**：变更前备份（可回滚点）、DDL 审核工具（防止全表更新类语句混入）、回滚脚本（加列可 DROP，但删列前数据要归档）。
    6. **加分点**：expand-contract 模式命名；migration 与 ORM 模型的一致性校验（CI diff schema）；多环境（dev/test/prod）迁移顺序与 feature flag 配合。

- title: "图片优化专题：格式选择、懒加载、响应式图片怎么做？"
  category: FULLSTACK
  difficulty: 2
  tags: ["图片优化", "性能"]
  position_tags: ["fullstack", "frontend"]
  answer: |
    1. **格式选择**：
       - **WebP**：比 JPEG 省 25~35%，全浏览器支持（事实标准）；**AVIF** 更激进（省 50%），编码慢，渐进引入（picture 标签优先级回退）；
       - JPEG：照片兜底；PNG：需要透明/图形；SVG：图标矢量（体积小无限缩放）；
       - 服务端按 Accept 头自动协商格式（CDN 图片处理能力：`?format=webp`）。
    2. **响应式图片**：`srcset` 多分辨率 + `sizes` 描述布局宽度，浏览器选最合适的下载——不浪费流量不下超大图；`<picture>` 处理格式回退与艺术指导（不同断点裁剪不同构图）。
    3. **懒加载**：`loading="lazy"` 原生属性（视口外不加载）；首屏图相反要 `fetchpriority="high"`/preload 提升优先级（LCP 优化）。
    4. **其他关键手段**：尺寸压缩（缩到实际显示尺寸再传）、CDN 图片处理参数（裁剪/质量/格式一行 URL 搞定）、占位策略（低清 blurhash / 主色占位防布局跳动 CLS）、雪碧图已被 HTTP/2 多路复用+SVG 淘汰、图标统一 SVG symbol。
    5. **排查工具**：Lighthouse 图片审计项、DevTools Network 按类型过滤看浪费（下载了没显示的图）。
    6. **加分点**：图片通常是页面流量 60%+——优化 ROI 最高；能讲 AVIF 渐进增强的实现（picture + type 属性）；LCP 图片专用优化（preload + 高优先级 + 不 lazy）。
