# Java 基础经典面试题
- title: "HashMap 的底层实现原理？put 一个元素的流程是怎样的？"
  difficulty: 2
  tags: ["HashMap", "集合"]
  position_tags: ["java"]
  answer: |
    1. **底层结构（JDK8）**：数组 + 链表 + 红黑树。数组每个槽位是 Node；哈希冲突挂链表，链表长度 ≥8 且数组长度 ≥64 时转红黑树（查询 O(logN)），节点减少到 6 退化回链表。
    2. **put 流程**：
       - 计算 hash：`(h = key.hashCode()) ^ (h >>> 16)`——高 16 位异或低位，让高位也参与寻址，减少冲突；
       - 定位桶：`(n-1) & hash`（n 为数组长度）；
       - 桶为空直接放；不为空则比较首节点 key 相同就覆盖；是树节点走树插入；否则遍历链表尾插（JDK8 改尾插，JDK7 头插在并发扩容会成环死循环）；
       - 链表长度达阈值转红黑树；
       - size 超过 `容量 × loadFactor`（默认 16×0.75=12）触发扩容为 2 倍。
    3. **扩容**：新建 2 倍数组，JDK8 优化：元素新位置要么原下标、要么原下标+旧容量（看 hash 新增的那个 bit）。

- title: "HashMap 在 JDK7 和 JDK8 有什么区别？为什么容量必须是 2 的幂？"
  difficulty: 2
  tags: ["HashMap", "JDK8"]
  position_tags: ["java"]
  answer: |
    1. **结构**：7 是数组+链表；8 加入红黑树防哈希碰撞攻击（极端情况链表退化成 O(n)）。
    2. **插入**：7 头插法（并发扩容可能成环死循环）；8 尾插法。
    3. **扩容迁移**：7 重新 hash 逐个搬；8 按高低位拆成 lo/hi 两条链，位置要么不变要么 +oldCap，更快。
    4. **hash 扰动**：8 加了高 16 位异或，7 只有简单的 hash 混合。
    5. **为什么容量是 2 的幂**：`(n-1) & hash` 等价于取模但位运算快得多；且 2 的幂保证 (n-1) 二进制全 1，散列均匀；扩容 2 倍时元素只需判断一个 bit 就能确定新位置。

- title: "ConcurrentHashMap 如何保证线程安全？JDK8 相比 JDK7 做了哪些改进？"
  difficulty: 3
  tags: ["ConcurrentHashMap", "并发"]
  position_tags: ["java"]
  answer: |
    1. **JDK7：分段锁 Segment**：默认 16 段，每段继承 ReentrantLock 锁一段数组，并发度 = 段数；size() 要多次统计。
    2. **JDK8：CAS + synchronized 锁单桶**：
       - 桶为空：CAS 插入新节点；
       - 桶非空：synchronized 只锁该桶的头节点，锁粒度从"段"细化到"桶"，并发度 ≈ 数组长度；
       - 扩容时支持**多线程协助迁移**（每个线程认领一段桶区间），并把正在迁移的桶标记 ForwardingNode，读操作顺路访问新表。
    3. **size 统计**：baseCount + CounterCell[] 分段计数（类似 LongAdder），避免单点 CAS 竞争。
    4. **读无锁**：Node 的 val 和 next 用 volatile 保证可见性，get 全程不加锁。
    5. **注意**：key/value 都不允许 null（并发下 null 语义有歧义，containsKey 与 get 无法区分"不存在"和"值为 null"）。

- title: "== 和 equals 的区别？为什么重写 equals 必须重写 hashCode？"
  difficulty: 1
  tags: ["equals", "hashCode"]
  position_tags: ["java", "python"]
  answer: |
    1. **==**：基本类型比值；引用类型比地址（是否同一个对象）。
    2. **equals**：Object 默认实现就是 ==；String 等类重写成"比较内容"。可重写自定义相等逻辑。
    3. **必须同时重写 hashCode**：HashMap/HashSet 的契约是 **equals 相等 ⇒ hashCode 必须相等**。只重写 equals 不重写 hashCode，两个"相等"的对象 hashCode 不同，会被哈希容器放到不同桶里——`set.contains(new的相等对象)` 返回 false、HashMap 出现两个"相同"的 key。
    4. **规范**：hashCode 相等对象不一定 equals（哈希冲突允许）；equals 相等 hashCode 必须相等；IDE 生成或用 Lombok @EqualsAndHashCode 保证一致性。

- title: "String、StringBuilder、StringBuffer 的区别？String 为什么设计成不可变？"
  difficulty: 1
  tags: ["String", "不可变"]
  position_tags: ["java"]
  answer: |
    1. **String**：不可变，内部 char[]/byte[] 被 final 修饰且不提供修改方法，每次拼接产生新对象。
    2. **StringBuilder**：可变，非线程安全，单线程拼接首选（性能最好）。
    3. **StringBuffer**：可变，方法 synchronized，线程安全但慢，几乎不用（并发拼接少见）。
    4. **String 不可变的原因**：
       - **常量池复用**：字符串常量池基于不可变，相同字面量共享一个对象省内存；
       - **hashCode 缓存**：String 的 hash 缓存在字段里，作为 HashMap key 计算一次即可；
       - **线程安全**：天然可安全共享；
       - **安全性**：类加载路径、数据库 URL 等用 String 传参，不可变防止被篡改。

- title: "接口和抽象类的区别？什么场景用哪个？"
  difficulty: 1
  tags: ["面向对象"]
  position_tags: ["java"]
  answer: |
    1. **语法**：接口的方法默认 public abstract（JDK8 后可有 default/static 方法，可有成员常量），成员变量只能常量，类可实现多个接口；抽象类可以有任意成员、构造器、状态，单继承。
    2. **语义**：抽象类表达 "**是什么**"（is-a，模板复用：把公共实现和状态放父类）；接口表达 "**能做什么**"（can-do，能力契约：Comparable、Serializable）。
    3. **选择**：需要共享代码和状态 → 抽象类（模板方法模式）；需要多继承效果、定义行为规范、面向解耦 → 接口。
    4. **实践**：框架里常见组合——接口定义对外契约 + 抽象类提供骨架实现（如 Spring 的 JdbcDaoSupport、List/AbstractList）。

- title: "Java 的异常体系？受检异常和非受检异常的区别？"
  difficulty: 1
  tags: ["异常"]
  position_tags: ["java"]
  answer: |
    1. **体系**：Throwable → Error（OOM、StackOverflow 等严重错误，程序不应捕获）和 Exception。Exception 分：
       - **受检异常（Checked）**：编译器强制 try-catch 或 throws，如 IOException、SQLException——可预期的外部故障，调用方必须处理；
       - **非受检异常（RuntimeException 及其子类）**：空指针、数组越界、类型转换——编程 bug，不强制捕获，修代码而不是 catch 掩盖。
    2. **实践**：不要用异常做业务流程控制；catch 里要么处理要么包装抛出，不要空 catch；自定义业务异常继承 RuntimeException；finally 中不要 return（会吞掉异常）。
    3. **性能**：异常构造时填充栈轨迹有开销，别在高频路径 throw-catch 当 if 用。

- title: "深拷贝和浅拷贝的区别？Java 有哪些实现深拷贝的方式？"
  difficulty: 1
  tags: ["拷贝", "面向对象"]
  position_tags: ["java", "python"]
  answer: |
    1. **浅拷贝**：复制对象本身，内部引用类型字段**共享同一对象**——改副本的引用字段会影响原对象。实现：实现 Cloneable 重写 clone()（Object.clone 默认浅拷贝）、拷贝构造器、BeanUtils.copyProperties（属性级浅复制）。
    2. **深拷贝**：引用字段也递归复制，完全独立。
    3. **实现方式**：
       - 所有引用字段都手动 clone（层层实现 Cloneable，繁琐易漏）；
       - **序列化反序列化**：对象转字节流再转回来（JSON、Java 原生序列化），最简单通用，性能较差；
       - 拷贝构造器手动 new 每个引用字段（清晰可控，推荐）。
    4. **注意**：不可变字段（String、Integer）不需要深拷贝；业务中更多用"重新 build 一个对象"代替 clone（Effective Java 不推荐 clone）。
