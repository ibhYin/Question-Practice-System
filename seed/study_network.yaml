category: NETWORK
doc:
  title: 计算机网络知识体系全景
  content: "计算机网络面试的主线，可以浓缩为一次请求的完整旅程：应用层 HTTP 走起，经传输层 TCP/UDP，穿过网络层 IP 与链路设备，全程由 TLS 护航，最后以排障能力收束。\n\n\
    **应用层：HTTP 与 HTTPS。** HTTP 是请求-响应协议，HTTP/1.1 的连接串行处理造成应用层队头阻塞，浏览器靠并发多条连接缓解；HTTP/2 用二进制帧与 Stream 多路复用解决应用层阻塞，但底层一条\
    \ TCP 仍让丢包阻塞所有流，QUIC/HTTP/3 基于 UDP 自建可靠传输才彻底解决。HTTPS 在 HTTP 与 TCP 之间插入 TLS：非对称加密（RSA/ECDHE）只做密钥协商与身份认证，对称加密（AES/ChaCha20）负责数据传输，CA\
    \ 签名的证书链回答「这个公钥真的是服务端吗」，TLS 1.3 用 ECDHE 实现 1-RTT 握手与前向安全。\n\n**传输层：TCP 与 UDP。** TCP 面向连接、可靠、字节流。建立连接靠三次握手——双方各确认一次发送与接收能力，SYN+ACK\
    \ 可合并所以三次足够；断开靠四次挥手——全双工两个方向各关一次，被动方 ACK 与 FIN 之间还要发完剩余数据；主动关闭方留在 TIME_WAIT 等 2MSL，保证最后的 ACK 可达并让旧报文消亡。可靠性由五道防线叠加：校验和、序列号加确认应答、超时重传与快速重传、滑动窗口流量控制、从慢启动到拥塞避免的拥塞控制。字节流没有消息边界，粘包拆包要靠应用层分帧——固定长度、分隔符、长度前缀、应用层自带结构四种方案，长度前缀最通用。UDP\
    \ 则无连接、面向报文、头部仅 8 字节，放弃可靠性换来低延迟与可控性，DNS、实时音视频与 QUIC 底座都是它的主场。\n\n**网络层与设备。** DNS 按浏览器缓存、系统缓存、本地 DNS、根与顶级域与权威域的层级把域名解析为\
    \ IP，CDN 正是在 DNS 层完成就近调度；数据包经路由器逐跳转发，负载均衡器与网关位于服务端入口。从输入 URL 到页面展示把以上全部串起来：DNS 解析 → TCP 握手 → TLS 握手\
    \ → HTTP 请求经负载均衡与网关到应用 → 响应回来后浏览器构建 DOM 与 CSSOM、布局绘制合成上屏。\n\n**排障主线。** 生产环境最常考的网络排障都围绕连接状态：大量 TIME_WAIT\
    \ 说明短连接泛滥，治本靠连接池与 Keep-Alive，tcp_tw_reuse 只能缓解；大量 CLOSE_WAIT 则说明应用忘了关闭连接。掌握 ss/netstat 看状态分布、沿 DNS/建连/传输分段定位慢点，是从背题走向实战的标志。记住总纲：应用层管语义与加密，传输层管可靠与效率，下层管可达，排障沿链路自上而下。\n\
    \n\n**实时通信：SSE 与 WebSocket。** 需要服务端主动推送时，轮询让位于两类长连接方案。SSE 是基于 HTTP 的单向事件流：`text/event-stream` 响应按 `id/event/data/retry` 字段分块，浏览器原生 EventSource 自带断线自动重连并携带 Last-Event-ID 请求头，服务端据此从历史队列补发实现断点续传；它复用 HTTP 鉴权与代理生态，是 LLM 流式输出（ChatGPT/Claude API）的事实标准，配合 HTTP/2 多路复用还能绕开 HTTP/1.1 同域 6 连接的限制。WebSocket 则是独立协议的双向全双工通道：HTTP Upgrade 握手（Sec-WebSocket-Accept = base64(sha1(key+魔法串))）后脱离 HTTP 语义，帧结构含 opcode/长度分级/掩码——客户端帧必须掩码以防透明代理的缓存投毒；ping/pong 控制帧做心跳，间隔必须小于 nginx proxy_read_timeout 与 LB 空闲超时。百万级连接的架构三部曲：接入层网关统一管连接、Redis pub/sub 或 Kafka 做跨实例广播扇出、按 uid 的粘性会话映射。选型一句话：服务端说客户端听选 SSE，双向对讲选 WebSocket，兼容性苛刻降级长轮询。\n\n### SSE 与 WebSocket 选型与流程\n\n```mermaid\nflowchart TD\n    A[需要实时推送] --> B{客户端也要高频发消息?}\n    B -- 否 --> C[SSE<br>单向事件流<br>自动重连+断点续传]\n    B -- 是 --> D[WebSocket<br>双向全双工<br>Upgrade 握手+心跳自管]\n    C --> E[复用 HTTP 生态<br>LLM 流式输出标准]\n    D --> F[网关管连接<br>Redis pub/sub 广播<br>粘性会话]\n    G[兼容性苛刻] --> H[长轮询降级]\n```\n\n# \U0001F4CC 知识速览图\n\n把上面正文的零散知识串成一张张图——先自己复述，再对照图检验。\n\n### TCP 三次握手与四次挥手\n\n```mermaid\nsequenceDiagram\n\
    \    participant C as 客户端\n    participant S as 服务端\n    Note over C,S: 建立连接（三次握手）\n    C->>S: SYN\
    \ (seq=x)\n    S->>C: SYN+ACK (seq=y, ack=x+1)\n    C->>S: ACK (ack=y+1)\n    Note over C,S: 数据传输\
    \ …\n    Note over C,S: 断开连接（四次挥手）\n    C->>S: FIN\n    S->>C: ACK\n    S->>C: FIN\n    C->>S: ACK\n\
    \    Note over C: TIME_WAIT 等 2MSL\n```\n\n### 从输入 URL 到页面展示\n\n```mermaid\nflowchart TD\n    A[输入\
    \ URL] --> B[DNS 解析<br>缓存 → 根 → 顶级域 → 权威]\n    B --> C[TCP 三次握手]\n    C --> D{HTTPS?}\n    D -- 是\
    \ --> E[TLS 握手]\n    D -- 否 --> F\n    E --> F[发送 HTTP 请求]\n    F --> G[服务端处理<br>网关 → 应用 → 缓存/DB]\n\
    \    G --> H[返回响应]\n    H --> I[浏览器渲染<br>DOM → CSSOM → 渲染树 → 绘制]\n```\n\n### HTTP 缓存决策链\n\n```mermaid\n\
    flowchart TD\n    A[发起请求] --> B{本地有缓存?}\n    B -- 无 --> F[请求服务器 200]\n    B -- 有 --> C{强缓存<br>max-age\
    \ 未过期?}\n    C -- 是 --> D[直接用缓存<br>不发请求 200 from cache]\n    C -- 已过期 --> E{协商缓存<br>ETag / Last-Modified}\n\
    \    E -- 未变 --> G[304 继续用本地]\n    E -- 已变 --> F\n```\n"
cards:
- title: TCP 三次握手的过程与三次的必要性
  content: 三次握手依次是客户端发 SYN（seq=x）、服务端回 SYN+ACK（seq=y，ack=x+1）、客户端再回 ACK（ack=y+1），连接建立。之所以是三次而不是两次，是因为双方都要确认自己的发送与接收能力：两次握手下服务端无法确认客户端能收到自己的报文，同时旧的重复
    SYN 会让服务端误建连接、白白占用资源。三次中 SYN+ACK 已经合并了服务端的 SYN 与对客户端的确认，因此四次握手可以压缩为三次，这是信息量最小且充分的方案。
  points:
  - SYN → SYN+ACK → ACK 三步完成双向能力确认
  - 两次握手无法确认服务端的发送与接收能力
  - 旧的重复 SYN 会误导服务端建连接浪费资源
  - SYN+ACK 可合并，四次压缩为三次
- title: TCP 四次挥手的过程与全双工语义
  content: 四次挥手对应全双工两个方向各关一次：主动方发 FIN，被动方先回 ACK——此刻被动方可能还有数据要发，进入半关闭状态继续发送；数据发完后被动方再发 FIN，主动方回 ACK 并进入
    TIME_WAIT，等待 2MSL 后才真正关闭。之所以 ACK 与 FIN 不能像握手的 SYN+ACK 那样合并，是因为中间隔着被动方发完剩余数据的时间窗口（被动方无数据可发时可合并为三次）。理解半关闭是理解四次的钥匙。
  points:
  - FIN → ACK → FIN → ACK 四步完成关闭
  - 被动方 ACK 与 FIN 之间可继续发数据（半关闭）
  - 关闭是全双工两个方向各关一次
  - 无数据可发时 ACK 与 FIN 可合并为三次
- title: TIME_WAIT 状态等待 2MSL 的两个原因
  content: TIME_WAIT 只出现在主动关闭方，持续 2MSL（Linux 通常 60 秒）。等 2MSL 有两个原因：一是确保最后的 ACK 可靠到达——若对方没收到 ACK 会重发 FIN，主动方还在TIME_WAIT
    就能重新应答；二是让本连接的旧报文在网络中自然消亡，避免旧序列号的报文串入复用同一四元组的新连接造成数据污染。MSL 是报文最大生存时间，两倍 MSL 保证来回两个方向的残留报文都死亡。
  points:
  - TIME_WAIT 属于主动关闭方，持续 2MSL（常 60s）
  - 保证最后的 ACK 丢失后可响应对方重发的 FIN
  - 让旧报文消亡，避免污染复用同一四元组的新连接
  - MSL 即报文最大生存时间
- title: 服务器大量 TIME_WAIT 的治理思路
  content: 大量 TIME_WAIT 说明本机在频繁主动断连，根因是每请求新建短连接：HTTP 短连接、每次新建 DB/Redis 连接。治本是连接复用——HTTP Keep-Alive 与各类连接池，让
    TIME_WAIT 自然消失；治标可用 tcp_tw_reuse=1 客户端侧依赖时间戳复用端口，tcp_max_tw_buckets 限总量，禁开已移除的 tcp_tw_recycle（NAT
    下出问题）。若 TIME_WAIT 集中出现在服务端，说明是下游调用方没用长连接，推动对方改造是正解。
  points:
  - 大量 TIME_WAIT 等于本机频繁主动断连
  - 治本：连接池与 Keep-Alive 实现连接复用
  - tcp_tw_reuse 可缓解，禁用 tcp_tw_recycle
  - 服务端大量 TIME_WAIT 应推动调用方改长连接
- title: TCP 保证可靠传输的核心机制
  content: TCP 的可靠性由一组机制叠加保证：校验和检测传输过程中的数据损坏；序列号给每个字节编号，配合确认应答实现有序、不丢、去重；超时重传基于 RTT 动态计算 RTO，超时未确认就重发，快速重传则在收到三个重复
    ACK 时立即重发不等超时；滑动窗口做流量控制，接收方用窗口字段告知缓冲区余量，发送方据此限速；拥塞控制探测网络容量，避免压垮网络。记忆主线是：校验、编号确认、重传、流量控制、拥塞控制五层防线。
  points:
  - 序列号 + 确认应答实现有序、不丢、去重
  - 校验和检测传输损坏
  - 超时重传与快速重传双保险
  - 滑动窗口流量控制 + 拥塞控制
- title: TCP 超时重传与快速重传的分工
  content: 超时重传是兜底机制：发送方基于 RTT 动态计算超时时间 RTO，超过 RTO 仍未收到确认就重发报文段；RTO 过小会频繁误重传，过大则丢包恢复慢。快速重传是提速机制：接收方收到失序报文时会重复确认最后连续收到的序号，发送方收到
    3 个重复 ACK 就判定该报文大概率丢失，立即重发而不必干等超时，通常配合快速恢复一起处理拥塞窗口。两者覆盖了丢包感知的慢路径与快路径。
  points:
  - RTO 基于 RTT 动态计算，超时未确认即重发
  - 3 个重复 ACK 触发快速重传，不等超时
  - 重复 ACK 源于接收方对失序报文的重复确认
  - 快速重传通常与快速恢复配合使用
- title: TCP 滑动窗口实现流量控制
  content: 流量控制解决发送太快淹没收端的问题。接收方在每个 ACK 中携带窗口字段，宣告自己接收缓冲区的剩余容量；发送方维护一个滑动窗口，已发送未确认与可发送的数据都必须落在窗口内，窗口随确认到来向右滑动。接收方缓冲区被应用读走数据后窗口放大，应用不读则窗口收缩；缩到
    0 时发送方停止发送并定期发零窗口探测报文，防止窗口更新丢失导致双向卡死。滑动窗口也是叠加并发发送、提升吞吐的基础。
  points:
  - 接收方通过窗口字段告知缓冲区余量
  - 发送窗口约束已发未确认与可发数据的范围
  - 窗口为 0 时用零窗口探测防死锁
  - 窗口滑动同时是并发发送提升吞吐的手段
- title: TCP 拥塞控制的四个阶段
  content: 拥塞控制面向网络整体容量，与面向对端的流量控制互补。慢启动阶段拥塞窗口从小值起步按指数增长快速探测；达到阈值后进入拥塞避免，改为每个 RTT 线性加一谨慎爬坡；发生丢包时快速重传立即重发并配合快速恢复，拥塞窗口减半后继续线性增长，避免推倒重来；超时这种严重拥塞则把窗口重置回初值重新慢启动。整个过程像水电调峰：指数试探、线性稳行、丢包减半、超时重来。
  points:
  - 慢启动指数增长，拥塞避免线性增长
  - 快速重传 + 快速恢复：窗口减半后继续传输
  - 超时视为严重拥塞，重置窗口重新慢启动
  - 拥塞控制面向网络容量，与流量控制互补
- title: TCP 面向字节流与粘包拆包的成因
  content: TCP 只保证字节流有序可靠，不维护消息边界。发送端 Nagle 算法会把小数据合并攒批发送，MSS 与 MTU 会把大报文分段，接收端应用读取时机不可控——读到半条是拆包，一次读到多条是粘包。这不是
    TCP 的 bug 而是字节流语义的必然结果，UDP 面向报文反而天然保留边界。所以应用层协议必须自带分帧机制，否则接收方无法还原消息；理解成因才能理解四种分帧方案的取舍。
  points:
  - TCP 字节流无消息边界，粘包拆包是语义必然
  - Nagle 合并、MSS/MTU 分段、读取时机共同导致
  - UDP 面向报文天然有边界
  - 分帧必须由应用层协议自己解决
- title: 粘包问题的四种解决方案
  content: 应用层分帧有四种主流方案。固定长度：不足补齐，最简单但浪费带宽；分隔符：以 \r\n 等标记边界，HTTP 与 Redis 均采用，内容中的分隔符需要转义；长度前缀：header 用固定字节声明
    body 长度，是自定义二进制协议的标配；应用层自带结构：直接用 HTTP 的 Content-Length 或 chunked 编码。工程上长度前缀最通用，Netty 的 LengthFieldBasedFrameDecoder
    是其工业实现。
  points:
  - 固定长度：简单但浪费带宽
  - 分隔符：HTTP 与 Redis 采用，内容需转义
  - 长度前缀：二进制协议标配，最通用
  - 应用层结构：Content-Length 与 chunked
  - Netty 的 LengthFieldBasedFrameDecoder 是工业实现
- title: UDP 与 TCP 的核心区别与选型
  content: UDP 与 TCP 的差异贯穿连接、可靠性与效率三个维度：UDP 无连接，不需要握手即可发包；不保证可靠与有序，没有确认、重传与拥塞控制；面向报文，保留应用交付的边界；头部仅 8 字节，开销极小，还支持广播与多播。因此实时音视频、DNS、游戏状态同步等容忍丢包、追求低延迟的场景选
    UDP，丢包处理交给应用层；QUIC 更是在 UDP 之上自建可靠传输，兼得低延迟握手与流级可靠。要低延迟可控选 UDP，要省心可靠选 TCP。
  points:
  - UDP 无连接、不保证可靠有序、面向报文
  - 头部仅 8 字节，支持广播多播
  - 实时音视频、DNS、游戏同步选 UDP
  - QUIC 在 UDP 之上自建可靠传输
- title: HTTPS 混合加密的设计逻辑
  content: HTTPS 采用混合加密是安全与性能的折中。非对称加密（RSA/ECDHE）安全性强但速度比对称加密慢千倍量级，因此只用于握手阶段的密钥协商与身份认证；对称加密（AES/ChaCha20）速度快，负责之后的全部数据传输。公钥分发的可信问题由证书体系解决：服务端证书由
    CA 私钥签名，客户端验证证书链、域名与有效期，确认公钥确实属于真服务端，从而挡住中间人替换公钥的攻击。一句话：非对称管协商与认证，对称管传输，证书管信任。
  points:
  - 非对称只用于密钥协商与身份认证（慢千倍）
  - 对称加密负责数据传输（快，适合大流量）
  - CA 签名的证书链解决公钥信任与中间人问题
  - 混合加密是安全与性能的折中
- title: TLS 1.2 握手的完整流程
  content: TLS 1.2 的 RSA 握手分四步：客户端发 ClientHello，携带随机数与支持的加密套件；服务端回应 ServerHello 并下发证书（含公钥）与自己选择的套件；客户端验证证书链、域名与有效期后，生成预主密钥并用服务端公钥加密发送；双方以两个随机数加预主密钥派生出会话密钥，互发
    Finished 校验一致，之后全部通信改用会话密钥对称加密。整个握手解决三件事：协商算法、交换密钥材料、认证服务端身份。
  points:
  - ClientHello 与 ServerHello 交换随机数与套件
  - 客户端验证证书链后用服务端公钥加密预主密钥
  - 两随机数 + 预主密钥派生会话密钥
  - Finished 验证后切换对称加密通信
- title: TLS 1.3 的改进与前向安全
  content: TLS 1.3 把握手压缩到 1-RTT（会话恢复时甚至 0-RTT），并废弃了 RSA 密钥交换，改用 ECDHE 做密钥协商。核心收益是前向安全：会话密钥由临时的 ECDHE 参数推导，服务端私钥即使日后泄露，攻击者拿历史抓包也无法回放解密——RSA
    模式下私钥泄露等于历史流量全部暴露。1.3 还精简了加密套件数量、强制握手加密，减少了可降级攻击面。理解前向安全是理解 TLS 1.3 一切改动的钥匙。
  points:
  - 握手 1-RTT，会话恢复场景 0-RTT
  - 废弃 RSA 密钥交换，改用 ECDHE
  - 前向安全：私钥泄露也解不开历史流量
  - 精简套件并强制握手加密，缩小攻击面
- title: 从输入 URL 到页面展示的完整链路
  content: 一次页面访问串联了网络与系统的全部层次：浏览器先做 URL 解析与 HSTS 判断，再走 DNS 多级缓存拿到 IP；随后三次握手建立 TCP 连接，HTTPS 再加 TLS 握手；接着发送
    HTTP 请求，服务端依次经过负载均衡、网关、应用处理，可能查询缓存与数据库后返回响应；浏览器解析 HTML 构建 DOM 树，合成 CSSOM 与渲染树，经布局、绘制、合成上屏，期间 JS 会阻塞解析；最后
    Keep-Alive 复用连接供后续请求。这条链路是面试综合题的母版，也是性能优化的地图。
  points:
  - URL 解析 + HSTS 判断先行
  - DNS 解析拿到 IP 后建 TCP/TLS 连接
  - 请求经负载均衡、网关、应用返回响应
  - DOM → CSSOM → 渲染树 → 布局绘制合成
  - Keep-Alive 复用连接收尾
- title: DNS 解析的缓存层级与递归迭代
  content: DNS 把域名翻译成 IP，查询按缓存由近及远展开：浏览器缓存 → 系统缓存与 hosts 文件 → 本地 DNS 服务器；本地服务器未命中时代表客户端向根域名服务器、顶级域服务器、权威域名服务器逐级查询——客户端到本地服务器是递归，本地服务器向上是迭代。CDN
    正是在 DNS 层完成就近调度，权威服务器按来源返回最近的边缘节点 IP。理解缓存层级就能解释 DNS 劫持、解析慢等问题的发生位置。
  points:
  - 缓存顺序：浏览器 → 系统/hosts → 本地 DNS
  - 客户端侧递归，本地 DNS 向上迭代
  - 根 → 顶级域 → 权威域逐级查询
  - CDN 在 DNS 层完成就近调度
- title: 浏览器渲染流程与 JS 的阻塞位置
  content: 拿到 HTML 后浏览器进入渲染关键路径：解析 HTML 构建 DOM 树，解析 CSS 构建 CSSOM，两者合成渲染树；随后布局计算几何位置（回流），绘制生成位图（重绘），最后合成上屏。JS
    的特殊性在于它可以读写 DOM 与样式，因此普通 script 会阻塞 HTML 解析；defer 脚本推迟到 DOM 解析完成后按序执行，async 脚本下载完即执行不保序。理解这条路径就能解释首屏优化为什么强调关键
    CSS 内联、JS 延后加载。
  points:
  - DOM + CSSOM → 渲染树 → 布局 → 绘制 → 合成
  - 布局改动触发回流，样式改动触发重绘
  - 普通 script 阻塞 HTML 解析
  - defer 保序延后执行，async 下载完即执行
- title: HTTP/2 多路复用仍存在队头阻塞的原因
  content: HTTP/1.1 的队头阻塞在应用层：一条连接串行处理请求，前一个响应未完成后续必须等待，只能靠浏览器并发多条连接缓解。HTTP/2 引入二进制帧与 Stream 多路复用，解决了应用层阻塞，但底层仍是一条
    TCP 连接——TCP 保证字节全局有序，任何报文丢失都会让所有 Stream 的数据停在重传点，传输层队头阻塞依旧；实测丢包率 2% 时 HTTP/2 甚至慢于 HTTP/1.1 的多连接。演进主线是：应用层阻塞已解决，传输层阻塞留给
    QUIC。
  points:
  - HTTP/1.1 阻塞在应用层串行处理
  - HTTP/2 二进制帧与 Stream 解决应用层阻塞
  - TCP 全局有序导致丢包阻塞所有 Stream
  - 丢包率 2% 时可能慢于 HTTP/1.1 多连接
- title: QUIC 与 HTTP/3 的关键特性
  content: QUIC 基于 UDP 自建可靠传输，成为 HTTP/3 的底座。它为每个 Stream 维护独立的序号与重传，一条流丢包不再阻塞其他流，彻底解决传输层队头阻塞；握手内嵌 TLS 1.3，实现
    1-RTT 甚至 0-RTT 建连；用 Connection ID 标识连接而非四元组，WiFi 切蜂窝网络连接不中断，即连接迁移；拥塞控制可插拔，对 BBR 友好。部署上需放行 UDP 443，通过
    Alt-Svc 与 HTTP/2 协商降级，Nginx 1.25+ 与主流 CDN 已支持。
  points:
  - 基于 UDP 自建可靠传输
  - Stream 级独立重传消除传输层队头阻塞
  - 内嵌 TLS 1.3，1-RTT/0-RTT 建连
  - Connection ID 实现网络切换的连接迁移
  - 部署需放行 UDP 443，Alt-Svc 协商降级
- title: SSE 的事件流格式与断线续传
  content: SSE 响应为 text/event-stream 纯文本流，按事件块组织：id 行是递增序号、event 行区分事件类型、data 行是内容（可多行拼接）、retry 行建议重连间隔，冒号开头的行是注释（常用作心跳），空行结束一个事件。断线续传靠 id：EventSource 断开后自动重连并把最后收到的 id 放进 Last-Event-ID 请求头，服务端据此从历史队列补发断线期间的消息。前提是服务端有可重放的消息源（Redis List、单调游标），且 id 要设计成业务级单调序号而非连接内自增。
  points:
  - 事件块由 id/event/data/retry 行组成，空行结束
  - 冒号注释行兼作 keep-alive 心跳
  - 重连自动携带 Last-Event-ID，服务端按序号补发
  - id 用业务单调序号，实例重启后续传仍成立
- title: EventSource 自动重连与浏览器 6 连接限制
  content: 浏览器原生 EventSource 断线后默认约 3 秒自动重连，服务端可用 retry 字段调整间隔；readyState 三态中 CLOSED（服务端返回错误状态或主动 close）不再重连。HTTP/1.1 下浏览器对同域名最多 6 条 TCP 并发连接，每条 SSE 流长期占用一条，开到第 7 个流会被挂起——解法是 HTTP/2 多路复用、SSE 独立域名、或一页多源共用一条流用 event 字段区分分发。
  points:
  - 默认约 3s 自动重连，retry 字段可调
  - readyState=2（CLOSED）后不再重连
  - HTTP/1.1 同域 6 连接限制，SSE 流各占一条
  - 解法：HTTP/2 复用 / 独立域名 / 多源合流按 event 分发
- title: SSE 服务端实现要点与 nginx 代理三大坑
  content: 服务端要点：响应头 Content-Type 为 text/event-stream 且禁缓存，写完头部立即 flush，之后每条事件即时 flush；每 15-30 秒发一行注释心跳防代理空闲断连；写失败要捕获并清理订阅资源，防止 fd 泄漏。nginx 代理三坑：proxy_buffering 默认缓冲会把流式变成攒一段吐一段（要加 X-Accel-Buffering=no 或关缓冲）、proxy_read_timeout 默认 60s 无数据就断（心跳间隔必须小于它）、gzip 对事件流缓冲破坏边界（对该类型关闭）。
  points:
  - text/event-stream + no-cache，逐事件 flush
  - 注释行心跳 15-30s，兼作断连探测
  - nginx 三坑：proxy_buffering / read_timeout / gzip
  - 水平扩展靠 Redis pub/sub 扇出到各实例
- title: SSE 单向限制下的客户端上行方案
  content: SSE 只有服务端到客户端的方向，客户端发消息走普通 HTTP 请求即可：上行 POST 带鉴权与请求 id，服务端处理完把结果或回执通过 SSE 流推下去，消息用请求 id 关联对号。这是 LLM 应用的标准模式——提问走 POST、回答 token 流走 SSE 返回。一页多类推送（通知、进度、对话）共用一条 SSE，用 event 字段分频道各自 addEventListener 订阅。上行也变高频低延迟需求（游戏操作、即时已读回执）时才升级 WebSocket。
  points:
  - 下行走 SSE，上行走普通 POST
  - 请求 id 关联流中回执，防串台
  - event 字段分频道，多源共用一条流
  - 上行高频低延迟时才升级 WebSocket
- title: WebSocket 握手过程与 Sec-WebSocket-Accept 计算
  content: WebSocket 建连是 HTTP Upgrade：客户端发携带 Upgrade=websocket、Connection=Upgrade、Sec-WebSocket-Key（随机 base64）的 GET 请求，服务端回 101 Switching Protocols，并在 Sec-WebSocket-Accept 里放 base64(sha1(Key + 魔法串 258EAFA5-E914-47DA-95CA-C5AB0DC85B11))，此后连接切换为 WebSocket 二进制协议。Accept 计算不为加密，而是证明服务端理解该协议并防中间盒误解析。握手期可带 token 鉴权，但升级后无 HTTP 语义，token 过期需应用层 re-auth。反向代理必须显式透传 Upgrade 头。
  points:
  - GET + Upgrade/Connection 头发起，101 切换协议
  - Accept = base64(sha1(Key + 固定魔法串))
  - 目的是协议证明与防中间盒误解析，非加密
  - 升级后失去 HTTP 语义，鉴权续期要应用层做
- title: WebSocket 帧结构与客户端掩码的作用
  content: WebSocket 帧头由 FIN、opcode（0x1 文本 0x2 二进制 0x8 关闭 0x9 ping 0xA pong）、MASK 位、分级 Payload len（7bit/16bit/64bit）与 32bit 掩码键组成，负载用掩码键异或混淆。客户端到服务端的每一帧必须掩码，目的是防缓存投毒——攻击者伪装明文 HTTP 头让透明代理误缓存 WebSocket 流内容污染用户请求；服务端到客户端不掩码。大消息可分片：首帧 FIN=0 带真实 opcode，后续帧 opcode=0 续传；控制帧不超 125 字节且不分片，可在分片消息中间穿插心跳。
  points:
  - opcode 定义帧类型，FIN 分片，长度三级表示
  - 客户端帧必须掩码，防代理缓存投毒
  - 服务端到客户端帧不掩码
  - 控制帧 ≤125 字节，可穿插在分片消息中
- title: WebSocket 心跳与超时链路匹配
  content: 心跳用协议内置 ping/pong 控制帧：一方发 ping，对方必须尽快回 pong。浏览器 JS 发不了 ping 但会自动回 pong，所以探活由服务端定时发；要拿到 JS 层在线状态需应用层心跳消息（JSON ping/pong）配合超时踢线。心跳间隔必须小于链路上最短超时——nginx proxy_read_timeout 默认 60s、云 LB 空闲超时常见 350-900s、NAT 表项几分钟，经验值 15-30s 心跳、2-3 次未回踢线。重连用指数退避加抖动防雪崩，重连后要重新鉴权并按最后 seq 补拉消息。
  points:
  - 协议层 ping/pong，浏览器自动回 pong
  - JS 层在线状态靠应用层心跳消息
  - 心跳间隔 < 链路最短超时，经验值 15-30s
  - 重连：指数退避+抖动，补拉断线消息
- title: 百万级 WebSocket 长连接的架构设计
  content: 大规模长连接架构三部曲：接入层用独立网关集群统一管连接（只做维持连接、鉴权、收发，不含业务），业务服务无状态通过内部总线与网关交互；广播扇出用 Redis pub/sub 或 Kafka——用户分散在不同网关实例，消息进总线、各网关推各自持有的连接，热房间做分层广播避免每条消息百万人次总线传输；会话粘性用 uid 到网关的映射（LB hash 或 Redis 存映射），网关宕机靠客户端退避重连加会话恢复协议兜底。单机层面靠事件驱动 NIO、连接与业务解耦、发布灰度分批滚动避免重连风暴。
  points:
  - 网关集群管连接，业务无状态解耦
  - Redis pub/sub 或 Kafka 做跨实例广播扇出
  - uid→网关粘性映射，宕机靠重连退避+会话恢复
  - 滚动发布要分批，防重连风暴
- title: WebSocket 与 Redis pub/sub 的配合模式
  content: 多实例部署下 WebSocket 连接分散在各实例，用户 A 在网关 1、用户 B 在网关 2 时，A 发的消息要让 B 收到，就要靠消息总线扇出：业务服务把消息发进 Redis pub/sub 频道（或 Kafka 主题），所有网关实例订阅该频道，各自把消息推给自己持有的连接。频道设计按房间或会话划分控制扇出粒度；百万级或需要历史回放时换 Kafka（分区按会话 hash 保序）；SSE 场景完全同构——SSE 流同样钉在实例上，广播同样走总线扇出，这是实时推送水平扩展的通用骨架。
  points:
  - 消息进总线，各实例推各自连接
  - 频道按房间/会话划分控制扇出粒度
  - 需要历史回放与大流量用 Kafka 分区保序
  - SSE 广播同构复用这套骨架
- title: 短轮询长轮询 SSE WebSocket 四方案对比
  content: 短轮询客户端定时拉取，延迟等于轮询间隔且大量空请求，适合弱实时内部系统；长轮询服务端挂起请求直到有数据或超时才返回，延迟接近实时且兼容一切环境，代价是服务端挂起大量请求；SSE 是 HTTP 单向事件流，自动重连加断点续传，服务端推送场景首选（LLM 流式输出事实标准）；WebSocket 是双向全双工独立协议，延迟最低支持二进制，代价是心跳重连网关全要自建。选型一句话：服务端说客户端听选 SSE，双向对讲选 WebSocket，兼容苛刻用长轮询，Socket.IO 这类库内置 WS 到 SSE 再到长轮询的降级链。
  points:
  - 延迟：WS ≈ SSE < 长轮询 < 短轮询
  - 复杂度：WS > SSE > 长轮询 > 短轮询
  - SSE 是 LLM 流式输出与通知推送首选
  - 生产实时系统做 feature detect 逐级降级
