# 场景设计题
- title: "设计一个秒杀系统，你会考虑哪些问题？"
  difficulty: 3
  tags: ["秒杀", "高并发", "架构"]
  position_tags: ["java", "backend", "golang", "cpp"]
  answer: |
    1. **流量漏斗，层层削减**：前端按钮置灰防重复点击、验证码/答题打散请求、静态资源 CDN、网关限流（令牌桶，只放行和库存同量级的请求）——**大部分流量死在进 DB 之前**。
    2. **库存方案（核心）**：库存预热进 Redis，**Lua 原子扣减**（判断+扣减一个脚本），防超卖不靠先查后改；扣减成功发 MQ 异步创建订单，DB 用 `UPDATE ... SET stock=stock-1 WHERE id=? AND stock>0` 条件更新兜底。
    3. **削峰填谷**：MQ 缓冲下单请求，消费端按 DB 能力匀速消费；前端下单后轮询/WebSocket 查结果（"排队中"体验）。
    4. **防刷与公平**：用户维度限流（同一 userId 频次）、黑名单风控、一人一单（Redis setnx userId 或 DB 唯一索引）。
    5. **热点与隔离**：秒杀链路独立部署（独立服务/独立库），失败不影响主站；热点 key 本地缓存 + Redis 分片桶（库存分桶扣减）。
    6. **兜底**：全链路降级预案、对账任务修正 Redis 与 DB、消息幂等（订单号唯一索引）、超时未支付释放库存回 Redis。
    7. **一句话总结**：**限流是第一道闸，Redis 原子扣减是主战场，MQ 削峰是缓冲带，DB 条件更新是最后防线，幂等和对账是保险丝。**

- title: "热点数据（如爆款商品详情）的缓存架构怎么设计？"
  difficulty: 2
  tags: ["多级缓存", "热点"]
  position_tags: ["java", "backend", "golang", "cpp"]
  answer: |
    1. **多级缓存结构**：浏览器缓存/CDN（静态化页面或接口）→ **本地缓存 Caffeine**（应用内存，纳秒级，容量小）→ **Redis**（集群共享，毫秒级）→ DB。
    2. **本地缓存要点**：只放**极热且允许短暂不一致**的数据；容量上限 + 淘汰策略（W-TinyLFU）；过期时间短 + **主动失效通知**（Redis pub/sub 或 MQ 广播"删本地缓存"）。
    3. **一致性**：Cache Aside——更新 DB 后删 Redis + 广播删各节点本地缓存；TTL 兜底。接受秒级不一致是设计前提，要求强一致就不要用这种缓存。
    4. **防击穿**：重建缓存加分布式锁/单飞（singleflight，同一 key 并发只放一个回源）；热点永不过期 + 异步刷新。
    5. **防雪崩**：TTL 随机化、多级缓存本身就隔离了 Redis 故障、限流兜底。
    6. **热点探测**：客户端统计 top key，动态把热点加入本地缓存（京东开源 hotkey 思路）。

- title: "如何设计一个分布式 ID 生成器？"
  difficulty: 2
  tags: ["分布式ID", "雪花算法"]
  position_tags: ["java", "backend", "golang", "cpp"]
  answer: |
    1. **需求**：全局唯一、趋势递增（利于 InnoDB 主键顺序插入）、高可用高性能、信息安全（不暴露业务量）。
    2. **UUID**：无依赖本地生成；但**无序导致 B+ 树页分裂**、太长（36 字符）、无业务含义——不适合做 MySQL 主键。
    3. **数据库号段模式**：一张表存业务标识 + 当前最大值，服务一次取一段（如 1000 个）内存分配，用完再取；双 buffer 预取消除取号毛刺。简单可控，强依赖 DB。
    4. **雪花算法 Snowflake**：64 bit = 1 符号位 + 41 时间戳（69 年）+ 10 机器 id + 12 序列号（单机每毫秒 4096 个）。本地生成、趋势递增、性能极高。
       **坑：时钟回拨**——回拨时拒绝发号/等待，或用备用位；机器 id 分配要管理（ZK/DB/配置中心）。
    5. **Redis INCR**：原子自增，简单；每次网络往返可用号段方式批量取；强依赖 Redis 可用性。
    6. **选型**：中小规模号段模式够用；高性能低延迟用雪花（美团的 Leaf 同时支持号段+雪花，百度 UidGenerator）。

- title: "接口的幂等性如何保证？"
  difficulty: 2
  tags: ["幂等", "分布式"]
  position_tags: ["java", "backend", "golang", "cpp", "test"]
  answer: |
    1. **什么是幂等**：同一操作执行一次和多次结果相同。触发场景：用户重复点击、网络重试、MQ 重复投递、重试补偿。
    2. **天然幂等**：查询、按唯一条件 UPDATE（`UPDATE account SET balance=100 WHERE id=1`）、DELETE by id。
    3. **非幂等操作的方案**：
       - **唯一索引/唯一约束（最强）**：订单号、业务流水号建唯一索引，重复插入直接报错兜底——**最后一道防线必须在这**；
       - **防重 token**：进页面先领 token 存 Redis，提交带上并 `SETNX` 校验删除，重复提交被拦；
       - **分布式锁**：业务 id 加锁串行化（粒度细、释放要及时）；
       - **状态机**：更新带状态前置条件 `WHERE status='INIT'`，非法流转不生效；
       - **去重表/Redis 记录**：处理过的业务单号记录下来，重复的直接返回上次结果。
    4. **设计原则**：先靠**业务单号 + 唯一索引**硬保证，再用 Redis 拦截提升体验；MQ 消费端必须幂等（消息至少一次投递语义）。

- title: "如何从 MySQL 导出千万级数据生成 Excel？会不会 OOM？"
  difficulty: 2
  tags: ["大数据导出", "OOM"]
  position_tags: ["java", "backend", "python"]
  answer: |
    1. **两个 OOM 点**：一次 `SELECT *` 全量加载到内存；一次性把整个 Excel 写内存（POI 的 XSSFWorkbook 全量驻留）。
    2. **读侧——分页/流式**：
       - 游标分页 `WHERE id > ? ORDER BY id LIMIT batch`（不要深分页 offset）；
       - JDBC 流式查询：`fetchSize=Integer.MIN_VALUE`（MySQL 流式）或 MyBatis Cursor / ResultHandler 逐行消费；
       - 读写分离：走从库，且低峰执行。
    3. **写侧——流式写**：EasyExcel（阿里，逐行写、SAX 模型）或 POI 的 SXSSFWorkbook（滑动窗口只留有限行在内存），边查边写边刷盘。
    4. **交互设计**：异步任务——提交导出请求落任务表 → 后台 worker 生成文件传对象存储（OSS）→ 通知用户下载链接；前端轮询任务状态。超大导出可分片并行 + 合并。
    5. **补充**：控制列宽样式降低文件体积；CSV 替代方案（更快更省，无样式）；限流防多人同时导出打爆服务。
